<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kabuzen Rumah AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kabuzen Rumah AI: katalog aplikasi AI, jasa pembuatan aplikasi, artikel, galeri, dan video seputar kecerdasan buatan.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style id="site-css">
/* Layout: sticky bar → hero (thesis + logo "power core") → app catalog grid → services/process/pricing → articles + reader view → order form → footer.
   Deliberately dark single look taken from the logo: night-indigo ground, electric blue body, one yellow bolt accent. */
:root{
  --ink:#0A0624;        /* page ground */
  --night:#130C3E;      /* raised surface */
  --night-2:#1B1257;    /* hover surface */
  --volt:#1E9BFF;       /* electric blue from the figure */
  --cyan:#55EEFF;       /* rim light */
  --bolt:#FFD233;       /* the lightning — single bold accent */
  --text:#EEEFFF;
  --muted:#A7A3D4;
  --line:rgba(150,140,255,.16);
  --ok:#3EE59A; --warn:#FFB547;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
:focus-visible{outline:2px solid var(--bolt);outline-offset:3px;border-radius:6px}

/* ---------- header ---------- */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,6,36,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px rgba(85,238,255,.35),0 0 18px rgba(30,155,255,.45)}
.brand b{font-family:var(--f-display);font-size:15px;letter-spacing:.02em;line-height:1.05}
.brand b span{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.2em;color:var(--bolt)}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{text-decoration:none;font-weight:600;font-size:14.5px;color:var(--muted);padding:8px 12px;border-radius:999px;transition:color .2s,background .2s}
nav.main a:hover,nav.main a.on{color:var(--text);background:var(--night-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px/1 var(--f-body);text-decoration:none;border:0;cursor:pointer;padding:13px 20px;border-radius:999px;transition:transform .15s,box-shadow .2s,background .2s}
.btn-bolt{background:var(--bolt);color:#1A1040;box-shadow:0 6px 24px rgba(255,210,51,.28)}
.btn-bolt:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,210,51,.4)}
.btn-ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--cyan);color:var(--cyan)}
.bar .btn{padding:10px 16px;font-size:14px}
.menu-btn{display:none;margin-left:auto;background:var(--night);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:10px;cursor:pointer}
.menu-btn svg{width:20px;height:20px}
@media (max-width:900px){
  nav.main{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--ink);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  nav.main.open{display:flex}
  nav.main a{padding:12px 14px;border-radius:10px}
  .menu-btn{display:grid;place-items:center}
  .bar .btn{display:none}
}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding-block:72px 64px}
.hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:780px;height:780px;background:radial-gradient(closest-side,rgba(42,18,160,.75),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,64px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--bolt);position:relative;white-space:nowrap}
.hero h1 .glow{background:linear-gradient(100deg,var(--cyan),var(--volt));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:18.5px;color:var(--muted);max-width:56ch;margin-top:22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
.stats div{min-width:110px}
.stats strong{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;color:var(--text)}
.stats span{font-size:13.5px;color:var(--muted)}

.core{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin-left:auto}
.core .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(85,238,255,.3);animation:spin 60s linear infinite}
.core .ring.r2{inset:9%;border:1px solid rgba(30,155,255,.25);animation-duration:90s;animation-direction:reverse}
.core img{position:absolute;inset:17%;width:66%;height:66%;border-radius:50%;box-shadow:0 0 0 3px rgba(85,238,255,.4),0 0 80px rgba(30,155,255,.55),0 30px 80px rgba(0,0,0,.5);animation:float 6s ease-in-out infinite}
.chip{position:absolute;display:flex;align-items:center;gap:8px;background:var(--night);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.chip.c1{top:6%;left:-4%}.chip.c2{bottom:12%;right:-6%}.chip.c3{bottom:2%;left:6%}
.chip code{font-family:var(--f-mono);font-size:12px;color:var(--bolt)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
@media (max-width:900px){
  .hero{padding-block:40px 48px}
  .hero .wrap{grid-template-columns:1fr}
  .core{max-width:300px;margin:8px auto 0;order:-1}
  .chip.c1{left:-2%}.chip.c2{right:-2%}
}

/* ---------- sections ---------- */
section.block{padding-block:88px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}
.sec-head h2{font-size:clamp(26px,3.6vw,40px);margin-top:10px;max-width:22ch}
.sec-head p{color:var(--muted);max-width:46ch}
.band{background:linear-gradient(180deg,var(--night),var(--ink))}

/* ---------- apps ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:600 14px var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .2s}
.filters button:hover{color:var(--text);border-color:var(--volt)}
.filters button[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:#fff}
.search{margin-left:auto;position:relative;flex:0 1 260px;min-width:0}
.search input{width:100%;font:500 14.5px var(--f-body);color:var(--text);background:var(--night);border:1px solid var(--line);border-radius:999px;padding:10px 14px 10px 38px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
@media (max-width:640px){.search{flex-basis:100%;margin-left:0}}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.app{display:flex;flex-direction:column;gap:14px;background:var(--night);border:1px solid var(--line);border-radius:var(--r);padding:22px;transition:transform .2s,border-color .2s,background .2s}
.app:hover{transform:translateY(-4px);border-color:rgba(85,238,255,.45);background:var(--night-2)}
.app-top{display:flex;align-items:center;gap:14px}
.mono{width:52px;height:52px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:#fff}
.app h3{font-size:17px;overflow-wrap:anywhere}
.app-top>div:not(.mono){min-width:0}
.app .cat{font-size:12.5px;color:var(--muted)}
.app p{color:var(--muted);font-size:14.5px;flex:1}
.status{margin-left:auto;align-self:flex-start;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.status.live{color:var(--ok);background:rgba(62,229,154,.12)}
.status.beta{color:var(--warn);background:rgba(255,181,71,.12)}
.status.soon{color:var(--muted);background:rgba(167,163,212,.12)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;color:var(--cyan);background:rgba(85,238,255,.08);padding:3px 9px;border-radius:999px}
.app-foot{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.app-foot a{font-weight:700;color:var(--bolt);text-decoration:none}
.app-foot a:hover{text-decoration:underline}
.app-foot a[aria-disabled="true"]{color:var(--muted);pointer-events:none}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{margin-top:22px;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.note b{color:var(--bolt)}

/* ---------- services ---------- */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.svc article{padding:24px;border-radius:var(--r);background:rgba(19,12,62,.6);border:1px solid var(--line)}
.svc svg{width:30px;height:30px;color:var(--cyan)}
.svc h3{font-size:16.5px;margin:16px 0 8px}
.svc p{font-size:14.5px;color:var(--muted)}
@media (max-width:980px){.svc{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.svc{grid-template-columns:1fr}}

.process{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:64px;counter-reset:s;position:relative}
.process li{list-style:none;padding:0 20px 0 0;position:relative}
.process li::before{counter-increment:s;content:counter(s,decimal-leading-zero);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--ink);border:2px solid var(--volt);font:500 14px var(--f-mono);color:var(--cyan);position:relative;z-index:1}
.process li::after{content:"";position:absolute;top:23px;left:46px;right:0;height:2px;background:linear-gradient(90deg,var(--volt),transparent)}
.process li:last-child::after{display:none}
.process h3{font-size:16px;margin:16px 0 6px}
.process p{font-size:14.5px;color:var(--muted)}
.process small{display:block;margin-top:8px;font:500 12px var(--f-mono);color:var(--bolt)}
@media (max-width:820px){.process{grid-template-columns:1fr 1fr;row-gap:32px}.process li::after{display:none}}
@media (max-width:480px){.process{grid-template-columns:1fr}}

.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:72px;align-items:start}
.plan{padding:28px;border-radius:18px;background:var(--night);border:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.plan.hot{border:1.5px solid var(--bolt);background:linear-gradient(180deg,rgba(255,210,51,.07),var(--night) 45%);position:relative}
.plan.hot::before{content:"Paling dipilih";position:absolute;top:-12px;left:28px;background:var(--bolt);color:#1A1040;font:700 12px var(--f-body);padding:4px 10px;border-radius:999px}
.plan h3{font-size:18px}
.plan .desc{font-size:14.5px;color:var(--muted);margin-top:6px}
.price{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.price small{display:block;font:500 13px var(--f-body);color:var(--muted);margin-bottom:4px}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14.5px}
.plan li{display:flex;gap:10px}
.plan li svg{width:18px;height:18px;flex-shrink:0;margin-top:3px;color:var(--ok)}
.plan .btn{width:100%}
@media (max-width:900px){.pricing{grid-template-columns:1fr}}

.faq{margin-top:72px;display:grid;grid-template-columns:.8fr 1.2fr;gap:40px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--cyan);font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);margin-top:10px;font-size:15px;max-width:62ch}
@media (max-width:820px){.faq{grid-template-columns:1fr;gap:12px}}

/* ---------- articles ---------- */
.posts{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.post{display:flex;flex-direction:column;text-decoration:none;border-radius:var(--r);overflow:hidden;background:var(--night);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.post:hover{border-color:rgba(85,238,255,.45);transform:translateY(-3px)}
.post .cover{aspect-ratio:16/8;max-width:100%;position:relative;overflow:hidden}
.post .cover canvas{width:100%;height:100%;display:block}
.post .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.post .meta{display:flex;flex-wrap:wrap;gap:10px;font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.post .meta b{color:var(--bolt);font-weight:500;text-transform:uppercase}
.post h3{font-size:18px;line-height:1.3}
.post p{color:var(--muted);font-size:14.5px}
.post.feat{grid-row:span 3}
.post.feat .cover{aspect-ratio:16/10}
.post.feat h3{font-size:clamp(20px,2.4vw,26px)}
.post.small{flex-direction:row}
.post.small .cover{width:38%;aspect-ratio:auto;flex-shrink:0}
.post.small .body{padding:16px}
.post.small h3{font-size:15.5px}
.post.small p{display:none}
@media (max-width:820px){.posts{grid-template-columns:1fr}.post.feat{grid-row:auto}}
@media (max-width:460px){.post.small{flex-direction:column}.post.small .cover{width:100%;aspect-ratio:16/7}}

/* reader */
#reader{padding-block:48px 96px}
.reader{max-width:720px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);text-decoration:none;font-weight:600;font-size:14.5px}
.reader .cover{margin:24px 0 28px;border-radius:var(--r);overflow:hidden;aspect-ratio:16/7;max-width:100%}
.reader .cover canvas{width:100%;height:100%;display:block}
.reader h1{font-size:clamp(28px,4.4vw,44px);margin-top:14px}
.reader .meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font:500 13px var(--f-mono);color:var(--muted)}
.reader .meta b{color:var(--bolt);font-weight:500}
.prose{font-size:17.5px;line-height:1.75;color:#D9DAF5}
.prose p{margin:0 0 1.2em}
.prose h2{font-size:22px;margin:1.8em 0 .6em}
.prose ul{padding-left:1.2em;margin:0 0 1.2em}
.prose li{margin-bottom:.5em}
.prose blockquote{margin:1.6em 0;padding:4px 0 4px 20px;border-left:3px solid var(--bolt);font-size:19px;color:var(--text)}
.author{display:flex;align-items:center;gap:14px;margin-top:40px;padding:20px;border-radius:var(--r);background:var(--night);border:1px solid var(--line)}
.author img{width:52px;height:52px;border-radius:50%}
.author p{font-size:14.5px;color:var(--muted)}
.author b{display:block;color:var(--text)}
.more{margin-top:48px}
.more h2{font-size:18px;margin-bottom:16px}
.more .posts{grid-template-columns:1fr 1fr}
@media (max-width:620px){.more .posts{grid-template-columns:1fr}}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
.contact h2{font-size:clamp(28px,4vw,44px);margin-top:10px}
.contact .lead{color:var(--muted);margin-top:16px;max-width:44ch}
.channels{display:grid;gap:12px;margin-top:28px}
.channel{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--night);border:1px solid var(--line)}
.channel svg{width:22px;height:22px;color:var(--cyan);flex-shrink:0}
.channel div{min-width:0;flex:1}
.channel small{display:block;font-size:12.5px;color:var(--muted)}
.channel span{font-weight:600;user-select:all;overflow-wrap:anywhere}
.channel button{background:transparent;border:1px solid var(--line);color:var(--muted);font:600 12.5px var(--f-body);padding:6px 10px;border-radius:8px;cursor:pointer}
.channel button:hover{color:var(--text);border-color:var(--cyan)}
form.order{background:var(--night);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
form.order .full{grid-column:1/-1}
form.order label{display:grid;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
form.order input,form.order select,form.order textarea{font:500 15px var(--f-body);color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;min-width:0}
form.order textarea{min-height:120px;resize:vertical}
form.order input:focus,form.order select:focus,form.order textarea:focus{outline:none;border-color:var(--volt);box-shadow:0 0 0 3px rgba(30,155,255,.25)}
.err{color:#FF8A8A;font-size:13px;font-weight:500}
.result{grid-column:1/-1;background:var(--ink);border:1px solid var(--bolt);border-radius:12px;padding:16px}
.result pre{white-space:pre-wrap;font:500 13px/1.6 var(--f-mono);color:var(--text);margin:10px 0 12px;user-select:all}
.result p{font-size:14px;color:var(--muted)}
.result .row{display:flex;flex-wrap:wrap;gap:10px}
.result .btn{padding:10px 16px;font-size:14px}
@media (max-width:900px){.contact{grid-template-columns:1fr}}
@media (max-width:520px){form.order{grid-template-columns:1fr;padding:20px}}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding-block:48px 32px;margin-top:40px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.foot p{color:var(--muted);font-size:14.5px;margin-top:14px;max-width:36ch}
.foot h4{font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:0 0 14px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14.5px}
.foot ul a{text-decoration:none;color:var(--muted)}
.foot ul a:hover{color:var(--text)}
.legal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (max-width:820px){.foot{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.foot{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);text-align:center;transform:translate(-50%,-12px);opacity:0;background:var(--bolt);color:#1A1040;font-weight:700;padding:10px 18px;border-radius:999px;transition:all .25s;z-index:95;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- gallery & video ---------- */
.gallery{columns:3 260px;column-gap:16px}
.gallery figure{break-inside:avoid;margin:0 0 16px;border-radius:var(--r);overflow:hidden;background:var(--night);border:1px solid var(--line);cursor:zoom-in;transition:border-color .2s}
.gallery figure:hover{border-color:rgba(85,238,255,.45)}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{padding:10px 14px;font-size:13.5px;color:var(--muted)}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:56px}
.vid{display:flex;flex-direction:column;text-decoration:none;border-radius:var(--r);overflow:hidden;background:var(--night);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.vid:hover{transform:translateY(-3px);border-color:rgba(85,238,255,.45)}
.vid .thumb{position:relative;aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;overflow:hidden}
.vid .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,6,36,.75))}
.vid .play{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.vid .play svg{width:22px;height:22px;margin-left:3px;color:#1A1040}
.vid .pf{position:absolute;left:12px;bottom:10px;z-index:1;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#fff}
.vid .body{padding:14px 16px}
.vid h3{font-family:var(--f-body);font-size:15.5px;font-weight:700;line-height:1.35}
.vid small{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}
.pf-youtube{background:linear-gradient(135deg,#FF3B3B,#7A0F2E)}
.pf-instagram{background:linear-gradient(135deg,#FEDA75,#D62976 45%,#4F5BD5)}
.pf-tiktok{background:linear-gradient(135deg,#25F4EE,#0A0624 50%,#FE2C55)}
.pf-other{background:linear-gradient(135deg,var(--volt),var(--night-2))}
.socials{display:flex;flex-wrap:wrap;gap:10px}
.socials a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);color:var(--text)}
.socials a:hover{border-color:var(--cyan);color:var(--cyan)}
.socials i{width:10px;height:10px;border-radius:50%}
.sub-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-top:64px}
.sub-h h3{font-size:20px}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(5,3,20,.92);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-height:82vh;max-width:100%;border-radius:12px}
.lightbox p{color:var(--muted);text-align:center;margin-top:12px}
.app .mono img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.app .shot{border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--ink)}
.app .shot img{width:100%;height:100%;object-fit:cover;display:block}
.post .cover > img,.reader .cover > img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- admin ---------- */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;background:var(--bolt);color:#1A1040;font:700 14.5px var(--f-body);border:0;border-radius:999px;padding:13px 18px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pend-bar{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:69;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);background:var(--night-2);border:1px solid var(--bolt);color:var(--text);padding:10px 14px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.45);font-size:14px}
.pub-err{flex-basis:100%;background:rgba(255,92,92,.12);border:1px solid #FF8A8A;color:#FFC2C2;border-radius:10px;padding:10px 12px;font-size:13.5px}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,210,51,.25)}}
.fab b{background:#1A1040;color:var(--bolt);border-radius:999px;font-size:12px;min-width:22px;height:22px;white-space:nowrap;display:grid;place-items:center;padding:0 6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:85;background:var(--night);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:17px;flex:1}
.x{background:transparent;border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px}
.tabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:600 13.5px var(--f-body);color:var(--muted);background:transparent;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--volt);color:#fff}
.dr-body{flex:1;overflow-y:auto;padding:20px;display:grid;gap:14px;align-content:start}
.dr-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.dr-foot p{flex:1;min-width:160px;font-size:13px;color:var(--muted)}
.dr-foot .btn{padding:11px 18px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--ink)}
.row-item .th{width:44px;height:44px;border-radius:10px;flex-shrink:0;overflow:hidden;background:var(--night-2);display:grid;place-items:center;font:800 14px var(--f-display)}
.row-item .th img{width:100%;height:100%;object-fit:cover}
.row-item div.t{flex:1;min-width:0}
.row-item b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item small{color:var(--muted);font-size:12.5px}
.mini{font:600 12.5px var(--f-body);background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--cyan)}
.mini.danger{color:#FF8A8A}
.mini.danger.armed{background:#FF5C5C;color:#fff;border-color:#FF5C5C}
.field{display:grid;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:500 15px var(--f-body);color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.field textarea.long{min-height:280px;font-family:var(--f-mono);font-size:13.5px;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--volt);box-shadow:0 0 0 3px rgba(30,155,255,.25)}
.field .hint{font-weight:500;font-size:12.5px;color:var(--muted)}
.imgpick{display:flex;align-items:center;gap:12px}
.imgpick .pv{width:72px;height:72px;border-radius:12px;background:var(--ink);border:1px dashed var(--line);overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--muted);flex-shrink:0}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.banner{padding:12px 14px;border-radius:12px;border:1px solid var(--bolt);background:rgba(255,210,51,.08);font-size:13.5px;display:grid;gap:10px}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:6px;border-radius:999px;background:var(--ink);overflow:hidden}
.meter i{display:block;height:100%;background:var(--volt)}
.form-actions{display:flex;gap:10px;flex-wrap:wrap}
.form-actions .btn{padding:11px 18px;font-size:14px}
.help{font-size:12.5px;color:var(--muted);line-height:1.6}
.help code{font-family:var(--f-mono);color:var(--cyan)}

k Anda. Anda tetap memegang percakapan yang butuh sentuhan manusia, seperti negosiasi atau keluhan.\n\n## 2. Mencatat pengeluaran\n\nFoto nota lalu biarkan AI membaca tanggal, nama barang, dan total belanja. Dalam sebulan, Anda punya catatan pengeluaran rapi tanpa mengetik satu angka pun.\n\n## 3. Menulis konten promosi\n\nAI bisa menyiapkan draf caption, deskripsi produk, dan pesan siaran. Tugas Anda tinggal menyunting supaya gaya bahasanya tetap terasa seperti toko Anda.\n\n> Mulai dari satu pekerjaan, ukur waktu yang dihemat, baru tambah yang lain.\n\nKalau Anda bingung harus mulai dari mana, catat semua pekerjaan selama satu minggu. Yang paling sering muncul dan paling membosankan biasanya kandidat terbaik untuk diotomasi.", "sample": true}, {"id": "p2", "slug": "prompt-seperti-brief", "cat": "Tips", "date": "2026-10-24", "title": "Prompt yang baik itu seperti brief untuk karyawan baru", "excerpt": "Kalau karyawan baru bingung dengan perintah Anda, AI juga akan bingung. Begini cara menulis perintah yang jelas.", "cover": "", "body": "Bayangkan Anda menyuruh karyawan baru di hari pertamanya: tolong buatkan promosi. Hasilnya hampir pasti tidak sesuai harapan, karena ia tidak tahu produknya, siapa pembelinya, dan promosi itu akan dipasang di mana.\n\nAI bekerja dengan cara yang mirip. Semakin jelas konteksnya, semakin tepat hasilnya.\n\n## Empat hal yang perlu ada\n\n- Siapa Anda dan untuk siapa tulisannya.\n\n- Apa tujuannya: menjual, menjelaskan, atau meminta maaf.\n\n- Batasannya: panjang tulisan, gaya bahasa, kata yang harus dihindari.\n\n- Contoh hasil yang Anda sukai, kalau ada.\n\n> Perintah yang panjang dan jelas hampir selalu lebih baik daripada perintah pendek yang ambigu.\n\nSimpan perintah yang hasilnya bagus, lalu pakai ulang sebagai templat. Lama-lama Anda punya perpustakaan perintah sendiri.", "sample": true}, {"id": "p3", "slug": "di-balik-notakilat", "cat": "Studi kasus", "date": "2026-10-12", "title": "Di balik layar NotaKilat: membaca nota yang kusut dan pudar", "excerpt": "Nota kertas termal cepat pudar, sering terlipat, dan formatnya berbeda di setiap toko. Ini cara saya mengatasinya.", "cover": "", "body": "NotaKilat lahir dari masalah sederhana: tumpukan nota belanja yang tidak pernah sempat dicatat. Tantangannya ternyata bukan di AI-nya, melainkan di kondisi nota itu sendiri.\n\n## Masalah pertama: kualitas foto\n\nNota sering difoto miring, di bawah lampu kuning, dan dalam keadaan terlipat. Langkah pertama aplikasi adalah meluruskan gambar dan menaikkan kontras sebelum teksnya dibaca.\n\n## Masalah kedua: format yang berbeda-beda\n\nMinimarket, warung, dan pom bensin punya susunan nota yang berlainan. Daripada membuat aturan untuk setiap toko, saya meminta model AI mengembalikan data dalam satu susunan baku: tanggal, nama toko, daftar barang, dan total.\n\n## Masalah ketiga: angka yang salah baca\n\nAngka 8 dan 3 yang pudar mudah tertukar. Karena itu aplikasi menjumlahkan ulang semua barang dan membandingkannya dengan total di nota. Kalau berbeda, pengguna diminta memeriksa.\n\n> Pemeriksaan sederhana seperti menjumlah ulang sering lebih berguna daripada model yang lebih besar.\n\nPelajaran terbesarnya: aplikasi AI yang baik tetap butuh pemikiran rekayasa biasa di sekelilingnya.", "sample": true}, {"id": "p4", "slug": "biaya-aplikasi-ai", "cat": "Bisnis", "date": "2026-09-30", "title": "Berapa biaya membuat aplikasi AI di tahun 2026?", "excerpt": "Ada tiga komponen biaya yang sering terlupa: pembuatan, pemakaian model, dan pemeliharaan.", "cover": "", "body": "Pertanyaan yang paling sering saya terima adalah berapa biayanya. Jawabannya bergantung pada tiga komponen yang perlu dipahami sejak awal.\n\n## Biaya pembuatan\n\nIni biaya sekali bayar untuk merancang dan membangun aplikasi. Chatbot sederhana tentu lebih murah daripada aplikasi web lengkap dengan dashboard dan banyak pengguna.\n\n## Biaya pemakaian model\n\nSetiap kali aplikasi bertanya ke model AI, ada biaya kecil yang dihitung berdasarkan panjang teks. Untuk usaha kecil, biaya ini sering hanya puluhan sampai ratusan ribu rupiah per bulan.\n\n## Biaya pemeliharaan\n\nServer, pembaruan, dan perbaikan kecil. Komponen ini sering terlupa, padahal menentukan apakah aplikasi tetap berjalan baik setahun kemudian.\n\n> Minta selalu perkiraan biaya bulanan, bukan hanya harga pembuatan.\n\nDengan memahami ketiganya, Anda bisa membandingkan penawaran secara adil dan tidak kaget dengan tagihan di kemudian hari.", "sample": true}, {"id": "p-digitalisasi-umkm-kredit", "slug": "digitalisasi-transaksi-umkm-kredit-perbankan", "cat": "Opini", "date": "2026-11-07", "title": "Digitalisasi Transaksi UMKM sebagai Jembatan Menuju Kredit Perbankan", "excerpt": "Jejak transaksi QRIS, e-commerce, dan aplikasi kasir bisa menjadi rapor usaha yang dibaca bank, membuka jalan UMKM menuju kredit perbankan.", "cover": "", "body": "## Pendahuluan\n\nSejak pandemi Covid-19, pemerintah menjadikan digitalisasi UMKM sebagai agenda nasional. Melalui Gerakan Nasional Bangga Buatan Indonesia (Gernas BBI) yang diluncurkan Mei 2020, pemerintah menargetkan 30 juta UMKM masuk ekosistem digital pada 2024 (JPNN). Pada akhir 2023, Kemenko Perekonomian mencatat sekitar 27 juta UMKM telah go digital (Bisnis.com). Di sisi pembayaran, Bank Indonesia memperluas QRIS hingga diterima 44,86 juta merchant per Juni 2026, dan 96,68 persen di antaranya adalah UMKM (Antara).\n\nPandemi sempat memukul jumlah pelaku usaha. Data Kemenkop UKM menunjukkan jumlah UMKM turun dari 65,47 juta unit pada 2019 menjadi 64,19 juta unit pada 2020 (Mimbar Agribisnis, 2023). Namun sektor ini bangkit cepat. Bank Indonesia menyebut jumlah unit usaha kembali mencapai sekitar 66 juta pada 2023 (detikFinance). Banyak pekerja yang terdampak PHK beralih membuka usaha sendiri, dan jumlah UMKM yang berjualan di e-commerce melonjak dari 8 juta sebelum pandemi menjadi 21 juta pada akhir 2022 (IDX Channel).\n\nPeran UMKM dalam perekonomian sangat menentukan. Menurut Kementerian UMKM yang merujuk data BPS, terdapat 65,5 juta UMKM yang menyumbang 61,9 persen PDB dan menyerap lebih dari 119 juta tenaga kerja, atau sekitar 97 persen tenaga kerja nasional (Antara). UMKM juga menyumbang 15,7 persen ekspor nasional (Katadata).\n\nAgar peran sebesar itu dapat terus tumbuh, UMKM membutuhkan modal kerja dan investasi, dan perbankan adalah sumber pembiayaan formal terbesar. Ironisnya, porsi kredit UMKM masih berada di bawah 20 persen dari total kredit perbankan sepanjang 2025 (Bisnis.com). Kesenjangan inilah yang dapat dijembatani oleh digitalisasi transaksi.\n\n## Dari go digital ke jejak transaksi\n\nProgram digitalisasi selama ini banyak diukur dari jumlah UMKM yang onboarding ke marketplace. Ukuran itu penting, tetapi manfaat terbesarnya justru ada pada data yang dihasilkan. Setiap pembayaran lewat QRIS, e-commerce, atau aplikasi kasir meninggalkan catatan omzet, frekuensi penjualan, dan arus kas yang sulit dipalsukan. Skalanya sudah besar: pada semester I 2026, volume transaksi QRIS mencapai 12,55 miliar dengan nilai Rp600,69 triliun (Infobank).\n\nDeputi Gubernur BI Filianingsih Hendarta menilai penggunaan QRIS dapat menjadi jembatan bagi UMKM menuju pembiayaan formal (Infobank). Pandangan ini sejalan dengan gagasan bahwa transaksi digital layak menjadi salah satu syarat pengajuan kredit.\n\n## Pertumbuhan UMKM pasca pandemi menuntut pembiayaan baru\n\nBertambahnya pelaku usaha pasca pandemi berarti bertambah pula calon debitur yang belum pernah berhubungan dengan bank. Mereka umumnya tidak punya laporan keuangan, riwayat kredit, maupun agunan. Kemenkop UKM mengakui agunan selama ini menjadi kendala utama UMKM mengakses pembiayaan, termasuk KUR (Infobank). Tanpa data, bank tidak dapat menilai kelayakan, sehingga usaha baru ini cenderung berpaling ke rentenir atau pinjaman daring berbunga tinggi.\n\n## Regulasi sudah membuka jalan\n\nKerangka hukumnya kini tersedia. OJK menerbitkan POJK 29/2024 tentang Pemeringkat Kredit Alternatif atau Innovative Credit Scoring (Kontan). Selanjutnya, POJK 19/2025 tentang Kemudahan Akses Pembiayaan kepada UMKM memungkinkan bank dan lembaga keuangan nonbank memakai penilaian kredit alternatif (Okezone). OJK bahkan menyatakan UMKM yang belum tercatat di SLIK dapat dinilai dari data alternatif seperti transaksi e-commerce dan tagihan listrik (CNBC Indonesia).\n\nManfaatnya terukur. Kemenkop UKM mengutip riset yang menunjukkan credit scoring dengan data alternatif dapat menaikkan persetujuan pinjaman sekitar 10 persen dan menekan potensi kredit macet sekitar 4 persen (Infobank). Di lapangan, BRI Finance telah memakai riwayat transaksi usaha dan arus kas untuk menilai kelayakan debitur UMKM (Bisnis.com).\n\n## Mengapa dukungan semua pihak diperlukan\n\nRasio kredit bermasalah UMKM sempat mencapai 4,15 persen pada Februari 2025, di atas rata-rata industri (Bisnis.com). Angka ini menjelaskan mengapa bank berhati-hati. Pengamat menilai kewajiban menyalurkan kredit saja tidak cukup; yang dibutuhkan adalah ekosistem pendukung berupa penjaminan dan digitalisasi credit scoring (Bisnis.com). Data transaksi digital mengurangi asimetri informasi, sehingga bank dapat menyalurkan kredit lebih luas tanpa menambah risiko secara berlebihan.\n\nNamun, digitalisasi transaksi juga membawa tantangan. OJK menekankan perlunya kajian pelindungan data pribadi dan validitas informasi sebelum data QRIS dipakai untuk penilaian kredit (Infobank). Selain itu, sebagian besar UMKM adalah usaha mikro yang literasi digitalnya terbatas. Karena itu, syarat transaksi digital sebaiknya diterapkan bertahap dan disertai pendampingan, bukan menjadi penghalang baru.\n\nOJK menargetkan porsi kredit UMKM naik hingga 25 persen dari total kredit perbankan (Infobank). Target ini realistis bila jutaan UMKM yang sudah memakai QRIS dan marketplace menjadikan jejak transaksinya sebagai \"rapor\" usaha yang dapat dibaca bank.\n\n## Penutup\n\nMendukung program digitalisasi UMKM bukan sekadar mengejar angka onboarding, melainkan membangun jalan menuju kredit perbankan. Transaksi digital memberi UMKM rekam jejak usaha, memberi bank dasar penilaian yang objektif, dan memberi negara basis data untuk kebijakan yang lebih tepat sasaran. Pemerintah, Bank Indonesia, OJK, perbankan, dan pelaku UMKM perlu bergerak bersama: memperluas QRIS dan pencatatan digital, menjamin pelindungan data, serta mendampingi usaha mikro agar tidak tertinggal. Dengan begitu, tulang punggung ekonomi nasional ini dapat benar-benar naik kelas.\n\n## Rujukan\n\n- Antara (2025). Kementerian UMKM: 65,5 juta UMKM serap 119 juta tenaga kerja\n- Antara Bali (2026). QRIS dipakai 65,77 juta pengguna dan diterima 44,86 juta gerai\n- Bisnis.com (2023). Pemerintah optimistis target 30 juta UMKM go digital tercapai pada 2024\n- Bisnis.com (2025). Alarm pertumbuhan kredit UMKM bank\n- Bisnis.com (2025). OJK wajibkan kemudahan pembiayaan UMKM, begini cara BRI Finance nilai kelayakan kredit\n- Bisnis.com (2025). Menakar taji beleid anyar OJK dalam dongkrak kredit UMKM\n- CNBC Indonesia (2025). UMKM bisa ajukan kredit ke bank tanpa SLIK\n- detikFinance (2023). Makin melek digital, pedagang pengguna QRIS tembus 25,4 juta\n- Dhiyaa, A. R. & Sulistyowati, L. (2023). Strategi UMKM PT Ijo Kreasi Indonesia pasca pandemi Covid-19. Mimbar Agribisnis, 9(2).\n- IDX Channel. 13 juta UMKM mendadak jadi pedagang online gegara pandemi\n- Infobank. Skema credit scoring KemenkopUKM: debitur bisa akses KUR hingga Rp500 juta tanpa agunan\n- Infobank. Wacana QRIS jadi dasar penilaian kredit, begini tanggapan OJK\n- Infobank (2026). Peluang penyaluran kredit UMKM masih besar, ini strategi OJK\n- Infobank (2026). BI: QRIS jadi pintu UMKM naik kelas dan akses pembiayaan formal\n- Infobank (2026). Transaksi QRIS melonjak 100,12 persen di semester I 2026\n- JPNN. Luhut: semua harus segera bergerak kawal 30 juta UMKM onboarding digital\n- Katadata (2025). UMKM sumbang 60,5% PDB, tetapi 99,7% usahanya masih mikro\n- Kontan (2025). Menteri Maman genjot kredit UMKM digital tanpa jaminan dengan ICS\n- Okezone (2025). OJK permudah kredit UMKM, bisa dapat pembiayaan meski tanpa SLIK"}], "gallery": [], "videos": []}</script>
<script id="site-js">
(function(){
"use strict";
/* Kabuzen Rumah AI — semua konten tersimpan di blok JSON #site-data.
   Pemilik mengubahnya lewat tombol "Kelola konten"; halaman lalu menerbitkan ulang dirinya. */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const fmtDate = d => { const x = new Date((d||"")+"T00:00:00"); return isNaN(x) ? "" : x.getDate()+" "+BULAN[x.getMonth()]+" "+x.getFullYear(); };
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const STATUS = {live:["live","Live"], beta:["beta","Beta"], soon:["soon","Segera"]};
const hashHue = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h%360; };
const safeUrl = u => /^(https?:\/\/|\/)/i.test(u||"") ? u : "";
const ss = { get(k){ try{return sessionStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{sessionStorage.setItem(k,v);}catch(e){} }, del(k){ try{sessionStorage.removeItem(k);}catch(e){} } };

/* ---------- boot: mount shell ---------- */
const shellTpl = document.getElementById("shell");
shellTpl.parentNode.insertBefore(shellTpl.content.cloneNode(true), shellTpl);
const PUBLISHED = JSON.parse(document.getElementById("site-data").textContent);
let DATA = clone(PUBLISHED);   // what the page shows (draft for editors)
let dirty = 0;

/* ---------- helpers ---------- */
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2200); }
function copyText(text, el){
  try{
    navigator.clipboard.writeText(text).then(()=>toast("Tersalin")).catch(()=>selectEl(el));
  }catch(e){ selectEl(el); }
}
function selectEl(el){ if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Teks sudah dipilih, tekan salin"); }
function platformOf(url){
  const u=(url||"").toLowerCase();
  if(/youtube\.com|youtu\.be/.test(u)) return ["youtube","YouTube"];
  if(/instagram\.com/.test(u)) return ["instagram","Instagram"];
  if(/tiktok\.com/.test(u)) return ["tiktok","TikTok"];
  return ["other","Video"];
}
function readMinutes(body){ return Math.max(1, Math.round((body||"").split(/\s+/).filter(Boolean).length/200)); }
function renderBody(text){
  const lines=(text||"").replace(/\r/g,"").split("\n");
  let html="", para=[], inList=false;
  const flush=()=>{ if(para.length){ html+=`<p>${esc(para.join(" "))}</p>`; para=[]; } };
  const closeList=()=>{ if(inList){ html+="</ul>"; inList=false; } };
  for(const raw of lines){
    const l=raw.trim();
    if(!l){ flush(); continue; }
    if(/^[-•*]\s+/.test(l)){ flush(); if(!inList){ html+="<ul>"; inList=true; } html+=`<li>${esc(l.replace(/^[-•*]\s+/,""))}</li>`; continue; }
    closeList();
    if(l.startsWith("## ")){ flush(); html+=`<h2>${esc(l.slice(3))}</h2>`; }
    else if(l.startsWith("> ")){ flush(); html+=`<blockquote>${esc(l.slice(2))}</blockquote>`; }
    else para.push(l);
  }
  flush(); closeList(); return html;
}

/* ---------- generative cover (when a post has no image) ---------- */
function drawCover(cv, seed){
  const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = Math.max(200, r.width||600), H = Math.max(100, r.height||300);
  cv.width = W*dpr; cv.height = H*dpr; const g = cv.getContext("2d"); g.scale(dpr,dpr);
  let s = 0; for(const c of seed) s = (s*31 + c.charCodeAt(0))>>>0;
  const rnd = () => (s = (s*1664525+1013904223)>>>0) / 4294967296;
  const bg = g.createLinearGradient(0,0,W,H); bg.addColorStop(0,"#1B1257"); bg.addColorStop(1,"#0A0624");
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){ const x=rnd()*W,y=rnd()*H,rad=40+rnd()*W*.35;
    const rg=g.createRadialGradient(x,y,0,x,y,rad); const hue = rnd()<.5?205:255;
    rg.addColorStop(0,`hsla(${hue},95%,60%,.45)`); rg.addColorStop(1,"hsla(240,90%,40%,0)"); g.fillStyle=rg; g.fillRect(0,0,W,H); }
  g.strokeStyle="rgba(85,238,255,.18)"; g.lineWidth=1;
  for(let x=0;x<W;x+=28){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(let y=0;y<H;y+=28){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  const n=14, pts=[]; for(let i=0;i<n;i++) pts.push([rnd()*W, rnd()*H]);
  g.strokeStyle="rgba(85,238,255,.55)"; g.lineWidth=1.2;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]); if(d<W*.22){g.globalAlpha=1-d/(W*.22);g.beginPath();g.moveTo(pts[i][0],pts[i][1]);g.lineTo(pts[j][0],pts[j][1]);g.stroke();}}
  g.globalAlpha=1;
  pts.forEach((p,i)=>{g.fillStyle=i%5===0?"#FFD233":"#55EEFF";g.beginPath();g.arc(p[0],p[1],i%5===0?3.5:2.2,0,7);g.fill();});
  const bx=W*.78, by=H*.5, k=Math.min(W,H)*.32;
  g.fillStyle="#FFD233"; g.shadowColor="rgba(255,210,51,.6)"; g.shadowBlur=24;
  g.beginPath(); g.moveTo(bx+.15*k,by-.9*k); g.lineTo(bx-.35*k,by+.1*k); g.lineTo(bx-.02*k,by+.05*k); g.lineTo(bx-.2*k,by+.9*k); g.lineTo(bx+.38*k,by-.15*k); g.lineTo(bx+.04*k,by-.1*k); g.closePath(); g.fill();
  g.shadowBlur=0;
}
function paintCovers(root){ (root||document).querySelectorAll("canvas[data-seed]").forEach(c=>drawCover(c,c.dataset.seed)); }
const coverHTML = p => p.cover ? `<img src="${esc(p.cover)}" alt="" loading="lazy">` : `<canvas data-seed="${esc(p.slug)}" aria-hidden="true"></canvas>`;

/* ---------- render: whole site from DATA ---------- */
let curCat = "Semua";
function renderAll(){
  const C = DATA.config;
  document.querySelectorAll("img[data-logo]").forEach(i=>{ i.src = C.logo; });
  $("#stApps").textContent = DATA.apps.length;
  $("#stLive").textContent = DATA.apps.filter(a=>a.status==="live").length;
  $("#stPosts").textContent = DATA.posts.length;
  $("#stVids").textContent = DATA.videos.length + DATA.gallery.length;
  $("#yr").textContent = new Date().getFullYear();
  $("#waText").textContent = C.whatsappLabel || C.whatsapp || "Belum diisi";
  $("#mailText").textContent = C.email || "Belum diisi";
  $("#sampleNote").hidden = !DATA.apps.concat(DATA.posts).some(x=>x.sample);
  renderFilters(); renderApps(); renderPosts(); renderGallery(); renderVideos(); renderSocials();
  if(!$("#reader").hidden) route();
}
function renderFilters(){
  const cats = ["Semua", ...new Set(DATA.apps.map(a=>a.cat).filter(Boolean))];
  if(!cats.includes(curCat)) curCat="Semua";
  $("#filters").innerHTML = cats.map(c=>`<button type="button" aria-pressed="${c===curCat}">${esc(c)}</button>`).join("");
}
function renderApps(){
  const q = $("#q").value.trim().toLowerCase();
  const list = DATA.apps.filter(a => (curCat==="Semua"||a.cat===curCat) && (!q || (a.name+" "+a.desc+" "+(a.tags||[]).join(" ")).toLowerCase().includes(q)));
  $("#apps").innerHTML = list.length ? list.map(a=>{
    const [cls,lbl] = STATUS[a.status]||STATUS.live;
    const ini = (a.name||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
    const h = hashHue(a.name||"x");
    const url = safeUrl(a.url);
    const link = a.status==="soon" ? `<a aria-disabled="true">Segera hadir</a>` : url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Buka aplikasi →</a>` : "";
    return `<article class="app">${a.shot?`<div class="shot"><img src="${esc(a.shot)}" alt="Tampilan ${esc(a.name)}" loading="lazy"></div>`:""}
      <div class="app-top">
        ${a.shot&&!a.image?"":`<div class="mono" style="background:linear-gradient(135deg,hsl(${h} 90% 55%),hsl(${(h+40)%360} 80% 36%))">${a.image?`<img src="${esc(a.image)}" alt="">`:esc(ini)}</div>`}
        <div><h3>${esc(a.name)}</h3><div class="cat">${esc(a.cat)}</div></div>
        <span class="status ${cls}">${lbl}</span>
      </div>
      <p>${esc(a.desc)}</p>
      <div class="tags">${(a.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      <div class="app-foot"><span>${a.year?"Rilis "+esc(a.year):""}</span>${link}</div>
    </article>`;
  }).join("") : `<div class="empty">${DATA.apps.length?`Belum ada aplikasi yang cocok dengan “${esc(q)}”. Coba kata lain atau pilih kategori Semua.`:"Katalog aplikasi akan segera diisi."}</div>`;
}
const sortedPosts = () => [...DATA.posts].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
function postCard(p, cls){
  return `<a class="post ${cls||""}" href="#artikel-${esc(p.slug)}">
    <div class="cover">${coverHTML(p)}</div>
    <div class="body">
      <div class="meta"><b>${esc(p.cat||"Artikel")}</b><span>${fmtDate(p.date)}</span><span>${readMinutes(p.body)} menit baca</span></div>
      <h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p>
    </div></a>`;
}
function renderPosts(){
  const s = sortedPosts();
  $("#posts").innerHTML = s.length ? s.map((p,i)=>postCard(p, i===0?"feat":"small")).join("") : `<div class="empty">Artikel pertama sedang ditulis.</div>`;
  paintCovers($("#posts"));
}
function renderGallery(){
  const g = DATA.gallery;
  $("#gallery").innerHTML = g.length ? g.map((x,i)=>`<figure data-i="${i}" tabindex="0"><img src="${esc(x.image)}" alt="${esc(x.caption)}" loading="lazy">${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:""}</figure>`).join("")
    : `<div class="empty" style="column-span:all">Foto karya dan dokumentasi akan tampil di sini.</div>`;
}
function renderVideos(){
  const v = DATA.videos;
  $("#videos").innerHTML = v.length ? v.map(x=>{
    const [k,lbl]=platformOf(x.url); const url=safeUrl(x.url);
    return `<a class="vid" href="${esc(url||"#galeri")}" target="_blank" rel="noopener">
      <div class="thumb pf-${k}">${x.cover?`<img src="${esc(x.cover)}" alt="">`:""}<span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span><span class="pf">${lbl}</span></div>
      <div class="body"><h3>${esc(x.title||("Tonton di "+lbl))}</h3><small>Buka di ${lbl} ↗</small></div></a>`;
  }).join("") : `<div class="empty">Video dari YouTube, Instagram, dan TikTok akan tampil di sini.</div>`;
}
function renderSocials(){
  const C=DATA.config, items=[["youtube","YouTube","#FF3B3B"],["instagram","Instagram","#D62976"],["tiktok","TikTok","#25F4EE"]].filter(([k])=>safeUrl(C[k]));
  $("#socials").innerHTML = items.map(([k,l,c])=>`<a href="${esc(C[k])}" target="_blank" rel="noopener"><i style="background:${c}"></i>${l}</a>`).join("");
}

/* ---------- article reader ---------- */
function route(){
  const h = location.hash.slice(1);
  const p = h.startsWith("artikel-") && DATA.posts.find(x=>"artikel-"+x.slug===h);
  if(p){
    const others = sortedPosts().filter(x=>x!==p).slice(0,2);
    $("#readerBody").innerHTML = `
      <a class="back" href="#artikel">← Semua artikel</a>
      <div class="meta"><b>${esc(p.cat||"Artikel")}</b><span>${fmtDate(p.date)}</span><span>${readMinutes(p.body)} menit baca</span></div>
      <h1>${esc(p.title)}</h1>
      <div class="cover">${coverHTML(p)}</div>
      <div class="prose">${renderBody(p.body)}</div>
      <div class="author"><img src="${esc(DATA.config.logo)}" alt=""><p><b>Kabuzen</b>Pembuat aplikasi AI dan penulis di Kabuzen Rumah AI. Ingin aplikasi serupa untuk usaha Anda? <a href="#kontak" style="color:var(--bolt)">Konsultasi gratis</a>.</p></div>
      ${others.length?`<div class="more"><h2>Baca juga</h2><div class="posts">${others.map(o=>postCard(o)).join("")}</div></div>`:""}`;
    const wasHome = !$("#home").hidden;
    $("#home").hidden = true; $("#reader").hidden = false;
    document.title = p.title + " · Kabuzen Rumah AI";
    if(wasHome) window.scrollTo(0,0);
    paintCovers($("#reader")); setActive("artikel");
  } else {
    const wasReader = !$("#reader").hidden;
    $("#reader").hidden = true; $("#home").hidden = false;
    document.title = "Kabuzen Rumah AI";
    if(wasReader){ paintCovers($("#home")); const t = document.getElementById(h||"beranda"); if(t) t.scrollIntoView(); }
  }
  $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
}
window.addEventListener("hashchange", route);
function setActive(id){ document.querySelectorAll("nav.main a").forEach(a=>a.classList.toggle("on", a.dataset.sec===id)); }
try{
  const io = new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting && $("#reader").hidden) setActive(e.target.id); }); }, {rootMargin:"-45% 0px -50% 0px"});
  ["beranda","aplikasi","layanan","artikel","galeri","kontak"].forEach(id=>io.observe(document.getElementById(id)));
}catch(e){}

/* ---------- static UI wiring ---------- */
$("#menuBtn").addEventListener("click", ()=>{ const o = $("#nav").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });
$("#filters").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; curCat=b.textContent; renderFilters(); renderApps(); });
$("#q").addEventListener("input", renderApps);
document.querySelectorAll("[data-plan]").forEach(b=>b.addEventListener("click", ()=>{ $("#f-plan").value = b.dataset.plan; }));
document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click", ()=>{
  const wa=b.dataset.copy==="wa"; copyText(wa?(DATA.config.whatsappLabel||DATA.config.whatsapp):DATA.config.email, wa?$("#waText"):$("#mailText"));
}));
$("#gallery").addEventListener("click", e=>{ const f=e.target.closest("figure"); if(f) openLightbox(+f.dataset.i); });
$("#gallery").addEventListener("keydown", e=>{ const f=e.target.closest("figure"); if(f && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openLightbox(+f.dataset.i); } });
function openLightbox(i){ const x=DATA.gallery[i]; if(!x) return; const lb=$("#lightbox"); lb.innerHTML=`<div><img src="${esc(x.image)}" alt="${esc(x.caption)}">${x.caption?`<p>${esc(x.caption)}</p>`:""}</div>`; lb.hidden=false; }
$("#lightbox").addEventListener("click", ()=>{ $("#lightbox").hidden=true; });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ $("#lightbox").hidden=true; } });

$("#order").addEventListener("submit", e=>{
  e.preventDefault();
  const name=$("#f-name").value.trim(), msg=$("#f-msg").value.trim();
  const err=[]; if(!name) err.push("nama"); if(msg.length<10) err.push("kebutuhan (minimal 10 karakter)");
  if(err.length){ $("#err").textContent="Mohon lengkapi "+err.join(" dan ")+"."; $("#err").hidden=false; return; }
  $("#err").hidden=true;
  const biz=$("#f-biz").value.trim();

/* image → compressed data URL (works for every visitor, no external hosting needed) */
function compressImage(file, max){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type)) return rej(new Error("type"));
    const fr=new FileReader();
    fr.onerror=()=>rej(fr.error);
    fr.onload=()=>{
      if(file.type==="image/svg+xml" || file.type==="image/gif"){ return res(fr.result); }
      const img=new Image();
      img.onload=()=>{
        const k=Math.min(1, max/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let out=c.toDataURL("image/webp",.82);
        if(!out.startsWith("data:image/webp")) out=c.toDataURL("image/jpeg",.82);
        res(out);
      };
      img.onerror=()=>rej(new Error("decode"));
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function readManuscript(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".docx")){
    if(!window.mammoth) await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js");
    const r=await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
    return r.value.replace(/\n{3,}/g,"\n\n").trim();
  }
  return (await file.text()).trim();
}

let pendingImages={};
function wireForm(){
  const form=$("#edForm"); if(!form) return;
  pendingImages={};
  const cancel=$("#edCancel"); if(cancel) cancel.onclick=()=>{ editing=null; renderDrawerBody(); };
  form.querySelectorAll("[data-img]").forEach(inp=>inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return;
    const k=inp.dataset.img; $("#pv-"+k).textContent="Memproses…";
    try{ const url=await compressImage(file, +inp.dataset.max||1200); pendingImages[k]=url; $("#pv-"+k).innerHTML=`<img src="${url}" alt="">`; }
    catch(e){ $("#pv-"+k).textContent="Gagal"; toast("File ini bukan gambar yang bisa dibaca. Coba JPG atau PNG."); }
  });
  form.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{ pendingImages[b.dataset.clear]=""; $("#pv-"+b.dataset.clear).textContent="Belum ada"; b.remove(); });
  const mf=$("#ed-file"); if(mf) mf.onchange=async()=>{
    const file=mf.files[0]; if(!file) return;
    try{
      const text=await readManuscript(file); const ta=$("#ed-body");
      ta.value = ta.value.trim() ? ta.value.trim()+"\n\n"+text : text;
      const t=$("#ed-title"); if(t && !t.value.trim()) t.value=file.name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," ");
      toast("Naskah dimuat");
    }catch(e){ toast("Naskah tidak bisa dibaca. Simpan ulang sebagai .docx atau .txt lalu coba lagi."); }
  };
  form.onsubmit=e=>{
    e.preventDefault();
    const isConfig = tab==="config";
    const f=FIELDS[tab];
    const base = isConfig ? DATA.config : (editing.id ? DATA[tab].find(x=>x.id===editing.id) : editing.blank);
    const out = Object.assign({}, base);
    for(const x of f){
      if(x.type==="image"){ if(x.k in pendingImages) out[x.k]=pendingImages[x.k]; continue; }
      let v=(form.elements[x.k]||{}).value; v=v==null?"":String(v).trim();
      if(x.k==="tags") v=v.split(",").map(s=>s.trim()).filter(Boolean);
      if(x.type==="number") v=v?+v:"";
      out[x.k]=v;
    }
    const missing=f.filter(x=>x.req && (Array.isArray(out[x.k])?!out[x.k].length:!out[x.k])).map(x=>x.l.toLowerCase());
    const badUrl=["url","youtube","instagram","tiktok"].find(k=>out[k] && !safeUrl(out[k]));
    const err=$("#edErr");
    if(missing.length){ err.textContent="Mohon isi "+missing.join(", ")+"."; err.hidden=false; return; }
    if(badUrl){ err.textContent="Link harus diawali https:// (contoh: https://youtube.com/@kabuzen)."; err.hidden=false; return; }
    delete out.sample;
    if(isConfig){ DATA.config=out; markDirty(); toast("Pengaturan disimpan ke pratinjau"); renderDrawerBody(); return; }
    if(tab==="posts"){
      if(!out.excerpt) out.excerpt = renderBody(out.body).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,150)+"…";
      if(!out.slug || !editing.id){
        let s=(out.title||"artikel").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"artikel";
        let n=s, i=2; while(DATA.posts.some(p=>p.slug===n && p.id!==out.id)) n=s+"-"+(i++);
        out.slug=n;
      }
    }
    if(editing.id){ DATA[tab]=DATA[tab].map(x=>x.id===editing.id?out:x); }
    else { out.id=uid(tab[0]); DATA[tab]= tab==="posts" ? DATA[tab].concat(out) : [out].concat(DATA[tab]); }
    editing=null; markDirty(); renderDrawerBody(); toast("Disimpan ke pratinjau. Klik Terbitkan agar tampil untuk pengunjung.");
  };
}

async function publishSite(){
  const btn=$("#publishBtn"); btn.disabled=true; btn.textContent="Menerbitkan…";
  if(!artifactNS){ publishError="Penerbitan tidak tersedia di tampilan ini. Buka website lewat halamannya sendiri di claude.ai (bukan pratinjau di samping obrolan), lalu coba lagi."; renderDrawerFoot(); return; }
  if(sizeInfo().bytes > 16*1024*1024){ publishError="Halaman melebihi 16 MB. Hapus atau ganti beberapa gambar besar."; renderDrawerFoot(); return; }
  ss.set("kbz-draft", JSON.stringify(DATA)); ss.set("kbz-pub","1");
  try{
    await artifactNS.publish(buildDoc(DATA));
    // the view reloads to the new version
  }catch(e){
    ss.del("kbz-pub");
    const code=(e && e.code) || "tidak diketahui";
    const msg = code==="conflict" ? "Ada versi lebih baru. Halaman dimuat ulang; draf Anda bisa dipulihkan di panel ini."
      : (code==="not_writer"||code==="not_granted") ? "Akun ini tidak punya izin mengubah halaman."
      : code==="too_large" ? "Halaman terlalu besar. Hapus beberapa gambar lalu coba lagi."
      : code==="rate_limited" ? "Terlalu sering menerbitkan. Tunggu sebentar lalu coba lagi."
      : (code==="not_granted"||code==="capability_disabled"||code==="capability_removed"||code==="consent_required") ? "Penerbitan tidak tersedia di tampilan ini. Buka website lewat halamannya sendiri di claude.ai (bukan pratinjau di samping obrolan), lalu coba lagi."
      : "Gagal menerbitkan (kode: "+code+"). Perubahan Anda masih tersimpan di panel; coba klik Terbitkan lagi sebentar lagi.";
    if(code==="conflict") ss.set("kbz-restore", JSON.stringify(DATA));
    publishError=msg; toast(msg); renderDrawerFoot();
  }
}

/* reveal admin only for editors */
(async function initAdmin(){
  for(let i=0;i<40 && !(window.claude && window.claude.use);i++) await new Promise(r=>setTimeout(r,250));
  if(!window.claude || !window.claude.use) return;
  try{
    const user = await window.claude.use("user");
    const can = user ? await user.canEdit() : false;
    if(!can) return;
    artifactNS = await window.claude.use("artifact");
    const fab=$("#fab"); fab.hidden=false; fab.onclick=openDrawer;
    $("#pendOpen").onclick=openDrawer;
    window.addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });
    updatePending();
  }catch(e){}
})();
})();
</script>
