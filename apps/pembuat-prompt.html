<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pembuat Prompt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
/* Reset dasar (di artifact disediakan otomatis, di ekstensi harus ditulis sendiri) */
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}

/* Layout: satu kolom untuk HP (wizard di atas, pratinjau di bawah, bilah aksi tetap di dasar);
   dua kolom ≥ 920px dengan pratinjau menempel di kanan. Tema gelap tunggal ala SIGMA. */
:root{
  color-scheme: dark;
  --bg:#0A1230;
  --bg-2:#0E1838;
  --surface:#131D45;
  --surface-2:#1A2656;
  --line:#28376E;
  --fg:#EEF2FF;
  --muted:#A3AED6;
  --faint:#6E7AA8;
  /* enam aksen */
  --c-peran:#FF6B8B;
  --c-tugas:#FFB347;
  --c-konteks:#34D3B4;
  --c-batasan:#A78BFA;
  --c-hasil:#4FB3FF;
  --c-plus:#B7E44A;
  --warn:#FFC857;
  --on-accent:#0A1230;
  --f-sans:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-s:10px; --r-m:16px; --r-l:22px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(600px 300px at 110% -5%, color-mix(in srgb,var(--c-hasil) 18%,transparent), transparent 70%),
    radial-gradient(500px 260px at -15% 30%, color-mix(in srgb,var(--c-peran) 12%,transparent), transparent 70%),
    var(--bg);
  background-attachment:fixed;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-plus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg-2) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.spectrum{height:4px;display:flex}
.spectrum i{flex:1}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{width:34px;height:34px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;flex:none}
.logo i:nth-child(1){background:var(--c-peran)}.logo i:nth-child(2){background:var(--c-tugas)}.logo i:nth-child(3){background:var(--c-konteks)}
.logo i:nth-child(4){background:var(--c-batasan)}.logo i:nth-child(5){background:var(--c-hasil)}.logo i:nth-child(6){background:var(--c-plus)}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.meter{margin-left:auto;display:flex;align-items:center;gap:8px}
.meter-bars{display:flex;gap:3px}
.meter-bars i{width:14px;height:8px;border-radius:3px;background:var(--line);transition:background .25s}
.meter-num{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-weight:600;font-size:13px}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{border-color:var(--muted)}
.hide-sm{display:none}
@media (min-width:560px){.hide-sm{display:inline}}

/* ---------- Main ---------- */
main{max-width:1120px;margin:0 auto;padding-block:20px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Beranda */
.hero{display:grid;gap:10px;margin-bottom:18px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-plus)}
.hero h1{font-size:clamp(26px,6.4vw,40px);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--muted);max-width:60ch}
.formula{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.formula span{font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:999px;color:var(--on-accent)}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.types{grid-template-columns:repeat(4,minmax(0,1fr))}}
.type{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:14px;display:grid;gap:8px;align-content:start;min-width:0;transition:transform .15s,border-color .15s,background .15s}
.type:hover{transform:translateY(-2px);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.type .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.type .ico svg{width:22px;height:22px}
.type b{font-size:16px;font-weight:700}
.type small{color:var(--muted);font-size:12.5px;line-height:1.4}
.type.resume{grid-column:1/-1;display:flex;align-items:center;gap:12px;border-style:dashed}
.type.resume b{font-size:14px}
.home-foot{margin-top:22px;display:grid;gap:10px}
.home-foot h2{font-size:15px;font-weight:700;color:var(--muted)}
.contoh-row{display:grid;gap:10px}
@media (min-width:700px){.contoh-row{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Wizard */
.layout{display:grid;gap:18px}
@media (min-width:920px){.layout{grid-template-columns:minmax(0,1fr) 420px;align-items:start}
  .preview-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 8px;font-weight:600;font-size:13.5px}
.pill-btn .dot{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.pill-btn .dot svg{width:15px;height:15px}
.seg{margin-left:auto;display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px 7px;display:grid;justify-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;min-width:0}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border:2px solid var(--c);color:var(--c)}
.step.done .n{background:var(--c);color:var(--on-accent)}
.step[aria-current="step"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--fg)}
.step span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.sec{border-radius:var(--r-l);padding:18px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface) 70%);display:grid;gap:14px}
.sec-head{display:grid;gap:4px}
.sec-head .lab{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.sec-head h2{font-size:24px;font-weight:800;letter-spacing:-.015em}
.sec-head p{color:var(--muted);font-size:13.5px}
.field{display:grid;gap:7px}
.field label{font-weight:700;font-size:15px}
.field .sub{font-weight:600;font-size:13.5px;color:var(--muted)}
textarea,input[type=text]{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-s);padding:11px 12px;font-size:15.5px;line-height:1.5;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--faint);font-style:italic}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--c,var(--c-plus));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--c-plus)) 25%,transparent)}
.chips-lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--fg);transition:background .15s}
.chip:hover{background:color-mix(in srgb,var(--c) 15%,transparent)}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-accent);border-color:var(--c)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.warns{display:grid;gap:6px}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:13px;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:8px 10px;color:var(--fg)}
.warn b{color:var(--warn)}
.warn svg{flex:none;width:16px;height:16px;color:var(--warn);margin-top:2px}
.nav{display:flex;gap:10px;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn-fill{background:var(--c,var(--c-plus));color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}

/* Pratinjau */
.preview{border:1px solid var(--line);background:var(--bg-2);border-radius:var(--r-l);overflow:hidden}
.pv-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-head h3{font-size:14px;font-weight:700}
.pv-meta{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pv-body{padding:16px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;min-height:160px;max-height:62vh;overflow:auto}
.pv-body .p{border-radius:4px;padding:1px 0}
.p-peran{color:var(--c-peran)}.p-tugas{color:var(--c-tugas)}.p-konteks{color:var(--c-konteks)}.p-batasan{color:var(--c-batasan)}.p-hasil{color:var(--c-hasil)}.p-plus{color:var(--muted)}
.pv-body .h{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;font-weight:500;opacity:.85}
.pv-body .ghost{color:var(--faint);font-style:italic;border:1px dashed var(--line);border-radius:6px;padding:0 6px;display:inline-block;margin:1px 0}
.pv-body mark{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:3px;border-radius:3px;padding:0 2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.pv-actions{display:none;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
@media (min-width:920px){.pv-actions{display:flex}}
.pv-actions .btn{flex:1}

/* Bilah aksi bawah (HP) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg-2) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.dock .btn{padding:12px 8px;font-size:14px}
@media (min-width:920px){.dock{display:none}main{padding-bottom:40px}}
.btn-ask{background:var(--c-plus);color:var(--on-accent)}
.btn-copy{background:var(--fg);color:var(--bg)}

/* Lembar (sheet) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,6,20,.65);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.scrim{align-items:center}}
.sheet{width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@media (min-width:720px){.sheet{border-radius:22px;max-height:84vh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet-head h2{font-size:19px;font-weight:800}
.sheet-head .x{margin-left:auto;border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.sheet-body{overflow:auto;padding:4px 18px 18px;display:grid;gap:14px;align-content:start}
.tabs{display:flex;gap:6px;padding:0 18px 8px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.item{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:grid;gap:8px;background:var(--bg-2);min-width:0}
.item-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item b{font-size:15px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.item p{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .row{display:flex;gap:6px;flex-wrap:wrap}
.item .row button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.item .row button.go{background:var(--c-plus);color:var(--on-accent);border-color:var(--c-plus)}
.item .row button.del{margin-left:auto;color:#FF9AAE}
.item time{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.empty{border:1px dashed var(--line);border-radius:var(--r-m);padding:18px;color:var(--muted);font-size:14px;text-align:center}
.note{font-size:12.5px;color:var(--muted)}
.save-row{display:grid;gap:8px;border:1px solid var(--line);border-radius:var(--r-m);padding:12px;background:var(--bg-2)}
.save-row .btns{display:flex;gap:8px}
.q-card{border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:var(--r-m);padding:12px;display:grid;gap:8px;background:color-mix(in srgb,var(--c) 8%,var(--bg-2))}
.q-card .badge{justify-self:start}
.q-card label{font-weight:700}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--c-plus);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;gap:12px;align-items:center;color:var(--muted);padding:12px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
@media (min-width:920px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Penyesuaian panel samping Chrome (lebar 320–500px) */
body{min-width:320px}
.meter{flex:none}
#btn-set{margin-left:auto}
.meter:not([hidden])+#btn-set{margin-left:0}
@media (max-width:440px){.brand small{display:none}}
@media (max-width:420px){.top-in{gap:8px}.meter:not([hidden]) ~ .brand, .brand:has(+ .meter:not([hidden])) > span:last-child{display:none}.meter-bars i{width:11px}}
.dock .btn{white-space:nowrap}
@media (max-width:380px){.dock .btn svg{display:none}}

</style>
</head>
<body>
<header class="top">
  <div class="spectrum" aria-hidden="true"><i style="background:var(--c-peran)"></i><i style="background:var(--c-tugas)"></i><i style="background:var(--c-konteks)"></i><i style="background:var(--c-batasan)"></i><i style="background:var(--c-hasil)"></i><i style="background:var(--c-plus)"></i></div>
  <div class="top-in">
    <button class="brand" id="btn-home" type="button" aria-label="Kembali ke awal">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span><b>Pembuat Prompt</b><small>Peran · Tugas · Konteks · Batasan · Hasil</small></span>
    </button>
    <div class="meter" id="meter" title="Kelengkapan 5 bagian" hidden>
      <div class="meter-bars" id="meter-bars"></div>
      <span class="meter-num" id="meter-num">0/5</span>
    </div>
    <button class="icon-btn" id="btn-set" type="button" aria-label="Pengaturan AI" title="Pengaturan AI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="icon-btn" id="btn-lib" type="button" aria-label="Buka pustaka prompt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.8 1-4 15-3.8-1z"/></svg>
      <span class="hide-sm">Pustaka</span>
    </button>
  </div>
</header>

<main id="app"></main>

<nav class="dock" id="dock" hidden>

}

function clean(s){return String(s||"").trim().replace(/\s+/g," ").replace(/[\s.;,:]+$/,"");}
function lf(s){s=clean(s);if(s.length>1&&/^\p{Lu}\p{Ll}/u.test(s))return s.charAt(0).toLowerCase()+s.slice(1);return s;}
function uf(s){s=clean(s);return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function vagueIn(text){var out=[],m;VAGUE_RE.lastIndex=0;while((m=VAGUE_RE.exec(text||""))){var w=m[2].toLowerCase();if(out.indexOf(w)<0)out.push(w);}return out;}

  P.push({k:"tugas",text:t});
  // konteks
  t="";
  if(clean(f.konteks)){t=(full?uf(f.konteks):"Konteksnya: "+lf(f.konteks))+".";}
  if(full&&clean(f.konteks2))t+=(t?"\n":"")+"Sasaran pembaca/pengguna: "+lf(f.konteks2)+".";
  P.push({k:"konteks",text:t});
  // batasan
  var b=c.batasan.slice();if(clean(f.batasan))b.push(clean(f.batasan));
  if(full&&clean(f.batasan2))b.push("Hindari: "+lf(f.batasan2));
  t="";
  if(b.length){t=full?b.map(function(x){return "- "+uf(x);}).join("\n"):"Batasan: "+b.map(lf).join("; ")+".";}
  P.push({k:"batasan",text:t});
  // hasil
  var h=c.hasil.slice();if(clean(f.hasil))h.push(clean(f.hasil));
  t="";
  if(h.length){t=full?"Format: "+h.map(lf).join("; ")+".":"Sajikan hasilnya dalam bentuk: "+h.map(lf).join("; ")+".";}
  if(full&&clean(f.hasil2))t+=(t?"\n":"")+"Panjang/jumlah: "+lf(f.hasil2)+".";
  P.push({k:"hasil",text:t});
  if(full)P.push({k:"plus",text:"Sebelum mulai, tanyakan kepada saya jika ada informasi penting yang belum jelas."});
  return P;
}
function promptText(src){
  var full=(src||state).mode==="lengkap";
  return buildParts(src).filter(function(p){return p.text;}).map(function(p){
    if(full&&p.k!=="plus")return SEC[p.k].label.toUpperCase()+"\n"+p.text;return p.text;
  }).join(full?"\n\n":" ");
}
function hiVague(text){
  var e=esc(text);VAGUE_RE.lastIndex=0;
  return e.replace(VAGUE_RE,function(m,pre,w,nya){return pre+"<mark title=\"Kata kabur\">"+w+(nya||"")+"</mark>";});
}

function copyText(text,btn,okMsg){okMsg=okMsg||"Prompt disalin";
  if(!clean(text)){toast("Prompt masih kosong. Isi bagian Tugas dulu.");return;}
  function fallback(){
    var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);
    if(ok)toast(okMsg);
    else{var pv=$("#pv-body");if(pv){var r=document.createRange();r.selectNodeContents(pv);var s=getSelection();s.removeAllRanges();s.addRange(r);}toast("Teks sudah diblok. Tekan lama lalu pilih Salin.");}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(okMsg);},fallback);}
    else fallback();
  }catch(e){fallback();}
}

/* Kode bagikan: "PP1." + base64(JSON) */
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
function shareCode(it){return "PP1."+b64e(JSON.stringify({judul:it.judul,kebutuhan:it.kebutuhan,mode:it.mode,f:it.f,chips:it.chips}));}
function validItem(x){
  if(!x||typeof x!=="object"||!TYPES[x.kebutuhan]||typeof x.f!=="object")return null;
  var f=blankF();Object.keys(f).forEach(function(k){if(typeof x.f[k]==="string")f[k]=x.f[k].slice(0,4000);});
  var ch={batasan:[],hasil:[]};["batasan","hasil"].forEach(function(k){if(x.chips&&Array.isArray(x.chips[k]))ch[k]=x.chips[k].filter(function(v){return typeof v==="string";}).slice(0,20);});
  var it={judul:String(x.judul||"Prompt impor").slice(0,120),kebutuhan:x.kebutuhan,mode:x.mode==="lengkap"?"lengkap":"singkat",f:f,chips:ch,waktu:Date.now()};
  it.teks=promptText(it);return it;
}
function importText(raw){
  raw=String(raw||"").trim();if(!raw){toast("Belum ada kode yang ditempel");return;}
  var found=[];
  try{
    var codes=raw.match(/PP1\.[A-Za-z0-9+/=]+/g);
    if(codes)codes.forEach(function(c){found.push(JSON.parse(b64d(c.slice(4))));});
    else{var j=JSON.parse(raw);found=Array.isArray(j)?j:(j&&Array.isArray(j.items)?j.items:[j]);}
  }catch(e){toast("Kode tidak terbaca. Pastikan disalin utuh, diawali PP1.");return;}
  var have={};lib.mine.forEach(function(x){have[x.judul+"|"+x.teks]=1;});
  var n=0;found.map(validItem).forEach(function(it){if(it&&!have[it.judul+"|"+it.teks]){lib.mine.unshift(it);have[it.judul+"|"+it.teks]=1;n++;}});
  if(!n){toast("Tidak ada prompt baru untuk ditambahkan");return;}
  saveLib();libTab="mine";renderLibrary();toast(n+" prompt ditambahkan");
}
function exportAll(){
  var data=JSON.stringify({app:"Pembuat Prompt",versi:1,items:lib.mine.map(function(x){return {judul:x.judul,kebutuhan:x.kebutuhan,mode:x.mode,f:x.f,chips:x.chips,waktu:x.waktu};})},null,2);
  var url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  var a=document.createElement("a");a.href=url;a.download="pustaka-prompt-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},2000);
  toast("File ekspor diunduh");
}
function itemAction(b){
  var src=b.getAttribute("data-src"),i=+b.getAttribute("data-i"),act=b.getAttribute("data-item"),it=srcList(src)[i];if(!it)return;
  if(act==="use"){closeSheet();loadInto(it);toast("Prompt dimuat ke wizard");}
  else if(act==="copy"){copyText(it.teks||promptText(it),b);}
  else if(act==="code"){copyText(shareCode(it),b,"Kode bagikan disalin. Kirim ke teman, lalu mereka tempel di tab Impor.");}
  else if(act==="del"){
    if(b.getAttribute("data-confirm")!=="1"){b.setAttribute("data-confirm","1");b.textContent="Yakin hapus?";return;}
    lib.mine.splice(i,1);saveLib();renderLibrary();toast("Dihapus");
  }
}

/* ================= PENGATURAN AI ================= */
var DEFAULT_MODEL="claude-haiku-5-5";
function settings(){return Object.assign({apiKey:"",model:DEFAULT_MODEL},lsGet(LS_SET)||{});}
function openSettings(){
  sheetMode="set";openSheet("Pengaturan AI");$("#sheet-tabs").innerHTML="";
  var s=settings();
  $("#sheet-body").innerHTML=
    '<p class="note">Tombol <b>Tanyai saya</b> memakai Claude lewat kunci API Anda sendiri. Tanpa kunci, aplikasi tetap memberi pertanyaan pemandu bawaan.</p>'+
    '<div class="field"><label for="set-key">Kunci API Claude</label><input type="password" id="set-key" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="'+esc(s.apiKey)+'">'+
    '<span class="note">Buat kunci di <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--c-hasil)">console.anthropic.com</a>. Kunci hanya disimpan di Chrome perangkat ini dan hanya dikirim ke api.anthropic.com. Pemakaian dikenai biaya sesuai akun Anda.</span></div>'+
    '<div class="field"><label for="set-model">Model</label><input type="text" id="set-model" spellcheck="false" value="'+esc(s.model)+'"><span class="note">Bawaan: '+DEFAULT_MODEL+' (cepat dan hemat).</span></div>'+
    '<div class="nav"><button class="btn btn-ghost" type="button" id="set-clear">Hapus kunci</button><button class="btn btn-fill" type="button" id="set-save" style="--c:var(--c-plus)">Simpan</button></div>';
  $("#set-save").addEventListener("click",function(){
    lsSet(LS_SET,{apiKey:$("#set-key").value.trim(),model:$("#set-model").value.trim()||DEFAULT_MODEL});closeSheet();toast("Pengaturan disimpan");});
  $("#set-clear").addEventListener("click",function(){lsSet(LS_SET,{apiKey:"",model:settings().model});closeSheet();toast("Kunci API dihapus");});
}
$("#btn-set").addEventListener("click",openSettings);

function callClaude(input,signal){
  var s=settings();
  if(!s.apiKey&&SAMPLE){return SAMPLE(input,{signal:signal,cache:false}).then(function(r){var t=(r&&r.text)||"";var m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("Jawaban AI tidak berbentuk JSON");return JSON.parse(m[0]);},function(e){var er=new Error((e&&e.message)||"AI belum bisa dihubungi");er.status=e&&e.code==="rate_limited"?429:0;throw er;});}
  return fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:signal,
    headers:{"x-api-key":s.apiKey,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:s.model||DEFAULT_MODEL,max_tokens:900,messages:[{role:"user",content:input}]})
  }).then(function(r){return r.json().catch(function(){return {};}).then(function(j){
    if(!r.ok){var e=new Error((j.error&&j.error.message)||("HTTP "+r.status));e.status=r.status;throw e;}
    var t=(j.content||[]).filter(function(c){return c.type==="text";}).map(function(c){return c.text;}).join("");
    var m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("Jawaban AI tidak berbentuk JSON");
    return JSON.parse(m[0]);
  });});
}

/* ================= TANYAI SAYA ================= */
var askCtl=null,askQs=[];
var SAMPLE=null;
(function(){var n=0;(function tryUse(){if(window.claude&&window.claude.use){window.claude.use("sample").then(function(s){SAMPLE=s||null;}).catch(function(){});return;}if(++n<20)setTimeout(tryUse,250);})();})();
function fallbackQuestions(){
  var T=TYPES[state.type],qs=[];
  KEYS.forEach(function(k){if(qs.length<3&&!filled(k))qs.push({bagian:k,tanya:T[k].q,contoh:T[k].ph});});
  KEYS.forEach(function(k){
    if(qs.length>=3)return;
    var w=vagueIn(state.f[k]+" "+state.f[k+"2"]);
    if(w.length&&!qs.some(function(q){return q.bagian===k;}))qs.push({bagian:k,tanya:"Di bagian "+SEC[k].label+" Anda menulis “"+w[0]+"”. Apa ukurannya yang konkret?",contoh:VAGUE[w[0]]});
  });
  if(qs.length<2){
    if(!clean(state.f.konteks2))qs.push({bagian:"konteks",tanya:"Siapa persisnya yang akan membaca atau memakai hasilnya?",contoh:"mis. kepala dinas yang hanya sempat membaca 2 menit"});
    if(qs.length<2)qs.push({bagian:"hasil",tanya:"Berapa panjang atau jumlah hasil yang Anda harapkan?",contoh:"mis. maks. 300 kata atau 5 poin"});
  }
  return qs.slice(0,3);
}
function openAsk(){
  sheetMode="ask";openSheet("Tanyai saya");$("#sheet-tabs").innerHTML="";
  if(!settings().apiKey&&!SAMPLE){renderAsk(fallbackQuestions(),"pemandu","Ini pertanyaan pemandu bawaan. Pasang kunci API Claude di Pengaturan agar pertanyaan disusun AI dari draf Anda.");return;}
  $("#sheet-body").innerHTML='<div class="loading"><span class="spin"></span>AI sedang membaca draf Anda dan menyiapkan pertanyaan…</div>';
  askCtl=new AbortController();
  var draftObj={};KEYS.forEach(function(k){draftObj[k]=state.f[k];if(state.mode==="lengkap")draftObj[k+"_tambahan"]=state.f[k+"2"];});
  draftObj.batasan_terpilih=state.chips.batasan;draftObj.hasil_terpilih=state.chips.hasil;
  var input="Anda membantu pengguna Indonesia menyempurnakan prompt AI dengan rumus Peran–Tugas–Konteks–Batasan–Hasil.\n"+
    "Jenis kebutuhan: "+TYPES[state.type].nama+".\nIsian saat ini (JSON): "+JSON.stringify(draftObj)+"\n"+
    "Prompt sementara:\n"+(promptText()||"(kosong)")+"\n\n"+
    "Ajukan 2 sampai 3 pertanyaan klarifikasi paling penting yang jawabannya akan paling memperbaiki prompt ini. Utamakan bagian yang kosong, kabur (kata seperti bagus, menarik, lengkap), atau kurang spesifik. Pertanyaan singkat, dalam Bahasa Indonesia sehari-hari yang sopan, satu hal per pertanyaan. Sertakan contoh jawaban singkat yang realistis.\n"+
    "Balas HANYA JSON tanpa teks lain, dengan bentuk: {\"pertanyaan\":[{\"bagian\":\"peran|tugas|konteks|batasan|hasil\",\"tanya\":\"...\",\"contoh\":\"mis. ...\"}]}";
  callClaude(input,askCtl.signal).then(function(res){
    if(sheetMode!=="ask")return;
    var qs=(res&&res.pertanyaan||[]).filter(function(q){return q&&q.tanya&&KEYS.indexOf(q.bagian)>=0;}).slice(0,3);
    renderAsk(qs.length?qs:fallbackQuestions(),qs.length?"ai":"pemandu");
  }).catch(function(err){
    if(sheetMode!=="ask"||(err&&err.name==="AbortError"))return;
    var st=err&&err.status,msg=st===401?"Kunci API ditolak. Periksa kunci di Pengaturan.":st===404?"Nama model tidak dikenal. Periksa di Pengaturan.":st===429||st===529?"AI sedang sibuk. Coba lagi sebentar.":"AI belum bisa dihubungi.";
    renderAsk(fallbackQuestions(),"pemandu",msg+" Sementara ini, pertanyaan pemandu bawaan:");
  });
}
function renderAsk(qs,src,note){
  askQs=qs;
  var h='<p class="note">'+esc(note||(src==="ai"?"Pertanyaan berikut disusun AI dari draf Anda. Jawab yang Anda tahu; yang kosong dilewati.":"Pertanyaan pemandu untuk bagian yang masih kosong atau kabur."))+'</p>';
  h+=qs.map(function(q,i){return '<div class="q-card" style="--c:'+COLOR[q.bagian]+'"><span class="badge">'+SEC[q.bagian].label+'</span><label for="ans-'+i+'">'+esc(q.tanya)+'</label><textarea id="ans-'+i+'" rows="2" placeholder="'+esc(q.contoh||"")+'"></textarea></div>';}).join("");
  h+='<div class="nav"><button class="btn btn-ghost" type="button" id="ask-cancel">Batal</button><button class="btn btn-fill" type="button" id="ask-go" style="--c:var(--c-plus)">Masukkan ke prompt</button></div>';
  $("#sheet-body").innerHTML=h;
  $("#ask-cancel").addEventListener("click",closeSheet);
  $("#ask-go").addEventListener("click",applyAnswers);
  var a0=$("#ans-0");if(a0)a0.focus();
}
function applyAnswers(){
  var n=0;
  askQs.forEach(function(q,i){
    var a=clean($("#ans-"+i).value);if(!a)return;n++;
    var k=q.bagian,cur=clean(state.f[k]);
    state.f[k]=cur?cur+". "+uf(a):(k==="tugas"||k==="konteks"?a:a);
  });
  closeSheet();
  if(n){renderSection();renderLive();toast(n+" jawaban dimasukkan ke prompt");}
  else toast("Tidak ada jawaban yang diisi");
}

/* ================= BOOT ================= */
storageLoad([LS_DRAFT,LS_LIB,LS_SET]).then(function(){
  draft=lsGet(LS_DRAFT);lib.mine=lsGet(LS_LIB)||[];
  renderHome();
});
})();
