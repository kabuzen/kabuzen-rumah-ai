<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akademi SAR Laut Kepri — LMS Pelatihan SAR Maritim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html{color-scheme:light}
:root{
  --navy:#0b2540; --navy2:#123a5f; --sea:#1d6fa5; --foam:#e8f1f8; --orange:#f26a1b; --orange2:#ffe3d1;
  --ink:#14212e; --muted:#5b6b7a; --line:#d9e2ea; --bg:#f5f8fb; --card:#fff; --good:#1f8a4c; --bad:#c43d3d; --warn:#b7791f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:15px}
a{color:var(--sea)}
button,input,select,textarea{color:var(--ink);font-family:inherit}
.btn{color:#fff}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--navy);color:#dbe7f2;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 20px}
.brand .logo{width:40px;height:40px;border-radius:10px;background:var(--orange);display:grid;place-items:center;flex:none}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{color:#9fb6cc;font-size:11.5px}
.navlbl{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#7f9bb5;margin:18px 10px 6px}
nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:#dbe7f2;font:inherit;font-size:13.5px;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.07)}
nav button.on{background:rgba(242,106,27,.18);color:#fff}
nav .num{width:22px;height:22px;border-radius:50%;border:1.5px solid #4f6f8d;font-size:11px;display:grid;place-items:center;flex:none}
nav .num.done{background:var(--good);border-color:var(--good);color:#fff}
nav .ico{width:22px;text-align:center;flex:none}
.progbox{margin:22px 6px 0;padding:14px;border-radius:10px;background:rgba(255,255,255,.06)}
.progbar{height:7px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-top:8px}
.progbar i{display:block;height:100%;background:var(--orange);width:0;transition:width .4s}
main{padding:28px 40px 60px;max-width:1080px;width:100%}
.topbar{display:none}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;color:var(--navy)}
h2{font-size:20px;margin:28px 0 10px;color:var(--navy)}
h3{font-size:16px;margin:20px 0 6px;color:var(--navy2)}
.lead{color:var(--muted);font-size:15.5px;margin:0 0 20px;max-width:760px}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,var(--sea) 100%);color:#fff;border-radius:16px;padding:30px 32px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:30px}
.hero p{color:#d3e3f1;max-width:620px;margin:0 0 18px}
.hero svg.waves{position:absolute;right:-20px;bottom:-10px;opacity:.18}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.light{background:#fff;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.mcard{cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(11,37,64,.08)}
.mcard .tag{font-size:11.5px;color:var(--sea);font-weight:700;letter-spacing:.5px}
.mcard b{font-size:15px;color:var(--navy);line-height:1.3}
.mcard small{color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600}
.pill.ok{background:#e1f3e8;color:var(--good)}
.pill.no{background:#eef2f6;color:var(--muted)}
.pill.mid{background:var(--orange2);color:#a7480f}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{font-size:24px;color:var(--navy);display:block}
.stat span{font-size:12.5px;color:var(--muted)}
.lesson{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.lesson p,.lesson li{max-width:760px}
.obj{background:var(--foam);border-left:4px solid var(--sea);padding:12px 16px;border-radius:8px;margin:14px 0}
.obj ul{margin:6px 0 0;padding-left:20px}
.key{background:var(--orange2);border-left:4px solid var(--orange);padding:12px 16px;border-radius:8px;margin:16px 0}
table.t{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--foam);color:var(--navy)}
.tabs{display:flex;gap:6px;margin:18px 0 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;font:inherit;font-weight:600;font-size:14px;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-color:var(--orange)}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:12px 0}
.q .qt{font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;margin:6px 0;font:inherit;font-size:14px;cursor:pointer}
.opt:hover{border-color:var(--sea)}
.opt.sel{border-color:var(--sea);background:var(--foam)}
.opt.right{border-color:var(--good);background:#e8f6ee}
.opt.wrong{border-color:var(--bad);background:#fbeaea}
.ex{font-size:13.5px;color:var(--muted);margin-top:8px;display:none}
.ex.show{display:block}
.result{border-radius:12px;padding:18px 20px;margin-top:14px}
.result.pass{background:#e8f6ee;border:1px solid #b7e1c7}
.result.fail{background:#fbeaea;border:1px solid #efc1c1}
.sim{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:14px}
.ctrl label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:12px 0 4px}
.ctrl label span{float:right;font-family:'JetBrains Mono',monospace;color:var(--sea);font-weight:500}
.ctrl input[type=range]{width:100%;accent-color:var(--orange)}
.ctrl select,.ctrl input[type=text],.field{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff}
canvas{width:100%;background:#0d3150;border-radius:12px;display:block}
.out{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.out div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.out b{display:block;font-size:18px;color:var(--navy);font-family:'JetBrains Mono',monospace}
.out span{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.scn-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.scn-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.scn-meta span{font-size:12px;background:var(--foam);color:var(--navy2);padding:4px 10px;border-radius:20px;font-weight:600}
.feedback{margin-top:12px;padding:12px 14px;border-radius:9px;font-size:14px;display:none}
.feedback.show{display:block}
.feedback.g{background:#e8f6ee;border:1px solid #b7e1c7}
.feedback.m{background:#fff6e5;border:1px solid #f1d49b}
.feedback.b{background:#fbeaea;border:1px solid #efc1c1}
.chat{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:560px}
.msgs{flex:1;overflow:auto;padding:18px}
.msg{max-width:82%;padding:10px 14px;border-radius:12px;margin:6px 0;white-space:pre-wrap;font-size:14px}
.msg.u{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--foam);border-bottom-left-radius:4px}
.chatin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatin textarea{flex:1;resize:none;height:46px;padding:10px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.chips button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--navy2)}
.cert{background:#fff;border:10px solid var(--navy);outline:2px solid var(--orange);outline-offset:-18px;border-radius:6px;padding:46px 40px;text-align:center;max-width:820px;margin:16px auto}
.cert h2{font-size:30px;margin:6px 0;letter-spacing:1px}
.cert .nm{font-size:30px;font-weight:800;color:var(--sea);border-bottom:2px solid var(--line);display:inline-block;padding:0 30px 6px;margin:14px 0}
.cert small{color:var(--muted)}
.lock{text-align:center;padding:40px 20px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:16px}
footer{color:var(--muted);font-size:12px;margin-top:40px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}
  .topbar button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
  main{padding:20px 16px 50px}
  .sim{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lesson{padding:20px}
}
</style>
</head>
<body>
<div class="topbar"><button id="menuBtn" aria-label="Menu">☰</button><b>Akademi SAR Laut Kepri</b></div>
<div class="app">

  <div class="brand">
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/></svg></div>
    <div><b>Akademi SAR Laut</b><small>Pelatihan SAR Maritim · Kepri</small></div>
  </div>

  <div class="progbox"><div style="font-size:12.5px">Kemajuan belajar: <b id="progTxt" style="color:#fff">0/7</b></div><div class="progbar"><i id="progBar"></i></div></div>
</aside>
<main id="main"></main>

<script>
// ===================== DATA KURIKULUM =====================
const MODULES = [
{id:'m1', t:'Dasar Sistem SAR Maritim dan Regulasi', dur:'45 menit',
 obj:['Menjelaskan peran Basarnas, Kantor SAR, dan KSOP dalam keselamatan di laut','Membedakan tiga fase darurat: INCERFA, ALERFA, DETRESFA','Mengenali lima tahap operasi SAR menurut IAMSAR'],
 body:`
<h3>1. Siapa melakukan apa</h3>
<p>Penyelenggaraan pencarian dan pertolongan di Indonesia berdasar <b>UU No. 29 Tahun 2014</b>. Basarnas melalui Kantor SAR (seperti Kantor SAR Kelas A Tanjungpinang) mengoordinasikan operasi, sedangkan unsur lain (TNI AL, Polairud, Bakamla, KSOP/KPLP, BPBD, relawan, nelayan) menjadi <b>potensi SAR</b>.</p>
<table class="t"><tr><th>Instansi</th><th>Peran utama di laut</th></tr>
<tr><td>Kantor SAR</td><td>Menerima laporan, menetapkan fase darurat, merencanakan dan mengendalikan operasi (SMC), mengerahkan unit</td></tr>
<tr><td>KSOP (Syahbandar)</td><td>Menerbitkan Surat Persetujuan Berlayar (SPB), mengawasi kelaiklautan dan manifest, menunda keberangkatan saat cuaca buruk</td></tr>
<tr><td>SROP / VTS</td><td>Memantau komunikasi radio dan lalu lintas kapal, meneruskan berita marabahaya</td></tr>
<tr><td>BMKG</td><td>Prakiraan cuaca maritim dan peringatan dini gelombang tinggi</td></tr></table>
<h3>2. Tiga fase darurat</h3>
<table class="t"><tr><th>Fase</th><th>Arti</th><th>Contoh</th></tr>
<tr><td><b>INCERFA</b></td><td>Fase ketidakpastian: ada keraguan atas keselamatan</td><td>Kapal belum tiba sesuai jadwal, belum ada tanda bahaya</td></tr>
<tr><td><b>ALERFA</b></td><td>Fase siaga: ada kekhawatiran nyata</td><td>Kapal terlambat, tidak bisa dihubungi, dan ada laporan cuaca buruk di rute</td></tr>
<tr><td><b>DETRESFA</b></td><td>Fase bahaya: ada keyakinan jiwa terancam dan butuh pertolongan segera</td><td>Sinyal MAYDAY, EPIRB aktif, atau saksi melihat kapal tenggelam</td></tr></table>
<h3>3. Lima tahap operasi SAR (IAMSAR)</h3>
<ol><li><b>Kesadaran (awareness)</b> — kejadian diketahui.</li><li><b>Tindakan awal</b> — penilaian, penetapan fase, pengumpulan informasi.</li><li><b>Perencanaan</b> — datum, area pencarian, pola, alokasi unit.</li><li><b>Operasi</b> — pencarian, pertolongan, evakuasi.</li><li><b>Pengakhiran</b> — korban ditemukan, atau pencarian dihentikan berdasar evaluasi.</li></ol>
<div class="key"><b>Poin kunci:</b> pencegahan (KSOP) dan pertolongan (Kantor SAR) adalah satu rantai. Data SPB dan manifest dari syahbandar adalah informasi pertama yang dibutuhkan SMC saat kapal hilang kontak. Nomor darurat Basarnas: <b>115</b>.</div>`,
 quiz:[
 {q:'Kapal terlambat tiba, tidak dapat dihubungi, dan BMKG melaporkan badai di rutenya. Fase darurat yang paling tepat?',o:['INCERFA','ALERFA','DETRESFA','Belum perlu fase darurat'],a:1,e:'Ada kekhawatiran nyata (terlambat + hilang kontak + cuaca buruk), tetapi belum ada kepastian bahaya. Itu ALERFA.'},
 {q:'Dokumen dari syahbandar yang memuat nama kapal, rute, dan jam berangkat adalah…',o:['Sertifikat Keselamatan','Surat Persetujuan Berlayar (SPB)','Pas Kecil','Buku Pelaut'],a:1,e:'SPB diterbitkan syahbandar sebelum kapal berangkat dan menjadi sumber data awal bagi SMC.'},
 {q:'Penetapan datum dan pola pencarian termasuk tahap…',o:['Kesadaran','Tindakan awal','Perencanaan','Pengakhiran'],a:2,e:'Datum, area, pola, dan alokasi unit adalah inti tahap perencanaan.'},
 {q:'Undang-undang yang menjadi dasar penyelenggaraan pencarian dan pertolongan di Indonesia adalah…',o:['UU No. 17 Tahun 2008','UU No. 24 Tahun 2007','UU No. 29 Tahun 2014','UU No. 32 Tahun 2014'],a:2,e:'UU 29/2014 tentang Pencarian dan Pertolongan. UU 17/2008 mengatur pelayaran.'},
 {q:'Siapa yang mengendalikan perencanaan dan pelaksanaan satu operasi SAR?',o:['Nakhoda kapal terdekat','SAR Mission Coordinator (SMC)','Kepala desa','Operator VTS'],a:1,e:'SMC adalah pejabat yang ditunjuk untuk mengoordinasikan operasi SAR tertentu.'}
 ]},
{id:'m2', t:'Cuaca Maritim dan Perubahan Iklim di Kepri', dur:'50 menit',
 obj:['Membaca prakiraan cuaca maritim BMKG','Mengenali pola musim dan tanda cuaca ekstrem di Kepri','Memahami dampak perubahan iklim terhadap risiko pelayaran'],
 body:`
<h3>1. Mengapa cuaca makin sulit ditebak</h3>
<p>Laporan IPCC AR6 menunjukkan Asia Tenggara termasuk kawasan paling rentan: hujan lebat menguat sekitar 7% setiap 1°C pemanasan, muka laut naik lebih cepat dari rata-rata global, dan siklon tropis cenderung lebih jarang tetapi lebih ekstrem.</p>
<p>Di Kepri, tanda-tandanya sudah terlihat. Pada November 2025 Siklon Tropis Senyar terbentuk di laut sempit dekat Selat Malaka, sesuatu yang jarang terjadi di dekat khatulistiwa, dan gelombang di Natuna–Anambas diperingatkan bisa mencapai 4 meter. Pada Maret 2026 BMKG memprakirakan gelombang hingga 2,3 m di perairan terbuka Kepri saat puncak mudik.</p>
<h3>2. Pola musim</h3>
<table class="t"><tr><th>Periode (perkiraan)</th><th>Ciri</th><th>Perhatian SAR</th></tr>
<tr><td>Musim Utara (Des–Feb)</td><td>Angin timur laut kuat</td><td>Gelombang tinggi di Laut Natuna, perairan timur Bintan, Anambas</td></tr>
<tr><td>Pancaroba (Mar–Mei, Sep–Nov)</td><td>Badai petir dan angin mendadak</td><td>Squall cepat terbentuk, sering tidak tertangkap prakiraan harian</td></tr>
<tr><td>Musim Selatan (Jun–Agu)</td><td>Angin tenggara–barat daya</td><td>Squall "Sumatra" di Selat Malaka, biasanya dini hari</td></tr></table>
<h3>3. Membaca prakiraan</h3>
<ul><li><b>Tinggi gelombang signifikan</b> adalah rata-rata sepertiga gelombang tertinggi. Gelombang tunggal bisa hampir dua kali lebih tinggi.</li>
<li>Kategori BMKG yang umum dipakai: rendah 0,5–1,25 m; sedang 1,25–2,5 m; tinggi 2,5–4 m; sangat tinggi di atasnya.</li>
<li>Perahu nelayan kecil sudah berisiko pada angin di atas sekitar 15 knot dan gelombang di atas 1,25 m; kapal kayu penumpang pada gelombang di atas 2 m.</li></ul>
<h3>4. Tanda squall di lapangan</h3>
<ul><li>Awan gelap bergulung rendah (arcus/shelf cloud) dari arah barat atau barat daya.</li><li>Angin tiba-tiba berbalik dan menguat, suhu turun mendadak.</li><li>Petir di kejauhan dan hujan lebat yang mendekat cepat.</li></ul>
<div class="key"><b>Poin kunci:</b> pantau peringatan dini BMKG (aplikasi Info BMKG dan kanal BMKG Kepri) sebelum setiap operasi. Cuaca bukan hanya penyebab kecelakaan, tetapi juga pembatas keselamatan tim SAR sendiri.</div>`,
 quiz:[
 {q:'Menurut IPCC AR6, setiap kenaikan 1°C pemanasan global memperkuat hujan lebat sekitar…',o:['1%','7%','20%','50%'],a:1,e:'Atmosfer yang lebih hangat menahan lebih banyak uap air; intensitas hujan ekstrem naik sekitar 7% per °C.'},
 {q:'Tinggi gelombang signifikan adalah…',o:['Gelombang tertinggi yang pernah tercatat','Rata-rata sepertiga gelombang tertinggi','Rata-rata semua gelombang','Tinggi pasang tertinggi'],a:1,e:'Karena itu gelombang tunggal bisa jauh lebih tinggi dari angka prakiraan.'},
 {q:'Tanda squall yang mendekat adalah…',o:['Langit cerah dan angin stabil','Awan gelap bergulung rendah, angin berbalik dan suhu turun mendadak','Kabut tipis pagi hari','Laut tenang setelah hujan'],a:1,e:'Shelf/arcus cloud, angin mendadak, dan penurunan suhu adalah tanda klasik squall.'},
 {q:'Kejadian November 2025 yang disebut sebagai tanda nyata perubahan iklim di sekitar Kepri adalah…',o:['Gempa bumi di Natuna','Siklon tropis yang tumbuh di laut sempit dekat Selat Malaka','Kemarau panjang','Tsunami kecil'],a:1,e:'Siklon Senyar tumbuh di laut sempit, bukan laut lepas, dan sangat dekat khatulistiwa.'},
 {q:'Gelombang 2,5–4 m dalam kategori BMKG termasuk…',o:['Rendah','Sedang','Tinggi','Tenang'],a:2,e:'2,5–4 m dikategorikan gelombang tinggi.'}
 ]},
{id:'m3', t:'Perencanaan Pencarian dan Drift', dur:'60 menit',
 obj:['Menjelaskan LKP, datum, total drift, dan leeway','Memilih pola pencarian IAMSAR yang sesuai','Memahami POD, POS, dan cara AI memperbarui area pencarian'],
 body:`
<h3>1. Dari LKP ke datum</h3>
<p><b>LKP (Last Known Position)</b> adalah posisi terakhir yang diketahui. Korban tidak diam: ia bergerak karena arus dan angin. <b>Datum</b> adalah posisi paling mungkin korban pada saat pencarian dimulai.</p>
<p><b>Total drift = arus air total + leeway.</b> Arus air total mencakup arus pasang surut, arus laut, dan arus yang dibangkitkan angin. <b>Leeway</b> adalah gerak objek akibat angin yang menekan bagian yang muncul di atas air; besarnya bergantung jenis objek (orang di air lebih kecil leeway-nya dibanding rakit atau perahu terbalik).</p>
<p>Leeway tidak selalu searah angin: ada sudut divergensi ke kiri atau kanan arah angin, sehingga area pencarian sering berbentuk memanjang atau terbagi dua.</p>
<h3>2. Pola pencarian</h3>
<table class="t"><tr><th>Pola</th><th>Kapan dipakai</th></tr>
<tr><td>Expanding Square (SS)</td><td>Posisi target cukup pasti, area kecil, satu unit</td></tr>
<tr><td>Sector Search (VS)</td><td>Datum sangat akurat, area kecil (misal orang jatuh ke laut yang baru terjadi)</td></tr>
<tr><td>Track Line (TS)</td><td>Kapal hilang di sepanjang rute yang diketahui; pencarian cepat pertama</td></tr>
<tr><td>Parallel Track (PS)</td><td>Area luas dan posisi tidak pasti; beberapa unit berjajar</td></tr>
<tr><td>Creeping Line (CS)</td><td>Area panjang dan sempit, misalnya di sepanjang selat atau garis pantai</td></tr></table>
<h3>3. Probabilitas</h3>
<ul><li><b>POC</b> — probabilitas target ada di suatu area.</li><li><b>POD</b> — probabilitas target terdeteksi bila ada di area itu (dipengaruhi jarak lintasan, cuaca, ketinggian pengamat).</li><li><b>POS = POC × POD</b> — probabilitas keberhasilan.</li></ul>
<h3>4. Peran AI</h3>
<p>Model drift modern (misalnya OpenDrift atau SAROPS) menjalankan simulasi Monte Carlo ribuan lintasan untuk membuat peta probabilitas. AI menambah nilai dengan mengoreksi lintasan berdasar data arus lokal, posisi temuan puing, dan riwayat operasi. Hasilnya tetap saran: SMC yang memutuskan.</p>
<div class="key"><b>Coba sendiri:</b> buka menu <b>Simulator Drift</b> untuk melihat bagaimana angin dan arus menggeser datum dan memperluas area pencarian.</div>`,

 {q:'POS dihitung dengan…',o:['POC + POD','POC × POD','POD − POC','POD ÷ waktu'],a:1,e:'POS = POC × POD.'},
 {q:'Kapal hilang di rute Tanjungpinang–Lingga yang diketahui, langkah pencarian cepat pertama yang logis adalah…',o:['Track Line di sepanjang rute','Expanding Square di pelabuhan','Menunggu laporan nelayan','Sector search di Batam'],a:0,e:'Track Line menyisir rute yang direncanakan, tempat kapal kemungkinan besar berada.'},

{id:'m4', t:'Teknik Pertolongan dan Bertahan Hidup di Laut', dur:'50 menit',
 obj:['Melakukan prosedur orang jatuh ke laut (MOB)','Menjelaskan teknik bertahan hidup di air hangat tropis','Memahami prinsip evakuasi aman dari kapal ke kapal'],
 body:`
<h3>1. Orang jatuh ke laut (Man Overboard)</h3>
<ol><li>Teriakkan "Orang jatuh ke laut!" dan sebutkan sisinya (kiri/kanan).</li><li>Lempar pelampung atau benda apung secepatnya.</li><li>Tunjuk korban terus-menerus; tugaskan satu orang khusus sebagai pengamat.</li><li>Tekan tombol MOB di GPS/plotter untuk mencatat posisi.</li><li>Lakukan manuver kembali (misalnya Williamson turn) dan dekati korban dari sisi bawah angin dengan mesin pelan.</li><li>Kirim berita urgensi atau marabahaya di VHF kanal 16.</li></ol>
<h3>2. Bertahan hidup di perairan Kepri</h3>
<p>Air laut Kepri hangat (umumnya di atas 28°C), sehingga hipotermia berjalan jauh lebih lambat dibanding perairan dingin. Ancaman terbesar justru:</p>
<ul><li><b>Kelelahan dan tenggelam</b> akibat gelombang — tetap di dekat kapal atau benda apung.</li><li><b>Dehidrasi dan sengatan matahari</b> — lindungi kepala, jangan minum air laut.</li><li><b>Kehilangan kelompok</b> — berkumpul (huddle) agar lebih mudah terlihat dan saling menjaga.</li></ul>
<p>Posisi <b>HELP</b> (Heat Escape Lessening Posture): lutut ditarik ke dada saat memakai jaket pelampung, untuk menghemat tenaga. Jangan berenang jauh mengejar pantai kecuali benar-benar dekat.</p>
<h3>3. Evakuasi kapal ke kapal</h3>
<ul><li>Nilai gelombang dan angin: pada gelombang tinggi, gunakan tali dan pelampung, jangan merapat langsung.</li><li>Pastikan setiap korban memakai jaket pelampung sebelum dipindahkan.</li><li>Prioritaskan korban cedera, anak-anak, dan lansia; hitung ulang jumlah orang setelah evakuasi dan cocokkan dengan manifest.</li></ul>
<h3>4. Pertolongan pertama</h3>
<p>Untuk korban tenggelam yang tidak bernapas: mulai dengan 5 napas bantuan lalu lanjutkan RJP sesuai pelatihan. Semua korban yang sempat menelan air laut perlu diobservasi medis meski tampak sehat.</p>
<div class="key"><b>Poin kunci:</b> keselamatan tim lebih dulu. Penolong yang menjadi korban menambah masalah.</div>`,

 {q:'Di perairan hangat Kepri, ancaman utama bagi korban adalah…',o:['Hipotermia dalam 30 menit','Kelelahan, tenggelam, dan dehidrasi','Radang dingin','Tekanan air'],a:1,e:'Air hangat memperlambat hipotermia; kelelahan, gelombang, dan dehidrasi lebih menentukan.'},

{id:'m5', t:'Komunikasi dan Koordinasi Operasi', dur:'40 menit',
 obj:['Menggunakan prosedur radio marabahaya, urgensi, dan keselamatan','Menyusun SITREP singkat','Memahami koordinasi lintas instansi dan lintas negara'],
 body:`
<h3>1. Radio maritim</h3>
<table class="t"><tr><th>Sinyal</th><th>Arti</th><th>Contoh</th></tr>
<tr><td><b>MAYDAY</b> ×3</td><td>Marabahaya: jiwa atau kapal terancam bahaya serius dan segera</td><td>Kapal tenggelam, kebakaran tak terkendali</td></tr>
<tr><td><b>PAN-PAN</b> ×3</td><td>Urgensi: keadaan darurat tetapi belum mengancam jiwa segera</td><td>Mesin mati di dekat karang, korban luka</td></tr>
<tr><td><b>SECURITE</b> ×3</td><td>Keselamatan navigasi atau cuaca</td><td>Peringatan badai, benda hanyut berbahaya</td></tr></table>
<p>Kanal panggilan dan marabahaya VHF adalah <b>kanal 16 (156,8 MHz)</b>; DSC menggunakan kanal 70. Dalam GMDSS, beacon <b>EPIRB 406 MHz</b> dideteksi satelit Cospas-Sarsat dan diteruskan ke pusat koordinasi.</p>
<h3>2. Format MAYDAY</h3>
<p>MAYDAY ×3 — "Di sini" nama kapal ×3 — MAYDAY + nama kapal — posisi — jenis bahaya — bantuan yang dibutuhkan — jumlah orang — informasi lain — "Ganti".</p>
<h3>3. SITREP (laporan situasi)</h3>
<p>Laporan berkala dari OSC/SMC: identitas kejadian, situasi, tindakan yang sudah dilakukan, rencana selanjutnya, cuaca di lokasi, dan status operasi. Gunakan nomor urut dan waktu yang jelas.</p>
<h3>4. Koordinasi</h3>
<ul><li><b>KSOP</b>: SPB, manifest, data kapal; penundaan keberangkatan kapal lain bila cuaca buruk.</li><li><b>VTS Batam dan SROP</b>: rekam AIS, siaran ke kapal di sekitar lokasi.</li><li><b>MRCC Malaysia dan Singapura</b>: korban bisa hanyut lintas batas, seperti nelayan Karimun yang terseret lebih dari 20 mil laut ke perairan Kukup, Malaysia, pada April 2026.</li></ul>
<div class="key"><b>Poin kunci:</b> informasi yang cepat dan seragam menyelamatkan waktu. Satu titik kontak per instansi, satu format laporan.</div>`,

{id:'m6', t:'AI dan Teknologi Digital untuk SAR', dur:'50 menit',
 obj:['Menjelaskan empat penerapan AI paling berguna untuk SAR laut','Membaca peta probabilitas dan peringatan AIS','Memahami batas dan risiko AI dalam operasi'],
 body:`
<h3>1. Empat penerapan utama</h3>
<table class="t"><tr><th>Penerapan</th><th>Cara kerja</th><th>Manfaat</th></tr>
<tr><td>Prediksi drift</td><td>Simulasi Monte Carlo + koreksi pembelajaran mesin dengan data arus lokal</td><td>Area pencarian lebih kecil dan tepat</td></tr>
<tr><td>Analitik AIS/VTS</td><td>Mendeteksi kapal yang berhenti mendadak, menyimpang rute, atau sinyalnya hilang</td><td>Kejadian diketahui lebih cepat</td></tr>
<tr><td>Deteksi visual</td><td>Computer vision pada video drone/helikopter (kamera biasa dan inframerah)</td><td>Orang, rakit, puing terdeteksi meski pengamat lelah</td></tr>
<tr><td>Prakiraan cuaca-laut lokal</td><td>Downscaling prakiraan BMKG dengan radar maritim dan sensor</td><td>Jendela operasi aman lebih jelas</td></tr></table>
<h3>2. Membaca peta probabilitas</h3>
<ul><li>Warna lebih pekat = probabilitas lebih tinggi target berada di sana.</li><li>Peta berubah setiap jam karena drift terus berjalan; selalu cek waktu valid peta.</li><li>Area yang sudah disisir menurunkan probabilitasnya, sehingga peta berikutnya mengarahkan unit ke area baru.</li></ul>
<h3>3. Drone dan edge AI</h3>
<p>Drone dengan kamera termal dapat memindai area lebih cepat di sekitar datum. Karena sinyal di laut terbatas, model deteksi sebaiknya berjalan di perangkat (edge) dan hanya mengirim temuan berupa koordinat dan cuplikan gambar.</p>
<h3>4. Batas dan risiko</h3>
<ul><li>Kapal kecil tanpa AIS tidak terlihat oleh analitik AIS.</li><li>Model bisa keliru jika data arus lokal tidak akurat; bandingkan selalu dengan perhitungan manual.</li><li>Data manifest dan rekaman panggilan adalah data pribadi; akses harus dibatasi sesuai UU Pelindungan Data Pribadi.</li><li>Siapkan prosedur manual bila sistem gagal.</li></ul>
<div class="key"><b>Prinsip:</b> AI memberi saran, SMC memutuskan dan bertanggung jawab. Catat saran AI dan keputusan yang diambil untuk evaluasi pasca-operasi.</div>`,

{id:'m7', t:'Keselamatan Pelayaran dan Pencegahan', dur:'40 menit',
 obj:['Menjelaskan peran SPB, kelaiklautan, dan manifest dalam pencegahan','Menerapkan keputusan menunda berlayar saat cuaca buruk','Merancang edukasi keselamatan bagi nelayan dan penumpang'],
 body:`
<h3>1. Pencegahan adalah pertolongan terbaik</h3>
<p>Kecelakaan yang dicegah tidak membutuhkan operasi SAR. Syahbandar memegang tiga alat pencegahan utama: pemeriksaan kelaiklautan, pengendalian manifest, dan kewenangan menerbitkan atau menunda SPB.</p>
<h3>2. Daftar periksa sebelum berangkat</h3>
<ul><li>Mesin dan bahan bakar cukup, termasuk cadangan.</li><li>Jaket pelampung untuk setiap orang di atas kapal, termasuk ukuran anak.</li><li>Alat komunikasi: radio VHF, telepon terisi daya, dan bila ada, AIS atau beacon.</li><li>Jumlah penumpang sesuai kapasitas dan tercatat di manifest.</li><li>Prakiraan cuaca BMKG untuk rute dan waktu tiba.</li></ul>
<h3>3. Keputusan menunda berlayar</h3>
<p>Peringatan dini gelombang tinggi adalah dasar kuat untuk menunda keberangkatan kapal kecil dan kapal kayu. Masa padat seperti Lebaran dan Nataru sering bertepatan dengan musim gelombang, sehingga tekanan untuk tetap berangkat tinggi. Komunikasi yang jelas kepada penumpang dan operator membantu keputusan diterima.</p>
<h3>4. Edukasi nelayan</h3>
<ul><li>Beri tahu keluarga atau kelompok nelayan tujuan dan jam kembali.</li><li>Bawa pelampung dan alat sinyal sederhana (peluit, cermin, senter).</li><li>Bila mesin mati: pasang jangkar bila memungkinkan, tetap di perahu, hemat air.</li><li>Kenali nomor darurat 115 dan kanal 16.</li></ul>
<div class="key"><b>Poin kunci:</b> data SPB yang rapi hari ini mempercepat operasi SAR besok. Kolaborasi KSOP dan Kantor SAR dimulai dari pelabuhan.</div>`,

 {q:'Kewenangan menerbitkan atau menunda Surat Persetujuan Berlayar ada pada…',o:['Kantor SAR','Syahbandar (KSOP)','BMKG','Pemerintah desa'],a:1,e:'Syahbandar berwenang atas SPB.'},
 {q:'Perahu nelayan mesinnya mati di laut. Tindakan terbaik adalah…',o:['Berenang ke pulau terdekat','Tetap di perahu, pasang jangkar bila bisa, hemat air, kirim sinyal','Meninggalkan perahu','Menyalakan api besar di perahu'],a:1,e:'Perahu jauh lebih mudah ditemukan daripada orang di air.'},

const OBJ={piw:{n:'Orang di air (berjaket pelampung)',k:0.015,div:15},
 raft:{n:'Rakit penolong tanpa jangkar laut',k:0.045,div:25},
 raftd:{n:'Rakit penolong dengan jangkar laut',k:0.025,div:20},
 boat:{n:'Perahu kayu kecil mesin mati',k:0.04,div:30},
 capsized:{n:'Perahu kecil terbalik',k:0.02,div:20}};
function viewSim(){
  main.innerHTML=`<h1>Simulator Drift</h1><p class="lead">Atur angin, arus, dan waktu sejak LKP untuk melihat ke mana korban kemungkinan hanyut. Simulator menjalankan 400 lintasan acak (metode Monte Carlo) seperti prinsip model drift operasional, dalam bentuk yang disederhanakan.</p>
  <div class="sim"><div class="card ctrl">
   <label>Jenis objek</label><select id="obj">${Object.entries(OBJ).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select>
   <label>Kecepatan angin <span id="vws"></span></label><input type="range" id="ws" min="0" max="40" value="18">
   <label>Angin bertiup DARI arah <span id="vwd"></span></label><input type="range" id="wd" min="0" max="359" value="225">
   <label>Kecepatan arus <span id="vcs"></span></label><input type="range" id="cs" min="0" max="3" step="0.1" value="1">
   <label>Arus mengalir KE arah <span id="vcd"></span></label><input type="range" id="cd" min="0" max="359" value="45">
   <label>Waktu sejak LKP <span id="vt"></span></label><input type="range" id="tt" min="1" max="24" value="4">
   <label>Ketidakpastian posisi LKP <span id="ve"></span></label><input type="range" id="le" min="0.1" max="5" step="0.1" value="0.5">
   <button class="btn mt" id="rerun" style="width:100%">Jalankan ulang simulasi</button>
  </div>
  <div><canvas id="cv" width="760" height="560"></canvas>
   <div class="out"><div><b id="oD">–</b><span>Jarak datum dari LKP</span></div><div><b id="oB">–</b><span>Arah datum dari LKP</span></div><div><b id="oR">–</b><span>Radius berisi 90% lintasan</span></div></div>
   <div class="card mt" id="rec"></div>
   <p class="note">Koefisien leeway dan ketidakpastian di sini disederhanakan untuk tujuan pelatihan. Untuk operasi nyata gunakan IAMSAR Manual, perangkat lunak drift resmi, dan data arus terkini.</p>
  </div></div>`;
  const ids=['obj','ws','wd','cs','cd','tt','le'];
  ids.forEach(i=>document.getElementById(i).oninput=()=>simRun(false));
  document.getElementById('rerun').onclick=()=>simRun(true);
  simRun(true);
}
let SEED=1;
function rnd(){SEED=(SEED*16807)%2147483647;return (SEED-1)/2147483646}
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function dirName(d){const n=['U','UTL','TL','TTL','T','TTg','Tg','STg','S','SBD','BD','BBD','B','BBL','BL','UBL'];return n[Math.round(((d%360)+360)%360/22.5)%16]}
function simRun(newSeed){
  if(newSeed) SEED=Math.floor(Math.random()*1e6)+1; let base=SEED;
  const g=id=>document.getElementById(id).value;
  const o=OBJ[g('obj')], ws=+g('ws'), wd=+g('wd'), cs=+g('cs'), cd=+g('cd'), T=+g('tt'), le=+g('le');
  document.getElementById('vws').textContent=ws+' kn';
  document.getElementById('vwd').textContent=wd+'° ('+dirName(wd)+')';
  document.getElementById('vcs').textContent=cs.toFixed(1)+' kn';
  document.getElementById('vcd').textContent=cd+'° ('+dirName(cd)+')';
  document.getElementById('vt').textContent=T+' jam';
  document.getElementById('ve').textContent=le.toFixed(1)+' NM';
  SEED=base;
  const rad=d=>d*Math.PI/180;
  const pts=[];
  for(let i=0;i<400;i++){
    const x0=gauss()*le*0.6, y0=gauss()*le*0.6;
    const csi=Math.max(0,cs*(1+0.25*gauss())), cdi=cd+12*gauss();
    const wsi=Math.max(0,ws*(1+0.2*gauss()));
    const side=rnd()<0.5?-1:1;
    const ldir=wd+180+side*o.div*(0.6+0.4*rnd());
    const lv=o.k*wsi*(1+0.2*gauss());
    const vx=csi*Math.sin(rad(cdi))+lv*Math.sin(rad(ldir));
    const vy=csi*Math.cos(rad(cdi))+lv*Math.cos(rad(ldir));
    pts.push([x0+vx*T, y0+vy*T]);
  }
  const mx=pts.reduce((a,p)=>a+p[0],0)/pts.length, my=pts.reduce((a,p)=>a+p[1],0)/pts.length;
  const ds=pts.map(p=>Math.hypot(p[0]-mx,p[1]-my)).sort((a,b)=>a-b);
  const R=ds[Math.floor(ds.length*0.9)];
  const D=Math.hypot(mx,my); let B=Math.atan2(mx,my)*180/Math.PI; if(B<0)B+=360;
  // draw
  const cv=document.getElementById('cv'), c=cv.getContext('2d'), W=cv.width, H=cv.height;
  const ext=Math.max(...pts.map(p=>Math.max(Math.abs(p[0]),Math.abs(p[1]))),R+D,3)*1.15;
  const sc=Math.min(W,H)/2/ext, cx=W/2, cy=H/2;
  const X=x=>cx+x*sc, Y=y=>cy-y*sc;
  c.fillStyle='#0d3150';c.fillRect(0,0,W,H);
  const step=[0.5,1,2,5,10,20,50].find(s=>ext/s<=5)||100;
  c.strokeStyle='rgba(255,255,255,.08)';c.lineWidth=1;c.font='12px Plus Jakarta Sans';c.fillStyle='rgba(255,255,255,.4)';
  for(let r=step;r<=ext*1.5;r+=step){c.beginPath();c.arc(cx,cy,r*sc,0,Math.PI*2);c.stroke();c.fillText(r+' NM',cx+r*sc*0.707+4,cy-r*sc*0.707-4);}
  c.beginPath();c.moveTo(cx,0);c.lineTo(cx,H);c.moveTo(0,cy);c.lineTo(W,cy);c.stroke();
  // particles
  pts.forEach(p=>{c.fillStyle='rgba(120,200,255,.55)';c.beginPath();c.arc(X(p[0]),Y(p[1]),2.4,0,Math.PI*2);c.fill();});
  // search circle
  c.strokeStyle='#f26a1b';c.lineWidth=2;c.setLineDash([6,5]);c.beginPath();c.arc(X(mx),Y(my),R*sc,0,Math.PI*2);c.stroke();c.setLineDash([]);
  // drift line
  c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1.5;c.beginPath();c.moveTo(cx,cy);c.lineTo(X(mx),Y(my));c.stroke();
  // LKP
  c.fillStyle='#fff';c.beginPath();c.arc(cx,cy,6,0,Math.PI*2);c.fill();c.font='600 13px Plus Jakarta Sans';c.fillText('LKP',cx+10,cy-8);
  // datum
  c.fillStyle='#f26a1b';c.beginPath();c.moveTo(X(mx),Y(my)-9);c.lineTo(X(mx)+9,Y(my));c.lineTo(X(mx),Y(my)+9);c.lineTo(X(mx)-9,Y(my));c.closePath();c.fill();
  c.fillStyle='#fff';c.fillText('DATUM',X(mx)+12,Y(my)+4);
  // arrows legend
  const arrow=(x,y,deg,len,col,lab)=>{const a=rad(deg);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2.5;c.beginPath();c.moveTo(x,y);const ex=x+Math.sin(a)*len,ey=y-Math.cos(a)*len;c.lineTo(ex,ey);c.stroke();c.beginPath();c.moveTo(ex,ey);c.lineTo(ex-Math.sin(a-0.4)*10,ey+Math.cos(a-0.4)*10);c.lineTo(ex-Math.sin(a+0.4)*10,ey+Math.cos(a+0.4)*10);c.closePath();c.fill();c.font='12px Plus Jakarta Sans';c.fillStyle='rgba(255,255,255,.85)';c.fillText(lab,x-20,y+40);};
  c.fillStyle='rgba(0,0,0,.25)';c.fillRect(14,H-92,200,78);
  arrow(55,H-62,wd+180,26,'#9fe2bf','Angin');
  arrow(150,H-62,cd,26,'#7cc4ff','Arus');
  c.fillStyle='#fff';c.font='700 14px Plus Jakarta Sans';c.fillText('U',W-30,28);c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(W-25,36);c.lineTo(W-25,64);c.stroke();
  document.getElementById('oD').textContent=D.toFixed(1)+' NM';
  document.getElementById('oB').textContent=Math.round(B)+'° '+dirName(B);
  document.getElementById('oR').textContent=R.toFixed(1)+' NM';
  const area=Math.PI*R*R;
  let pat,why;
  if(R<1.5&&le<=1){pat='Sector Search (VS) atau Expanding Square (SS)';why='Area kecil dan datum relatif pasti; satu unit dapat menyisir dengan cepat.';}
  else if(R<4){pat='Expanding Square (SS), dilanjutkan Parallel Track bila nihil';why='Area sedang; mulai dari datum lalu perluas secara sistematis.';}
  else {pat='Parallel Track (PS) dengan beberapa unit, didahului Track Line oleh helikopter';why='Area luas dan sebaran besar; butuh beberapa unit berjajar.';}
  document.getElementById('rec').innerHTML=`<b>Rekomendasi pola:</b> ${pat}<br><span class="note" style="margin:0">${why} Perkiraan luas area 90%: <b>${area.toFixed(0)} NM²</b>. Objek: ${o.n}. Perhatikan bagaimana sebaran melebar seiring waktu — inilah alasan setiap jam keterlambatan laporan membuat pencarian makin sulit.</span>`;
}

function viewScn(){

  const draw=()=>{
    if(i<0){main.innerHTML=`<h1>Skenario Operasi</h1><p class="lead">Ambil keputusan sebagai SAR Mission Coordinator. Setiap pilihan diberi umpan balik dan skor.</p>

      document.getElementById('go').onclick=()=>{i=0;draw()};return;}
    if(i>=SCN.steps.length){
      const pct=Math.round(score/max*100); S.scn=pct; save();
      main.innerHTML=`<h1>Hasil Skenario</h1><div class="result ${pct>=70?'pass':'fail'}"><b style="font-size:20px">Skor keputusan: ${pct}%</b><br>${pct>=85?'Sangat baik. Keputusan Anda cepat, berbasis data, dan menjaga keselamatan tim.':pct>=70?'Baik. Beberapa keputusan dapat dipertajam.':'Perlu latihan lagi. Tinjau Modul 1, 3, dan 5.'}</div>
      <h2>Ringkasan keputusan</h2>${log.map((l,k)=>`<div class="card" style="margin:8px 0"><b>${k+1}. ${SCN.steps[k].q}</b><br><span class="pill ${l.k==='g'?'ok':l.k==='m'?'mid':'no'}">${l.k==='g'?'Tepat':l.k==='m'?'Kurang tepat':'Keliru'}</span> ${l.t}</div>`).join('')}
      <div class="flex mt"><button class="btn" id="again">Ulangi skenario</button><button class="btn ghost" onclick="location.hash='beranda'">Ke beranda</button></div>`;
      document.getElementById('again').onclick=()=>{i=-1;score=0;log=[];draw()};return;}
    const st=SCN.steps[i];
    main.innerHTML=`<div class="flex" style="justify-content:space-between"><h1 style="margin:0">${SCN.title}</h1><span class="pill no">Keputusan ${i+1} dari ${SCN.steps.length}</span></div>
    <div class="progbar" style="background:var(--line);margin:12px 0 18px"><i style="width:${i/SCN.steps.length*100}%"></i></div>
    <div class="scn-step"><div class="scn-meta">${st.meta.map(m=>`<span>${m}</span>`).join('')}</div><h3 style="margin-top:0;font-size:18px">${st.q}</h3>
    ${st.o.map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}. ${o.t}</button>`).join('')}
    <div class="feedback" id="fb"></div><div class="mt" id="nx"></div></div>`;
    let done=false;
    main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done) return; done=true;
      const o=st.o[+b.dataset.k]; score+=o.s; log.push(o);
      main.querySelectorAll('.opt').forEach(x=>{const oo=st.o[+x.dataset.k]; if(oo.k==='g') x.classList.add('right'); else if(x===b) x.classList.add('wrong');});
      const fb=document.getElementById('fb'); fb.className='feedback show '+o.k; fb.innerHTML=`<b>${o.k==='g'?'Tepat.':o.k==='m'?'Kurang tepat.':'Keliru.'}</b> ${o.f}`;
      document.getElementById('nx').innerHTML=`<button class="btn" id="nxt">${i+1<SCN.steps.length?'Keputusan berikutnya →':'Lihat hasil →'}</button>`;
      document.getElementById('nxt').onclick=()=>{i++;draw()};
    });
  };
  draw();
}

// ===================== TUTOR AI =====================
let chatHist=[];
const SYS=`Anda adalah Tutor AI "Akademi SAR Laut Kepri", pendamping pelatihan pencarian dan pertolongan (SAR) maritim untuk personel Kantor SAR Tanjungpinang (Basarnas), KSOP Tanjungpinang, dan potensi SAR di Kepulauan Riau, Indonesia.
Aturan:
- Jawab dalam Bahasa Indonesia yang jelas dan ringkas (maksimal sekitar 200 kata kecuali diminta lebih), gunakan poin bila membantu.
- Rujuk prinsip IAMSAR Manual, UU 29/2014 tentang Pencarian dan Pertolongan, regulasi pelayaran, dan praktik keselamatan maritim yang umum diterima.
- Kurikulum LMS: (1) dasar sistem SAR & regulasi, (2) cuaca maritim & perubahan iklim di Kepri, (3) perencanaan pencarian & drift, (4) teknik pertolongan & bertahan hidup, (5) komunikasi & koordinasi, (6) AI & teknologi digital untuk SAR, (7) keselamatan pelayaran & pencegahan.
- Ini sarana pembelajaran. Untuk keadaan darurat nyata, minta pengguna segera menghubungi Basarnas di 115 atau VHF kanal 16, dan jangan memberi keputusan operasional seolah-olah perintah resmi.
- Jika tidak yakin pada angka atau aturan spesifik, katakan terus terang dan sarankan merujuk dokumen resmi atau instruktur.
- Bila diminta, buat soal latihan, studi kasus, atau ringkasan materi.`;
async function viewTutor(){
  main.innerHTML=`<h1>Tutor AI</h1><p class="lead">Tanyakan materi SAR laut, minta penjelasan ulang, atau minta soal latihan. Tutor menjawab dalam Bahasa Indonesia.</p>
  <div class="chat"><div class="msgs" id="msgs"></div>
  <div class="chips" id="chips">${['Jelaskan beda INCERFA, ALERFA, DETRESFA','Bagaimana menghitung datum sederhana?','Kapan pakai Parallel Track?','Buatkan 3 soal latihan tentang radio maritim','Bagaimana AI membantu mencari orang di air?'].map(t=>`<button>${t}</button>`).join('')}</div>
  <div class="chatin"><textarea id="tin" placeholder="Tulis pertanyaan…"></textarea><button class="btn" id="tsend">Kirim</button></div></div>
  <p class="note" id="tnote">Untuk keadaan darurat nyata hubungi Basarnas 115 atau VHF kanal 16.</p>`;
  const msgs=document.getElementById('msgs');
  const paint=()=>{msgs.innerHTML=(chatHist.length?'':`<div class="msg a">Halo! Saya Tutor AI Akademi SAR Laut. Silakan bertanya tentang materi modul, simulator drift, atau skenario operasi.</div>`)+chatHist.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight;};
  paint();
  let sample=null;
  try{ sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; }catch(e){sample=null}
  if(!document.getElementById('msgs')) return;
  if(!sample){
    document.getElementById('tin').disabled=true;document.getElementById('tsend').disabled=true;
    document.getElementById('chips').style.display='none';
    msgs.innerHTML=`<div class="msg a">Tutor AI belum tersedia di tampilan ini. Buka halaman ini langsung di claude.ai untuk menggunakannya. Sementara itu, Anda tetap bisa belajar lewat modul, simulator, dan skenario.</div>`;
    return;
  }
  let busy=false;
  const send=async(text)=>{
    text=(text||'').trim(); if(!text||busy) return; busy=true;
    chatHist.push({role:'user',content:text}); paint();
    const holder=document.createElement('div'); holder.className='msg a'; holder.textContent='Sedang berpikir…'; msgs.appendChild(holder); msgs.scrollTop=msgs.scrollHeight;
    document.getElementById('tin').value='';
    const recent=chatHist.slice(-10);
    const input=[{role:'user',content:SYS+'\n\n---\nPertanyaan peserta berikut.'},{role:'assistant',content:'Baik, saya siap membantu sebagai Tutor AI SAR laut.'},...recent];
    try{
      const r=await sample(input,{cache:false,onText:({text})=>{holder.textContent=text;msgs.scrollTop=msgs.scrollHeight;}});
      chatHist.push({role:'assistant',content:r.text});
    }catch(e){
      const msg=e&&e.code==='rate_limited'?'Terlalu banyak permintaan. Coba lagi sebentar lagi.':e&&e.code==='not_granted'?'Akses Tutor AI tidak diizinkan pada tampilan ini.':'Maaf, terjadi gangguan. Silakan coba lagi.';
      chatHist.push({role:'assistant',content:msg});
    }
    busy=false; paint();
  };
  document.getElementById('tsend').onclick=()=>send(document.getElementById('tin').value);
  document.getElementById('tin').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e.target.value)}};
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>send(b.textContent));
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

    <div class="flex" style="justify-content:center">${MODULES.map((m,i)=>`<span class="pill ${passed(m.id)?'ok':'no'}">M${i+1} ${passed(m.id)?'✓':''}</span>`).join('')}</div>

  <h2>SERTIFIKAT PENYELESAIAN</h2><small>Diberikan kepada</small><br><div class="nm" id="cnm">${esc(S.name)||'Nama Peserta'}</div>
  <p style="max-width:560px;margin:0 auto">telah menyelesaikan program pembelajaran mandiri <b>Pelatihan SAR Maritim: Perubahan Iklim dan Teknologi AI</b> yang terdiri dari 7 modul, dengan nilai rata-rata <b>${avg}</b>.</p>
  <div style="display:flex;justify-content:space-around;margin-top:34px;font-size:13px"><div>${d}<br><small>Tanggal</small></div><div>${MODULES.length} modul · ${avg}<br><small>Jumlah modul · rata-rata</small></div></div>
  <p class="note" style="margin-top:26px">Sertifikat pembelajaran mandiri; bukan sertifikat kompetensi resmi Basarnas.</p></div>
  <p class="note" style="text-align:center">Untuk menyimpan, ambil tangkapan layar sertifikat di atas.</p>`;
  document.getElementById('nm').oninput=e=>{S.name=e.target.value;save();document.getElementById('cnm').textContent=e.target.value||'Nama Peserta';};
}

route();
