<style>
:root{--indigo:#1d0b78;--indigo2:#2a1a9a;--kuning:#ffd60a;--laut:#0b2a4a;--bg:#f3f4fa;--kartu:#fff;--teks:#1a1c2b;--redup:#5d6178;--garis:#dfe1ee;--ok:#2f9e44;--salah:#d9480f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--teks);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
a{color:var(--indigo2);overflow-wrap:anywhere}
main{overflow-wrap:break-word}
header.atas{position:sticky;top:0;z-index:20;background:var(--indigo);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header.atas h1{font-size:15px;margin:0;flex:1;font-weight:700;letter-spacing:.02em;line-height:1.2}
header.atas small{display:block;font-weight:500;opacity:.8;font-size:11.5px;letter-spacing:0}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--kuning);object-fit:cover;flex:none}
.kembali{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px 4px 0;cursor:pointer;line-height:1}
.status{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:16px 14px 96px}
nav.bawah{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--garis);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
nav.bawah a{flex:1;text-align:center;text-decoration:none;color:var(--redup);font-size:11.5px;padding:8px 2px 9px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bawah a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.bawah a.aktif{color:var(--indigo);font-weight:700}
h2{font-size:21px;margin:4px 0 10px;line-height:1.25}
h3{font-size:16.5px;margin:20px 0 6px}
p{margin:0 0 10px}
.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:14px;padding:14px;margin:0 0 12px}
a.kartu{display:block;text-decoration:none;color:inherit}
a.kartu:active{background:#f0f0fb}
.baris{display:flex;gap:10px;align-items:center}
.tumbuh{flex:1;min-width:0}
.redup{color:var(--redup);font-size:14px}
.kecil{font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;color:#fff;margin:0 4px 4px 0}
.nomor{width:40px;height:40px;border-radius:11px;background:var(--indigo);color:var(--kuning);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:8px;background:#e6e7f3;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:99px}
.tombol{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--indigo);background:#fff;color:var(--indigo);font-weight:700;cursor:pointer;text-decoration:none}
.tombol.utama{background:var(--kuning);border-color:var(--kuning);color:#1a1440}
.tombol.gelap{background:var(--indigo);color:#fff}
.tombol.penuh{width:100%}
.tombol:disabled{opacity:.45}
.tab{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}
.tab button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--garis);background:#fff;color:var(--redup);font-weight:600;padding:6px 10px;white-space:nowrap;cursor:pointer}
.tab button.aktif{background:var(--indigo);color:#fff;border-color:var(--indigo)}
ul.rapi{margin:0 0 10px;padding-left:20px}
ul.rapi li{margin-bottom:5px}
ol.waktu{list-style:none;margin:0 0 10px;padding:0;border-left:3px solid var(--indigo);}
ol.waktu li{padding:0 0 10px 14px;position:relative}
ol.waktu li:before{content:"";position:absolute;left:-7.5px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--kuning);border:2px solid var(--indigo)}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=email],input[type=number],select{width:100%;min-height:46px;border:1px solid #c5c8dc;border-radius:10px;padding:8px 12px;background:#fff;color:var(--teks)}
.pilihan{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--garis);background:#fff;cursor:pointer;min-height:48px;color:var(--teks)}
.pilihan.benar{border-color:var(--ok);background:#ebfbee}
.pilihan.salah{border-color:var(--salah);background:#fff4e6}
.pilihan:disabled{cursor:default;color:var(--teks)}
.catatan{border-left:4px solid var(--kuning);background:#fffbe0;padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:0 0 12px}
.cek{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--garis)}
.cek:last-child{border:0}
.cek input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--indigo)}
canvas.laut{width:100%;aspect-ratio:1/1;border-radius:14px;display:block;background:#0b2a4a;touch-action:manipulation}
.keterangan{min-height:66px;background:#0f1b3d;color:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.kendali{display:flex;gap:8px;align-items:center}
.kendali input[type=range]{flex:1;min-width:0;accent-color:var(--indigo);min-height:40px}
.kisi2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kisi2 .kartu{margin:0}
.hasil{font-size:28px;font-weight:800;color:var(--indigo)}
/* sampul */
.sampul{min-height:100vh;background:linear-gradient(175deg,#1d0b78 0%,#16105c 55%,#0b2a4a 100%);color:#fff;padding:22px 20px 40px;position:relative;overflow:hidden}
.sampul .logo{position:absolute;right:18px;top:18px;width:54px;height:54px;border-width:3px}
.sampul .isi{max-width:520px;margin:0 auto;padding-top:86px}
.sampul h1{font-size:34px;line-height:1.08;margin:10px 0 12px;letter-spacing:-.01em}
.sampul h1 span{color:var(--kuning)}
.sampul p{opacity:.9}
.sampul .garis{display:flex;gap:6px;margin:18px 0}
.sampul .garis i{height:5px;flex:1;border-radius:9px}
.sampul form{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:16px;margin-top:18px}
.sampul label{color:#fff}
.sampul svg.ombak{position:absolute;left:0;right:0;bottom:0;width:100%;opacity:.25}
@media (min-width:700px){main{padding-top:24px}h2{font-size:25px}}
@media print{header.atas,nav.bawah,.tanpa-cetak{display:none!important}main{padding:0}}
</style>
</head>

{id:"m1", judul:"Dasar pencegahan tubrukan", faktor:"manusia",
 ringkas:"Tanggung jawab, pengamatan, kecepatan aman, bahaya tubrukan, dan tindakan menghindar (Aturan 2, 5, 6, 7, 8).",
 tujuan:["Menjelaskan mengapa pengamatan yang baik menjadi dasar semua aturan lain.","Menentukan ada tidaknya bahaya tubrukan dengan baringan dan radar.","Menyebutkan ciri tindakan menghindar yang benar: dini, tegas, dan cukup besar."],
 materi:[
  {h:"Kedudukan COLREG 1972", p:["Peraturan Internasional untuk Mencegah Tubrukan di Laut (COLREG 1972, di Indonesia dikenal sebagai P2TL) disahkan IMO pada 20 Oktober 1972 dan berlaku sejak 15 Juli 1977. Isinya 38 aturan dalam lima bagian (A–E) ditambah empat lampiran; Bagian F (Aturan 39–41) ditambahkan kemudian.","Uraian di aplikasi ini adalah parafrase untuk belajar. Di kapal, naskah resmi edisi terakhir tetap menjadi rujukan."]},
  {h:"Aturan 2 — Tanggung jawab", p:["Mematuhi aturan tidak membebaskan siapa pun dari akibat kelalaian, termasuk kelalaian terhadap tindakan berjaga-jaga yang dituntut oleh kecakapan pelaut yang baik (good seamanship).","Dalam keadaan bahaya yang mendesak, menyimpang dari aturan dibenarkan bila itu satu-satunya cara menghindari bahaya langsung."]},
  {h:"Aturan 5 — Pengamatan", p:["Setiap kapal setiap saat wajib melakukan pengamatan yang layak dengan penglihatan dan pendengaran serta semua sarana yang tersedia sesuai keadaan, agar dapat menilai sepenuhnya situasi dan bahaya tubrukan.","Semua sarana berarti mata, telinga, radar/ARPA, AIS, dan VHF dipakai bersama. Tidak satu pun boleh menggantikan yang lain."]},
  {h:"Aturan 6 — Kecepatan aman", p:["Kapal harus selalu bergerak dengan kecepatan aman sehingga dapat bertindak tepat dan berhasil guna untuk menghindari tubrukan dan dapat berhenti dalam jarak yang sesuai dengan keadaan.","Yang dipertimbangkan antara lain: tingkat penglihatan, kepadatan lalu lintas termasuk kumpulan kapal ikan, kemampuan olah gerak, cahaya latar pada malam hari, angin, laut, arus, bahaya navigasi di dekatnya, dan sarat dibanding kedalaman. Kapal berradar juga menimbang keterbatasan radarnya."]},
  {h:"Aturan 7 — Bahaya tubrukan", p:["Gunakan semua sarana yang tersedia untuk menentukan ada tidaknya bahaya tubrukan. Bila ragu, anggap bahaya itu ada.","Radar dipakai dengan benar: pengamatan jarak jauh untuk peringatan dini dan plotting atau pengamatan sistematis yang setara. Jangan menarik kesimpulan dari keterangan yang sangat kurang, terutama keterangan radar yang sangat kurang.","Tanda utama: baringan pedoman kapal yang mendekat tidak menunjukkan perubahan berarti. Bahaya kadang tetap ada meski baringan berubah nyata, misalnya terhadap kapal sangat besar, tundaan, atau kapal pada jarak dekat."]},
  {h:"Aturan 8 — Tindakan menghindari tubrukan", p:["Tindakan harus tegas, dilakukan dalam waktu yang cukup, dan memperhatikan kecakapan pelaut yang baik.","Perubahan haluan dan/atau kecepatan harus cukup besar sehingga segera tampak oleh kapal lain, baik secara visual maupun di radar. Hindari serangkaian perubahan kecil.","Bila perlu untuk menghindari tubrukan atau memberi waktu lebih untuk menilai keadaan, kurangi kecepatan atau hentikan laju dengan memberhentikan atau memundurkan mesin. Pantau hasil tindakan sampai kapal lain benar-benar lewat dan bebas."]}
 ],
 kasus:["seagate","fitzgerald"], anim:["r15"],
 kuis:[
  {q:"Menurut Aturan 5, pengamatan yang layak dilakukan dengan…", o:["Radar dan AIS saja bila tersedia","Penglihatan, pendengaran, dan semua sarana yang tersedia","Penglihatan saja pada siang hari","VHF sebagai sarana utama"], a:1, why:"Aturan 5 menuntut penglihatan, pendengaran, dan semua sarana yang tersedia sesuai keadaan."},
  {q:"Baringan pedoman sebuah kapal yang mendekat tidak berubah berarti. Kesimpulan yang benar:", o:["Kapal itu akan lewat aman","Bahaya tubrukan harus dianggap ada","Tunggu sampai jarak 1 mil","Cukup pantau lewat AIS"], a:1, why:"Aturan 7: baringan yang tidak berubah berarti menandakan bahaya tubrukan."},
  {q:"Anda ragu apakah ada bahaya tubrukan. Aturan 7 meminta Anda…", o:["Menganggap bahaya itu ada","Menganggap bahaya itu tidak ada","Memanggil kapal lain dulu lewat VHF","Menunggu perwira lain"], a:0, why:"Bila ada keraguan, bahaya tubrukan harus dianggap ada."},
  {q:"Ciri tindakan menghindar yang benar menurut Aturan 8:", o:["Kecil dan bertahap agar tidak mengganggu","Tegas, cukup dini, dan cukup besar agar segera tampak","Hanya perubahan kecepatan","Menunggu kapal lain bertindak dulu"], a:1, why:"Aturan 8 meminta tindakan tegas, dalam waktu cukup, dan cukup besar; serangkaian perubahan kecil harus dihindari."},
  {q:"Faktor yang BUKAN bagian dari pertimbangan kecepatan aman (Aturan 6):", o:["Tingkat penglihatan","Kepadatan lalu lintas","Jadwal tiba di pelabuhan","Kemampuan olah gerak kapal"], a:2, why:"Jadwal tidak termasuk; kecepatan aman ditentukan keadaan dan kemampuan kapal."}
 ]},

{id:"m2", judul:"Kapal saling melihat", faktor:"manusia",
 ringkas:"Menyusul, berhadapan, memotong, kewajiban kapal yang menghindar dan yang bertahan (Aturan 13–17).",
 tujuan:["Mengenali situasi menyusul, berhadapan, dan memotong.","Menentukan kapal mana yang wajib menghindar.","Menjelaskan kapan kapal yang bertahan boleh dan wajib bertindak."],
 materi:[
  {h:"Aturan 13 — Menyusul", p:["Kapal yang menyusul wajib menghindari kapal yang disusul, apa pun jenis kapalnya.","Kapal dianggap menyusul bila mendekat dari arah lebih dari 22,5° di belakang arah melintang kapal lain; pada malam hari ia hanya melihat lampu buritan. Bila ragu, anggap diri Anda menyusul.","Perubahan baringan sesudahnya tidak mengubah status: kapal yang menyusul tetap wajib menghindar sampai lewat dan bebas."]},
  {h:"Aturan 14 — Berhadapan", p:["Dua kapal tenaga yang bertemu pada haluan berlawanan atau hampir berlawanan sehingga menimbulkan bahaya tubrukan masing-masing mengubah haluan ke kanan, sehingga saling berpapasan pada lambung kiri.","Bila ragu apakah situasinya berhadapan, anggap berhadapan dan bertindaklah sesuai."]},
  {h:"Aturan 15 — Memotong", p:["Bila dua kapal tenaga berpotongan haluan dan ada bahaya tubrukan, kapal yang melihat kapal lain di lambung kanannya wajib menghindar dan, bila keadaan mengizinkan, menghindari memotong di depan kapal lain itu."]},
  {h:"Aturan 16 — Kapal yang menghindar", p:["Kapal yang diwajibkan menghindar harus, sedapat mungkin, bertindak dini dan tegas agar tetap bebas dari kapal lain."]},
  {h:"Aturan 17 — Kapal yang bertahan", p:["Kapal yang bertahan mempertahankan haluan dan kecepatan.","Ia boleh bertindak sendiri segera setelah jelas bahwa kapal yang wajib menghindar tidak bertindak sesuai aturan. Ia wajib bertindak bila tubrukan tidak lagi dapat dihindari oleh tindakan kapal yang menghindar saja.","Dalam situasi memotong, kapal tenaga yang bertindak atas dasar ini sedapat mungkin tidak mengubah haluan ke kiri terhadap kapal yang berada di lambung kirinya."]},
  {h:"Isyarat olah gerak (Aturan 34)", p:["Satu tiup pendek: saya mengubah haluan ke kanan. Dua tiup pendek: ke kiri. Tiga tiup pendek: mesin saya bergerak mundur.","Sekurang-kurangnya lima tiup pendek cepat: saya ragu terhadap maksud atau tindakan Anda."]}
 ],
 kasus:["fitzgerald","bahuga","mccain"], anim:["r14","r15","r13"],
 kuis:[
  {q:"Dua kapal tenaga berhadapan dengan bahaya tubrukan. Tindakan yang benar:", o:["Keduanya mengubah haluan ke kanan","Keduanya mengubah haluan ke kiri","Kapal yang lebih kecil menghindar","Keduanya mempertahankan haluan"], a:0, why:"Aturan 14: masing-masing mengubah haluan ke kanan dan berpapasan lambung kiri."},
  {q:"Dalam situasi memotong, kapal yang wajib menghindar adalah kapal yang…", o:["Melihat kapal lain di lambung kirinya","Melihat kapal lain di lambung kanannya","Lebih cepat","Lebih besar"], a:1, why:"Aturan 15: kapal yang melihat kapal lain di lambung kanannya wajib menghindar."},
  {q:"Kapal dianggap menyusul bila mendekat dari arah…", o:["Lebih dari 22,5° di belakang arah melintang","Tepat dari haluan","Kurang dari 22,5° dari haluan","Sisi kanan saja"], a:0, why:"Aturan 13: lebih dari 22,5° di belakang arah melintang kapal yang disusul."},
  {q:"Kapal yang bertahan WAJIB bertindak ketika…", o:["Jarak tinggal 5 mil","Tubrukan tidak lagi dapat dihindari hanya oleh tindakan kapal yang menghindar","Kapal lain memanggil lewat VHF","Kapten naik ke anjungan"], a:1, why:"Aturan 17(b)."},
  {q:"Lima tiup pendek cepat atau lebih berarti…", o:["Saya mengubah haluan ke kanan","Saya menyusul","Saya ragu terhadap maksud atau tindakan Anda","Mesin saya mundur"], a:2, why:"Aturan 34(d): isyarat keraguan."},
  {q:"Kapal menghindar dalam situasi memotong sebaiknya menghindari…", o:["Mengurangi kecepatan","Memotong di depan kapal lain","Mengubah haluan ke kanan","Memberi isyarat"], a:1, why:"Aturan 15: bila keadaan mengizinkan, jangan memotong di depan kapal lain."}
 ]},

{id:"m3", judul:"Cuaca dan tampak terbatas", faktor:"cuaca",
 ringkas:"Berlayar dalam kabut, hujan lebat, atau asap: Aturan 19, isyarat kabut, dan penggunaan radar.",
 tujuan:["Menerapkan Aturan 19 ketika kapal lain hanya terdeteksi radar.","Menyebutkan perubahan haluan yang harus dihindari dalam tampak terbatas.","Mengambil pelajaran dari tubrukan Andrea Doria–Stockholm."],
 materi:[
  {h:"Kapan Aturan 19 berlaku", p:["Aturan 19 berlaku bagi kapal yang tidak saling melihat ketika berlayar di dalam atau di dekat daerah tampak terbatas. Aturan menyusul, berhadapan, dan memotong (Aturan 13–17) hanya berlaku bagi kapal yang saling melihat.","Dalam tampak terbatas tidak ada kapal yang bertahan: setiap kapal bertanggung jawab menghindari situasi terlalu dekat."]},
  {h:"Kecepatan aman dan kesiapan mesin", p:["Setiap kapal berlayar dengan kecepatan aman yang disesuaikan dengan keadaan dan tampak terbatas. Kapal tenaga menyiapkan mesinnya untuk olah gerak segera."]},
  {h:"Kapal lain terdeteksi hanya dengan radar", p:["Tentukan apakah sedang berkembang situasi terlalu dekat dan/atau ada bahaya tubrukan. Bila ya, bertindaklah dalam waktu yang cukup.","Bila tindakan itu berupa perubahan haluan, sedapat mungkin hindari: (1) mengubah haluan ke kiri terhadap kapal di depan arah melintang, kecuali kapal yang sedang disusul; (2) mengubah haluan ke arah kapal yang berada melintang atau di belakang arah melintang."]},
  {h:"Mendengar isyarat kabut di depan arah melintang", p:["Kecuali telah dipastikan tidak ada bahaya tubrukan, kurangi kecepatan sampai serendah-rendahnya yang masih mempertahankan haluan. Bila perlu hentikan laju sama sekali, dan berlayarlah dengan sangat hati-hati sampai bahaya berlalu."]},
  {h:"Isyarat bunyi dalam tampak terbatas (Aturan 35)", p:["Kapal tenaga yang berlaju: satu tiup panjang dengan selang tidak lebih dari 2 menit.","Kapal tenaga yang berlayar tetapi berhenti dan tidak berlaju: dua tiup panjang berturut-turut dengan selang tidak lebih dari 2 menit."]},
  {h:"Pelajaran dari kasus", p:["Pada tubrukan Andrea Doria–Stockholm (1956) kedua kapal saling mendeteksi dengan radar dari jarak jauh, tetapi salah membaca haluan lawan. Kabut tebal, kecepatan tinggi dalam tampak buruk, dan penggunaan radar yang keliru disebut sebagai faktor penyebab.","Radar memberi jarak dan baringan; haluan dan CPA kapal lain baru diketahui setelah plotting. Satu atau dua pengamatan sekilas termasuk keterangan yang sangat kurang."]}
 ],
 kasus:["doria"], anim:["r19","doria"],
 kuis:[
  {q:"Dalam tampak terbatas, kapal yang tidak saling melihat menggunakan…", o:["Aturan 13–17","Aturan 19","Aturan 18 saja","Kesepakatan lewat VHF"], a:1, why:"Aturan 13–17 hanya untuk kapal yang saling melihat; Aturan 19 untuk tampak terbatas."},
  {q:"Radar mendeteksi kapal di depan arah melintang, situasi terlalu dekat sedang berkembang. Sedapat mungkin hindari…", o:["Mengurangi kecepatan","Mengubah haluan ke kanan","Mengubah haluan ke kiri","Membunyikan isyarat kabut"], a:2, why:"Aturan 19(d)(i): hindari perubahan haluan ke kiri terhadap kapal di depan arah melintang, kecuali yang sedang disusul."},
  {q:"Isyarat kabut kapal tenaga yang berlaju:", o:["Satu tiup panjang tiap ≤ 2 menit","Dua tiup panjang tiap ≤ 2 menit","Tiga tiup pendek","Lonceng 5 detik"], a:0, why:"Aturan 35(a)."},
  {q:"Anda mendengar isyarat kabut dari depan arah melintang dan belum yakin aman. Tindakan pertama:", o:["Menambah kecepatan agar cepat lewat","Mengurangi kecepatan sampai minimum yang masih bisa mengemudi","Mengubah haluan ke kiri","Mematikan radar agar tidak bingung"], a:1, why:"Aturan 19(e)."},
  {q:"Faktor yang disebut Britannica sebagai penyebab tubrukan Andrea Doria–Stockholm:", o:["Kerusakan kemudi","Kabut tebal, kecepatan tinggi dalam tampak buruk, dan penggunaan radar yang keliru","Badai tropis","Kegagalan mesin"], a:1, why:"Lihat studi kasus Andrea Doria–Stockholm."}
 ]},

{id:"m4", judul:"Human error dan kerja tim anjungan", faktor:"manusia",
 ringkas:"Mengapa perwira yang cakap tetap membuat kesalahan, dan bagaimana tim anjungan mencegahnya.",
 tujuan:["Mengenali pola kesalahan manusia yang berulang pada laporan investigasi.","Menerapkan komunikasi tertutup dan saling mengingatkan di anjungan.","Menggunakan VHF dan isyarat bunyi secara tepat."],
 materi:[
  {h:"Pola yang berulang", p:["Laporan investigasi yang dibahas di aplikasi ini memperlihatkan pola serupa: kapal lain terlihat tetapi tidak dipantau (Seagate), asumsi tanpa baringan (Seagate), tindakan terlambat (Fitzgerald), tindakan kecil dan ragu-ragu (Norgas Cathinka), dan belok kiri pada situasi memotong (Bahuga Jaya).","Kelelahan, pelatihan yang kurang, dan pengawasan yang lemah disebut NTSB sebagai faktor pada tubrukan Fitzgerald dan John S McCain."]},
  {h:"Kerja tim anjungan", p:["Bagi tugas dengan jelas: siapa mengamati, siapa memplot, siapa mengemudi, siapa berkomunikasi. Pada tubrukan Fitzgerald, NTSB mencatat komunikasi dan kerja sama yang tidak efektif antara anjungan dan pusat informasi tempur.","Gunakan komunikasi tertutup: perintah diulang, pelaksanaan dilaporkan. Setiap anggota tim berhak dan wajib menyampaikan keraguan.","Panggil nakhoda lebih awal. Menunggu sampai situasi genting menghilangkan pilihan."]},
  {h:"VHF: alat bantu, bukan pengganti aturan", p:["Kesepakatan lewat VHF mudah salah paham: salah identifikasi kapal, bahasa, atau kanal. Pada tubrukan Ever Smart–Alexandra 1, MAIB mencatat olah gerak tanker didasarkan pada informasi VHF yang terbatas dan tidak ada kesepakatan berpapasan yang disampaikan kepada semua pihak.","Pada tubrukan Bahuga Jaya–Norgas Cathinka, panggilan VHF kanal 16 baru dilakukan ketika jarak kurang dari 0,25 mil dan tidak dipahami.","Bila VHF dipakai, lakukan dini, sebut identitas dengan jelas, dan tetap bertindak menurut COLREG."]},
  {h:"Alih kendali dan perubahan mendadak", p:["Jangan memindahkan kendali kemudi atau mesin di perairan padat. NTSB menyebut keputusan memindahkan kendali dorong di perairan ramai sebagai isu keselamatan pada tubrukan John S McCain.","Bila kendali terasa hilang, jalankan prosedur darurat kemudi dan segera peringatkan kapal di sekitar."]}
 ],
 kasus:["fitzgerald","bahuga","seagate","eversmart"], anim:["fitzgerald","bahuga","seagate"],
 kuis:[
  {q:"Penyebab yang mungkin (probable cause) tubrukan Fitzgerald–ACX Crystal menurut NTSB:", o:["Kerusakan radar ACX Crystal","Tim anjungan Fitzgerald tidak bertindak dini dan tegas sebagai kapal yang wajib menghindar","Kabut tebal","Kegagalan kemudi"], a:1, why:"Lihat laporan NTSB MAR-20/02."},
  {q:"Menurut KNKT, belok kiri KMP Bahuga Jaya…", o:["Sesuai Aturan 15","Tidak sesuai peraturan pencegahan tubrukan di laut","Diminta oleh Norgas Cathinka","Dilakukan terlalu dini"], a:1, why:"KNKT menyatakan perubahan haluan ke kiri itu tidak sesuai peraturan pencegahan tubrukan."},
  {q:"Perwira jaga Seagate melihat Timor Stream lalu…", o:["Mengambil baringan berulang","Memplotnya di radar","Mengira kapal itu menyusul tanpa mengambil baringan atau memplot","Memanggil nakhoda"], a:2, why:"MAIB: ia berasumsi kapal itu menyusul; tidak ada baringan maupun plot radar."},
  {q:"Sikap terbaik terhadap VHF dalam pencegahan tubrukan:", o:["Selalu sepakati menyimpang dari COLREG","Alat bantu yang dipakai dini dan jelas; tindakan tetap menurut COLREG","Tidak perlu dipakai sama sekali","Dipakai hanya setelah jarak di bawah 1 mil"], a:1, why:"VHF rawan salah paham; ia melengkapi, bukan mengganti aturan."},
  {q:"Kapan sebaiknya nakhoda dipanggil?", o:["Setelah tubrukan tak terhindarkan","Lebih awal, ketika masih ada pilihan","Hanya pada siang hari","Bila radar mati saja"], a:1, why:"Panggilan dini memberi waktu untuk menilai dan bertindak."}
 ]},

{id:"m5", judul:"Kesalahan navigasi", faktor:"navigasi",
 ringkas:"Alur pelayaran sempit, bagan pemisah lalu lintas, pemantauan posisi, dan perencanaan pelayaran (Aturan 9, 10).",
 tujuan:["Menerapkan Aturan 9 dan 10 di alur sempit dan TSS.","Memeriksa posisi dengan lebih dari satu cara.","Mengambil pelajaran dari Royal Majesty dan Ever Smart–Alexandra 1."],
 materi:[
  {h:"Aturan 9 — Alur pelayaran sempit", p:["Kapal yang berlayar mengikuti alur sempit berlayar sedekat mungkin ke batas luar alur di sisi kanannya, sejauh aman dan dapat dilaksanakan.","Kapal dengan panjang kurang dari 20 meter dan kapal layar tidak boleh merintangi kapal yang hanya dapat berlayar aman di dalam alur. Kapal yang sedang menangkap ikan tidak boleh merintangi kapal lain yang berlayar di dalam alur. Jangan memotong alur bila itu merintangi kapal yang hanya dapat berlayar aman di dalamnya, dan sedapat mungkin hindari berlabuh jangkar di alur sempit."]},
  {h:"Aturan 10 — Bagan pemisah lalu lintas (TSS)", p:["Ikuti jalur sesuai arah umum lalu lintas, jauhi garis atau zona pemisah, dan masuk atau keluar jalur pada ujungnya; bila dari samping, dengan sudut sekecil mungkin terhadap arah lalu lintas.","Sedapat mungkin hindari memotong jalur. Bila terpaksa, potonglah dengan haluan yang sedapat mungkin tegak lurus arah lalu lintas.","Berada di dalam TSS tidak memberi hak istimewa: aturan lain tetap berlaku."]},
  {h:"Pemantauan posisi", p:["Royal Majesty kandas pada 10 Juni 1995 setelah berlayar lebih dari sehari dengan posisi GPS yang sebenarnya hasil hitungan duga (dead reckoning). NTSB menyebut ketergantungan berlebihan perwira jaga pada fitur otomatis sistem anjungan terpadu sebagai penyebab yang mungkin, dan mualim dua tidak bertindak walau beberapa petunjuk menunjukkan kapal keluar jalur.","Rekomendasi NTSB sesudahnya: bandingkan data dari beberapa penerima posisi yang berdiri sendiri, dan periksa posisi dengan benda darat, kedalaman, serta sarana bantu navigasi."]},
  {h:"Perencanaan dan daerah padat", p:["Pada tubrukan Ever Smart–Alexandra 1 di pintu alur Jebel Ali, MAIB mencatat tanker berlayar terlalu dekat dengan pintu alur, VTS tidak menegurnya, pandu turun terlalu awal, dan kapal peti kemas tidak memantau gerak tanker.","Pada tubrukan Fitzgerald, NTSB mencatat perencanaan komandan yang kurang terhadap bahaya lintasan yang akan dilalui.","KNKT merekomendasikan pembenahan pengaturan lalu lintas penyeberangan Merak–Bakauheni setelah tubrukan Bahuga Jaya–Norgas Cathinka."]}
 ],
 kasus:["royalmajesty","eversmart","mccain"], anim:["royalmajesty","eversmart","mccain"],
 kuis:[
  {q:"Di alur pelayaran sempit, kapal berlayar…", o:["Di tengah alur","Sedekat mungkin ke batas luar alur di sisi kanannya","Di sisi kiri alur","Zig-zag agar terlihat"], a:1, why:"Aturan 9(a)."},
  {q:"Bila terpaksa memotong jalur TSS, haluan sedapat mungkin…", o:["Sejajar arah lalu lintas","Tegak lurus arah lalu lintas","45° terhadap arah lalu lintas","Berlawanan arah lalu lintas"], a:1, why:"Aturan 10(c)."},
  {q:"Penyebab yang mungkin kandasnya Royal Majesty menurut NTSB mencakup…", o:["Ketergantungan berlebihan perwira jaga pada fitur otomatis sistem anjungan terpadu","Badai besar","Kerusakan mesin induk","Peta yang salah cetak"], a:0, why:"Lihat laporan NTSB MAR-97/01."},
  {q:"Cara memeriksa posisi yang direkomendasikan setelah kasus Royal Majesty:", o:["Cukup satu GPS yang mahal","Membandingkan beberapa sumber posisi dan memeriksa dengan benda darat, kedalaman, serta sarana bantu navigasi","Mengandalkan autopilot","Bertanya ke kapal lain"], a:1, why:"Rekomendasi NTSB seri M-97."},
  {q:"Berada di dalam jalur TSS berarti…", o:["Kapal lain wajib menghindar","Aturan lain tetap berlaku; tidak ada hak istimewa","Boleh mengabaikan Aturan 5","Kecepatan bebas"], a:1, why:"Aturan 10(a): tidak membebaskan dari kewajiban menurut aturan lain."}
 ]},

{id:"m6", judul:"Peralatan elektronik dan kalibrasi", faktor:"alat",
 ringkas:"Radar, ARPA, AIS, pedoman giro, GPS, dan perum gema: periksa, bandingkan, dan catat galatnya.",
 tujuan:["Menjelaskan mengapa masukan haluan dan kecepatan yang salah membuat CPA/TCPA menyesatkan.","Melakukan pemeriksaan rutin radar, giro, AIS, GPS, dan perum gema.","Mengambil pelajaran dari Royal Majesty, Timor Stream, dan Ever Smart–Alexandra 1."],
 materi:[
  {h:"Mengapa kalibrasi menyangkut tubrukan", p:["ARPA menghitung haluan, kecepatan, CPA, dan TCPA sasaran dari masukan pedoman dan log kapal sendiri. Pedoman MCA Inggris (MGN 379) mengingatkan bahwa masukan haluan atau kecepatan yang tidak akurat menurunkan ketelitian hasil itu.","MGN 379 juga menyatakan penanda haluan radar yang tidak segaris, walau sedikit, dapat menimbulkan penafsiran situasi tubrukan yang menyesatkan dan berbahaya, terutama dalam tampak terbatas."]},
  {h:"Radar dan ARPA", p:["Menurut MGN 379, unjuk kerja radar diperiksa dengan performance monitor sebelum berlayar dan sekurang-kurangnya tiap empat jam selama jaga radar. Kesegarisan penanda haluan diperiksa secara berkala.","Gunakan baringan pedoman, visual atau radar, untuk menilai bahaya tubrukan. Ganti skala jarak secara teratur agar sasaran jauh dan dekat sama-sama terpantau."]},
  {h:"Pedoman giro dan magnet", p:["Tentukan galat pedoman secara teratur, misalnya dengan azimut benda angkasa atau garis baringan di darat, lalu catat di buku harian. Bandingkan pedoman giro, repeater, dan pedoman magnet setiap jaga dan setelah perubahan haluan besar.","Laporan MAIB tentang tubrukan Seagate–Timor Stream mencatat data haluan AIS yang dipancarkan Timor Stream berbeda sekitar 160° dari haluan sebenarnya, terkait penyelarasan repeater antarmuka giro. Data haluan AIS kapal lain karena itu jangan diterima begitu saja."]},
  {h:"AIS", p:["AIS membantu identifikasi, tetapi datanya bergantung pada alat dan pengisian di kapal pengirim. Pada tubrukan Ever Smart–Alexandra 1, AIS tanker dalam keadaan mati sehingga nama dan data kapal tidak langsung tersedia bagi kapal lain maupun VTS.","Jangan mendasarkan keputusan menghindar pada AIS saja. Periksa juga data statis dan dinamis AIS kapal sendiri."]},
  {h:"GPS, ECDIS, dan perum gema", p:["Pada Royal Majesty, sambungan kabel antena GPS terlepas tidak lama setelah berangkat dan penerima beralih ke mode hitungan duga tanpa disadari awak; autopilot terus mengikuti data itu. Kapal kandas sekitar 17 mil dari jalur yang direncanakan.","Kenali tanda mode dan alarm tiap alat. Setel alarm kedalaman pada nilai yang berguna. Bandingkan posisi GPS dengan radar, baringan visual, dan kedalaman.","NTSB merekomendasikan alarm suara yang terus berbunyi sampai dimatikan pengguna, serta penataan kabel navigasi yang tidak terbuka."]},
  {h:"Catatan kejujuran data", p:["Tidak semua kasus di sini murni soal kalibrasi. Pada Seagate–Timor Stream, MAIB menyimpulkan penyebab utamanya adalah standar jaga yang buruk; galat haluan AIS dicatat sebagai temuan. Royal Majesty adalah kasus kandas, bukan tubrukan, tetapi pelajarannya tentang memeriksa alat elektronik berlaku langsung bagi pencegahan tubrukan."]}
 ],
 kasus:["royalmajesty","seagate","eversmart","doria"], anim:["royalmajesty","seagate"],
 kuis:[
  {q:"Masukan pedoman atau log yang salah ke ARPA menyebabkan…", o:["Tidak ada pengaruh","Hasil hitungan sasaran seperti CPA/TCPA menjadi kurang teliti","Radar mati","AIS berhenti memancar"], a:1, why:"MGN 379: masukan haluan atau kecepatan yang tidak akurat menurunkan ketelitian."},
  {q:"Menurut MGN 379, unjuk kerja radar diperiksa…", o:["Setahun sekali","Sebelum berlayar dan sekurang-kurangnya tiap empat jam selama jaga radar","Hanya ketika rusak","Tiap ganti awak"], a:1, why:"MGN 379."},
  {q:"Pada Royal Majesty, penerima GPS beralih ke mode…", o:["Diferensial","Hitungan duga (dead reckoning)","Simulasi","Hemat daya"], a:1, why:"Kabel antena terlepas; penerima beralih ke mode DR."},
  {q:"Laporan MAIB mencatat data haluan AIS Timor Stream…", o:["Tepat sama dengan haluan sebenarnya","Berbeda sekitar 160° dari haluan sebenarnya","Tidak dipancarkan","Berbeda 2°"], a:1, why:"Bagian 1.5.6 laporan MAIB 17/2013."},
  {q:"Pada tubrukan Ever Smart–Alexandra 1, AIS Alexandra 1…", o:["Memancarkan nama yang salah","Dalam keadaan mati","Berfungsi normal","Belum terpasang"], a:1, why:"MAIB: AIS mati sehingga data kapal tidak langsung tersedia."},
  {q:"Sikap yang benar terhadap data AIS kapal lain:", o:["Dasar tunggal untuk menghindar","Alat bantu yang harus dicocokkan dengan radar dan pengamatan visual","Lebih dipercaya daripada baringan","Diabaikan sama sekali"], a:1, why:"Data AIS bergantung pada alat dan pengisian kapal pengirim."}
 ]},
{id:"m7", judul:"Kapal otonom dan kecerdasan artifisial", faktor:"alat",
 ringkas:"Peluang dan risiko kapal otonom (MASS), berawak maupun tanpa awak, serta AI dalam lalu lintas laut terhadap kecelakaan kapal.",
 tujuan:["Menjelaskan istilah MASS, empat tingkat otonomi, dan status MASS Code IMO.","Menimbang peluang dan risiko otomasi serta AI terhadap tubrukan.","Menentukan sikap tim anjungan ketika berbagi perairan dengan kapal otonom."],
 materi:[
  {h:"Istilah dan tingkat otonomi", p:["IMO memakai istilah Maritime Autonomous Surface Ships (MASS) untuk kapal yang, dalam tingkat tertentu, dapat beroperasi tanpa campur tangan manusia.","Untuk kajian peraturannya, IMO memakai empat tingkat: (1) kapal dengan proses terotomasi dan dukungan keputusan, pelaut tetap di kapal; (2) kapal dikendalikan dari jauh, pelaut masih di kapal; (3) kapal dikendalikan dari jauh tanpa pelaut di kapal; (4) kapal otonom penuh yang sistemnya mengambil keputusan sendiri.","Jadi kapal otonom tidak selalu tanpa awak. Tingkat 1 dan 2 adalah kapal berawak dengan bantuan otomasi atau kendali jarak jauh."]},
  {h:"Status peraturan", p:["IMO menyelesaikan kajian lingkup peraturan (regulatory scoping exercise) pada 2021. Kajian itu menyoroti antara lain arti nakhoda dan awak, pusat kendali jarak jauh, dan kedudukan operator jarak jauh.","Pada sidang MSC 111 bulan Mei 2026, IMO mengadopsi MASS Code yang tidak wajib melalui resolusi MSC.595(111), berlaku 1 Juli 2026. Kode ini berbasis tujuan, berlaku bagi kapal barang, dan mensyaratkan penilaian risiko dalam proses persetujuan.","Menurut ringkasan DNV, nakhoda manusia tetap bertanggung jawab atas kapal; ia boleh tidak berada di kapal tetapi harus dapat campur tangan. Pusat operasi jarak jauh disertifikasi negara bendera.","Kode wajib direncanakan berlaku paling cepat 1 Januari 2032, setelah tahap pengumpulan pengalaman."]},
  {h:"COLREG tetap sama", p:["Aturan 1 menyatakan COLREG berlaku bagi semua kapal di laut lepas dan perairan yang berhubungan dengannya. Tidak ada aturan pencegahan tubrukan tersendiri bagi kapal otonom.","Kajian ilmiah mencatat persoalan terbuka: Aturan 5 ditulis untuk penglihatan dan pendengaran manusia, dan banyak aturan memakai ukuran seperti kecakapan pelaut yang baik yang sulit diterjemahkan menjadi algoritma. Satu tinjauan tahun 2022 menyimpulkan hampir semua metode penghindaran tubrukan yang ada paling jauh hanya sebagian sesuai COLREG."]},
  {h:"Peluang", p:["Bagian ini adalah analisis penulis yang ditarik dari kasus di buku ini; belum ada statistik kecelakaan yang membuktikannya.","Sensor yang tidak lelah dapat menutup celah pengamatan seperti pada Seagate–Timor Stream dan Ever Smart–Alexandra 1. Dukungan keputusan dapat mengingatkan lebih dini pada situasi seperti Fitzgerald–ACX Crystal. Kelelahan awak, yang disebut NTSB pada dua tubrukan tahun 2017, tidak dialami mesin.","AI juga dipakai di kapal berawak dan di darat: peringatan bahaya tubrukan, pengenalan sasaran dari kamera, dan pemantauan lalu lintas. Perekaman data yang lengkap memudahkan investigasi dan pembelajaran."]},
  {h:"Risiko", p:["Kajian SAFEMASS (DNV GL untuk EMSA, 2020) menyoroti bahaya yang terkait kesadaran situasi operator jarak jauh, mode confusion, serta rasa terlalu percaya atau tidak percaya pada otomasi.","Penelitian tahun 2024 tentang kapal kendali jarak jauh menemukan interaksi manusia dan komputer yang tidak selaras pada tahap pengambilan keputusan sebagai faktor kunci dalam penghindaran tubrukan.","Dua kasus di buku ini sudah menunjukkan risiko itu pada kapal berawak: Royal Majesty (terlalu percaya pada sistem anjungan terpadu) dan John S McCain (salah paham mode kendali layar sentuh).","Risiko lain: ketergantungan pada sambungan komunikasi dan keamanan siber (pedoman uji coba MASS IMO meminta pengelolaan risiko siber), sensor yang menurun kinerjanya dalam hujan lebat atau kabut, dan lalu lintas campuran ketika kapal berawak sulit menebak maksud kapal otonom."]},
  {h:"Sikap tim anjungan", p:["Perlakukan kapal otonom sama dengan kapal lain: tentukan bahaya tubrukan dan status menurut COLREG, lalu bertindak dini. Jangan berasumsi kapal itu pasti melihat Anda atau pasti patuh.","Panggilan VHF mungkin dijawab operator di darat, mungkin terlambat, atau tidak dijawab. Isyarat bunyi dan olah gerak yang jelas tetap berlaku.","Di kapal sendiri, perlakukan saran AI sebagai salah satu sarana menurut Aturan 5. Keputusan dan tanggung jawab tetap pada perwira jaga dan nakhoda (Aturan 2). Kenali mode tiap alat dan cocokkan dengan pengamatan sendiri."]}
 ],
 kasus:["royalmajesty","mccain","seagate"], anim:["royalmajesty","mccain"],
 kuis:[
  {q:"Menurut tingkat otonomi yang dipakai IMO, kapal tingkat 2 adalah…", o:["Kapal otonom penuh","Kapal dikendalikan dari jauh dengan pelaut masih di kapal","Kapal dikendalikan dari jauh tanpa pelaut","Kapal tanpa otomasi"], a:1, why:"Tingkat 2: kendali jarak jauh, pelaut masih di kapal."},
  {q:"MASS Code yang diadopsi IMO pada Mei 2026 bersifat…", o:["Wajib bagi semua kapal","Tidak wajib, berlaku 1 Juli 2026","Hanya untuk kapal perang","Pengganti COLREG"], a:1, why:"Resolusi MSC.595(111); kode wajib direncanakan paling cepat 2032."},
  {q:"Terhadap kapal otonom, COLREG…", o:["Tidak berlaku","Berlaku sama seperti terhadap kapal lain","Memberi hak jalan khusus","Hanya berlaku pada siang hari"], a:1, why:"Aturan 1: COLREG berlaku bagi semua kapal."},
  {q:"Risiko yang disoroti kajian SAFEMASS:", o:["Kesadaran situasi operator jarak jauh dan mode confusion","Kekurangan bahan bakar","Ukuran kapal terlalu kecil","Kelebihan awak"], a:0, why:"Lihat ringkasan SAFEMASS (DNV GL untuk EMSA, 2020)."},
  {q:"Sikap yang benar terhadap saran sistem AI di anjungan:", o:["Diikuti tanpa diperiksa","Salah satu sarana; dicocokkan dengan pengamatan, keputusan tetap pada perwira jaga","Diabaikan sepenuhnya","Menggantikan pengamat"], a:1, why:"Aturan 5 dan Aturan 2; pelajaran Royal Majesty."}
 ]}
],

kasus: [
{id:"doria", judul:"Andrea Doria – Stockholm", tanggal:"25–26 Juli 1956", lokasi:"Lepas pantai Nantucket, Samudra Atlantik", faktor:["cuaca","alat","manusia"], anim:"doria",

{id:"fitzgerald", judul:"USS Fitzgerald – ACX Crystal", tanggal:"17 Juni 2017, sekitar 01.30", lokasi:"Teluk Sagami Nada, lepas Pulau Honshu, Jepang", faktor:["manusia","navigasi"], anim:"fitzgerald",

 kronologi:["Fitzgerald (315 orang) berlayar ke selatan dengan kecepatan sekitar 22,1 knot dari Yokosuka.","ACX Crystal (kapal peti kemas berbendera Filipina) berlayar ke timur-timur laut sekitar 18,5 knot dari Nagoya menuju Tokyo.","Jarak terus mengecil. Tidak ada kapal yang memanggil lewat radio.","Beberapa detik sebelum benturan, perwira jaga kedua kapal mencoba mengolah gerak, tetapi terlambat.","Haluan ACX Crystal mengenai lambung kanan depan Fitzgerald."],

 pelajaran:["Kapal yang wajib menghindar bertindak dini dan tegas (Aturan 16).","Kapal yang bertahan memakai isyarat keraguan dan bertindak sebelum terlambat (Aturan 17, 34).","Kelelahan dan pembagian tugas tim adalah bagian dari pencegahan tubrukan."],
 aturan:["Aturan 5","Aturan 7","Aturan 15","Aturan 16","Aturan 17"], ref:["ntsb-fitz"]},

{id:"bahuga", judul:"KMP Bahuga Jaya – MT Norgas Cathinka", tanggal:"26 September 2012, sekitar 04.44 WIB", lokasi:"Selat Sunda, lintasan Merak–Bakauheni", faktor:["manusia","navigasi"], anim:"bahuga",
 ringkas:"Feri ro-ro dan tanker gas bertubrukan pada situasi memotong. Bahuga Jaya tenggelam.",
 kronologi:["03.05 — Bahuga Jaya berangkat dari Merak menuju Bakauheni; Norgas Cathinka melintasi Selat Sunda menuju Singapura.","04.20 — Norgas melaju 11 knot; radarnya mendeteksi lima kapal yang akan melintas di depan haluan.","04.36 — Bahuga Jaya masih pada lintasan berpotensi tubrukan pada jarak 2 mil laut.","04.40 — Mualim jaga Norgas mengubah haluan ke 050° dengan autopilot; mualim jaga Bahuga Jaya memerintahkan belok 20° ke kiri.","04.41 — Norgas mengubah haluan dari 055° ke 060°; jarak kurang dari 1 mil laut.","04.43 — Bahuga Jaya memanggil tiga kali di VHF kanal 16; panggilan terdengar tetapi tidak dipahami. Jarak kurang dari 0,25 mil laut.","04.44 — Norgas berbelok tajam ke kanan; haluan kirinya menghantam sisi kanan Bahuga Jaya di bawah anjungan."],

{id:"mccain", judul:"USS John S McCain – Alnic MC", tanggal:"21 Agustus 2017, pukul 05.24", lokasi:"Selat Singapura, jalur barat TSS, sekitar 5 mil dari Mercusuar Horsburgh", faktor:["manusia","navigasi","alat"], anim:"mccain",

 temuan:["Penyebab yang mungkin: kurangnya pengawasan operasional yang efektif oleh Angkatan Laut AS, yang berakibat pada pelatihan yang kurang dan prosedur anjungan yang tidak memadai.","Faktor penyumbang: tim anjungan kehilangan kesadaran situasi dan tidak menjalankan prosedur darurat kehilangan kemudi, termasuk memperingatkan lalu lintas di sekitar.","Isu keselamatan: pemindahan kendali dorong di perairan padat, tidak ada komunikasi VHF antar kapal, kebijakan pemancaran AIS, rancangan sistem anjungan terpadu, dan kelelahan.","Korban: 10 meninggal dan 48 luka di John S McCain; tidak ada korban di Alnic MC."],

{id:"eversmart", judul:"Ever Smart – Alexandra 1", tanggal:"11 Februari 2015", lokasi:"Pintu alur masuk Pelabuhan Jebel Ali, Uni Emirat Arab", faktor:["navigasi","manusia","alat"], anim:"eversmart",
 ringkas:"Kapal peti kemas keluar alur bertubrukan dengan tanker yang menunggu pandu di dekat pintu alur.",
 kronologi:["Pandu pelabuhan dipindahkan dengan motor pandu dari Ever Smart yang keluar ke Alexandra 1 yang akan masuk.","Alexandra 1 bergerak dekat pintu alur sambil menunggu pandu.","Ever Smart tidak memantau gerak tanker dan baru menyadari kedekatannya beberapa detik sebelum benturan.","Kedua kapal bertubrukan di pintu alur; keduanya rusak, tanpa korban dan tanpa pencemaran."],
 temuan:["Ever Smart tidak memantau gerak Alexandra 1.","Alexandra 1 berlayar terlalu dekat dengan pintu alur tanpa perlu, dan VTS pelabuhan tidak menegur.","Olah gerak Alexandra 1 didasarkan pada informasi VHF yang terbatas.","Tidak ada kesepakatan berpapasan yang disampaikan ke semua pihak, dan pandu meninggalkan Ever Smart terlalu awal.","AIS Alexandra 1 mati."],
 pelajaran:["Hak jalan tidak menghapus kewajiban mengamati.","Jangan menunggu di depan pintu alur.","Pastikan AIS hidup dan kesepakatan berpapasan dipahami semua pihak."],
 aturan:["Aturan 5","Aturan 7","Aturan 9"], ref:["maib-ever"]},

{id:"seagate", judul:"Seagate – Timor Stream", tanggal:"10 Maret 2012, pukul 05.40", lokasi:"24 mil laut di utara Republik Dominika", faktor:["manusia","alat"], anim:"seagate",
 ringkas:"Dua kapal bertubrukan di laut terbuka dengan tampak baik karena kedua perwira jaga tidak menjaga pengamatan.",
 kronologi:["Timor Stream meninggalkan pelabuhan tiga jam sebelumnya menuju Inggris; Seagate menuju pantai barat Afrika.","Perwira jaga Seagate melihat Timor Stream tetapi mengira kapal itu menyusul dan akan menghindar.","Ia tidak mengambil baringan dan tidak memplot kapal itu di radar.","Nakhoda Timor Stream, sendirian di anjungan, tidak melihat Seagate sampai sesaat sebelum benturan.","Pukul 05.40 haluan Timor Stream menghantam sisi kanan Seagate."],
 temuan:["MAIB: tubrukan terjadi karena kedua perwira jaga tidak cukup memperhatikan jaga navigasi yang aman; isu keselamatannya standar jaga yang buruk akibat rasa puas diri.","Laporan mencatat data haluan AIS Timor Stream berbeda sekitar 160° dari haluan sebenarnya, terkait penyelarasan repeater antarmuka giro.","Tidak ada korban; kedua kapal rusak berat dan terjadi pencemaran ringan."],
 pelajaran:["Melihat kapal lain belum berarti mengamatinya: ambil baringan dan plot.","Asumsi adalah keterangan yang sangat kurang.","Jangan jaga sendirian di anjungan pada malam hari.","Data haluan AIS bisa salah; cocokkan dengan radar dan mata."],
 aturan:["Aturan 5","Aturan 7","Aturan 15","Aturan 17"], ref:["maib-seagate"]},

{id:"royalmajesty", judul:"Royal Majesty (kandas)", tanggal:"10 Juni 1995, sekitar 22.25", lokasi:"Rose and Crown Shoal, sekitar 10 mil di timur Pulau Nantucket", faktor:["alat","navigasi","manusia"], anim:"royalmajesty",
 ringkas:"Kapal penumpang dengan 1.509 orang kandas setelah GPS diam-diam beralih ke hitungan duga.",
 kronologi:["9 Juni sekitar tengah hari, Royal Majesty berangkat dari St. George's, Bermuda, menuju Boston.","Tidak lama setelah berangkat, sambungan kabel antena GPS terlepas dan penerima beralih ke mode hitungan duga.","Autopilot terus mengikuti data posisi itu; pengaruh angin dan laut tidak terhitung.","Beberapa petunjuk bahwa kapal keluar jalur tidak ditindaklanjuti.","10 Juni sekitar 22.25 kapal kandas, sekitar 17 mil dari jalur yang direncanakan."],
 temuan:["Penyebab yang mungkin: ketergantungan berlebihan perwira jaga pada fitur otomatis sistem anjungan terpadu; perusahaan tidak memastikan perwiranya terlatih; kekurangan rancangan dan prosedur sistem; mualim dua tidak bertindak atas petunjuk yang ada.","Tidak ada korban. Kerusakan dan kehilangan pendapatan ditaksir sekitar 7 juta dolar AS."],
 pelajaran:["Satu sumber posisi tidak pernah cukup.","Kenali tanda mode dan alarm setiap alat.","Setel alarm kedalaman pada nilai yang berguna dan periksa posisi dengan radar serta kedalaman."],
 aturan:["Aturan 2","Aturan 5"], ref:["ntsb-rm"],
 catatan:"Ini kasus kandas, bukan tubrukan. Dimuat karena pelajarannya tentang verifikasi alat elektronik."}
],

/* ---------- penyimpanan: localStorage dengan cadangan memori ---------- */
var mem=null;
function muat(){ if(mem) return mem; try{ mem=JSON.parse(localStorage.getItem(KUNCI)||"null") }catch(e){ mem=null } if(!mem) mem={profil:null,baca:{},kuis:{},kasus:{},anim:{},cek:{},ujian:[]}; return mem }

/* ---------- kemajuan ---------- */
function lulusKuis(id){ var k=D.kuis[id]; return k && k.benar/k.total>=0.8 }
function kemajuanModul(m){ var n=0; if(D.baca[m.id]) n++; if(lulusKuis(m.id)) n++; return n/2 }
function kemajuanTotal(){ var s=0; K.modul.forEach(function(m){s+=kemajuanModul(m)}); var kasus=K.kasus.filter(function(k){return D.kasus[k.id]}).length; return (s+kasus)/(K.modul.length+K.kasus.length) }
function ujianTerbaik(){ var b=null; D.ujian.forEach(function(u){ if(!b||u.nilai>b.nilai) b=u }); return b }
function semuaKuisLulus(){ return K.modul.every(function(m){return lulusKuis(m.id)}) }

function hBeranda(){

 '<h3>Ujian akhir</h3><div class="kartu">'+(u?'<p>Nilai terbaik: <b>'+u.nilai+'</b> ('+(u.nilai>=80?"lulus":"belum lulus")+')</p>':'<p class="redup">Belum pernah mengikuti ujian.</p>')+

/* ---------- modul ---------- */
function hModulDaftar(){
 var isi='<h2>Modul belajar</h2><p class="redup">Baca materi, tonton animasi, lalu kerjakan kuis. Lulus kuis bila benar 80% atau lebih.</p>'+
 K.modul.map(function(m,i){var p=Math.round(kemajuanModul(m)*100);return '<a class="kartu" href="#/modul/'+m.id+'"><div class="baris"><div class="nomor">'+(i+1)+'</div><div class="tumbuh"><b>'+esc(m.judul)+'</b><div class="redup kecil">'+esc(m.ringkas)+'</div></div></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="redup kecil" style="margin-top:4px">'+(D.baca[m.id]?"Materi dibaca":"Materi belum dibaca")+' · '+(D.kuis[m.id]?("Kuis "+D.kuis[m.id].benar+"/"+D.kuis[m.id].total):"Kuis belum dikerjakan")+'</div></a>'}).join("");
 return kerangka("Modul",K.modul.length+" modul",isi,"modul");
}
function hModul(id,tab){
 var m=K.modul.filter(function(x){return x.id===id})[0]; if(!m) return hModulDaftar();
 tab=tab||"materi"; var no=K.modul.indexOf(m)+1, isi='';
 isi+='<div class="tab">'+[["materi","Materi"],["animasi","Animasi"],["kuis","Kuis"]].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"aktif":"")+'">'+t[1]+'</button>'}).join("")+'</div>';
 if(tab==="materi"){
  isi+='<h2>'+no+'. '+esc(m.judul)+'</h2>'+tagFaktor(m.faktor)+'<div class="kartu" style="margin-top:8px"><b>Tujuan belajar</b><ul class="rapi">'+m.tujuan.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul></div>'+
  m.materi.map(function(s){return '<h3>'+esc(s.h)+'</h3>'+s.p.map(function(p){return '<p>'+esc(p)+'</p>'}).join("")}).join("")+
  '<h3>Studi kasus terkait</h3>'+m.kasus.map(function(c){var k=kasusById(c);return '<a class="kartu" href="#/kasus/'+k.id+'"><b>'+esc(k.judul)+'</b><div class="redup kecil">'+esc(k.tanggal)+'</div></a>'}).join("")+
  '<button class="tombol '+(D.baca[m.id]?"":"utama")+' penuh" id="tandaBaca">'+(D.baca[m.id]?"✓ Sudah ditandai dibaca":"Tandai materi sudah dibaca")+'</button>';
 } else if(tab==="animasi"){
  isi+='<h2>Animasi modul '+no+'</h2>'+m.anim.map(function(a){return '<a class="kartu" href="#/animasi/'+a+'"><div class="baris"><div class="nomor">▶</div><div class="tumbuh"><b>'+esc(K.anim[a].judul)+'</b><div class="redup kecil">'+esc(K.anim[a].ket)+'</div></div></div></a>'}).join("");
 } else {
  isi+='<h2>Kuis modul '+no+'</h2><div id="kuis"></div>';
 }
 return kerangka("Modul "+no,m.judul,isi,"modul","#/modul");
}
function kasusById(id){ return K.kasus.filter(function(k){return k.id===id})[0] }

/* ---------- mesin kuis (dipakai kuis modul dan ujian) ---------- */
function jalankanKuis(wadah,soal,selesai,modeUjian){
 var i=0,benar=0,jawab=[];

}

function hGlos(){ return kerangka("Glosarium","",'<h2>Glosarium</h2><input type="text" id="cari" placeholder="Cari istilah…" aria-label="Cari istilah"><div id="glos" style="margin-top:12px"></div>',"lain","#/lain") }

function hRef(){ return kerangka("Referensi","",'<h2>Referensi</h2><p class="redup">Tautan memerlukan internet. Judul dan penerbit tetap terbaca saat luring.</p>'+K.referensi.map(function(x,i){return '<div class="kartu kecil"><b>['+(i+1)+'] '+esc(x.judul)+'</b><br>'+esc(x.penerbit)+'<br><a href="'+x.url+'" target="_blank" rel="noopener" style="word-break:break-all">'+esc(x.url)+'</a><div class="redup" style="margin-top:4px;font-size:13px">'+esc(x.ket)+'</div></div>'}).join(""),"lain","#/lain") }
function hProfil(){

 var isi='<h2>Profil dan data</h2><form id="fProfil" class="kartu"><label for="nama">Nama lengkap</label><input id="nama" type="text" required maxlength="60" value="'+esc(p.nama)+'"><label for="jabatan2">Jabatan</label><input id="jabatan2" type="text" maxlength="40" value="'+esc(p.jabatan)+'"><label for="kapal">Kapal / satuan</label><input id="kapal" type="text" maxlength="60" value="'+esc(p.kapal||"")+'"><button class="tombol gelap penuh" style="margin-top:14px">Simpan profil</button><p class="kecil redup" id="psn" style="margin:8px 0 0"></p></form>'+

 '<div class="kartu"><b>Hapus semua data</b><p class="redup kecil">Menghapus profil dan seluruh kemajuan di perangkat ini.</p><button class="tombol penuh" id="hapus" style="border-color:#d9480f;color:#d9480f">Hapus data</button><div id="yakin"></div></div>';
 return kerangka("Profil","",isi,"lain","#/lain");

function laporan(){
 var u=ujianTerbaik(), L=["KABUZEN CEGAH TUBRUKAN DI LAUT — LAPORAN KEMAJUAN","Nama    : "+D.profil.nama,"Jabatan : "+D.profil.jabatan,"Kapal   : "+(D.profil.kapal||"-"),"Tanggal : "+tglID(new Date()),"Kemajuan: "+Math.round(kemajuanTotal()*100)+"%","","MODUL"];
 K.modul.forEach(function(m,i){ var k=D.kuis[m.id]; L.push((i+1)+". "+m.judul+" | materi: "+(D.baca[m.id]?"dibaca":"belum")+" | kuis: "+(k?k.benar+"/"+k.total+(lulusKuis(m.id)?" (lulus)":" (belum lulus)"):"belum")) });
 L.push("","STUDI KASUS"); K.kasus.forEach(function(k){ L.push("- "+k.judul+": "+(D.kasus[k.id]?"dipelajari":"belum")) });
 L.push("","UJIAN AKHIR"); if(!D.ujian.length) L.push("belum pernah"); D.ujian.forEach(function(x){ L.push("- "+x.tgl+": "+x.nilai) }); if(u) L.push("Nilai terbaik: "+u.nilai+(u.nilai>=80?" (LULUS)":" (BELUM LULUS)"));
 return L.join("\r\n");
}
window.__laporan=laporan;

 '<h3>Data</h3><p>Profil dan kemajuan hanya tersimpan di perangkat ini. Tidak ada data yang dikirim ke server.</p>',"lain","#/lain");

function render(){
 if(animHenti){ animHenti(); animHenti=null }
 var h=location.hash.replace(/^#/,"")||"/", q={}, i=h.indexOf("?"); if(i>=0){ h.slice(i+1).split("&").forEach(function(x){var a=x.split("=");q[a[0]]=decodeURIComponent(a[1]||"")}); h=h.slice(0,i) }
 var s=h.split("/").filter(Boolean), app=$("#app"), html;
 if(!D.profil){ app.innerHTML=hSampul(); $("#fDaftar").onsubmit=function(e){ e.preventDefault(); var n=$("#nama").value.trim(); if(!n) return; D.profil={nama:n,jabatan:$("#jabatan").value,kapal:$("#kapal").value.trim(),email:$("#email").value.trim(),daftar:tglID(new Date())}; simpan(); location.hash="#/"; render() }; return }
 if(!s.length) html=hBeranda();
 else if(s[0]==="modul") html=s[1]?hModul(s[1],q.tab):hModulDaftar();
 else if(s[0]==="kasus") html=s[1]?hKasus(s[1]):hKasusDaftar(q.f);
 else if(s[0]==="animasi") html=s[1]?hAnim(s[1]):hAnimDaftar();
 else if(s[0]==="ujian") html=hUjian();
 else if(s[0]==="sertifikat") html=hSertifikat();
 else if(s[0]==="lain") html=hLain();
 else if(s[0]==="cek") html=hCek();
 else if(s[0]==="cpa") html=hCPA();
 else if(s[0]==="isyarat") html=hIsyarat();
 else if(s[0]==="glosarium") html=hGlos();
 else if(s[0]==="referensi") html=hRef();
 else if(s[0]==="profil") html=hProfil();
 else if(s[0]==="tentang") html=hTentang();
 else html=hBeranda();
 app.innerHTML=html; setJaringan(); window.scrollTo(0,0);
 var kb=$(".kembali"); if(kb) kb.onclick=function(){ var t=kb.getAttribute("data-kembali"); if(t==="back"&&history.length>1) history.back(); else location.hash=t==="back"?"#/animasi":t };
 /* pengikat per halaman */
 if(s[0]==="modul"&&s[1]){
  [].forEach.call(document.querySelectorAll("[data-tab]"),function(b){b.onclick=function(){location.hash="#/modul/"+s[1]+"?tab="+b.getAttribute("data-tab")}});
  var tb=$("#tandaBaca"); if(tb) tb.onclick=function(){ D.baca[s[1]]=1; simpan(); render() };
  var kw=$("#kuis"); if(kw){ var m=K.modul.filter(function(x){return x.id===s[1]})[0]; var mulai=function(){ jalankanKuis(kw,m.kuis,function(b,n){ D.kuis[m.id]={benar:b,total:n,tgl:tglID(new Date())}; simpan(); var ok=b/n>=0.8; kw.innerHTML='<div class="kartu" style="text-align:center"><div class="hasil">'+b+' / '+n+'</div><p><b>'+(ok?"Lulus.":"Belum lulus.")+'</b> '+(ok?"Lanjutkan ke modul berikutnya.":"Baca ulang materi lalu coba lagi.")+'</p><button class="tombol gelap" id="ulang">Ulangi kuis</button> <a class="tombol" href="#/modul">Daftar modul</a></div>'; $("#ulang").onclick=mulai }) }; var k0=D.kuis[m.id]; if(k0){ kw.innerHTML='<div class="kartu"><p>Hasil terakhir: <b>'+k0.benar+' / '+k0.total+'</b> ('+(lulusKuis(m.id)?"lulus":"belum lulus")+')</p><button class="tombol utama penuh" id="ulang">Kerjakan lagi</button></div>'; $("#ulang").onclick=mulai } else mulai() }
 }
 if(s[0]==="kasus"&&!s[1]) [].forEach.call(document.querySelectorAll("[data-f]"),function(b){b.onclick=function(){var f=b.getAttribute("data-f");location.hash="#/kasus"+(f?"?f="+f:"")}});
 if(s[0]==="kasus"&&s[1]){ var tk=$("#tandaKasus"); if(tk) tk.onclick=function(){ D.kasus[s[1]]=1; simpan(); render() } }
 if(s[0]==="animasi"&&s[1]&&K.anim[s[1]]) pasangAnim(s[1]);
 if(s[0]==="ujian") $("#mulaiUjian").onclick=function(){ var bank=[]; K.modul.forEach(function(m){ m.kuis.forEach(function(x){bank.push(x)}) }); var soal=acak(bank).slice(0,15); this.parentNode.style.display="none"; jalankanKuis($("#kuis"),soal,function(b,n,jw){ var nilai=Math.round(b/n*100); D.ujian.push({nilai:nilai,tgl:tglID(new Date())}); simpan(); var salah=soal.map(function(x,i){return jw[i]!==x.a?'<div class="kartu kecil"><b>'+esc(x.q)+'</b><br>Jawaban benar: '+esc(x.o[x.a])+'<br><span class="redup">'+esc(x.why)+'</span></div>':''}).join(""); $("#kuis").innerHTML='<div class="kartu" style="text-align:center"><div class="hasil">Nilai '+nilai+'</div><p><b>'+(nilai>=80?"Lulus.":"Belum lulus.")+'</b> Benar '+b+' dari '+n+' soal.</p>'+(nilai>=80?'<a class="tombol utama" href="#/sertifikat">Lihat sertifikat</a> ':'')+'<a class="tombol" href="#/">Beranda</a></div>'+(salah?'<h3>Pembahasan soal yang salah</h3>'+salah:'') },true) };
 if(s[0]==="sertifikat"&&$("#sert")) gambarSertifikat();
 if(s[0]==="cek"){ [].forEach.call(document.querySelectorAll("[data-cek]"),function(c){c.onchange=function(){ var id=c.getAttribute("data-cek"); if(c.checked) D.cek[id]=1; else delete D.cek[id]; simpan(); var g=id.split("-")[0], L=K.checklist.filter(function(x){return x.id===g})[0]; $('[data-hit="'+g+'"]').textContent=L.item.filter(function(_,i){return D.cek[g+"-"+i]}).length+"/"+L.item.length }}); $("#kosongCek").onclick=function(){ D.cek={}; simpan(); render() } }
 if(s[0]==="cpa"){ var hit=function(){ var v=["oc","os","tb","tr","tc","ts"].map(function(i){return parseFloat($("#"+i).value)}); if(v.some(isNaN)){ $("#hasilCPA").innerHTML='<p>Isi semua kolom dengan angka.</p>'; return } var r=hitungCPA.apply(null,v), w=$("#hasilCPA"); if(r.tcpa===null) w.innerHTML='<p>Gerak relatif nol: jarak tetap <b>'+r.cpa.toFixed(2)+' mil</b>.</p>'; else if(r.tcpa<0) w.innerHTML='<div class="redup kecil">CPA sudah terlewati</div><p>Kedua kapal saling menjauh. Jarak terdekat tadi '+r.cpa.toFixed(2)+' mil, '+Math.abs(r.tcpa).toFixed(1)+' menit lalu.</p>'; else w.innerHTML='<div class="kisi2"><div><div class="redup kecil">CPA</div><div class="hasil" id="vCPA">'+r.cpa.toFixed(2)+' mil</div></div><div><div class="redup kecil">TCPA</div><div class="hasil" id="vTCPA">'+r.tcpa.toFixed(1)+' mnt</div></div></div><p style="margin-top:8px">'+(r.cpa<0.5?'<b style="color:#d9480f">CPA sangat kecil: bahaya tubrukan.</b> Tentukan status menurut aturan dan bertindak dini.':r.cpa<2?'CPA kecil. Pantau baringan dan pertimbangkan tindakan dini.':'CPA cukup lebar menurut data ini. Tetap pantau.')+'</p>' }; $("#hitung").onclick=hit; hit() }
 if(s[0]==="glosarium"){ isiGlos(""); $("#cari").oninput=function(){isiGlos(this.value)} }
 if(s[0]==="profil"){ $("#fProfil").onsubmit=function(e){ e.preventDefault(); var n=$("#nama").value.trim(); if(!n) return; D.profil.nama=n; D.profil.jabatan=$("#jabatan2").value.trim()||"-"; D.profil.kapal=$("#kapal").value.trim(); simpan(); $("#psn").textContent="Profil tersimpan." }; try{ $("#ekspor").href=URL.createObjectURL(new Blob([laporan()],{type:"text/plain"})) }catch(e){ $("#ekspor").href="data:text/plain;charset=utf-8,"+encodeURIComponent(laporan()) }
  $("#hapus").onclick=function(){ $("#yakin").innerHTML='<p style="margin-top:10px"><b>Yakin?</b> Tindakan ini tidak dapat dibatalkan.</p><div class="baris"><button class="tombol tumbuh" id="tidak">Batal</button><button class="tombol tumbuh" id="ya" style="background:#d9480f;border-color:#d9480f;color:#fff">Ya, hapus</button></div>'; $("#tidak").onclick=function(){$("#yakin").innerHTML=""}; $("#ya").onclick=function(){ try{localStorage.removeItem(KUNCI)}catch(e){} mem=null; D=muat(); location.hash="#/"; render() } } }
}
