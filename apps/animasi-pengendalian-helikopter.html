function txt(s,x,y,o={}){ctx.font=`${o.w||600} ${o.s||20}px ${F}`;ctx.fillStyle=o.c||'#fff';ctx.textAlign=o.a||'left';ctx.textBaseline=o.b||'alphabetic';ctx.fillText(s,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrap(s,x,y,mw,lh,o){ctx.font=`${o.w||600} ${o.s||20}px ${F}`;const ws=s.split(' ');let l='',n=0;for(const w of ws){if(ctx.measureText(l+w).width>mw&&l){txt(l.trim(),x,y+n*lh,o);l='';n++}l+=w+' '}txt(l.trim(),x,y+n*lh,o);return n+1}
function lines(s,mw,o){ctx.font=`${o.w||600} ${o.s||20}px ${F}`;const ws=s.split(' ');let l='',n=1;for(const w of ws){if(ctx.measureText(l+w).width>mw&&l){l='';n++}l+=w+' '}return n}

  ctx.beginPath();ctx.ellipse(0,0,40,16,0,0,6.3);ctx.fill();ctx.beginPath();ctx.moveTo(-30,-4);ctx.lineTo(-96,-10);ctx.lineTo(-100,-26);ctx.lineTo(-108,-26);ctx.lineTo(-104,2);ctx.lineTo(-32,8);ctx.closePath();ctx.fill();

  ctx.fillStyle='#4fd8ff';ctx.beginPath();ctx.ellipse(20,-3,14,8,0,0,6.3);ctx.fill();
  const rw=74*(.35+.65*Math.abs(Math.sin(t*22*spin)));ctx.strokeStyle='rgba(12,16,48,.9)';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-rw,-24);ctx.lineTo(rw,-24);ctx.stroke();
