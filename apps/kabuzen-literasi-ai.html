<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caladea&display=swap">
<style>
:root{color-scheme:light;--ind:#1d0b78;--yel:#ffd60a;--bg:#f5f4fb;--ink:#1b1b2b;--mut:#666;--card:#fff;--line:#e3dff5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
header{background:var(--ind);color:#fff;position:sticky;top:0;z-index:10}
.hb{display:flex;align-items:center;gap:12px;padding:10px 18px;max-width:1150px;margin:auto}
.hb .ttl{font-weight:900;letter-spacing:.5px}.hb .ttl small{display:block;font-weight:500;font-size:11px;color:#cfc8ff;letter-spacing:0}
.hb .logo{margin-left:auto;width:42px;height:42px;border-radius:50%;border:3px solid var(--yel)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1150px;margin:auto}
nav a{color:#e5e0ff;text-decoration:none;padding:6px 12px;border-radius:20px;font-size:13px;white-space:nowrap;font-weight:600}
nav a.on{background:var(--yel);color:var(--ind)}
main{max-width:1150px;margin:auto;padding:22px 18px 60px}
h1{color:var(--ind);font-size:26px;margin:0 0 6px}h2{color:var(--ind);font-size:21px;margin:22px 0 8px}h3{color:var(--ind);margin:18px 0 6px}h4{color:#2b1a9a;margin:16px 0 4px}
.card{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--line);margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mcard{cursor:pointer;transition:.15s;position:relative;overflow:hidden}.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(29,11,120,.12)}
.mcard .rn{font-size:40px;font-weight:900;color:var(--ind);line-height:1}.mcard .done{position:absolute;top:12px;right:12px;background:#2e9e5b;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.mcard .sc{font-size:12px;color:var(--mut)}
.cover{background:radial-gradient(circle at 50% 38%,#3a22b8 0%,#1d0b78 55%,#120650 100%);color:#fff;border-radius:18px;padding:34px 20px 30px;text-align:center;position:relative;overflow:hidden;margin-bottom:14px;min-height:min(86vh,760px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cover .ser{font-size:12px;letter-spacing:5px;color:var(--yel);font-weight:800}
.cover .big{width:min(72vw,340px);height:min(72vw,340px);border-radius:50%;border:8px solid var(--yel);box-shadow:0 0 0 10px rgba(255,214,10,.15),0 18px 50px rgba(0,0,0,.45);margin:18px 0 22px;object-fit:cover;background:#1d0b78}
.cover h1{color:#fff;font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:1px;line-height:1.05;margin:0}
.cover h1 span{color:var(--yel)}
.cover .cs{font-family:Caladea,serif;font-size:clamp(16px,3.4vw,21px);color:#e5e0ff;margin-top:8px}
.cover .bars{width:min(70vw,360px);margin:16px auto}.cover .bars i{display:block;height:6px;border-radius:4px;margin:5px auto}
.cover .au{font-weight:700;margin-top:6px}.cover .au small{display:block;font-weight:400;color:#cfc8ff;font-size:12px}
.cover .go{margin-top:20px;font-size:16px;padding:12px 26px}
.cover .badge{display:inline-block;margin-top:14px;background:var(--yel);color:var(--ind);font-weight:800;font-size:12px;letter-spacing:1px;padding:6px 12px;border-radius:8px}
.hero{background:var(--ind);color:#fff;border-radius:16px;padding:24px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:30px}.hero .s{font-family:Caladea,serif;font-size:18px;color:#e5e0ff}
.hero .stripes i{display:block;height:6px;border-radius:4px;margin:4px 0}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.stat div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px;color:var(--yel)}
.btn{-webkit-appearance:none;appearance:none;background:var(--yel);color:var(--ind);border:0;padding:9px 16px;border-radius:9px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px}
.btn.sec{background:#ece8ff}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ind)}
input,textarea,select{color:#1b1b2b;-webkit-appearance:none;appearance:none;font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid #cfc8ee;border-radius:9px;width:100%;background:#fff}
.lvlbar{display:flex;gap:6px;margin:10px 0}.lvlbar button{border:0;padding:7px 14px;border-radius:20px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;opacity:.45}
.lvlbar button.on{opacity:1}.b1{background:#2e9e5b}.b2{background:#e08a00}.b3{background:#c0392b}
.content p{text-align:left}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;display:block;overflow-x:auto}
table.t th{background:var(--ind);color:#fff;text-align:left;padding:7px 9px}table.t td{border-bottom:1px solid var(--line);padding:7px 9px;vertical-align:top}
table.t tr:nth-child(even) td{background:#f8f7ff}
.cap{font-size:12px;color:var(--mut);font-style:italic;text-align:center}
code{background:#eeebff;color:var(--ind);padding:1px 5px;border-radius:5px;font-size:13px}
.code{font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#14093f;color:#f3f0ff;padding:12px 14px;border-radius:10px;border-left:4px solid var(--yel);font-size:13px}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}.box-t{font-weight:800}.box.info{background:#eef3ff;border-left:5px solid #3a5bd9}.box.warn{background:#fff8d6;border-left:5px solid var(--yel)}
.nest{max-width:420px;margin:10px auto}.nest div{border-radius:50% 50% 20px 20px;padding:18px 16px 8px;text-align:center}.nest span{display:block;font-weight:800;font-size:13px;margin-bottom:6px}
.nest .n1{background:#e9e3ff}.nest .n2{background:#ffdcea}.nest .n3{background:#ffe6d2}.nest .n4{background:#eef7c9}.nest .n5{background:#d9ddff;padding-bottom:16px}
.ladder,.body5,.steps8,.matrix{display:grid;gap:8px;margin:10px 0}
.ladder{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.ladder div{color:#fff;padding:10px;border-radius:9px;font-size:13px}
.ladder div:nth-child(1){background:#2e9e5b}.ladder div:nth-child(2){background:#3a5bd9}.ladder div:nth-child(3){background:#6a3fd1}.ladder div:nth-child(4){background:var(--ind)}
.body5{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.body5 div{background:#f1edff;border-top:4px solid var(--ind);padding:10px;border-radius:9px;font-size:13.5px}
.steps8{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.steps8 div{background:#eef7e8;border-left:5px solid #2e9e5b;padding:9px 11px;border-radius:8px;font-size:13.5px}
.matrix{grid-template-columns:1fr 1fr;text-align:center;font-size:13.5px}.matrix div{padding:14px;border-radius:9px}
.matrix .q1{background:#d8f5d0}.matrix .q2{background:#fff3b0}.matrix .q3{background:#e7f0ff}.matrix .q4{background:#ffd2d2}
.opt{display:block;color:#1b1b2b !important;-webkit-text-fill-color:#1b1b2b;opacity:1;-webkit-user-select:none;user-select:none;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px}
.opt:hover{border-color:var(--ind)}.opt.ok{background:#d8f5d0;border-color:#2e9e5b}.opt.no{background:#ffd2d2;border-color:#c0392b}.opt.lock{cursor:default;pointer-events:none}
.expl{background:#f6f4ff;border-radius:9px;padding:10px 12px;margin-top:6px;font-size:13.5px}
.prog{height:8px;background:#e3dff5;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--yel)}
.flip{perspective:1000px;height:230px;cursor:pointer;max-width:560px;margin:auto}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa,.flip .ba{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.flip .fa{background:var(--ind);color:#fff;font-size:24px;font-weight:800;border:4px solid var(--yel)}
.flip .ba{background:#fff;color:#1b1b2b;border:2px solid var(--ind);transform:rotateY(180deg);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{-webkit-appearance:none;appearance:none;padding:5px 11px;border-radius:16px;background:#ece8ff;cursor:pointer;font-size:13px;font-weight:600;border:0;font-family:inherit;color:var(--ind)}.chip.on{background:var(--ind);color:#fff}
.cmd{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:flex-start}.cmd b{font-family:ui-monospace,Menlo,monospace;color:var(--ind);min-width:150px}
.cmd .use{margin-left:auto;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}.cmd{flex-wrap:wrap}.cmd b{min-width:auto}}
.cert{border:6px double var(--ind);padding:30px;text-align:center;background:#fffdf3;border-radius:12px}
.cert h2{font-size:28px}.cert .nm{font-family:Caladea,serif;font-size:30px;color:var(--ind);border-bottom:2px solid var(--yel);display:inline-block;padding:0 20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ind);color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;display:none;z-index:50}
.muted{color:var(--mut);font-size:13px}
</style></head><body>
