 <div class="bars"><i style="background:#ffd60a;width:100%"></i><i style="background:#ff5f8f;width:78%"></i><i style="background:#35c3ff;width:58%"></i></div>
 <div class="au">Dr. Arif Badrudin, M.Mgt.Stud.<small>Learning Management System pendamping buku · Edisi November 2026</small></div>
 <button class="btn go" onclick="document.getElementById('mulai').scrollIntoView({behavior:'smooth'})">Mulai belajar ↓</button></section>
 <div id="mulai"></div><div class="hero"><div style="font-size:12px;letter-spacing:3px;color:var(--yel);font-weight:700">KEMAJUAN BELAJAR</div>
 <div class="stat"><div><b>${nd}/8</b>Modul selesai</div><div><b>${nq}/8</b>Kuis dikerjakan</div><div><b>${quizAvg()}</b>Rata-rata kuis</div><div><b>${nk}/${D.gloss.length}</b>Istilah hafal</div><div><b>${S.exam==null?'–':S.exam}</b>Ujian akhir</div></div></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-top:0">Selamat datang${S.name?', '+esc(S.name):''}</h3>
 <p class="muted">Isi nama Anda untuk sertifikat. Kemajuan tersimpan di peramban perangkat ini.</p>
 <div style="display:flex;gap:8px;max-width:460px"><input id="nm" placeholder="Nama lengkap" value="${esc(S.name)}"><button class="btn" onclick="S.name=$('#nm').value.trim();save();render();toast('Nama disimpan')">Simpan</button></div>
 <div style="margin-top:12px"><div class="prog"><i style="width:${Math.round((nd+nq)/16*100)}%"></i></div><div class="muted">Kemajuan keseluruhan ${Math.round((nd+nq)/16*100)}%</div></div></div>
 <h2>Alur belajar</h2><div class="grid">
 ${['Baca modul di buku dan ringkasannya di menu Modul (pilih lapis Dasar, Menengah, Lanjut).','Kerjakan kuis 8 soal tiap modul; pembahasan muncul langsung.','Latih istilah di Kartu Hafalan.','Pakai Pustaka Kode dan Lab Prompt saat bekerja.','Kerjakan Ujian Akhir 20 soal acak untuk mendapat sertifikat.'].map((t,i)=>`<div class="card"><b style="color:var(--ind);font-size:22px">${i+1}</b><div>${t}</div></div>`).join('')}
 </div>`;
}
function modulList(){
 return `<h1>Modul</h1><p class="muted">Delapan modul sesuai buku. Klik untuk membaca.</p><div class="grid">`+D.modules.map((m,i)=>`<div class="card mcard" onclick="location.hash='modul-${i+1}'">${S.done[i+1]?'<span class="done">SELESAI</span>':''}<div class="rn">${m.roman}</div><b>${m.title}</b><div class="sc">${m.sub}</div>${S.quiz[i+1]!=null?`<div class="sc" style="margin-top:6px">Kuis: <b>${S.quiz[i+1]}</b></div>`:''}</div>`).join('')+`</div>`;
}
let LV='dasar';
function modul(i){
 const m=D.modules[i-1];if(!m)return modulList();
 return `<a href="#modul" class="muted">← semua modul</a><div class="hero" style="margin-top:8px"><div style="font-size:12px;letter-spacing:4px;color:#cfc8ff">MODUL</div><div style="font-size:56px;font-weight:900;color:var(--yel);line-height:1">${m.roman}</div><h1>${m.title}</h1><div class="s">${m.sub}</div></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-top:0">Tujuan Pembelajaran</h3><ol>${m.tujuan.map(t=>`<li>${t}</li>`).join('')}</ol><div class="muted">Sumber materi: ${m.src}</div></div>
 <div class="lvlbar"><button class="b1 ${LV=='dasar'?'on':''}" onclick="LV='dasar';render()">DASAR</button><button class="b2 ${LV=='menengah'?'on':''}" onclick="LV='menengah';render()">MENENGAH</button><button class="b3 ${LV=='lanjut'?'on':''}" onclick="LV='lanjut';render()">LANJUT</button></div>
 <div class="card content">${m[LV]}</div>
 <div class="card"><h3 style="margin-top:0">Kegiatan Belajar</h3><ol>${m.kegiatan.map(t=>`<li>${t}</li>`).join('')}</ol></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="S.done[${i}]=1;save();toast('Modul ditandai selesai');render()">${S.done[i]?'✓ Sudah selesai':'Tandai selesai'}</button><a class="btn sec" style="text-decoration:none" href="#kuis-${i}">Kerjakan kuis modul ${m.roman}</a>${i<8?`<a class="btn ghost" style="text-decoration:none" href="#modul-${i+1}">Modul berikutnya →</a>`:''}</div>`;
}
let QS={};
function kuisList(){return `<h1>Kuis</h1><p class="muted">8 soal per modul. Nilai tersimpan otomatis.</p><div class="grid">`+D.modules.map((m,i)=>`<div class="card mcard" onclick="location.hash='kuis-${i+1}'"><div class="rn">${m.roman}</div><b>${m.title}</b><div class="sc">${S.quiz[i+1]!=null?'Nilai terakhir: <b>'+S.quiz[i+1]+'</b>':'Belum dikerjakan'}</div></div>`).join('')+`</div>`}
function kuis(i){
 const qs=D.quiz[i];if(!qs)return kuisList();
 if(!QS[i])QS[i]={ans:{}};const st=QS[i];const n=Object.keys(st.ans).length;
 const ok=qs.filter((q,k)=>st.ans[k]===q.a).length;
 let h=`<a href="#kuis" class="muted">← semua kuis</a><h1>Kuis Modul ${D.modules[i-1].roman}</h1><p class="muted">${D.modules[i-1].title}</p><div class="prog"><i style="width:${n/qs.length*100}%"></i></div><p class="muted">${n}/${qs.length} dijawab · benar ${ok}</p>`;
 qs.forEach((q,k)=>{const a=st.ans[k];h+=`<div class="card"><b>${k+1}. ${esc(q.q)}</b>`+q.o.map((o,j)=>`<div role="button" tabindex="0" class="opt ${a!=null?'lock '+(j===q.a?'ok':(j===a?'no':'')):''}" onclick="if(QS[${i}].ans[${k}]==null){QS[${i}].ans[${k}]=${j};chk(${i})}">${'ABCD'[j]}. ${esc(o)}</div>`).join('')+(a!=null?`<div class="expl"><b>${a===q.a?'Benar.':'Belum tepat.'}</b> ${esc(q.e)}</div>`:'')+`</div>`});
 if(n===qs.length)h+=`<div class="card" style="text-align:center"><h2>Nilai: ${Math.round(ok/qs.length*100)}</h2><p>${pred(Math.round(ok/qs.length*100))}</p><button class="btn" onclick="QS[${i}]=null;render()">Ulangi</button> ${i<8?`<a class="btn sec" style="text-decoration:none" href="#modul-${i+1}">Lanjut ke Modul ${D.modules[i].roman}</a>`:`<a class="btn sec" style="text-decoration:none" href="#ujian">Ke Ujian Akhir</a>`}</div>`;
 return h;
}
function chk(i){const st=QS[i],qs=D.quiz[i];if(Object.keys(st.ans).length===qs.length){S.quiz[i]=Math.round(qs.filter((q,k)=>st.ans[k]===q.a).length/qs.length*100);save()}render(true)}
let FC=0,FF=false,FO=null;
function kartu(){
 if(!FO)FO=D.gloss.map((_,i)=>i);const g=D.gloss[FO[FC]];
 return `<h1>Kartu Hafalan</h1><p class="muted">Klik kartu untuk membalik. ${Object.keys(S.known).length}/${D.gloss.length} ditandai hafal.</p>
 <div class="flip ${FF?'f':''}" onclick="FF=!FF;render(true)"><div class="in"><div class="fa">${esc(g.t)}</div><div class="ba">${esc(g.d)}</div></div></div>
 <p style="text-align:center" class="muted">${FC+1} / ${FO.length} ${S.known[g.t]?'· ✓ hafal':''}</p>
 <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" onclick="FC=(FC-1+FO.length)%FO.length;FF=false;render(true)">← Sebelumnya</button>
 <button class="btn" onclick="S.known['${g.t.replace(/'/g,"\\'")}']=1;save();FC=(FC+1)%FO.length;FF=false;render(true)">Sudah hafal ✓</button>
 <button class="btn sec" onclick="FC=(FC+1)%FO.length;FF=false;render(true)">Belum, lanjut →</button>
 <button class="btn ghost" onclick="FO=FO.sort(()=>Math.random()-.5);FC=0;FF=false;render(true)">Acak</button>
 <button class="btn ghost" onclick="FO=D.gloss.map((_,i)=>i).filter(i=>!S.known[D.gloss[i].t]);if(!FO.length){FO=D.gloss.map((_,i)=>i);toast('Semua sudah hafal!')}FC=0;FF=false;render(true)">Hanya yang belum hafal</button></div>
 <h2>Glosarium lengkap</h2><input placeholder="Cari istilah…" oninput="document.querySelectorAll('.gl').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')">
 <div class="card" style="margin-top:10px">${D.gloss.map(g=>`<div class="gl cmd"><b style="font-family:inherit;min-width:220px">${esc(g.t)}</b><span>${esc(g.d)}</span></div>`).join('')}</div>`;
}
let LIB='claude',LG='Semua',LQ='';
function pustaka(){
 const src=LIB==='claude'?D.claude:D.gpt;const groups=['Semua',...src.map(g=>g.g)];let n=0,rows='';
 src.forEach(g=>g.items.forEach(it=>{n++;if((LG==='Semua'||LG===g.g)&&(('/'+it.c+' '+it.d).toLowerCase().includes(LQ.toLowerCase())))rows+=`<div class="cmd"><span class="muted" style="min-width:26px">${n}</span><b>/${esc(it.c)}</b><span>${esc(it.d)}<br><span class="muted">${esc(g.g)}</span></span><button class="btn ghost use" onclick="useCmd('${LIB}','${it.c}')">Pakai di Lab →</button></div>`}));
 return `<h1>Pustaka Kode</h1><div class="box warn"><div class="box-t">Ingat</div>Di chat biasa, kode ini adalah <b>singkatan instruksi</b>, bukan fitur tersembunyi. Hasil terbaik didapat bila dilengkapi konteks (lihat Lab Prompt dan Modul III).</div>
 <div class="chips"><button class="chip ${LIB=='claude'?'on':''}" onclick="LIB='claude';LG='Semua';render(true)">99 Perintah Claude</button><button class="chip ${LIB=='gpt'?'on':''}" onclick="LIB='gpt';LG='Semua';render(true)">99 Kode ChatGPT</button></div>
 <input id="lq" placeholder="Cari kode atau arti… (mis. ringkas, risiko, kode)" value="${esc(LQ)}" oninput="LQ=this.value;render(true);const e=$('#lq');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
 <div class="chips">${groups.map(g=>`<button class="chip ${LG===g?'on':''}" onclick="LG='${g}';render(true)">${g}</button>`).join('')}</div>
 <div class="card">${rows||'<p class="muted">Tidak ada hasil.</p>'}</div>`;
}
let LAB={cmd:'/summarize',desc:'Meringkas teks atau dokumen panjang menjadi ringkasan padat.',peran:'staf ahli yang menyiapkan bahan untuk pimpinan',konteks:'',format:'5 butir utama, masing-masing maksimal 20 kata, lalu 1 rekomendasi',batas:'Jangan menambah informasi di luar bahan. Tulis "tidak disebutkan" bila datanya tidak ada.',bahan:''};
function useCmd(lib,c){const src=lib==='claude'?D.claude:D.gpt;for(const g of src)for(const it of g.items)if(it.c===c){LAB.cmd='/'+c;LAB.desc=it.d}location.hash='lab'}
function labPrompt(){return `Bertindaklah sebagai ${LAB.peran||'[peran]'}.

Tugas: ${LAB.cmd} — ${LAB.desc.replace(/\.$/,'')}.

Konteks: ${LAB.konteks||'[untuk siapa, latar belakang, tujuan]'}

Format keluaran: ${LAB.format||'[bentuk dan panjang]'}

Batasan: ${LAB.batas||'[yang tidak boleh dilakukan]'}
${LAB.bahan?'\nBahan:\n<<<\n'+LAB.bahan+'\n>>>':''}`}
function lab(){
 const all=[];D.claude.forEach(g=>g.items.forEach(it=>all.push(['/'+it.c,it.d,'Claude · '+g.g])));D.gpt.forEach(g=>g.items.forEach(it=>all.push(['/'+it.c,it.d,'ChatGPT · '+g.g])));
 return `<h1>Lab Prompt PTKFB</h1><p class="muted">Ubah satu kode singkat menjadi prompt lengkap: <b>P</b>eran, <b>T</b>ugas, <b>K</b>onteks, <b>F</b>ormat, <b>B</b>atasan.</p>
 <div class="row"><div class="card">
 <label><b>Tugas (kode)</b></label><select onchange="const v=this.value.split('||');LAB.cmd=v[0];LAB.desc=v[1];render(true)">${all.map(a=>`<option value="${esc(a[0]+'||'+a[1])}" ${a[0]===LAB.cmd&&a[1]===LAB.desc?'selected':''}>${esc(a[0])} — ${esc(a[2])}</option>`).join('')}</select>
 <p class="muted">${esc(LAB.desc)}</p>
 <label><b>Peran</b></label><input value="${esc(LAB.peran)}" oninput="LAB.peran=this.value;upd()">
 <label><b>Konteks</b></label><textarea rows="2" oninput="LAB.konteks=this.value;upd()" placeholder="mis. Pembaca: Kepala Dinas, rapat 10 menit lagi">${esc(LAB.konteks)}</textarea>
 <label><b>Format</b></label><input value="${esc(LAB.format)}" oninput="LAB.format=this.value;upd()">
 <label><b>Batasan</b></label><textarea rows="2" oninput="LAB.batas=this.value;upd()">${esc(LAB.batas)}</textarea>
 <label><b>Bahan (opsional)</b></label><textarea rows="3" oninput="LAB.bahan=this.value;upd()" placeholder="Tempel teks di sini, atau lampirkan berkas langsung di asisten AI">${esc(LAB.bahan)}</textarea>
 </div><div class="card"><b>Prompt jadi</b><div class="code" id="pout" style="margin-top:8px">${esc(labPrompt())}</div>
 <button class="btn" onclick="cp()">Salin prompt</button> <span class="muted">lalu tempel di Claude atau asisten AI lain.</span>
 <textarea id="cpta" style="position:absolute;left:-9999px"></textarea>
 <div class="box info" style="margin-top:14px"><div class="box-t">Tips</div>Rangkai beberapa kode untuk proses berpikir: /research → /gaps → /proscons → /PUSHBACK → /brief → /FINALCHECK. Jika prompt ini sering dipakai, simpan sebagai <b>skill</b> (Modul III, lapis Lanjut).</div></div></div>`;
}
function upd(){const e=$('#pout');if(e)e.textContent=labPrompt()}
function cp(){const t=labPrompt();const done=()=>toast('Prompt disalin');try{navigator.clipboard.writeText(t).then(done).catch(fb)}catch(e){fb()}
 function fb(){const a=$('#cpta');a.value=t;a.select();try{document.execCommand('copy');done()}catch(e){toast('Pilih teks lalu salin manual')}}}
let EX=null;
function ujian(){
 if(!EX){return `<h1>Ujian Akhir</h1><div class="card"><p>20 soal acak dari seluruh modul. Pembahasan ditampilkan setelah selesai. Nilai ≥ 70 mendapat sertifikat penyelesaian.</p>${S.exam!=null?`<p>Nilai terakhir: <b>${S.exam}</b> (${pred(S.exam)})</p>`:''}<button class="btn" onclick="startEx()">Mulai ujian</button> ${S.exam>=70?`<button class="btn sec" onclick="EX={cert:1};render()">Lihat sertifikat</button>`:''}</div>`}
 if(EX.cert)return cert();
 const n=Object.keys(EX.ans).length;
 if(!EX.fin){const k=EX.i,q=EX.q[k];return `<h1>Ujian Akhir</h1><div class="prog"><i style="width:${n/20*100}%"></i></div><p class="muted">Soal ${k+1} dari 20 · Modul ${D.modules[q.m-1].roman}</p><div class="card"><b>${esc(q.q)}</b>${q.o.map((o,j)=>`<div role="button" tabindex="0" class="opt" onclick="EX.ans[${k}]=${j};EX.i++;if(EX.i>=20){EX.fin=1;fin()}render(true)">${'ABCD'[j]}. ${esc(o)}</div>`).join('')}</div>`}
 const ok=EX.q.filter((q,k)=>EX.ans[k]===q.a).length,sc=ok*5;
 return `<h1>Hasil Ujian Akhir</h1><div class="card" style="text-align:center"><h2>${sc}</h2><p>${pred(sc)} · benar ${ok} dari 20</p>${sc>=70?`<button class="btn" onclick="EX={cert:1};render()">Lihat sertifikat</button>`:''} <button class="btn sec" onclick="startEx()">Ulangi</button></div>`+
 EX.q.map((q,k)=>`<div class="card"><b>${k+1}. ${esc(q.q)}</b><div class="expl"><b>${EX.ans[k]===q.a?'Benar':'Salah'}</b> · Jawaban: ${'ABCD'[q.a]}. ${esc(q.o[q.a])}<br>${esc(q.e)}</div></div>`).join('');
}
function startEx(){const pool=[];Object.entries(D.quiz).forEach(([m,qs])=>qs.forEach(q=>pool.push(Object.assign({m:+m},q))));pool.sort(()=>Math.random()-.5);EX={q:pool.slice(0,20),ans:{},i:0};render()}
function fin(){S.exam=EX.q.filter((q,k)=>EX.ans[k]===q.a).length*5;save()}
