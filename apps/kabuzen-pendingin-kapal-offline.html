3\">Kompresor sering start-stop (<i>short cycling<\/i>)<\/td><td>Selisih setelan <i>cut-in<\/i> dan <i>cut-out<\/i> terlalu sempit<\/td><td>Setel ulang oleh personel berwenang<\/td><\/tr>\n<tr><td>Katup solenoid atau katup tekan kompresor bocor<\/td><td>Perbaiki/ganti katup<\/td><\/tr>\n<tr><td>Isi refrigeran kurang<\/td><td>Cari bocor, isi ulang<\/td><\/tr>\n<tr><td rowspan=\"2\">Kompresor jalan terus tanpa berhenti<\/td><td>Refrigeran yang sampai ke evaporator kurang; isi kurang<\/td><td>Periksa TEV, saringan, isi<\/td><\/tr>\n<tr><td>Beban panas berlebih; pengaman LP tidak bekerja<\/td><td>Kurangi beban; uji pengaman<\/td><\/tr>\n<tr><td rowspan=\"3\">Bunyi ketukan atau bunyi tidak wajar<\/td><td>Cairan refrigeran terisap kompresor<\/td><td>Periksa TEV dan letak bulb; hentikan bila ketukan keras<\/td><\/tr>\n<tr><td>Tekanan oli rendah<\/td><td>Periksa oli dan pompa oli<\/td><\/tr>\n<tr><td>Baut fondasi kendur, kopling tidak lurus, sabuk kendur<\/td><td>Kencangkan, luruskan, setel<\/td><\/tr>\n<tr><td rowspan=\"2\">Suhu gas tekan terlalu tinggi<\/td><td>Isi kurang sehingga uap isap terlalu panas<\/td><td>Cari bocor, isi ulang, periksa TEV<\/td><\/tr>\n<tr><td>Katup tekan kompresor bocor; tekanan tekan tinggi<\/td><td>Perbaiki katup; lihat gejala tekanan tekan tinggi<\/td><\/tr>\n<tr><td rowspan=\"2\">Evaporator tertutup es tebal<\/td><td>Defrost tidak bekerja (pengatur waktu, pemanas)<\/td><td>Periksa rangkaian defrost<\/td><\/tr>\n<tr><td>Pintu sering terbuka, paking pintu rusak<\/td><td>Tertibkan pemakaian pintu; ganti paking<\/td><\/tr>\n<tr><td rowspan=\"3\">Level oli karter terus turun<\/td><td>Saluran balik oli dari pemisah oli tersumbat<\/td><td>Bersihkan saluran dan saringannya<\/td><\/tr>\n<tr><td>Oli berbusa karena cairan refrigeran masuk karter<\/td><td>Hilangkan sebab cairan terisap<\/td><\/tr>\n<tr><td>Perapat poros bocor (ada noda oli)<\/td><td>Ganti perapat poros<\/td><\/tr>\n<tr><td>Kaca duga bergelembung terus<\/td><td>Isi kurang, atau drier di depannya tersumbat<\/td><td>Periksa level receiver dan beda suhu pada drier<\/td><\/tr>\n<tr><td>Penunjuk kelembapan berubah warna<\/td><td>Ada uap air di dalam sistem<\/td><td>Ganti elemen drier; cari jalan masuk uap air<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box term\"><b>Istilah<\/b><br><i>Purging<\/i> = membuang udara/gas tak terembunkan dari kondensor. <i>Short cycling<\/i> = hidup-mati terlalu sering. <i>Cut-in<\/i> / <i>cut-out<\/i> = tekanan saat saklar menyambung / memutus. <i>Defrost<\/i> = pencairan es di evaporator.<\/div>"},{"id":"s5-4","judul":"Bagan alir gangguan utama","html":"<p>Empat bagan berikut menuntun pemeriksaan dari yang paling mudah. Baca dari atas. Bila jawaban \"Ya\", kerjakan tindakan di kanan lalu amati hasilnya. Bila \"Tidak\", turun ke pertanyaan berikutnya.<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 648.0\" width=\"100%\"><rect x=\"4\" y=\"8\" width=\"336\" height=\"52\" rx=\"26.0\" fill=\"#1d0b78\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\"><tspan x=\"172.0\" y=\"31.0\">GEJALA: tekanan tekan (discharge) terlalu tinggi /<\/tspan><tspan x=\"172.0\" y=\"44.7\">pengaman HP memutus<\/tspan><\/text><polyline points=\"172.0,60.0 172.0,82.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,82.0 169.0,75.7 175.0,75.7\" fill=\"#333\"/><polygon points=\"172,82.0 330.0,134.0 172,186.0 14.0,134.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"123.7\">Aliran air laut ke kondensor<\/tspan><tspan x=\"172.0\" y=\"138.0\">kurang? (pompa, katup,<\/tspan><tspan x=\"172.0\" y=\"152.3\">saringan)<\/tspan><\/text><polyline points=\"330.0,134.0 378.0,134.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,134.0 371.7,137.0 371.7,131.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"130.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"90.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"124.3\">Pulihkan aliran: buka katup yang benar,<\/tspan><tspan x=\"506.0\" y=\"137.8\">bersihkan saringan, jalankan pompa<\/tspan><tspan x=\"506.0\" y=\"151.2\">cadangan.<\/tspan><\/text><polyline points=\"172.0,186.0 172.0,206.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,206.0 169.0,199.7 175.0,199.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"199.5\">Tidak<\/tspan><\/text><polygon points=\"172,206.0 330.0,258.0 172,310.0 14.0,258.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"254.9\">Aliran cukup, tetapi pipa<\/tspan><tspan x=\"172.0\" y=\"269.2\">kondensor kotor atau berkerak?<\/tspan><\/text><polyline points=\"330.0,258.0 378.0,258.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,258.0 371.7,261.0 371.7,255.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"254.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"214.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"255.0\">Rencanakan pembersihan pipa kondensor<\/tspan><tspan x=\"506.0\" y=\"268.5\">sesuai manual; periksa anoda seng.<\/tspan><\/text><polyline points=\"172.0,310.0 172.0,330.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,330.0 169.0,323.7 175.0,323.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"323.5\">Tidak<\/tspan><\/text><polygon points=\"172,330.0 330.0,382.0 172,434.0 14.0,382.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"371.7\">Saat berhenti &amp; dingin, tekanan<\/tspan><tspan x=\"172.0\" y=\"386.0\">lebih tinggi daripada tabel<\/tspan><tspan x=\"172.0\" y=\"400.3\">jenuh refrigeran?<\/tspan><\/text><polyline points=\"330.0,382.0 378.0,382.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,382.0 371.7,385.0 371.7,379.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"378.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"338.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"372.3\">Ada udara/gas tak terembunkan. Buang<\/tspan><tspan x=\"506.0\" y=\"385.8\">(purging) hanya dengan prosedur manual<\/tspan><tspan x=\"506.0\" y=\"399.2\">dan izin KKM.<\/tspan><\/text><polyline points=\"172.0,434.0 172.0,454.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,454.0 169.0,447.7 175.0,447.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"447.5\">Tidak<\/tspan><\/text><polygon points=\"172,454.0 330.0,506.0 172,558.0 14.0,506.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"502.9\">Level cairan di receiver<\/tspan><tspan x=\"172.0\" y=\"517.2\">terlalu tinggi?<\/tspan><\/text><polyline points=\"330.0,506.0 378.0,506.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,506.0 371.7,509.0 371.7,503.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"502.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"462.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"496.3\">Isi refrigeran berlebih. Kurangi dengan<\/tspan><tspan x=\"506.0\" y=\"509.8\">menampung ke tabung (recovery), jangan<\/tspan><tspan x=\"506.0\" y=\"523.2\">dibuang ke udara.<\/tspan><\/text><polyline points=\"172.0,558.0 172.0,580.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,580.0 169.0,573.7 175.0,573.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"572.5\">Tidak<\/tspan><\/text><rect x=\"6\" y=\"580.0\" width=\"628\" height=\"60\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"607.0\">Periksa katup tekan/katup kondensor yang tertutup sebagian dan ketepatan manometer. Bila belum<\/tspan><tspan x=\"320.0\" y=\"620.5\">ketemu: hentikan unit, laporkan ke KKM.<\/tspan><\/text><\/svg><figcaption><b>Gambar 5.3<\/b> Bagan alir: tekanan tekan terlalu tinggi<\/figcaption><\/figure>\n<h3><span class=\"lv m\">MENENGAH<\/span> Cara membuktikan adanya udara<\/h3>\n<p>Hentikan kompresor dan biarkan air laut tetap mengalir di kondensor sampai suhu kondensor sama dengan suhu air. Baca tekanan kondensor, lalu cari tekanan jenuh refrigeran pada suhu air itu di tabel jenuh. Bila tekanan yang terbaca jelas lebih tinggi daripada angka tabel, ada udara atau gas lain yang tidak dapat mengembun [4][13].<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 772.0\" width=\"100%\"><rect x=\"4\" y=\"8\" width=\"336\" height=\"52\" rx=\"26.0\" fill=\"#1d0b78\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\"><tspan x=\"172.0\" y=\"31.0\">GEJALA: tekanan isap (suction) terlalu rendah /<\/tspan><tspan x=\"172.0\" y=\"44.7\">pengaman LP memutus<\/tspan><\/text><polyline points=\"172.0,60.0 172.0,82.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,82.0 169.0,75.7 175.0,75.7\" fill=\"#333\"/><polygon points=\"172,82.0 330.0,134.0 172,186.0 14.0,134.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"130.9\">Kaca duga bergelembung terus<\/tspan><tspan x=\"172.0\" y=\"145.2\">dan level receiver rendah?<\/tspan><\/text><polyline points=\"330.0,134.0 378.0,134.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,134.0 371.7,137.0 371.7,131.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"130.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"90.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"131.0\">Kurang refrigeran. Cari kebocoran dulu,<\/tspan><tspan x=\"506.0\" y=\"144.5\">perbaiki, baru isi ulang sesuai manual.<\/tspan><\/text><polyline points=\"172.0,186.0 172.0,206.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,206.0 169.0,199.7 175.0,199.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"199.5\">Tidak<\/tspan><\/text><polygon points=\"172,206.0 330.0,258.0 172,310.0 14.0,258.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"247.7\">Saringan pengering (filter-<\/tspan><tspan x=\"172.0\" y=\"262.0\">drier) dingin/berembun di sisi<\/tspan><tspan x=\"172.0\" y=\"276.3\">keluarnya?<\/tspan><\/text><polyline points=\"330.0,258.0 378.0,258.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,258.0 371.7,261.0 371.7,255.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"254.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"214.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"255.0\">Drier tersumbat. Ganti isi/elemen drier<\/tspan><tspan x=\"506.0\" y=\"268.5\">sesuai prosedur.<\/tspan><\/text><polyline points=\"172.0,310.0 172.0,330.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,330.0 169.0,323.7 175.0,323.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"323.5\">Tidak<\/tspan><\/text><polygon points=\"172,330.0 330.0,382.0 172,434.0 14.0,382.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"378.9\">Katup solenoid tidak membuka<\/tspan><tspan x=\"172.0\" y=\"393.2\">padahal ruangan masih hangat?<\/tspan><\/text><polyline points=\"330.0,382.0 378.0,382.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,382.0 371.7,385.0 371.7,379.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"378.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"338.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"379.0\">Periksa termostat, kumparan (coil) dan<\/tspan><tspan x=\"506.0\" y=\"392.5\">sekring rangkaian kontrol.<\/tspan><\/text><polyline points=\"172.0,434.0 172.0,454.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,454.0 169.0,447.7 175.0,447.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"447.5\">Tidak<\/tspan><\/text><polygon points=\"172,454.0 330.0,506.0 172,558.0 14.0,506.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"495.7\">Katup ekspansi (TEV) macet,<\/tspan><tspan x=\"172.0\" y=\"510.0\">tersumbat es, atau bulb<\/tspan><tspan x=\"172.0\" y=\"524.3\">rusak/lepas?<\/tspan><\/text><polyline points=\"330.0,506.0 378.0,506.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,506.0 371.7,509.0 371.7,503.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"502.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"462.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"503.0\">Bersihkan saringan TEV; bila tersumbat<\/tspan><tspan x=\"506.0\" y=\"516.5\">es ganti drier; pasang ulang/ganti bulb.<\/tspan><\/text><polyline points=\"172.0,558.0 172.0,578.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,578.0 169.0,571.7 175.0,571.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"571.5\">Tidak<\/tspan><\/text><polygon points=\"172,578.0 330.0,630.0 172,682.0 14.0,630.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"619.7\">Evaporator tertutup es tebal<\/tspan><tspan x=\"172.0\" y=\"634.0\">atau aliran udara/air dingin<\/tspan><tspan x=\"172.0\" y=\"648.3\">kurang?<\/tspan><\/text><polyline points=\"330.0,630.0 378.0,630.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,630.0 371.7,633.0 371.7,627.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"626.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"586.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"620.3\">Jalankan defrost; bersihkan filter<\/tspan><tspan x=\"506.0\" y=\"633.8\">udara; periksa kipas atau pompa air<\/tspan><tspan x=\"506.0\" y=\"647.2\">dingin.<\/tspan><\/text><polyline points=\"172.0,682.0 172.0,704.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,704.0 169.0,697.7 175.0,697.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"696.5\">Tidak<\/tspan><\/text><rect x=\"6\" y=\"704.0\" width=\"628\" height=\"60\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"731.0\">Periksa katup isap yang tertutup sebagian dan setelan pengaman LP. Bila belum ketemu: laporkan<\/tspan><tspan x=\"320.0\" y=\"744.5\">ke KKM.<\/tspan><\/text><\/svg><figcaption><b>Gambar 5.4<\/b> Bagan alir: tekanan isap terlalu rendah<\/figcaption><\/figure>\n<h3><span class=\"lv m\">MENENGAH<\/span> Mencari kebocoran refrigeran<\/h3>\n<ul>\n<li>Noda oli pada sambungan, flens atau perapat poros adalah petunjuk pertama: oli ikut keluar bersama refrigeran.<\/li>\n<li>Oleskan larutan sabun pada sambungan yang dicurigai dan amati gelembung, atau gunakan alat pendeteksi bocor elektronik bila tersedia.<\/li>\n<li>Periksa juga sisi air kondensor dan pendingin air: pipa yang bocor di dalamnya tidak terlihat dari luar.<\/li>\n<li>Setelah bocor diperbaiki, barulah refrigeran ditambah. Pengisian dilakukan personel berwenang menurut manual; rujukan [6] menjelaskan prinsip umumnya.<\/li>\n<\/ul>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 772.0\" width=\"100%\"><rect x=\"4\" y=\"8\" width=\"336\" height=\"52\" rx=\"26.0\" fill=\"#1d0b78\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\"><tspan x=\"172.0\" y=\"37.9\">GEJALA: kompresor tidak mau jalan (start)<\/tspan><\/text><polyline points=\"172.0,60.0 172.0,82.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,82.0 169.0,75.7 175.0,75.7\" fill=\"#333\"/><polygon points=\"172,82.0 330.0,134.0 172,186.0 14.0,134.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"123.7\">Tidak ada tegangan?<\/tspan><tspan x=\"172.0\" y=\"138.0\">(pemutus/MCB terbuka, sekring<\/tspan><tspan x=\"172.0\" y=\"152.3\">putus)<\/tspan><\/text><polyline points=\"330.0,134.0 378.0,134.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,134.0 371.7,137.0 371.7,131.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"130.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"90.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"124.3\">Cari sebab pemutus terbuka sebelum<\/tspan><tspan x=\"506.0\" y=\"137.8\">menutupnya kembali; ganti sekring dengan<\/tspan><tspan x=\"506.0\" y=\"151.2\">nilai yang sama.<\/tspan><\/text><polyline points=\"172.0,186.0 172.0,206.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,206.0 169.0,199.7 175.0,199.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"199.5\">Tidak<\/tspan><\/text><polygon points=\"172,206.0 330.0,258.0 172,310.0 14.0,258.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" " y=\"392.5\">ikuti bagan Gambar 5.4.<\/tspan><\/text><polyline points=\"172.0,434.0 172.0,454.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,454.0 169.0,447.7 175.0,447.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"447.5\">Tidak<\/tspan><\/text><polygon points=\"172,454.0 330.0,506.0 172,558.0 14.0,506.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"510.0\">Tekanan tekan tinggi?<\/tspan><\/text><polyline points=\"330.0,506.0 378.0,506.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,506.0 371.7,509.0 371.7,503.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"502.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"462.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"503.0\">Kondensor tidak membuang panas dengan<\/tspan><tspan x=\"506.0\" y=\"516.5\">baik: ikuti bagan Gambar 5.3.<\/tspan><\/text><polyline points=\"172.0,558.0 172.0,578.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,578.0 169.0,571.7 175.0,571.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"571.5\">Tidak<\/tspan><\/text><polygon points=\"172,578.0 330.0,630.0 172,682.0 14.0,630.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"626.9\">Tekanan isap tinggi tetapi<\/tspan><tspan x=\"172.0\" y=\"641.2\">tekanan tekan rendah?<\/tspan><\/text><polyline points=\"330.0,630.0 378.0,630.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,630.0 371.7,633.0 371.7,627.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"626.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"586.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"620.3\">Kompresor tidak memompa penuh<\/tspan><tspan x=\"506.0\" y=\"633.8\">(katup/ring, pengatur kapasitas).<\/tspan><tspan x=\"506.0\" y=\"647.2\">Laporkan untuk pemeriksaan.<\/tspan><\/text><polyline points=\"172.0,682.0 172.0,704.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,704.0 169.0,697.7 175.0,697.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"696.5\">Tidak<\/tspan><\/text><rect x=\"6\" y=\"704.0\" width=\"628\" height=\"60\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"731.0\">Bandingkan termometer ruangan dengan termometer pembanding; periksa letak peraba termostat.<\/tspan><tspan x=\"320.0\" y=\"744.5\">Laporkan ke KKM.<\/tspan><\/text><\/svg><figcaption><b>Gambar 5.6<\/b> Bagan alir: suhu ruangan atau air dingin tidak tercapai<\/figcaption><\/figure>\n\n<h3><span class=\"lv l\">LANJUT<\/span> Gangguan di sisi air dingin dan udara<\/h3>\n<p>Pada sistem AC dengan air dingin, mesin pendingin bisa sehat tetapi ruangan tetap panas. Periksa sisi penyalurnya:<\/p>\n<ul>\n<li><b>Udara terperangkap<\/b> di pipa air dingin membuat aliran ke unit ruangan terhenti. Buang lewat keran pembuang udara di titik tertinggi.<\/li>\n<li><b>Saringan udara kotor<\/b> dan sirip koil tertutup debu mengurangi aliran udara; ini penyebab paling sering \"AC kurang dingin\" di satu ruangan saja.<\/li>\n<li><b>Saringan air dingin tersumbat<\/b> atau katup pengatur tertutup sebagian.<\/li>\n<li><b>Saluran pembuang air embun tersumbat<\/b> sehingga air menetes atau menggenang di ruangan.<\/li>\n<li><b>Beda suhu air dingin pergi–kembali<\/b> sangat kecil berarti panas tidak terambil di ruangan (aliran udara kurang); sangat besar berarti aliran air kurang.<\/li>\n<\/ul>\n<div class=\"box key\"><b>Satu ruangan atau semua ruangan?<\/b> Bila hanya satu ruangan yang panas, cari di ruangan itu (saringan, kipas, katup, udara terperangkap). Bila semua ruangan panas, cari di mesin pendingin atau pompa air dingin.<\/div>"},{"id":"s5-5","judul":"Kasus latihan","html":"<div class=\"box case\"><b>Kasus A.<\/b> Saat kapal berlabuh di perairan dangkal, unit AC berhenti dan lampu pengaman HP menyala. Jurnal menunjukkan tekanan tekan naik perlahan selama dua jam terakhir; suhu air laut keluar kondensor juga naik.<br><b>Telusuri:<\/b> Gambar 5.3, pertanyaan pertama. Tekanan tekan naik bersama suhu air keluar menunjuk pada aliran air laut yang berkurang. Periksa saringan air laut: perairan dangkal membawa lumpur dan sampah. Jangan mereset pengaman sebelum aliran pulih.<\/div>\n<div class=\"box case\"><b>Kasus B.<\/b> Kamar daging makin hangat. Kompresor jalan terus, tekanan isap rendah, kaca duga bergelembung, dan ada noda oli di salah satu sambungan pipa cair.<br><b>Telusuri:<\/b> Gambar 5.4, pertanyaan pertama. Gelembung dan noda oli menunjuk pada kebocoran. Tandai sambungan itu, laporkan, uji dengan larutan sabun. Menambah refrigeran tanpa memperbaiki sambungan hanya membuang refrigeran.<\/div>\n<div class=\"box case\"><b>Kasus C.<\/b> Kamar sayur dingin di pagi hari, tetapi siang hari tekanan isap turun tiba-tiba lalu pulih sendiri setelah unit berhenti beberapa lama. Penunjuk kelembapan pada kaca duga berubah warna.<br><b>Telusuri:<\/b> Gambar 5.4, pertanyaan keempat. Gangguan yang hilang-timbul disertai tanda kelembapan menunjuk pada uap air yang membeku di TEV, lalu mencair saat unit berhenti. Tindakannya mengganti elemen drier dan mencari dari mana uap air masuk.<\/div>"},{"id":"s5-6","judul":"Kegiatan","html":"<div class=\"box act\"><b>Kegiatan 3.1 — Latihan menelusuri<\/b>\n<ol>\n<li>Tutup kolom \"Telusuri\" pada tiga kasus di atas. Jelaskan langkah Anda kepada rekan memakai bagan alir.<\/li>\n<li>Tanyakan kepada senior satu gangguan mesin pendingin yang pernah terjadi di kapal. Tulis di lembar catatan gangguan buku (Lampiran C): gejala, sebab, tindakan.<\/li>\n<li>Cari di manual kapal bagian <i>fault finding<\/i> atau <i>trouble shooting<\/i> mesin pendingin. Catat nomor halamannya di lembar data kapal di buku (Lampiran A).<\/li>\n<\/ol><\/div>"}]},{"n":4,"judul":"Cara Kerja Sistem Pendingin Mesin Penggerak","lead":"Air tawar menjaga mesin, air laut menjaga air tawar. Dua rangkaian yang tidak pernah bercampur.","bagian":[{"id":"s6-1","judul":"Uraian materi","html":"<div class=\"box goal\"><b>Tujuan modul<\/b><br>Setelah modul ini Anda dapat (1) menjelaskan mengapa mesin didinginkan dengan air tawar, (2) menelusuri rangkaian air tawar dan air laut, (3) menyebut fungsi tiap komponen, dan (4) menyebut parameter yang diamati saat jaga.<\/div>\n\n\n<h3><span class=\"lv d\">DASAR<\/span> Mengapa mesin perlu didinginkan, dan mengapa dengan air tawar<\/h3>\n<p>Hanya sebagian energi bahan bakar yang menjadi tenaga pada poros. Sisanya menjadi panas, dan sebagian panas itu masuk ke dinding silinder, kepala silinder dan oli pelumas. Tanpa pendinginan, logam memuai berlebihan, lapisan oli rusak, dan pada keadaan parah torak macet di dalam silinder [16].<\/p>\n<p>Walau air laut tersedia tanpa batas, bagian mesin yang panas tidak didinginkan langsung dengan air laut. Garam akan mengendap sebagai kerak di permukaan panas dan air laut sangat merusak logam. Karena itu mesin didinginkan dengan <b>air tawar dalam rangkaian tertutup<\/b>, dan air tawar itulah yang kemudian didinginkan oleh air laut di dalam penukar kalor [9][10][16].<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 350\" width=\"100%\"><rect x=\"1\" y=\"250\" width=\"638\" height=\"76\" fill=\"#dff0fb\"/><text x=\"12.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"700\"><tspan x=\"12.0\" y=\"319.5\">LAUT<\/tspan><\/text><rect x=\"20\" y=\"196\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"59.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"59.0\" y=\"213.4\">Kotak laut<\/tspan><tspan x=\"59.0\" y=\"225.1\">(sea chest)<\/tspan><\/text><rect x=\"118\" y=\"196\" width=\"70\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"153.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"153.0\" y=\"213.4\">Saringan air<\/tspan><tspan x=\"153.0\" y=\"225.1\">laut<\/tspan><\/text><circle cx=\"228\" cy=\"216\" r=\"20\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"2\"/><text x=\"228.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.36\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"228.0\" y=\"213.7\">Pompa<\/tspan><tspan x=\"228.0\" y=\"224.2\">air laut<\/tspan><\/text><polyline points=\"59.0,262.0 59.0,236.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"59.0,236.0 62.0,242.3 56.0,242.3\" fill=\"#1479c9\"/><polyline points=\"98.0,216.0 118.0,216.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"118.0,216.0 111.7,219.0 111.7,213.0\" fill=\"#1479c9\"/><polyline points=\"188.0,216.0 208.0,216.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"208.0,216.0 201.7,219.0 201.7,213.0\" fill=\"#1479c9\"/><rect x=\"290\" y=\"180\" width=\"130\" height=\"72\" rx=\"6\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"355.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"355.0\" y=\"213.2\">PENUKAR KALOR (cooler)<\/tspan><tspan x=\"355.0\" y=\"225.9\">air tawar<\/tspan><\/text><polyline points=\"248.0,216.0 290.0,216.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"290.0,216.0 283.7,219.0 283.7,213.0\" fill=\"#1479c9\"/><polyline points=\"420.0,216.0 470.0,216.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"470.0,216.0 463.7,219.0 463.7,213.0\" fill=\"#f08a24\"/><rect x=\"470\" y=\"196\" width=\"80\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#f08a24\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><text x=\"510.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"510.0\" y=\"219.3\">Pendingin lain*<\/tspan><\/text><polyline points=\"550.0,216.0 600.0,216.0 600.0,266.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"600.0,266.0 597.0,259.7 603.0,259.7\" fill=\"#f08a24\"/><text x=\"590.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"end\" fill=\"#b55d00\" font-weight=\"400\"><tspan x=\"590.0\" y=\"293.3\">buang ke laut<\/tspan><\/text><text x=\"20.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.46\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"700\"><tspan x=\"20.0\" y=\"185.3\">AIR LAUT (rangkaian terbuka)<\/tspan><\/text><rect x=\"40\" y=\"40\" width=\"150\" height=\"78\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"2\"/><text x=\"115.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"115.0\" y=\"69.9\">MESIN DIESEL<\/tspan><tspan x=\"115.0\" y=\"82.5\">jaket silinder &amp; kepala<\/tspan><tspan x=\"115.0\" y=\"95.2\">silinder<\/tspan><\/text><polyline points=\"190.0,60.0 300.0,60.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polygon points=\"300.0,60.0 293.7,63.0 293.7,57.0\" fill=\"#d9432f\"/><polygon points=\"300,46 300,74 318,60\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.8\"/><polygon points=\"336,46 336,74 318,60\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.8\"/><polygon points=\"304,82 332,82 318,60\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.8\"/><text x=\"318.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"700\"><tspan x=\"318.0\" y=\"35.4\">Katup termostatik 3 jalan<\/tspan><\/text><polyline points=\"336.0,60.0 390.0,60.0 390.0,180.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polygon points=\"390.0,180.0 387.0,173.7 393.0,173.7\" fill=\"#d9432f\"/><text x=\"398.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"start\" fill=\"#d9432f\" font-weight=\"400\"><tspan x=\"398.0\" y=\"117.4\">ke cooler<\/tspan><tspan x=\"398.0\" y=\"129.1\">(saat panas)<\/tspan><\/text><polyline points=\"318.0,82.0 318.0,140.0 260.0,140.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-dasharray=\"6 4\"/><polygon points=\"260.0,140.0 266.3,137.0 266.3,143.0\" fill=\"#f08a24\"/><text x=\"312.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"end\" fill=\"#b55d00\" font-weight=\"400\"><tspan x=\"312.0\" y=\"105.4\">bypass<\/tspan><tspan x=\"312.0\" y=\"117.1\">(saat dingin)<\/tspan><\/text><polyline points=\"320.0,180.0 320.0,160.0 260.0,160.0 260.0,150.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><circle cx=\"240\" cy=\"140\" r=\"20\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"240.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.14\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"240.0\" y=\"137.8\">Pompa<\/tspan><tspan x=\"240.0\" y=\"147.9\">air tawar<\/tspan><\/text><polyline points=\"220.0,140.0 115.0,140.0 115.0,118.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polygon points=\"115.0,118.0 118.0,124.3 112.0,124.3\" fill=\"#1479c9\"/><rect x=\"470\" y=\"30\" width=\"110\" height=\"46\" rx=\"6\" fill=\"#eef1fb\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"525.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"525.0\" y=\"56.5\">Tangki ekspansi<\/tspan><\/text><polyline points=\"470.0,66.0 430.0,100.0 262.0,128.0\" fill=\"none\" stroke=\"#777\" stroke-width=\"1.2\" stroke-linejoin=\"round\" stroke-dasharray=\"3 3\"/><polygon points=\"262.0,128.0 267.7,124.0 268.7,130.0\" fill=\"#777\"/><text x=\"586.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#555\" font-weight=\"400\"><tspan x=\"586.0\" y=\"93.6\">menjaga sistem<\/tspan><tspan x=\"586.0\" y=\"104.6\">tetap penuh<\/tspan><\/text><text x=\"116.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#d9432f\" font-weight=\"700\"><tspan x=\"116.0\" y=\"19.4\">AIR TAWAR (rangkaian tertutup)<\/tspan><\/text><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.02\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"320.0\" y=\"343.2\">* misalnya pendingin oli pelumas, pendingin udara bilas, pendingin oli roda gigi. Susunan sebenarnya: lihat manual kapal.<\/tspan><\/text><\/svg><figcaption><b>Gambar 6.1<\/b> Skema umum sistem pendingin mesin diesel: rangkaian air tawar tertutup dan rangkaian air laut terbuka<\/figcaption><\/figure>\n\n<h3><span class=\"lv d\">DASAR<\/span> Perjalanan air tawar<\/h3>\n<p>Ikuti Gambar 6.1. Pompa air tawar mendorong air masuk ke mesin. Air mengalir di rongga sekeliling silinder (<b>jaket silinder<\/b>) dan di kepala silinder sambil mengambil panas. Keluar dari mesin, air sampai di <b>katup termostatik tiga jalan<\/b>. Bila mesin masih dingin, katup mengembalikan air langsung ke pompa lewat jalan pintas (<i>bypass<\/i>) supaya mesin cepat mencapai suhu kerja. Bila mesin sudah panas, katup mengalirkan air ke cooler untuk didinginkan air laut [10].<\/p>\n<p><b>Tangki ekspansi<\/b> dipasang di tempat tinggi. Fungsinya: memberi ruang bagi air yang memuai saat panas, menjaga sistem tetap penuh dan bertekanan di sisi isap pompa, menjadi jalan keluar udara, serta menjadi tempat menambah air dan mengamati level. Level tangki ekspansi adalah \"termometer kebocoran\" sistem air tawar.<\/p>\n<div class=\"box term\"><b>Istilah<\/b><br><i>Jaket silinder<\/i> (<i>cylinder jacket<\/i>) = rongga air di sekeliling silinder. <i>Bypass<\/i> = jalan pintas. <i>Tangki ekspansi<\/i> (<i>expansion<\/i> atau <i>header tank<\/i>) = tangki pemuaian.<\/div>\n\n<h3><span class=\"lv d\">DASAR<\/span> Perjalanan air laut<\/h3>\n<p>Air laut masuk lewat <b>kotak laut<\/b> (<i>sea chest<\/i>), yaitu ceruk berkisi-kisi di lambung kapal di bawah garis air. Dari sana air melewati katup isap laut dan <b>saringan<\/b> (<i>strainer<\/i>), diisap <b>pompa air laut<\/b>, didorong melewati satu atau beberapa cooler, lalu dibuang kembali ke laut (Gambar 6.2) [7][12].<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 252\" width=\"100%\"><rect x=\"1\" y=\"1\" width=\"638\" height=\"250\" fill=\"#f6f7fb\"/><path d=\"M1,40 L250,40 L250,250 L1,250 Z\" fill=\"#dff0fb\"/><text x=\"60.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"700\"><tspan x=\"60.0\" y=\"63.9\">LAUT<\/tspan><\/text><line x1=\"250\" y1=\"1\" x2=\"250\" y2=\"250\" stroke=\"#333\" stroke-width=\"6\"/><text x=\"262.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#333\" font-weight=\"400\"><tspan x=\"262.0\" y=\"17.4\">kulit lambung<\/tspan><\/text><rect x=\"253\" y=\"66\" width=\"60\" height=\"48\" fill=\"#dff0fb\" stroke=\"#1d0b78\" stroke-width=\"2\"/><line x1=\"250\" y1=\"72\" x2=\"250\" y2=\"78\" stroke=\"#dff0fb\" stroke-width=\"7\"/><line x1=\"250\" y1=\"84\" x2=\"250\" y2=\"90\" stroke=\"#dff0fb\" stroke-width=\"7\"/><line x1=\"250\" y1=\"96\" x2=\"250\" y2=\"102\" stroke=\"#dff0fb\" stroke-width=\"7\"/><line x1=\"250\" y1=\"108\" x2=\"250\" y2=\"114\" stroke=\"#dff0fb\" stroke-width=\"7\"/><polyline points=\"313.0,90.0 350.0,90.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"350,80 350,100 364,90\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.6\"/><polygon points=\"378,80 378,100 364,90\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.6\"/><polyline points=\"378.0,90.0 420.0,90.0 420.0,143.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke- e x1=\"480\" y1=\"122\" x2=\"480\" y2=\"166\" stroke=\"#888\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"490\" y1=\"122\" x2=\"490\" y2=\"166\" stroke=\"#888\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"500\" y1=\"122\" x2=\"500\" y2=\"166\" stroke=\"#888\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><line x1=\"510\" y1=\"122\" x2=\"510\" y2=\"166\" stroke=\"#888\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><text x=\"490.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"600\"><tspan x=\"490.0\" y=\"103.4\">saringan (strainer)<\/tspan><\/text><text x=\"490.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.02\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\"><tspan x=\"490.0\" y=\"187.5\">keranjang saringan<\/tspan><tspan x=\"490.0\" y=\"198.8\">diangkat untuk dibersihkan<\/tspan><\/text><polyline points=\"520.0,143.0 600.0,143.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"600.0,143.0 593.7,146.0 593.7,140.0\" fill=\"#1479c9\"/><text x=\"580.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"580.0\" y=\"131.4\">ke pompa air laut<\/tspan><\/text><text x=\"125.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"125.0\" y=\"141.1\">sampah, plastik,<\/tspan><tspan x=\"125.0\" y=\"153.5\">biota laut, lumpur<\/tspan><tspan x=\"125.0\" y=\"165.8\">menyumbat kisi-kisi<\/tspan><\/text><polyline points=\"180.0,150.0 244.0,100.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"1\" stroke-linejoin=\"round\"/><polygon points=\"244.0,100.0 241.8,104.5 239.1,101.1\" fill=\"#888\"/><polyline points=\"180.0,160.0 244.0,192.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"1\" stroke-linejoin=\"round\"/><polygon points=\"244.0,192.0 239.0,191.9 240.9,188.0\" fill=\"#888\"/><\/svg><figcaption><b>Gambar 6.2<\/b> Skema umum kotak laut, katup isap laut dan saringan air laut<\/figcaption><\/figure>\n<p>Kapal umumnya mempunyai lebih dari satu kotak laut, misalnya di bagian bawah dan di sisi lambung, supaya dapat berpindah bila salah satu tersumbat atau bila kapal berada di perairan dangkal yang berlumpur [7].<\/p>\n<div class=\"box manual\"><b>ISI DARI BUKU MANUAL KAPAL<\/b><br>Jumlah dan letak kotak laut: <span class=\"fill\"><\/span><br>Jumlah pompa air laut dan penggeraknya (mesin/listrik): <span class=\"fill\"><\/span><br>Peralatan yang didinginkan air laut, berurutan: <span class=\"fill\"><\/span><\/div>\n\n<h3><span class=\"lv m\">MENENGAH<\/span> Komponen utama<\/h3>\n<div class=\"tw\"><table id=\"t6-1\"><caption>Tabel 6.1 Komponen sistem pendingin mesin dan fungsinya<\/caption>\n<tr><th style=\"width:32%\">Komponen<\/th><th>Fungsi dan hal yang perlu diketahui<\/th><\/tr>\n<tr><td>Pompa air tawar<\/td><td>Mengedarkan air tawar; umumnya pompa sentrifugal, digerakkan mesin atau motor listrik<\/td><\/tr>\n<tr><td>Katup termostatik tiga jalan<\/td><td>Menjaga suhu air keluar mesin tetap; bekerja dengan elemen lilin yang memuai<\/td><\/tr>\n<tr><td>Cooler air tawar<\/td><td>Memindahkan panas air tawar ke air laut; jenis pelat atau selongsong-pipa<\/td><\/tr>\n<tr><td>Tangki ekspansi<\/td><td>Ruang muai, penjaga tekanan isap pompa, tempat menambah air dan bahan kimia<\/td><\/tr>\n<tr><td>Kotak laut dan katup isap laut<\/td><td>Jalan masuk air laut; katupnya termasuk katup terpenting bagi keselamatan kapal<\/td><\/tr>\n<tr><td>Saringan air laut<\/td><td>Menahan sampah dan biota sebelum masuk pompa dan cooler<\/td><\/tr>\n<tr><td>Pompa air laut<\/td><td>Mengalirkan air laut melalui cooler<\/td><\/tr>\n<tr><td>Pendingin oli pelumas<\/td><td>Menjaga suhu dan kekentalan oli<\/td><\/tr>\n<tr><td>Pendingin udara bilas (<i>charge air cooler<\/i>)<\/td><td>Mendinginkan udara dari turbocharger sebelum masuk silinder<\/td><\/tr>\n<tr><td>Anoda seng<\/td><td>Logam \"korban\" di sisi air laut; ia yang termakan karat sehingga cooler terlindung<\/td><\/tr>\n<tr><td>Sensor, alarm dan pengaman<\/td><td>Suhu air tinggi, tekanan air rendah, level tangki rendah<\/td><\/tr>\n<\/table><\/div>\n<p>Pompa sentrifugal (Gambar 6.3) tidak dapat mengisap udara. Bila rumah pompa kemasukan udara, aliran berhenti walau pompa berputar. Karena itu letak pompa, kerapatan sisi isap dan keran pembuang udara sangat penting.<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 270\" width=\"100%\"><circle cx=\"300\" cy=\"150\" r=\"96\" fill=\"#eef1fb\" stroke=\"#1d0b78\" stroke-width=\"2\"/><rect x=\"300\" y=\"198\" width=\"150\" height=\"48\" fill=\"#eef1fb\" stroke=\"#1d0b78\" stroke-width=\"2\"/><rect x=\"298\" y=\"200\" width=\"6\" height=\"44\" fill=\"#eef1fb\"/><circle cx=\"300\" cy=\"150\" r=\"62\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"2\"/><path d=\"M316.0,150.0 Q342.6,160.9 337.3,197.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\"/><path d=\"M308.0,163.9 Q311.9,192.4 277.9,205.8\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\"/><path d=\"M292.0,163.9 Q269.3,181.5 240.6,158.8\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\"/><path d=\"M284.0,150.0 Q257.4,139.1 262.7,103.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\"/><path d=\"M292.0,136.1 Q288.1,107.6 322.1,94.2\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\"/><path d=\"M308.0,136.1 Q330.7,118.5 359.4,141.2\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\"/><circle cx=\"300\" cy=\"150\" r=\"14\" fill=\"#1d0b78\"/><polyline points=\"450.0,222.0 520.0,222.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"520.0,222.0 511.0,226.3 511.0,217.7\" fill=\"#1479c9\"/><text x=\"530.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"530.0\" y=\"219.3\">keluar<\/tspan><tspan x=\"530.0\" y=\"231.7\">(sisi tekan)<\/tspan><\/text><text x=\"300.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"300.0\" y=\"23.5\">air masuk di pusat impeler (sisi isap), tegak lurus gambar<\/tspan><\/text><polyline points=\"300.0,30.0 300.0,132.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"1.2\" stroke-linejoin=\"round\" stroke-dasharray=\"3 3\"/><polygon points=\"300.0,132.0 297.8,127.5 302.2,127.5\" fill=\"#1479c9\"/><text x=\"120.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"120.0\" y=\"57.3\">rumah pompa<\/tspan><tspan x=\"120.0\" y=\"69.7\">(volute)<\/tspan><\/text><polyline points=\"150.0,72.0 222.0,100.0\" fill=\"none\" stroke=\"#777\" stroke-width=\"1\" stroke-linejoin=\"round\"/><polygon points=\"222.0,100.0 217.0,100.4 218.6,96.3\" fill=\"#777\"/><text x=\"110.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"110.0\" y=\"167.3\">impeler<\/tspan><tspan x=\"110.0\" y=\"179.7\">(roda bersudu)<\/tspan><\/text><polyline points=\"150.0,170.0 246.0,160.0\" fill=\"none\" stroke=\"#777\" stroke-width=\"1\" stroke-linejoin=\"round\"/><polygon points=\"246.0,160.0 241.7,162.6 241.3,158.3\" fill=\"#777\"/><text x=\"120.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"120.0\" y=\"247.3\">poros + perapat poros<\/tspan><tspan x=\"120.0\" y=\"259.7\">(mechanical seal)<\/tspan><\/text><polyline points=\"170.0,240.0 292.0,160.0\" fill=\"none\" stroke=\"#777\" stroke-width=\"1\" stroke-linejoin=\"round\"/><polygon points=\"292.0,160.0 289.4,164.3 287.0,160.7\" fill=\"#777\"/><polyline points=\"360.0,96.0 372.0,120.0 368.0,150.0\" fill=\"none\" stroke=\" Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"576.0\" y=\"187.3\">air laut<\/tspan><tspan x=\"576.0\" y=\"199.7\">masuk<\/tspan><\/text><polyline points=\"490.0,62.0 570.0,62.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"570.0,62.0 563.7,65.0 563.7,59.0\" fill=\"#1479c9\"/><text x=\"576.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"576.0\" y=\"59.3\">air laut<\/tspan><tspan x=\"576.0\" y=\"71.7\">keluar<\/tspan><\/text><text x=\"330.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"330.0\" y=\"27.5\">pelat tipis bergelombang; air tawar dan air laut mengalir berselang-seling tanpa bercampur<\/tspan><\/text><text x=\"330.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"330.0\" y=\"229.4\">paking karet di tiap pelat menjaga kedua cairan tetap terpisah<\/tspan><\/text><\/svg><figcaption><b>Gambar 6.4<\/b> Skema cara kerja penukar kalor jenis pelat<\/figcaption><\/figure>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 214\" width=\"100%\"><text x=\"160.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"800\"><tspan x=\"160.0\" y=\"21.9\">MESIN MASIH DINGIN<\/tspan><\/text><rect x=\"110\" y=\"60\" width=\"100\" height=\"70\" rx=\"8\" fill=\"#f1f2f8\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"160.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"160.0\" y=\"93.4\">elemen lilin<\/tspan><tspan x=\"160.0\" y=\"105.1\">(wax)<\/tspan><\/text><polyline points=\"30.0,95.0 110.0,95.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"110.0,95.0 101.9,98.9 101.9,91.1\" fill=\"#f08a24\"/><text x=\"30.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#1a1a2e\" font-weight=\"400\"><tspan x=\"30.0\" y=\"81.4\">dari mesin<\/tspan><\/text><line x1=\"210\" y1=\"95\" x2=\"290\" y2=\"95\" stroke=\"#bbb\" stroke-width=\"4\" stroke-dasharray=\"4 4\"/><text x=\"216.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.24\" text-anchor=\"start\" fill=\"#888\" font-weight=\"400\"><tspan x=\"216.0\" y=\"83.2\">ke cooler (tertutup)<\/tspan><\/text><polyline points=\"160.0,130.0 160.0,180.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"160.0,180.0 156.1,171.9 163.9,171.9\" fill=\"#f08a24\"/><text x=\"170.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#b55d00\" font-weight=\"700\"><tspan x=\"170.0\" y=\"163.4\">bypass → kembali ke pompa<\/tspan><\/text><rect x=\"140\" y=\"64\" width=\"40\" height=\"8\" fill=\"#1479c9\"/><text x=\"480.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#d9432f\" font-weight=\"800\"><tspan x=\"480.0\" y=\"21.9\">MESIN SUDAH PANAS<\/tspan><\/text><rect x=\"430\" y=\"60\" width=\"100\" height=\"70\" rx=\"8\" fill=\"#f1f2f8\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"480.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"480.0\" y=\"93.4\">elemen lilin<\/tspan><tspan x=\"480.0\" y=\"105.1\">(wax)<\/tspan><\/text><polyline points=\"350.0,95.0 430.0,95.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"430.0,95.0 421.9,98.9 421.9,91.1\" fill=\"#d9432f\"/><text x=\"350.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#1a1a2e\" font-weight=\"400\"><tspan x=\"350.0\" y=\"81.4\">dari mesin<\/tspan><\/text><polyline points=\"530.0,95.0 610.0,95.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"610.0,95.0 601.9,98.9 601.9,91.1\" fill=\"#d9432f\"/><text x=\"612.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"end\" fill=\"#d9432f\" font-weight=\"700\"><tspan x=\"612.0\" y=\"81.4\">ke cooler<\/tspan><\/text><line x1=\"480\" y1=\"130\" x2=\"480\" y2=\"176\" stroke=\"#bbb\" stroke-width=\"4\" stroke-dasharray=\"4 4\"/><text x=\"490.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#888\" font-weight=\"400\"><tspan x=\"490.0\" y=\"163.4\">bypass tertutup<\/tspan><\/text><rect x=\"460\" y=\"118\" width=\"40\" height=\"8\" fill=\"#d9432f\"/><line x1=\"320\" y1=\"10\" x2=\"320\" y2=\"190\" stroke=\"#ccc\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"320.0\" y=\"207.4\">Lilin di dalam elemen memuai saat panas dan menggeser katup; tidak butuh listrik.<\/tspan><\/text><\/svg><figcaption><b>Gambar 6.5<\/b> Cara kerja katup termostatik tiga jalan saat mesin dingin dan saat mesin panas<\/figcaption><\/figure>\n\n<h3><span class=\"lv m\">MENENGAH<\/span> Rangkaian suhu tinggi dan suhu rendah<\/h3>\n<p>Banyak kapal membagi air tawar pendingin menjadi dua rangkaian. Rangkaian <b>suhu tinggi<\/b> (HT, <i>high temperature<\/i>) mendinginkan jaket dan kepala silinder. Rangkaian <b>suhu rendah<\/b> (LT, <i>low temperature<\/i>) mendinginkan oli pelumas, udara bilas dan mesin bantu, dan rangkaian LT inilah yang didinginkan air laut di cooler pusat [7][15]. Pada susunan lain, tiap mesin punya cooler air tawar sendiri yang langsung didinginkan air laut.<\/p>\n<p>Sebagai gambaran, sebuah rujukan kapal niaga menyebut air rangkaian LT lazimnya sekitar 36–40 °C, tergantung rancangan dan pabrik pembuat; suhu rangkaian HT lebih tinggi [15]. <b>Angka ini bukan angka KRI Bung Tomo.<\/b><\/p>\n<div class=\"box manual\"><b>ISI DARI BUKU MANUAL KAPAL<\/b><br>Susunan pendingin mesin pokok (HT/LT terpisah, atau cooler tiap mesin): <span class=\"fill\"><\/span><br>Suhu normal air tawar keluar mesin pokok: <span class=\"fill s\"><\/span> &nbsp; Alarm: <span class=\"fill s\"><\/span> &nbsp; Pengaman: <span class=\"fill s\"><\/span><br>Tekanan normal air tawar: <span class=\"fill s\"><\/span> &nbsp; Tekanan normal air laut: <span class=\"fill s\"><\/span><\/div>\n\n<h3><span class=\"lv l\">LANJUT<\/span> Mutu air pendingin dan bahaya suhu terlalu rendah<\/h3>\n<ul>\n<li><b>Mutu air.<\/b> Air tawar pendingin diberi bahan penghambat karat (<i>inhibitor<\/i>) dan diuji berkala. Air tanpa perlindungan menimbulkan karat dan kerak di jaket silinder, yang mengurangi perpindahan panas. Jenis bahan, takaran dan cara uji ikuti anjuran pabrik mesin.<\/li>\n<li><b>Terlalu dingin juga merusak.<\/b> Mesin yang bekerja dengan air terlalu dingin mengalami pembakaran kurang sempurna, keausan silinder lebih cepat dan tegangan panas pada logam. Katup termostatik ada untuk mencegah hal ini; jangan melepas elemennya sebagai \"jalan keluar\" suhu tinggi.<\/li>\n<li><b>Air laut masuk ke air tawar.<\/b> Bila pelat atau pipa cooler bocor, cairan bertekanan lebih tinggi masuk ke yang lebih rendah. Level tangki ekspansi yang <i>naik<\/i> sendiri, atau hasil uji kadar garam (klorida) yang tinggi, menandakan air laut masuk ke air tawar.<\/li>\n<\/ul>"},{"id":"s6-2","judul":"Parameter yang diamati saat jaga","html":"<div class=\"tw\"><table id=\"t6-2\"><caption>Tabel 6.2 Parameter jaga sistem pendingin mesin<\/caption>\n<tr><th style=\"width:32%\">Parameter<\/th><th style=\"width:38%\">Mengapa diamati<\/th><th>Angka normal kapal (isi dari manual/jurnal)<\/th><\/tr>\n<tr><td>Suhu air tawar keluar mesin<\/td><td>Petunjuk utama keadaan pendinginan<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Suhu air tawar masuk mesin<\/td><td>Selisih masuk–keluar menunjukkan aliran dan beban<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Tekanan air tawar<\/td><td>Menunjukkan kerja pompa dan penuh tidaknya sistem<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Level tangki ekspansi<\/td><td>Turun: bocor keluar. Naik: ada yang masuk<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Tekanan air laut setelah pompa<\/td><td>Menunjukkan kerja pompa dan kebersihan sisi isap<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Suhu air laut masuk dan keluar cooler<\/td><td>Selisihnya menunjukkan aliran dan kebersihan cooler<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Suhu oli pelumas setelah pendingin<\/td><td>Pendingin oli ikut terganggu bila air laut kurang<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Suhu udara bilas<\/td><td>Naik bila pendingin udara kotor atau airnya kurang<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Jumlah air yang ditambahkan ke tangki ekspansi<\/td><td>Ukuran besar kecilnya kebocoran<\/td><td class=\"blank\"><\/td><\/tr>\n<\/table><\/div>"},{"id":"s6-3","judul":"Kegiatan","html":"<div class=\"box act\"><b>Kegiatan 4.1 — Menelusuri dua rangkaian<\/b>\n<ol>\n<li>Dengan Gambar 6.1 dan diagram sistem dari manual, telusuri rangkaian air laut satu mesin: dari kotak laut sampai katup buang laut. Catat tiap katup yang dilewati.<\/li>\n<li>Telusuri rangkaian air tawar mesin yang sama. Temukan tangki ekspansi, katup termostatik, cooler dan keran pembuang udara.<\/li>\n<li>Isi kotak kuning pada bab ini dan kolom \"angka normal\" Tabel 6.2.<\/li>\n<li>Gambar ulang kedua rangkaian di buku catatan dengan nama katup menurut penandaan di kapal.<\/li>\n<\/ol><\/div>"}]},{"n":5,"judul":"Trouble Shooting Sistem Pendingin Mesin Penggerak","lead":"Suhu naik adalah gejala. Sebabnya hampir selalu satu dari tiga: luas, beda suhu, atau aliran.","bagian":[{"id":"s7-1","judul":"Tindakan pertama saat suhu naik","html":"<div class=\"box goal\"><b>Tujuan modul<\/b><br>Setelah modul ini Anda dapat (1) mengambil tindakan pertama yang benar saat suhu air pendingin naik, (2) memakai tabel gejala–penyebab–tindakan, dan (3) menelusuri tiga bagan alir gangguan utama.<\/div>\n\n\n<h3><span class=\"lv d\">DASAR<\/span> Empat hal sebelum mencari sebab<\/h3>\n<div class=\"box warn\"><b>PERINGATAN — suhu air pendingin tinggi<\/b>\n<ol>\n<li><b>Lapor<\/b> segera kepada pengawas jaga/perwira jaga mesin. Alarm suhu tinggi menuntut tanggapan saat itu juga.<\/li>\n<li><b>Kurangi beban<\/b> mesin sesuai perintah, supaya panas yang harus dibuang berkurang.<\/li>\n<li><b>Jangan membuka<\/b> tutup tangki atau keran pada sistem yang panas dan bertekanan: air panas dan uap dapat menyembur.<\/li>\n<li><b>Jangan menuang air dingin<\/b> dalam jumlah banyak ke mesin yang sangat panas: perubahan suhu mendadak dapat meretakkan logam. Penambahan air dan penghentian mesin ikuti prosedur darurat di manual.<\/li>\n<\/ol><\/div>\n<p>Bandingkan juga bacaan di panel dengan termometer lokal di mesin. Sensor yang rusak dapat memberi alarm palsu, tetapi anggap alarm itu benar sampai terbukti sebaliknya.<\/p>"},{"id":"s7-2","judul":"Tabel gejala, penyebab dan tindakan","html":"<div class=\"tw\"><table id=\"t7-1\" class=\"ts\"><caption>Tabel 7.1 Gejala, kemungkinan penyebab dan tindakan pada sistem pendingin mesin<\/caption>\n<tr><th style=\"width:22%\">Gejala<\/th><th style=\"width:39%\">Kemungkinan penyebab<\/th><th>Tindakan<\/th><\/tr>\n<tr><td rowspan=\"6\">Suhu air tawar keluar mesin tinggi<\/td><td>Air tawar kurang (level tangki ekspansi rendah)<\/td><td>Tambah air sesuai prosedur; cari bocor<\/td><\/tr>\n<tr><td>Aliran air laut kurang<\/td><td>Lihat gejala tekanan air laut rendah<\/td><\/tr>\n<tr><td>Udara terperangkap di rangkaian air tawar<\/td><td>Buang udara di titik tertinggi<\/td><\/tr>\n<tr><td>Pompa air tawar lemah (impeler aus, penggerak slip)<\/td><td>Periksa pompa; pindah ke cadangan bila ada<\/td><\/tr>\n<tr><td>Katup termostatik macet pada posisi bypass<\/td><td>Operasikan manual bila tersedia; ganti elemen<\/td><\/tr>\n<tr><td>Cooler kotor atau berkerak<\/td><td>Bersihkan cooler<\/td><\/tr>\n<tr><td rowspan=\"5\">Tekanan air laut rendah<\/td><td>Katup isap/buang salah posisi<\/td><td>Betulkan susunan katup<\/td><\/tr>\n<tr><td>Saringan air laut kotor<\/td><td>Bersihkan; pindah ke saringan cadangan<\/td><\/tr>\n<tr><td>Kotak laut tersumbat<\/td><td>Pindah kotak laut; bersihkan sesuai manual<\/td><\/tr>\n<tr><td>Pompa kemasukan udara<\/td><td>Buang udara; rapatkan sisi isap<\/td><\/tr>\n<tr><td>Impeler aus/rusak, penggerak bermasalah<\/td><td>Pindah pompa cadangan; perbaiki<\/td><\/tr>\n<tr><td rowspan=\"2\">Tekanan air tawar rendah atau berayun<\/td><td>Level tangki ekspansi rendah, udara terisap<\/td><td>Tambah air; buang udara; cari bocor<\/td><\/tr>\n<tr><td>Pompa air tawar aus; perapat poros bocor<\/td><td>Periksa dan perbaiki pompa<\/td><\/tr>\n<tr><td rowspan=\"4\">Level tangki ekspansi turun<\/td><td>Bocor luar: selang, flens, perapat pompa<\/td><td>Perbaiki bocor<\/td><\/tr>\n<tr><td>Air masuk ke oli pelumas<\/td><td>Hentikan mesin sesuai prosedur; laporkan<\/td><\/tr>\n<tr><td>Gas pembakaran masuk ke air (gelembung di tangki)<\/td><td>Hentikan mesin sesuai prosedur; laporkan<\/td><\/tr>\n<tr><td>Bocor di dalam cooler ke sisi air laut<\/td><td>Uji tekan cooler<\/td><\/tr>\n<tr><td>Level tangki ekspansi naik<\/td><td>Air laut masuk lewat cooler yang bocor<\/td><td>Uji kadar garam air tawar; uji tekan cooler<\/td><\/tr>\n<tr><td>Suhu air tawar terlalu rendah<\/td><td>Katup termostatik macet pada posisi ke cooler; beban sangat rendah<\/td><td>Periksa/ganti elemen termostatik<\/td><\/tr>\n<tr><td rowspan=\"2\">Suhu oli pelumas tinggi<\/td><td>Air pendingin ke pendingin oli kurang; pendingin oli kotor<\/td><td>Pulihkan aliran; bersihkan pendingin<\/td><\/tr>\n<tr><td>Pengatur suhu oli tidak bekerja<\/td><td>Periksa pengatur suhu oli<\/td><\/tr>\n<tr><td>Suhu udara bilas tinggi<\/td><td>Pendingin udara kotor di sisi udara atau sisi air; aliran air kurang<\/td><td>Bersihkan pendingin udara; pulihkan aliran<\/td><\/tr>\n<tr><td>Pompa berisik dan bergetar<\/td><td>Kavitasi karena isapan terhambat; bantalan aus<\/td><td>Bersihkan sisi isap; periksa bantalan<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box term\"><b>Istilah<\/b><br><i>Kavitasi<\/i> = terbentuknya gelembung uap di dalam pompa karena tekanan isap terlalu rendah; gelembung itu pecah dan mengikis impeler, ditandai bunyi seperti kerikil. <i>Impeler<\/i> = roda bersudu pompa.<\/div>"},{"id":"s7-3","judul":"Bagan alir gangguan utama","html":"<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 772.0\" width=\"100%\"><rect x=\"4\" y=\"8\" width=\"336\" height=\"52\" rx=\"26.0\" fill=\"#1d0b78\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\"><tspan x=\"172.0\" y=\"31.0\">GEJALA: suhu air tawar pendingin mesin naik. Kurangi<\/tspan><tspan x=\"172.0\" y=\"44.7\">beban, lapor, bandingkan dengan termometer lokal<\/tspan><\/text><polyline points=\"172.0,60.0 172.0,82.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,82.0 169.0,75.7 175.0,75.7\" fill=\"#333\"/><polygon points=\"172,82.0 330.0,134.0 172,186.0 14.0,134.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"138.0\">Level tangki ekspansi rendah?<\/tspan><\/text><polyline points=\"330.0,134.0 378.0,134.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,134.0 371.7,137.0 371.7,131.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-s
