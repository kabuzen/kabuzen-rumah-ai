async function loadPemb() { try { pemb = await Online.all(); } catch (e) { pemb = {err: terr(String(e.message || e))}; } render(); }

/* ---------------- render & peristiwa ---------------- */
let sentTo = null;
function render() {
  const r = route(), pub = ['', 'daftar', 'masuk'];
  let h;
  if (!U) { h = r[0] === 'daftar' ? vDaftar(sentTo) : (r[0] === 'masuk' && C.online ? vMasuk() : vCover()); if (r[0] && !pub.includes(r[0])) { history.replaceState(null, '', '#/'); h = vCover(); } }
  else switch (r[0]) {
    case 'modul': h = vModul(+r[1], +r[2] || 0); break;
    case 'kuis': h = vKuis(+r[1]); break;
    case 'nilai': h = vNilai(r[1] === undefined ? undefined : +r[1]); break;
    case 'pandu': h = vPandu(r[1]); break;
    case 'istilah': h = vIstilah(); break;
    case 'animasi': h = vAnimasi(); break;
    case 'pengantar': h = vPengantar(); break;
    case 'pembina': h = vPembina(r[1]); break;
    case 'akun': h = vAkun(); break;
    default: h = vBeranda();
  }
  app.innerHTML = h; document.title = NM;
  const v = app.querySelector('[data-vid]'); if (v) v.addEventListener('error', () => { v.hidden = true; document.getElementById('vnote').hidden = false; });
}
let lastHash = '';
window.addEventListener('hashchange', () => { const r = route(); if (r[0] !== 'kuis') quizRes = null; if (r[0] !== 'pandu' || !r[1]) flowSt = null; if (r[0] !== 'daftar') sentTo = null; render(); if (location.hash !== lastHash) window.scrollTo(0, 0); lastHash = location.hash; });
const lock = async fn => { if (busy) return; busy = true; try { await fn(); } catch (e) { flash = {t: 'e', m: esc(terr(String(e.message || e)))}; render(); } finally { busy = false; } };
app.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return; ev.preventDefault();
  const fd = new FormData(f), k = f.dataset.form, v = n => String(fd.get(n) || '').trim();
  lock(async () => {
    if (k === 'daftar') {
      if (!v('nama')) { flash = {t: 'e', m: 'Nama wajib diisi.'}; return render(); }
      if (C.online && (!/^\S+@\S+\.\S+$/.test(v('email')) || String(fd.get('password') || '').length < 8)) { flash = {t: 'e', m: 'Isi email yang benar dan kata sandi minimal 8 karakter.'}; return render(); }
      const r = await S.register({nama: v('nama'), pangkat: v('pangkat'), bagian: v('bagian'), email: v('email'), password: String(fd.get('password') || '')});
      if (r.err) { flash = {t: 'e', m: esc(r.err)}; return render(); }
      if (r.confirm) { sentTo = v('email'); return render(); }
      flash = {t: 'o', m: 'Pendaftaran berhasil. Selamat belajar.'}; go('#/beranda'); render();
    } else if (k === 'masuk') {
      const r = await S.login({email: v('email'), password: String(fd.get('password') || '')});
      if (r.err) { flash = {t: 'e', m: esc(r.err)}; return render(); }
      go('#/beranda'); render();
    } else if (k === 'kuis') {
      const m = +f.dataset.m, R = grade(m, fd);
      try { await S.saveAttempt({modul: R.modul, skor: R.skor, maks: R.maks, detail: R.detail}); R.saved = true; } catch (e) { R.saved = false; }
      quizRes = R; render(); window.scrollTo(0, 0);
    }
  });
});
app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return; const a = b.dataset.act;
  if (a === 'fl-ya') { flowSt.ya = true; return render(); }
  if (a === 'fl-next') { flowSt.i++; flowSt.ya = false; return render(); }
  if (a === 'fl-back') { flowSt.i = Math.max(0, flowSt.i - 1); flowSt.ya = false; return render(); }
  if (a === 'fl-reset') { flowSt = {k: flowSt.k, i: 0, ya: false}; return render(); }
  if (a === 'ulang') { quizRes = null; render(); return window.scrollTo(0, 0); }
  if (a === 'tutuphasil') { quizRes = null; return; }
  if (a === 'pb-reload') { pemb = null; return render(); }
  if (a === 'reset1') { b.textContent = 'Tekan sekali lagi untuk menghapus'; b.dataset.act = 'reset2'; return; }
  if (a === 'salin') { const t = rapor(); const done = () => { flash = {t: 'o', m: 'Rapor disalin. Tempelkan di pesan untuk pembina.<br><pre style="white-space:pre-wrap;margin:6px 0 0;font:13px/1.4 monospace">' + esc(t) + '</pre>'}; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done); else done(); return; }
  lock(async () => {
    if (a === 'read') { await S.setRead(+b.dataset.m, b.dataset.b, true); go(b.dataset.next); render(); }
    else if (a === 'unread') { await S.setRead(+b.dataset.m, b.dataset.b, false); render(); }
    else if (a === 'logout' || a === 'reset2') { await S.logout(); pemb = null; flash = {t: 'o', m: a === 'logout' ? 'Anda sudah keluar.' : 'Semua data di perangkat ini sudah dihapus.'}; go('#/'); render(); }
    else if (a === 'resend') { const r = await S.resend(b.dataset.email); flash = r.err ? {t: 'e', m: esc(r.err)} : {t: 'o', m: 'Email konfirmasi dikirim ulang.'}; render(); }
  });
});
app.addEventListener('input', ev => {
  if (ev.target.dataset.act !== 'cari') return; const q = norm(ev.target.value); let n = 0;
  document.querySelectorAll('#tg tr').forEach((tr, i) => { if (!i) return; const ok = !q || norm(tr.textContent).includes(q); tr.hidden = !ok; if (ok) n++; });
  document.getElementById('kosong').hidden = n > 0;
});
(async () => { app.innerHTML = '<main class="wrap"><p class="muted">Memuat…</p></main>'; await S.init(); lastHash = location.hash; render(); })();
})();
