><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"447.5\">Tidak<\/tspan><\/text><polygon points=\"172,454.0 330.0,506.0 172,558.0 14.0,506.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"502.9\">Pipa ke cooler tetap dingin<\/tspan><tspan x=\"172.0\" y=\"517.2\">padahal suhu mesin tinggi?<\/tspan><\/text><polyline points=\"330.0,506.0 378.0,506.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,506.0 371.7,509.0 371.7,503.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"502.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"462.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"503.0\">Katup termostatik macet. Operasikan<\/tspan><tspan x=\"506.0\" y=\"516.5\">manual bila tersedia; ganti elemen.<\/tspan><\/text><polyline points=\"172.0,558.0 172.0,578.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,578.0 169.0,571.7 175.0,571.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"571.5\">Tidak<\/tspan><\/text><polygon points=\"172,578.0 330.0,630.0 172,682.0 14.0,630.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"626.9\">Selisih suhu air laut masuk-<\/tspan><tspan x=\"172.0\" y=\"641.2\">keluar cooler mengecil?<\/tspan><\/text><polyline points=\"330.0,630.0 378.0,630.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,630.0 371.7,633.0 371.7,627.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"626.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"586.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"627.0\">Cooler kotor di sisi air laut atau air<\/tspan><tspan x=\"506.0\" y=\"640.5\">tawar. Rencanakan pembersihan.<\/tspan><\/text><polyline points=\"172.0,682.0 172.0,704.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,704.0 169.0,697.7 175.0,697.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"696.5\">Tidak<\/tspan><\/text><rect x=\"6\" y=\"704.0\" width=\"628\" height=\"60\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"731.0\">Periksa beban mesin, pembakaran dan ketepatan sensor. Jika suhu terus naik: ikuti prosedur<\/tspan><tspan x=\"320.0\" y=\"744.5\">darurat manual dan perintah KKM.<\/tspan><\/text><\/svg><figcaption><b>Gambar 7.1<\/b> Bagan alir: suhu air tawar pendingin mesin naik<\/figcaption><\/figure>\n<h3><span class=\"lv m\">MENENGAH<\/span> Membaca cooler dengan termometer<\/h3>\n<p>Empat suhu di sekitar cooler memberi banyak keterangan: suhu air laut masuk dan keluar, suhu air tawar masuk dan keluar.<\/p>\n<ul>\n<li>Selisih suhu air laut masuk–keluar <b>membesar<\/b>, sedangkan suhu air tawar naik: aliran air laut berkurang. Air yang sedikit menjadi lebih panas.<\/li>\n<li>Selisih suhu air laut <b>mengecil<\/b>, sedangkan suhu air tawar naik: panas tidak berpindah. Permukaan cooler kotor atau berkerak.<\/li>\n<li>Selisih tekanan sebelum dan sesudah cooler yang membesar dari biasanya menandakan sumbatan di dalam cooler.<\/li>\n<\/ul>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 772.0\" width=\"100%\"><rect x=\"4\" y=\"8\" width=\"336\" height=\"52\" rx=\"26.0\" fill=\"#1d0b78\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\"><tspan x=\"172.0\" y=\"37.9\">GEJALA: tekanan / aliran air laut pendingin rendah<\/tspan><\/text><polyline points=\"172.0,60.0 172.0,82.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,82.0 169.0,75.7 175.0,75.7\" fill=\"#333\"/><polygon points=\"172,82.0 330.0,134.0 172,186.0 14.0,134.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"123.7\">Katup isap laut atau katup<\/tspan><tspan x=\"172.0\" y=\"138.0\">buang tertutup / salah susunan<\/tspan><tspan x=\"172.0\" y=\"152.3\">(line-up)?<\/tspan><\/text><polyline points=\"330.0,134.0 378.0,134.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,134.0 371.7,137.0 371.7,131.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"130.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"90.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"131.0\">Betulkan susunan katup sesuai diagram<\/tspan><tspan x=\"506.0\" y=\"144.5\">sistem di manual.<\/tspan><\/text><polyline points=\"172.0,186.0 172.0,206.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,206.0 169.0,199.7 175.0,199.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"199.5\">Tidak<\/tspan><\/text><polygon points=\"172,206.0 330.0,258.0 172,310.0 14.0,258.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"254.9\">Vakum isap tinggi dan saringan<\/tspan><tspan x=\"172.0\" y=\"269.2\">air laut kotor?<\/tspan><\/text><polyline points=\"330.0,258.0 378.0,258.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,258.0 371.7,261.0 371.7,255.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"254.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"214.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"255.0\">Pindah ke saringan cadangan bila ada,<\/tspan><tspan x=\"506.0\" y=\"268.5\">lalu bersihkan saringan yang kotor.<\/tspan><\/text><polyline points=\"172.0,310.0 172.0,330.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,330.0 169.0,323.7 175.0,323.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"323.5\">Tidak<\/tspan><\/text><polygon points=\"172,330.0 330.0,382.0 172,434.0 14.0,382.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"371.7\">Kotak laut (sea chest)<\/tspan><tspan x=\"172.0\" y=\"386.0\">tersumbat sampah, plastik atau<\/tspan><tspan x=\"172.0\" y=\"400.3\">biota?<\/tspan><\/text><polyline points=\"330.0,382.0 378.0,382.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,382.0 371.7,385.0 371.7,379.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"378.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"338.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"372.3\">Pindah ke kotak laut lain;<\/tspan><tspan x=\"506.0\" y=\"385.8\">bersihkan/tiup balik hanya dengan cara<\/tspan><tspan x=\"506.0\" y=\"399.2\">di manual.<\/tspan><\/text><polyline points=\"172.0,434.0 172.0,454.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,454.0 169.0,447.7 175.0,447.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"447.5\">Tidak<\/tspan><\/text><polygon points=\"172,454.0 330.0,506.0 172,558.0 14.0,506.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"502.9\">Pompa kemasukan udara? (tekanan<\/tspan><tspan x=\"172.0\" y=\"517.2\">berayun, bunyi kasar)<\/tspan><\/text><polyline points=\"330.0,506.0 378.0,506.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,506.0 371.7,509.0 371.7,503.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"502.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"462.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"503.0\">Buang udara di rumah pompa dan saringan;<\/tspan><tspan x=\"506.0\" y=\"516.5\">periksa kebocoran sisi isap.<\/tspan><\/text><polyline points=\"172.0,558.0 172.0,578.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,578.0 169.0,571.7 175.0,571.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"571.5\">Tidak<\/tspan><\/text><polygon points=\"172,578.0 330.0,630.0 172,682.0 14.0,630.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"626.9\">Pompa aus atau penggerak<\/tspan><tspan x=\"172.0\" y=\"641.2\">bermasalah?<\/tspan><\/text><polyline points=\"330.0,630.0 378.0,630.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,630.0 371.7,633.0 371.7,627.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"626.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"586.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"627.0\">Pindah ke pompa cadangan; periksa<\/tspan><tspan x=\"506.0\" y=\"640.5\">impeler, kopling, sabuk dan motor.<\/tspan><\/text><polyline points=\"172.0,682.0 172.0,704.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,704.0 169.0,697.7 175.0,697.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"696.5\">Tidak<\/tspan><\/text><rect x=\"6\" y=\"704.0\" width=\"628\" height=\"60\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"737.8\">Periksa kebocoran di sisi tekan dan pipa yang berkerak. Laporkan ke KKM.<\/tspan><\/text><\/svg><figcaption><b>Gambar 7.2<\/b> Bagan alir: tekanan atau aliran air laut pendingin rendah<\/figcaption><\/figure>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 648.0\" width=\"100%\"><rect x=\"4\" y=\"8\" width=\"336\" height=\"52\" rx=\"26.0\" fill=\"#1d0b78\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\"><tspan x=\"172.0\" y=\"37.9\">GEJALA: level tangki ekspansi air tawar terus turun<\/tspan><\/text><polyline points=\"172.0,60.0 172.0,82.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,82.0 169.0,75.7 175.0,75.7\" fill=\"#333\"/><polygon points=\"172,82.0 330.0,134.0 172,186.0 14.0,134.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"123.7\">Ada bocor yang terlihat?<\/tspan><tspan x=\"172.0\" y=\"138.0\">(selang, flens, perapat poros<\/tspan><tspan x=\"172.0\" y=\"152.3\">pompa, keran cerat)<\/tspan><\/text><polyline points=\"330.0,134.0 378.0,134.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,134.0 371.7,137.0 371.7,131.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"130.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"90.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"131.0\">Kencangkan atau ganti bagian yang bocor;<\/tspan><tspan x=\"506.0\" y=\"144.5\">catat jumlah air yang ditambahkan.<\/tspan><\/text><polyline points=\"172.0,186.0 172.0,206.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,206.0 169.0,199.7 175.0,199.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"199.5\">Tidak<\/tspan><\/text><polygon points=\"172,206.0 330.0,258.0 172,310.0 14.0,258.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"254.9\">Oli pelumas keruh seperti susu<\/tspan><tspan x=\"172.0\" y=\"269.2\">atau level oli naik?<\/tspan><\/text><polyline points=\"330.0,258.0 378.0,258.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,258.0 371.7,261.0 371.7,255.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"254.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"214.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"255.0\">Air masuk ke oli. Hentikan mesin sesuai<\/tspan><tspan x=\"506.0\" y=\"268.5\">prosedur dan laporkan segera.<\/tspan><\/text><polyline points=\"172.0,310.0 172.0,330.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,330.0 169.0,323.7 175.0,323.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"323.5\">Tidak<\/tspan><\/text><polygon points=\"172,330.0 330.0,382.0 172,434.0 14.0,382.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"378.9\">Ada gelembung gas terus-menerus<\/tspan><tspan x=\"172.0\" y=\"393.2\">di tangki ekspansi?<\/tspan><\/text><polyline points=\"330.0,382.0 378.0,382.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,382.0 371.7,385.0 371.7,379.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"378.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"338.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"372.3\">Gas pembakaran masuk ke air pendingin.<\/tspan><tspan x=\"506.0\" y=\"385.8\">Hentikan mesin sesuai prosedur dan<\/tspan><tspan x=\"506.0\" y=\"399.2\">laporkan.<\/tspan><\/text><polyline points=\"172.0,434.0 172.0,454.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,454.0 169.0,447.7 175.0,447.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"447.5\">Tidak<\/tspan><\/text><polygon points=\"172,454.0 330.0,506.0 172,558.0 14.0,506.0\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"172.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.44\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"172.0\" y=\"495.7\">Ada air di cerat pendingin<\/tspan><tspan x=\"172.0\" y=\"510.0\">udara bilas atau asap buang<\/tspan><tspan x=\"172.0\" y=\"524.3\">putih?<\/tspan><\/text><polyline points=\"330.0,506.0 378.0,506.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"378.0,506.0 371.7,509.0 371.7,503.0\" fill=\"#1f8a4c\"/><text x=\"354.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"354.0\" y=\"502.5\">Ya<\/tspan><\/text><rect x=\"378\" y=\"462.0\" width=\"256\" height=\"88\" rx=\"6\" fill=\"#e5f5ea\" stroke=\"#1f8a4c\" stroke-width=\"1.4\"/><text x=\"506.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"506.0\" y=\"496.3\">Curigai pendingin udara bocor atau air<\/tspan><tspan x=\"506.0\" y=\"509.8\">masuk ruang bakar. Laporkan untuk<\/tspan><tspan x=\"506.0\" y=\"523.2\">pemeriksaan.<\/tspan><\/text><polyline points=\"172.0,558.0 172.0,580.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"172.0,580.0 169.0,573.7 175.0,573.7\" fill=\"#333\"/><text x=\"180.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#555\" font-weight=\"600\"><tspan x=\"180.0\" y=\"572.5\">Tidak<\/tspan><\/text><rect x=\"6\" y=\"580.0\" width=\"628\" height=\"60\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.78\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"607.0\">Kebocoran mungkin di dalam cooler (air tawar terbawa air laut). Usulkan uji tekan sistem dan<\/tspan><tspan x=\"320.0\" y=\"620.5\">cooler.<\/tspan><\/text><\/svg><figcaption><b>Gambar 7.3<\/b> Bagan alir: level tangki ekspansi air tawar terus turun<\/figcaption><\/figure>\n\n<h3><span class=\"lv l\">LANJUT<\/span> Pelajaran dari sebuah kasus nyata<\/h3>\n<p>Sebuah penelitian pada kapal feri Indonesia menelusuri sebab naiknya suhu air tawar pendingin mesin pokok hingga melewati 80 °C. Para peneliti menemukan beberapa sebab yang bekerja bersama: kotak laut dan saringan tersumbat sampah serta biota laut, tekanan pompa air tawar turun karena impeler rusak dan air pendingin kurang, dan pipa-pipa cooler tersumbat lumpur dan kerak. Setelah pembersihan, penambahan air dan perbaikan pompa, suhu kembali normal [11].<\/p>\n<div class=\"box key\"><b>Pelajarannya:<\/b> gangguan besar sering merupakan gabungan beberapa kelalaian kecil yang menumpuk. Karena itu bagan alir ditelusuri sampai habis, tidak berhenti pada temuan pertama, dan perawatan berkala saringan, kotak laut serta cooler adalah obat yang paling murah.<\/div>"},{"id":"s7-4","judul":"Kasus latihan","html":"<div class=\"box case\"><b>Kasus D.<\/b> Kapal memasuki alur pelabuhan. Dalam sepuluh menit suhu air tawar dua mesin pokok dan suhu oli pelumas naik bersamaan; tekanan air laut turun.<br><b>Telusuri:<\/b> Gangguan yang mengenai beberapa mesin sekaligus menunjuk pada bagian yang dipakai bersama, yaitu pasokan air laut. Gambar 7.2: periksa saringan dan kotak laut; perairan pelabuhan penuh sampah dan lumpur. Pertimbangkan pindah ke kotak laut lain sesuai manual.<\/div>\n<div class=\"box case\"><b>Kasus E.<\/b> Satu diesel generator suhunya naik perlahan dari hari ke hari pada beban yang sama. Tekanan air laut normal. Selisih suhu air laut masuk–keluar cooler makin kecil.<br><b>Telusuri:<\/b> Gambar 7.1, pertanyaan kelima. Aliran ada, tetapi panas tidak berpindah: cooler kotor. Rencanakan pembersihan dan periksa anoda seng.<\/div>\n<div class=\"box case\"><b>Kasus F.<\/b> Level tangki ekspansi satu mesin turun setiap jaga walau tidak ada bocor terlihat. Pada pemeriksaan, oli di tongkat duga tampak keruh keabu-abuan.<br><b>Telusuri:<\/b> Gambar 7.3, pertanyaan kedua. Air masuk ke oli pelumas. Ini gangguan berat: mesin dihentikan sesuai prosedur dan dilaporkan; jangan dijalankan sebelum sebabnya ditemukan.<\/div>"},{"id":"s7-5","judul":"Kegiatan","html":"<div class=\"box act\"><b>Kegiatan 5.1 — Siap sebelum gangguan datang<\/b>\n<ol>\n<li>Cari di manual: prosedur darurat suhu air pendingin tinggi untuk mesin pokok. Salin butir-butir utamanya ke buku catatan.<\/li>\n<li>Catat di lembar data kapal di buku (Lampiran A) cara berpindah kotak laut dan cara berpindah pompa air laut menurut manual.<\/li>\n<li>Dari jurnal jaga, hitung berapa liter air ditambahkan ke tangki ekspansi tiap mesin selama seminggu. Adakah yang menonjol?<\/li>\n<li>Latih Kasus D, E dan F berpasangan seperti pada Modul 3.<\/li>\n<\/ol><\/div>"}]},{"n":6,"judul":"Keselamatan, Perawatan Pencegahan, Pencatatan dan Pelaporan","lead":"Gangguan terbaik adalah gangguan yang tidak jadi terjadi, dan perbaikan terbaik adalah yang tidak mencederai siapa pun.","bagian":[{"id":"s8-1","judul":"Keselamatan kerja","html":"<div class=\"box goal\"><b>Tujuan modul<\/b><br>Setelah modul ini Anda dapat (1) menyebut bahaya utama pekerjaan sistem pendingin dan cara mengendalikannya, (2) menjelaskan butir perawatan pencegahan, (3) memakai jurnal untuk melihat kecenderungan, dan (4) menyusun laporan gangguan.<\/div>\n\n\n<h3><span class=\"lv d\">DASAR<\/span> Bahaya dan pengendaliannya<\/h3>\n<div class=\"tw\"><table id=\"t8-1\"><caption>Tabel 8.1 Bahaya pekerjaan sistem pendingin dan pengendaliannya<\/caption>\n<tr><th style=\"width:28%\">Bahaya<\/th><th style=\"width:32%\">Akibat<\/th><th>Pengendalian<\/th><\/tr>\n<tr><td>Refrigeran cair mengenai kulit atau mata<\/td><td>Luka beku<\/td><td>Kacamata pelindung dan sarung tangan; jangan melonggarkan sambungan bertekanan<\/td><\/tr>\n<tr><td>Gas refrigeran bocor di ruang tertutup<\/td><td>Mendesak udara; sesak sampai pingsan<\/td><td>Ventilasi jalan; tinggalkan ruangan bila bocor besar; jangan masuk sendirian<\/td><\/tr>\n<tr><td>Refrigeran terkena api atau permukaan sangat panas<\/td><td>Dapat terurai menjadi gas beracun<\/td><td>Tidak ada api, las atau rokok di dekat kebocoran<\/td><\/tr>\n<tr><td>Tabung refrigeran dipanaskan atau terisi berlebih<\/td><td>Tabung dapat pecah<\/td><td>Jangan memanaskan tabung dengan api; simpan tegak, terikat, jauh dari panas<\/td><\/tr>\n<tr><td>Tekanan tinggi di sisi tekan<\/td><td>Semburan, pecahnya komponen<\/td><td>Jangan mengakali pengaman HP; turunkan tekanan sebelum membuka<\/td><\/tr>\n<tr><td>Air pendingin panas bertekanan<\/td><td>Luka bakar<\/td><td>Jangan membuka tutup/keran saat panas; tunggu dingin<\/td><\/tr>\n<tr><td>Bagian berputar: sabuk, kopling, kipas<\/td><td>Terjepit, terpotong<\/td><td>Pelindung terpasang; tidak memakai pakaian longgar<\/td><\/tr>\n<tr><td>Listrik motor dan rangkaian kontrol<\/td><td>Sengatan listrik<\/td><td>Putuskan sumber, kunci dan beri tanda sebelum bekerja<\/td><\/tr>\n<tr><td>Membuka katup atau saringan air laut<\/td><td>Air laut masuk kapal<\/td><td>Pastikan katup isap laut tertutup dan terbukti rapat; ada perintah dan pengawasan<\/td><\/tr>\n<tr><td>Bahan kimia air pendingin<\/td><td>Iritasi kulit dan mata<\/td><td>Sarung tangan dan kacamata; ikuti petunjuk pada kemasan<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box warn\"><b>PERINGATAN — lima larangan<\/b>\n<ol>\n<li>Dilarang menyambung langsung (<i>jumper<\/i>) atau mengganjal alat pengaman.<\/li>\n<li>Dilarang mereset pengaman berulang kali tanpa menemukan sebabnya.<\/li>\n<li>Dilarang membuang refrigeran ke udara dengan sengaja; tampung ke tabung dengan alat penampung (<i>recovery<\/i>).<\/li>\n<li>Dilarang membuka sistem bertekanan atau panas.<\/li>\n<li>Dilarang bekerja pada katup laut, saringan air laut atau cooler tanpa perintah, pengawasan dan penandaan.<\/li>\n<\/ol><\/div>"},{"id":"s8-2","judul":"Perawatan pencegahan","html":"<h3><span class=\"lv m\">MENENGAH<\/span> Yang dirawat dan mengapa<\/h3>\n<p>Selang waktu perawatan ditetapkan oleh pabrik dan oleh sistem pemeliharaan terencana kapal. Tabel 8.2 hanya menyebut <i>apa<\/i> yang dirawat dan <i>mengapa<\/i>; kolom selang waktu Anda isi dari manual.<\/p>\n<div class=\"tw\"><table id=\"t8-2\"><caption>Tabel 8.2 Butir perawatan pencegahan sistem pendingin<\/caption>\n<tr><th style=\"width:36%\">Butir perawatan<\/th><th style=\"width:40%\">Gangguan yang dicegah<\/th><th>Selang waktu (isi dari manual)<\/th><\/tr>\n<tr><td>Membersihkan saringan air laut<\/td><td>Aliran air laut kurang; suhu naik di semua sistem<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Memeriksa dan mengganti anoda seng<\/td><td>Karat dan bocor pada cooler dan kondensor<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Membersihkan cooler dan kondensor<\/td><td>Suhu air tinggi; tekanan tekan tinggi<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Menguji mutu air tawar pendingin<\/td><td>Karat dan kerak di jaket silinder<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Memeriksa sabuk, kopling dan perapat pompa<\/td><td>Pompa lemah, bocor<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Menguji alarm dan pengaman<\/td><td>Pengaman gagal bekerja saat dibutuhkan<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Memeriksa kebocoran refrigeran<\/td><td>Isi kurang, pendinginan lemah<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Memeriksa level dan mutu oli kompresor<\/td><td>Kerusakan kompresor<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Mengganti elemen filter-drier<\/td><td>TEV tersumbat es atau kotoran<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Membersihkan saringan udara dan koil AC<\/td><td>Ruangan kurang dingin<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Memeriksa defrost, paking pintu, isolasi kamar dingin<\/td><td>Evaporator ber-es, suhu kamar naik<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Menggerakkan katup-katup laut<\/td><td>Katup macet saat darurat<\/td><td class=\"blank\"><\/td><\/tr>\n<\/table><\/div>"},{"id":"s8-3","judul":"Pencatatan: jurnal sebagai alat diagnosis","html":"<h3><span class=\"lv m\">MENENGAH<\/span> Melihat kecenderungan<\/h3>\n<p>Satu angka hanya berkata \"normal\" atau \"tidak normal\". Deretan angka dari jaga ke jaga menunjukkan <b>kecenderungan<\/b> (<i>trend<\/i>), dan kecenderungan memberi waktu untuk bertindak sebelum alarm berbunyi (Gambar 8.1).<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 256\" width=\"100%\"><polyline points=\"70.0,220.0 70.0,20.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"70.0,20.0 73.0,26.3 67.0,26.3\" fill=\"#333\"/><polyline points=\"70.0,220.0 610.0,220.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"610.0,220.0 603.7,223.0 603.7,217.0\" fill=\"#333\"/><text x=\"30.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"30.0\" y=\"104.9\">Suhu air<\/tspan><tspan x=\"30.0\" y=\"117.3\">tawar<\/tspan><tspan x=\"30.0\" y=\"129.7\">keluar<\/tspan><tspan x=\"30.0\" y=\"142.0\">mesin<\/tspan><\/text><text x=\"340.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"340.0\" y=\"247.7\">Waktu (jam jaga berturut-turut)<\/tspan><\/text><rect x=\"70\" y=\"100\" width=\"530\" height=\"60\" fill=\"#e5f5ea\"/><text x=\"596.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"end\" fill=\"#1f8a4c\" font-weight=\"600\"><tspan x=\"596.0\" y=\"113.3\">rentang normal (dari manual)<\/tspan><\/text><line x1=\"70\" y1=\"60\" x2=\"600\" y2=\"60\" stroke=\"#d9432f\" stroke-dasharray=\"6 4\" stroke-width=\"1.5\"/><text x=\"596.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"end\" fill=\"#d9432f\" font-weight=\"600\"><tspan x=\"596.0\" y=\"55.3\">batas alarm<\/tspan><\/text><polyline points=\"90,140 140,138 190,141 240,136 290,133 340,127 390,120 440,110 490,96 540,80 580,66\" fill=\"none\" stroke=\"#1d0b78\" stroke-width=\"2.5\"/><circle cx=\"90\" cy=\"140\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"140\" cy=\"138\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"190\" cy=\"141\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"240\" cy=\"136\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"290\" cy=\"133\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"340\" cy=\"127\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"390\" cy=\"120\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"440\" cy=\"110\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"490\" cy=\"96\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"540\" cy=\"80\" r=\"3.5\" fill=\"#1d0b78\"/><circle cx=\"580\" cy=\"66\" r=\"3.5\" fill=\"#1d0b78\"/><polyline points=\"300.0,190.0 345.0,134.0\" fill=\"none\" stroke=\"#b58900\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"345.0,134.0 343.4,140.8 338.7,137.0\" fill=\"#b58900\"/><text x=\"300.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#7a5c00\" font-weight=\"600\"><tspan x=\"300.0\" y=\"203.4\">di sini kecenderungan naik sudah terlihat: mulai mencari sebab<\/tspan><\/text><text x=\"340.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#777\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"340.0\" y=\"17.3\">Ilustrasi saja, bukan data kapal<\/tspan><\/text><\/svg><figcaption><b>Gambar 8.1<\/b> Contoh kecenderungan suhu yang naik perlahan sebelum mencapai batas alarm<\/figcaption><\/figure>\n<ul>\n<li>Catat angka pada keadaan yang sebanding: beban dan suhu air laut dicatat bersama, sebab keduanya memengaruhi semua suhu lain.<\/li>\n<li>Tulis angka sebenarnya, bukan menyalin jaga sebelumnya. Jurnal yang \"rapi\" tetapi tidak jujur menghilangkan tanda peringatan dini.<\/li>\n<li>Catat juga hal yang tidak berupa angka: bunyi, getaran, embun es, noda oli, air yang ditambahkan.<\/li>\n<\/ul>"},{"id":"s8-4","judul":"Pelaporan","html":"<h3><span class=\"lv l\">LANJUT<\/span> Laporan gangguan yang berguna<\/h3>\n<p>Laporan yang baik membuat atasan dapat memutuskan tanpa harus bertanya ulang. Urutannya:<\/p>\n<ol>\n<li><b>Apa dan di mana:<\/b> peralatan dan nomor unitnya.<\/li>\n<li><b>Gejala:<\/b> angka sebenarnya dibanding angka normal; sejak kapan.<\/li>\n<li><b>Yang sudah diperiksa dan hasilnya.<\/b><\/li>\n<li><b>Dugaan sebab<\/b>, dengan tegas dibedakan dari yang sudah terbukti.<\/li>\n<li><b>Tindakan yang sudah dan akan diambil<\/b>, serta bantuan atau suku cadang yang diperlukan.<\/li>\n<li><b>Akibat bagi kesiapan kapal:<\/b> apa yang tidak dapat dilakukan selama gangguan berlangsung.<\/li>\n<\/ol>\n<div class=\"box key\"><b>Contoh laporan lisan singkat:<\/b> \"Lapor, unit AC nomor dua berhenti oleh pengaman tekanan tinggi pukul 14.10. Tekanan tekan sebelum berhenti di atas normal, suhu air laut keluar kondensor naik. Saringan air laut sudah diperiksa, kotor. Sedang dibersihkan, perkiraan selesai tiga puluh menit. Unit nomor satu jalan normal memikul beban.\"<\/div>"},{"id":"s8-5","judul":"Kegiatan","html":"<div class=\"box act\"><b>Kegiatan 6.1 — Menutup pembelajaran<\/b>\n<ol>\n<li>Isi kolom selang waktu Tabel 8.2 dari manual dan sistem pemeliharaan terencana kapal.<\/li>\n<li>Ambil satu parameter dari jurnal 14 hari terakhir (misalnya suhu air tawar keluar satu mesin). Gambar grafiknya. Adakah kecenderungan?<\/li>\n<li>Tulis laporan gangguan tertulis untuk salah satu kasus latihan (A sampai F) dengan enam butir di atas.<\/li>\n<li>Minta pembina menilai praktik Anda dengan rubrik rubrik di buku (Lampiran E).<\/li>\n<\/ol><\/div>"}]}],"quiz":{"1":{"pg":[{"q":"Panas yang dipakai untuk mengubah cairan menjadi uap tanpa menaikkan suhu disebut …","o":["panas sensibel","panas laten","panas jenis","panas buang"],"a":1,"e":"Panas laten mengubah wujud, bukan suhu. Karena besar, panas inilah yang dimanfaatkan mesin pendingin."},{"q":"Bila tekanan di atas suatu cairan diturunkan, maka cairan itu …","o":["mendidih pada suhu lebih tinggi","mendidih pada suhu lebih rendah","tidak dapat mendidih","membeku"],"a":1,"e":"Titik didih mengikuti tekanan: tekanan turun, titik didih turun."},{"q":"Air tawar yang mengalir membawa panas dari mesin ke cooler adalah contoh perpindahan panas secara …","o":["hantaran","pancaran","aliran (konveksi)","gesekan"],"a":2,"e":"Panas dibawa oleh cairan yang mengalir: konveksi."},{"q":"Tiga hal yang menentukan kemampuan sebuah cooler adalah …","o":["warna, berat, umur","luas, beda suhu, aliran","tekanan, putaran, tegangan","merek, tipe, ukuran"],"a":1,"e":"Luas permukaan bersih, beda suhu kedua cairan, dan aliran."},{"q":"Pembuangan akhir hampir semua panas di kapal adalah …","o":["udara kamar mesin","tangki ekspansi","air laut","oli pelumas"],"a":2,"e":"Semua jalur panas berujung di air laut."}],"isi":[{"q":"Panas yang mengubah wujud zat tanpa menaikkan suhunya disebut panas ____.","a":["laten"],"e":"Panas laten = panas tersembunyi."},{"q":"Alat tempat dua cairan bertukar panas tanpa bercampur disebut penukar ____.","a":["kalor","panas"],"e":"Penukar kalor (heat exchanger), di lapangan disebut cooler."},{"q":"Bila tekanan dinaikkan, uap mengembun pada suhu yang lebih ____.","a":["tinggi"],"e":"Tekanan naik, suhu embun naik."},{"q":"Tiga penentu kemampuan cooler adalah luas, beda suhu, dan ____.","a":["aliran"],"e":"Luas, beda suhu, aliran."}],"sk":[{"judul":"Kapal masuk perairan hangat","cerita":"Kapal berpindah dari laut lepas ke teluk yang dangkal. Dalam beberapa jam, tekanan tekan semua unit mesin pendingin naik bersamaan, tetapi belum mencapai alarm. Tidak ada pekerjaan perawatan sebelumnya.","data":["Suhu air laut masuk kondensor: naik dibanding kemarin","Tekanan tekan semua unit: naik bersamaan","Tekanan isap: hampir tetap"],"langkah":[{"q":"Dari tiga penentu kemampuan penukar kalor, mana yang paling mungkin berubah?","o":["Luas permukaan mendadak berkurang","Beda suhu mengecil karena air laut lebih hangat","Aliran refrigeran bertambah","Tidak ada yang berubah"],"a":1,"e":"Air laut yang lebih hangat memperkecil beda suhu di kondensor."},{"q":"Mengapa semua unit terkena pada waktu yang sama?","o":["Semua unit rusak bersamaan","Semua unit membuang panas ke media yang sama, yaitu air laut","Karena refrigeran semua unit bocor","Karena termostat ruangan salah setel"],"a":1,"e":"Gangguan serentak menunjuk pada bagian yang dipakai bersama."},{"q":"Tindakan jaga yang paling tepat adalah …","o":["Menambah refrigeran ke semua unit","Menyetel katup ekspansi","Mencatat, mengamati kecenderungan, memeriksa saringan dan aliran air laut, lalu melapor","Mereset pengaman tekanan tinggi"],"a":2,"e":"Amati dan pastikan aliran air laut; perairan dangkal juga membawa lumpur dan sampah."}],"esai":"Tulis dengan kalimat sendiri: mengapa perairan dangkal dapat memberi dua akibat sekaligus pada kondensor?","model":"Air di perairan dangkal lebih hangat sehingga beda suhu mengecil, dan lebih banyak lumpur serta sampah sehingga saringan cepat kotor dan aliran berkurang. Keduanya menaikkan tekanan tekan."},{"judul":"Pintu kamar dingin sering terbuka","cerita":"Selesai memuat bekal, pintu kamar sayur berkali-kali dibuka. Suhu kamar naik dan lapisan es pada evaporator menebal lebih cepat dari biasanya.","data":["Suhu kamar: di atas setelan","Evaporator: lapisan es menebal","Tekanan isap dan tekan: masih dalam rentang normal"],"langkah":[{"q":"Dari mana asal es pada evaporator?","o":["Dari refrigeran yang bocor","Dari uap air di udara luar yang masuk lalu membeku","Dari oli kompresor","Dari air laut"],"a":1,"e":"Udara luar yang lembap membawa uap air; uap itu membeku pada permukaan dingin."},{"q":"Mengapa lapisan es merugikan?","o":["Es menambah berat kamar","Es menghambat perpindahan panas dan aliran udara","Es menaikkan tekanan tekan","Es merusak termostat"],"a":1,"e":"Es bekerja seperti selimut: luas efektif dan aliran udara berkurang."},{"q":"Tindakan yang tepat adalah …","o":["Menambah refrigeran","Menurunkan setelan termostat sejauh mungkin","Menertibkan pemakaian pintu, memastikan defrost bekerja, dan memantau suhu","Mematik ipas yang meniupkan udara dingin ke ruangan."],["Anoda seng","Batang seng yang sengaja dibiarkan termakan karat agar logam cooler terlindung."],["Bilga (got)","Bagian terbawah ruangan mesin tempat air dan oli bocoran terkumpul."],["Bulb","Tabung peraba suhu pada katup ekspansi termostatik, dijepit di pipa keluar evaporator."],["Bypass","Jalan pintas aliran yang melewatkan suatu komponen."],["Charge air cooler","Pendingin udara bilas: mendinginkan udara dari turbocharger sebelum masuk silinder."],["Chilled water","Air dingin yang didinginkan mesin pendingin lalu diedarkan ke unit pengolah udara."],["Chiller","Pendingin air: evaporator yang mendinginkan air untuk sistem AC."],["Cooler","Sebutan lapangan untuk penukar kalor yang berfungsi mendinginkan."],["Cut-in / cut-out","Tekanan atau suhu saat saklar otomatis menyambung / memutus."],["Defrost","Pencairan lapisan es pada evaporator kamar dingin."],["DG (diesel generator)","Mesin diesel yang menggerakkan generator listrik."],["Discharge","Sisi keluar (sisi tekan) kompresor atau pompa."],["Evaporator","Penguap: tempat refrigeran menguap sambil menyerap panas."],["Fan coil unit","Unit pendingin udara kecil di ruangan, berisi koil air dingin dan kipas."],["Fault finding","Judul bagian pencarian gangguan dalam buku manual berbahasa Inggris."],["Filter-drier","Saringan pengering: menyaring kotoran dan menyerap uap air dari refrigeran."],["Heat exchanger","Penukar kalor: alat tempat dua cairan bertukar panas tanpa bercampur."],["HP (high pressure)","Tekanan tinggi; HP cut-out = saklar pengaman tekanan tinggi."],["HT (high temperature)","Rangkaian air tawar pendingin bersuhu tinggi (jaket dan kepala silinder)."],["Impeler","Roda bersudu di dalam pompa sentrifugal."],["Inhibitor","Bahan kimia penghambat karat yang dicampurkan ke air tawar pendingin."],["Jaket silinder","Rongga air pendingin di sekeliling silinder mesin."],["Jumper","Kabel sambung langsung yang melewatkan suatu saklar; dilarang pada alat pengaman."],["Kavitasi","Gelembung uap di dalam pompa akibat tekanan isap terlalu rendah; merusak impeler."],["KKM","Kepala Kamar Mesin."],["Kompresor","Mesin yang mengisap dan memampatkan uap refrigeran."],["Kondensor","Pengembun: tempat gas refrigeran panas didinginkan sampai menjadi cairan."],["Line-up","Susunan posisi buka-tutup katup untuk suatu cara operasi."],["LP (low pressure)","Tekanan rendah; LP cut-out = saklar pengaman tekanan rendah."],["LT (low temperature)","Rangkaian air tawar pendingin bersuhu rendah (oli, udara bilas, mesin bantu)."],["Mechanical seal","Perapat poros pompa dari dua permukaan halus yang saling menekan."],["MRLF (Multi-Role Light Frigate)","Fregat ringan serbaguna; sebutan jenis KRI kelas Bung Tomo."],["Oil separator","Pemisah oli: menangkap oli yang terbawa gas refrigeran dari kompresor."],["Overboard","Pembuangan ke luar lambung kapal (ke laut)."],["Overload","Beban lebih; pengaman overload memutus motor listrik yang arusnya berlebihan."],["Panas laten","Panas yang mengubah wujud zat tanpa mengubah suhunya."],["Panas sensibel","Panas yang mengubah suhu zat dan terbaca pada termometer."],["Purging","Pembuangan udara atau gas tak terembunkan dari kondensor."],["Receiver","Tabung penampung refrigeran cair setelah kondensor."],["Recovery","Penampungan refrigeran dari sistem ke tabung dengan alat khusus."],["Refrigeran","Zat kerja mesin pendingin yang menguap dan mengembun bergantian."],["Sea chest","Kotak laut: ceruk berkisi di lambung kapal tempat air laut diisap."],["Shell and tube","Jenis penukar kalor berbentuk selongsong berisi berkas pipa."],["Short cycling","Kompresor hidup-mati terlalu sering."],["Sight glass","Kaca duga: jendela kecil untuk melihat aliran cairan atau level."],["Solenoid (katup)","Katup buka-tutup yang digerakkan kumparan listrik."],["Strainer","Saringan kasar, misalnya saringan air laut."],["Subcooling","Dingin lanjut: selisih suhu embun dan suhu cairan keluar kondensor."],["Suction","Sisi masuk (sisi isap) kompresor atau pompa."],["Superheat","Panas lanjut: selisih suhu uap keluar evaporator dan suhu didih pada tekanan isap."],["Tabel jenuh","Tabel pasangan tekanan dan suhu didih/embun suatu refrigeran."],["Tangki ekspansi","Tangki pemuaian di titik tinggi rangkaian air tawar pendingin."],["TEV (thermostatic expansion valve)","Katup ekspansi termostatik: mengatur aliran refrigeran ke evaporator."],["Trend","Kecenderungan naik atau turunnya suatu angka dari waktu ke waktu."],["Trouble shooting","Pencarian dan penyelesaian gangguan secara berurutan."],["Venting","Pembuangan udara terperangkap dari pipa atau rumah pompa."],["Volute","Rumah pompa sentrifugal berbentuk rumah siput."]],"refs":[["Wikipedia. “Bung Tomo-class corvette.” Diakses 20 November 2026.","https://en.wikipedia.org/wiki/Bung_Tomo-class_corvette","Sumber terbuka; data umum kapal."],["Wikipedia. “KRI Bung Tomo.” Diakses 20 November 2026.","https://en.wikipedia.org/wiki/KRI_Bung_Tomo","Sumber terbuka; riwayat kapal."],["Maritime Activity Reports. “Ruston’s RK270 Engines Power Offshore Patrol Vessels.” MarineLink, 4 Oktober 2001.","https://www.marinelink.com/news/offshore-engines-rustons325401","Berita industri; jenis mesin penggerak."],["McGeorge, H. D. Marine Auxiliary Machinery, edisi ke-7. Oxford: Butterworth-Heinemann, 1995. ISBN 978-0-7506-1843-4.","https://shop.elsevier.com/books/marine-auxiliary-machinery/mcgeorge/978-0-7506-1843-4","Buku teks; naskah lengkap berbayar. Memuat bab penukar kalor, refrigerasi, serta pemanasan, ventilasi dan AC."],["Kantharia, R. “8 Most Common Problems Found in Ship’s Refrigeration System.” Marine Insight, 28 September 2019 (diperbarui 9 Mei 2024).","https://www.marineinsight.com/refrigeration-air-conditioning/8-most-common-problems-found-in-ships-refrigeration-system/","Artikel praktisi; akses bebas."],["Marine Insight. “How to Charge Refrigeration Plant on Ships?”","https://www.marineinsight.com/how-to-charge-refrigeration-plant-on-ships/","Artikel praktisi; akses bebas."],["Marine Insight. “General Overview of Central Cooling System on Ships.”","https://www.marineinsight.com/general-overview-of-central-cooling-system-on-ships/","Artikel praktisi; akses bebas."],["Danfoss A/S. Fitters Notes: Trouble shooting. DKRCC.PF.000.G1.02 / 520H1459, Oktober 2006.","https://assets.danfoss.com/documents/50950/AX271143152169en-000101.pdf","Dokumen pabrikan; akses bebas (PDF)."],["Taylor, D. A. Introduction to Marine Engineering, edisi ke-2 (revisi). Oxford: Butterworth-Heinemann, 1996.","","Buku teks; naskah lengkap berbayar atau tersedia di perpustakaan."],["Marinediesels.info. “How The Engine Is Cooled.”","https://marinediesels.info/Basics/cooling_the_engine.htm","Bahan ajar daring; akses bebas."],["Lopulalan, P. M., Surnata, S., Santoso, R., dan Firzatullah, R. M. “Factors Causing an Increase in the Main Engine’s Cooler Fresh Water Temperature KMP. Port Link III.” Proceedings of IWPOSPA-TE 2025, Advances in Engineering Research vol. 302. Atlantis Press, 2026. DOI 10.2991/978-94-6239-731-6_19.","https://www.atlantis-press.com/article/126025990.pdf","Makalah prosiding; akses terbuka (PDF)."],["Alfa Laval. “Heating and cooling in the engine room.”","https://alfalaval.com/nl/industrieen/scheepvaart-en-transport/marine/verwarmen-en-koelen/heating-and-cooling-in-the-engine-room","Halaman pabrikan; akses bebas."],["ACHR News. “The Professor: Symptoms of Air in a Refrigeration System.”","https://achrnews.com/articles/129746-the-professor-symptoms-of-air-in-a-refrigeration-system","Artikel majalah industri; akses bebas."],["Merchant Navy Decoded. “Marine Air Conditioning System Troubleshooting: Common Problems and Solutions.”","https://www.merchantnavydecoded.com/marine-air-conditioning-system-troubleshooting/","Artikel praktisi; akses bebas."],["Merchant Navy Decoded. “Central Cooling System.”","https://www.merchantnavydecoded.com/central-cooling-system/","Artikel praktisi; akses bebas."],["Integrated Publishing (tpub.com). “Types of Cooling Systems” (bahan pelatihan Engineman).","https://tpub.com/engine3/en32-14.htm","Bahan pelatihan; akses bebas."]],"pengantar":"\n\n<h2>Latar belakang<\/h2>\n<p>Kapal perang adalah kumpulan mesin yang menghasilkan panas. Mesin pokok membakar bahan bakar, generator memikul beban listrik, peralatan elektronik bekerja tanpa henti, dan awak kapal hidup di ruangan tertutup di perairan tropis. Semua panas itu harus dibuang. Bila tidak, mesin rusak, peralatan elektronik mati, bahan makanan membusuk, dan awak kapal tidak dapat bekerja dengan baik.<\/p>\n<p>Tugas membuang panas dikerjakan oleh <b>sistem pendingin<\/b>. Dalam modul ini istilah tersebut mencakup dua kelompok besar:<\/p>\n<ol>\n<li><b>Mesin pendingin<\/b>, yaitu mesin yang memakai refrigeran untuk mendinginkan udara ruangan (pengatur udara atau AC) dan kamar dingin bahan makanan.<\/li>\n<li><b>Sistem pendingin mesin penggerak<\/b>, yaitu rangkaian air tawar dan air laut yang menjaga suhu mesin pokok, diesel generator dan perlengkapannya.<\/li>\n<\/ol>\n<p>Gangguan pada sistem pendingin jarang datang tiba-tiba. Hampir selalu ada tanda awal: angka yang bergeser sedikit demi sedikit, bunyi yang berubah, embun es di tempat yang tidak biasa. Prajurit jaga yang terlatih melihat tanda itu lebih dulu, lalu mencari sebabnya secara berurutan. Kemampuan inilah yang disebut <i>trouble shooting<\/i> (pencarian dan penyelesaian gangguan).<\/p>\n\n<div class=\"box term\"><b>Istilah<\/b><br><i>Trouble shooting<\/i> = pencarian gangguan: cara kerja berurutan untuk menemukan sebab sebuah gangguan, memperbaikinya, dan memastikan gangguan itu tidak terulang. <i>Refrigeran<\/i> = zat kerja mesin pendingin yang mudah menguap dan mengembun, sering disebut \"freon\" di lapangan (Freon sebenarnya nama dagang).<\/div>\n\n<h2>Tujuan modul<\/h2>\n<p>Setelah menyelesaikan modul ini, prajurit muda Departemen Mesin diharapkan mampu:<\/p>\n<ol>\n<li>menjelaskan ke mana panas di kapal berpindah dan media apa yang membawanya;<\/li>\n<li>menjelaskan cara kerja mesin pendingin dan sistem pendingin mesin penggerak beserta fungsi tiap komponennya;<\/li>\n<li>membaca parameter kerja (tekanan, suhu, level) dan membedakan keadaan normal dari tidak normal;<\/li>\n<li>mencari sebab gangguan yang umum dengan langkah berurutan memakai tabel gejala dan bagan alir;<\/li>\n<li>bekerja dengan selamat, mencatat temuan, dan melapor dengan benar kepada atasan.<\/li>\n<\/ol>\n\n<h2>Sekilas tentang kapal<\/h2>\n<p>KRI Bung Tomo-357 adalah kapal pertama dari tiga kapal kelas Bung Tomo, yang dikenal juga sebagai <i>Multi-Role Light Frigate<\/i> atau MRLF (fregat ringan serbaguna). Data umum yang tersedia di sumber terbuka dirangkum pada Tabel 1.1.<\/p>\n\n<div class=\"tw\"><table id=\"t1-1\"><caption>Tabel 1.1 Data umum KRI kelas Bung Tomo dari sumber terbuka<\/caption>\n<tr><th style=\"width:36%\">Uraian<\/th><th>Keterangan<\/th><\/tr>\n<tr><td>Kapal dalam kelas<\/td><td>KRI Bung Tomo-357, KRI John Lie-358, KRI Usman Harun-359 [1]<\/td><\/tr>\n<tr><td>Jenis<\/td><td>Korvet F2000 / <i>Multi-Role Light Frigate<\/i> (MRLF) [1]<\/td><\/tr>\n<tr><td>Galangan pembuat<\/td><td>BAE Systems Marine, Scotstoun, Glasgow, Inggris; dibangun 1998–2002 [1]<\/td><\/tr>\n<tr><td>Riwayat<\/td><td>Semula dibangun untuk Angkatan Laut Brunei (kelas Nakhoda Ragam); KRI Bung Tomo eks KDB Jerambak, masuk dinas TNI AL 11 Juli 2014 [1][2]<\/td><\/tr>\n<tr><td>Bobot benaman<\/td><td>1.940 ton [1]<\/td><\/tr>\n<tr><td>Ukuran utama<\/td><td>Panjang 95 m (seluruhnya), lebar 12,8 m, sarat 3,6 m [1]<\/td><\/tr>\n<tr><td>Mesin penggerak<\/td><td>Empat mesin diesel MAN B&amp;W Ruston 20RK270 (20 silinder), dua poros [1][3]<\/td><\/tr>\n<tr><td>Kecepatan<\/td><td>30 knot [1]<\/td><\/tr>\n<tr><td>Awak<\/td><td>79 orang [1]<\/td><\/tr>\n<\/table><\/div>\n\n<div class=\"box note\"><b>Batas data<\/b><br>Sumber terbuka tidak memuat rincian sistem pendingin kapal ini: merek dan tipe mesin pendingin, jenis refrigeran, jumlah pompa, tekanan dan suhu kerja. Modul ini <b>tidak mengarang<\/b> data tersebut. Semua angka khusus kapal harus Anda salin sendiri dari buku manual kapal ke lembar data kapal di buku (Lampiran A). Di seluruh buku, tempat yang perlu diisi ditandai dengan kotak kuning bergaris putus.<\/div>\n\n<h2>Aturan keselamatan sebelum mulai<\/h2>\n<div class=\"box warn\"><b>PERINGATAN<\/b>\n<ul>\n<li>Modul ini bahan belajar, bukan izin kerja. Jangan membuka, menyetel atau melepas komponen apa pun tanpa perintah dan pengawasan personel yang berwenang.<\/li>\n<li>Kegiatan \"telusuri dan catat\" dilakukan dengan mata dan catatan, bukan dengan memutar katup.<\/li>\n<li>Refrigeran, air panas bertekanan, bagian berputar dan listrik dapat mencederai. Bab VIII memuat rinciannya; baca bab itu sebelum mengikuti pekerjaan perawatan apa pun.<\/li>\n<\/ul><\/div>\n\n<!-- ===================== BAB II ===================== -->\n","adegan":["Ke mana panas di kapal mengalir","Siklus mesin pendingin: empat komponen utama","Membaca dua manometer: empat kemungkinan","Sistem pendingin mesin: air tawar dan air laut","Lima langkah pencarian gangguan","Contoh kasus: tekanan tekan tinggi saat berlabuh","Contoh kasus: suhu air tawar pendingin naik","Keselamatan dan penutup"]};</script>
<script>(() => {
const C = window.LMS_CFG, D = window.LMS_DATA, app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PASS = 70, NM = 'KABUZEN PENDINGIN KAPAL';
let U = null, ATT = [], READ = {}, flash = null, quizRes = null, flowSt = null, busy = false, pemb = null;

/* ---------------- penyimpanan ---------------- */
const LS = {
  get() { try { return JSON.parse(localStorage.getItem('kpk') || '{}'); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('kpk', JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const Local = {
  async init() { const s = LS.get(); U = s.profile ? {...s.profile, role: 'siswa', id: 'lokal'} : null; ATT = s.att || []; READ = s.read || {}; },
  async register(f) { const s = LS.get(); s.profile = {nama: f.nama, pangkat: f.pangkat, bagian: f.bagian}; LS.set(s); await this.init(); return {ok: true}; },
  async logout() { localStorage.removeItem('kpk'); U = null; ATT = []; READ = {}; },
  async saveAttempt(a) { a.created_at = new Date().toISOString(); ATT.push(a); const s = LS.get(); s.att = ATT; LS.set(s); },
  async setRead(m, b, on) { const k = m + ':' + b; if (on) READ[k] = 1; else delete READ[k]; const s = LS.get(); s.read = READ; LS.set(s); }
};
const ERR = [[/invalid login/i, 'Email atau kata sandi salah.'], [/not confirmed/i, 'Email belum dikonfirmasi. Buka tautan konfirmasi di email Anda, lalu masuk lagi.'],
  [/already registered/i, 'Email ini sudah terdaftar. Silakan masuk.'], [/rate limit/i, 'Batas pengiriman email tercapai. Coba lagi beberapa saat lagi.'],
  [/password/i, 'Kata sandi minimal 8 karakter.'], [/fetch|network/i, 'Tidak dapat terhubung ke server. Periksa sambungan internet.']];
const terr = m => { for (const [r, t] of ERR) if (r.test(m)) return t; return 'Terjadi kesalahan: ' + m; };
const Online = {
  sb: null,
  async init() {
    this.sb = window.supabase.createClient(C.url, C.key);
    try { const {data} = await this.sb.auth.getSession(); await this.load(data.session); } catch (e) { flash = {t: 'e', m: terr(String(e.message || e))}; }
    this.sb.auth.onAuthStateChange((ev, s) => {
      if (ev === 'SIGNED_IN' && !U && s) setTimeout(async () => { await this.load(s); go('#/beranda'); render(); }, 0);
      if (ev === 'SIGNED_OUT' && U) { U = null; ATT = []; READ = {}; render(); }
    });
  },
  async load(session) {
    if (!session) { U = null; ATT = []; READ = {}; return; }
    const uid = session.user.id, sb = this.sb;
    const [p, a, r] = await Promise.all([sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      sb.from('attempts').select('*').eq('user_id', uid).order('created_at'), sb.from('reads').select('modul,bagian').eq('user_id', uid)]);
    const d = p.data || {};
    U = {id: uid, email: session.user.email, nama: d.nama || session.user.email, pangkat: d.pangkat || '', bagian: d.bagian || '', role: d.role || 'siswa'};
    ATT = a.data || []; READ = {}; (r.data || []).forEach(x => READ[x.modul + ':' + x.bagian] = 1);
  },
  async register(f) {
    const {data, error} = await this.sb.auth.signUp({email: f.email, password: f.password,
      options: {data: {nama: f.nama, pangkat: f.pangkat, bagian: f.bagian}, emailRedirectTo: location.origin + location.pathname}});
    if (error) return {err: terr(error.message)};
    if (data.user && data.user.identities && data.user.identities.length === 0) return {err: 'Email ini sudah terdaftar. Silakan masuk.'};
    if (data.session) { await this.load(data.session); return {ok: true}; }
    return {ok: true, confirm: true};
  },
  async login(f) {
    const {data, error} = await this.sb.auth.signInWithPassword({email: f.email, password: f.password});
    if (error) return {err: terr(error.message)};
    await this.load(data.session); return {ok: true};
  },
  async resend(email) { const {error} = await this.sb.auth.resend({type: 'signup', email, options: {emailRedirectTo: location.origin + location.pathname}}); return error ? {err: terr(error.message)} : {ok: true}; },
  async logout() { await this.sb.auth.signOut(); U = null; ATT = []; READ = {}; },
  async saveAttempt(a) {
    const {data, error} = await this.sb.from('attempts').insert({modul: a.modul, skor: a.skor, maks: a.maks, detail: a.detail}).select().single();
    if (error) throw new Error(error.message); ATT.push(data);
  },
  async setRead(m, b, on) {
    const k = m + ':' + b;
    if (on) { const {error} = await this.sb.from('reads').upsert({modul: m, bagian: b}); if (error) throw new Error(error.message); READ[k] = 1; }
    else { const {error} = await this.sb.from('reads').delete().eq('user_id', U.id).eq('modul', m).eq('bagian', b); if (error) throw new Error(error.message); delete READ[k]; }
  },
  async all() {
    const sb = this.sb;
    const [p, a, r] = await Promise.all([sb.from('profiles').select('*').order('nama'), sb.from('attempts').select('*').order('created_at'), sb.from('reads').select('user_id,modul,bagian')]);
    if (p.error) throw new Error(p.error.message);
    return {p: p.data || [], a: a.data || [], r: r.data || []};
  }
};
const S = C.online ? Online : Local;

/* ---------------- hitungan ---------------- */
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const best = (m, list = ATT) => { let b = null; list.filter(x => x.modul === m).forEach(x => { const p = pct(x.skor, x.maks); if (b === null || p > b) b = p; }); return b; };
const nread = (m, R = READ) => D.modul[m - 1].bagian.filter(b => R[m + ':' + b.id]).length;
const tuntas = (m, list = ATT, R = READ) => nread(m, R) === D.modul[m - 1].bagian.length && (best(m, list) ?? -1) >= PASS;
const overall = () => { let t = 0, d = 0; D.modul.forEach(M => { t += M.bagian.length + 1; d += nread(M.n) + ((best(M.n) ?? -1) >= PASS ? 1 : 0); }); return pct(d, t); };
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
const cekIsi = (ans, acc) => { const a = norm(ans); if (!a) return false; return acc.some(x => { const k = norm(x); return a === k || (' ' + a + ' ').includes(' ' + k + ' '); }); };
const tgl = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('id-ID', {day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}); };

/* ---------------- kerangka ---------------- */
const go = h => { if (location.hash !== h) location.hash = h; };
const route = () => (location.hash || '#/').slice(2).split('/').filter(Boolean);
function shell(body, cur) {
  const nav = [['beranda', 'Beranda'], ['pengantar', 'Pengantar'], ['animasi', 'Animasi'], ['pandu', 'Pandu Gangguan'], ['istilah', 'Istilah'], ['nilai', 'Nilai Saya']];
  if (U && U.role === 'pembina') nav.push(['pembina', 'Pembina']);
  nav.push(['akun', 'Akun']);
  return `<header class="top"><div class="bar"><img src="${D.logo}" alt="Logo KABUZEN"><div class="t">${NM}<small>LMS Trouble Shooting Sistem Pendingin Kapal${C.online ? '' : ' · mode offline'}</small></div><span class="chip">${esc(U.pangkat ? U.pangkat + ' ' : '')}${esc(U.nama)}</span></div>
  <nav class="nav" aria-label="Menu utama">${nav.map(([h, t]) => `<a href="#/${h}" class="${cur === h ? 'on' : ''}">${t}</a>`).join('')}</nav></header>
  <main class="wrap">${fl()}${body}</main><footer class="foot">${NM} · bahan belajar, tidak menggantikan buku manual kapal dan prosedur tetap satuan.<br>Seri KABUZEN · ${esc(D.author)}</footer>`;
}
const fl = () => { if (!flash) return ''; const f = flash; flash = null; return `<div class="alert ${f.t}" role="status">${f.m}</div>`; };

/* ---------------- halaman muka & akun ---------------- */
function vCover() {
  return `<div class="hero"><div class="in"><img class="lg" src="${D.logo}" alt="Logo KABUZEN"><div class="k">SERI KABUZEN</div>
  <h1>Selamat datang</h1><h2>di ${NM}</h2><div class="bars"><i style="background:#ffd60a"></i><i style="background:#35c7ee"></i><i style="background:#ff7a3d"></i><i style="background:#ff4d6d"></i></div>
  <p class="sub">Ruang belajar trouble shooting sistem pendingin kapal bagi prajurit muda Departemen Mesin KRI kelas Bung Tomo (MRLF).</p>${fl()}
  <div class="cta"><a class="btn y" href="#/daftar">Daftar</a>${C.online ? '<a class="btn g" href="#/masuk">Masuk</a>' : ''}</div>${C.online && C.offline ? `<p style="margin:-10px 0 18px"><a style="color:#fff" href="${C.offline}" download="KABUZEN_Pendingin_Kapal_LMS_Offline.html">Unduh versi offline</a> <span style="color:#cfd3ff;font-size:13px">untuk dibawa berlayar tanpa internet</span></p>` : ''}
  <ul><li>Enam modul berlapis: Dasar, Menengah, Lanjut</li><li>Kuis tiap modul: pilihan ganda, isian singkat dan analisis skenario</li><li>Pandu Gangguan: bagan alir interaktif langkah demi langkah</li><li>Video animasi dan daftar istilah</li></ul>
  <p class="note">${C.online ? 'Pendaftaran memakai email. Tautan konfirmasi dikirim ke email Anda sebelum dapat masuk.' : 'Mode offline: data belajar tersimpan hanya di perangkat ini dan tidak dikirim ke mana pun.'}<br>Bahan belajar ini tidak menggantikan buku manual kapal dan prosedur tetap satuan.</p></div></div>`;
}
function vDaftar(sent) {
  if (sent) return authWrap(`<h1 class="pt">Periksa email Anda</h1><div class="alert o">Pendaftaran diterima. Tautan konfirmasi sudah dikirim ke <b>${esc(sent)}</b>. Buka email itu, tekan tautan konfirmasi, lalu masuk.</div>
    <p class="muted">Belum menerima? Periksa folder spam, atau kirim ulang.</p><div class="row"><button class="btn g" data-act="resend" data-email="${esc(sent)}">Kirim ulang email</button><a class="btn" href="#/masuk">Ke halaman Masuk</a></div>`);
  return authWrap(`<h1 class="pt">Daftar</h1><p class="muted">${C.online ? 'Isi data di bawah. Konfirmasi pendaftaran dikirim ke email Anda.' : 'Isi nama Anda untuk mulai belajar di perangkat ini.'}</p>
  <form data-form="daftar" novalidate><label for="f-nama">Nama</label><input id="f-nama" name="nama" type="text" required maxlength="80" autocomplete="name">
  <label for="f-pangkat">Pangkat</label><input id="f-pangkat" name="pangkat" type="text" maxlength="40" placeholder="mis. Letda, Serda, Kld">
  <label for="f-bagian">Bagian / divisi</label><input id="f-bagian" name="bagian" type="text" maxlength="60" placeholder="mis. Departemen Mesin">
  ${C.online ? `<label for="f-email">Email</label><input id="f-email" name="email" type="email" required autocomplete="email">
  <label for="f-pw">Kata sandi (minimal 8 karakter)</label><input id="f-pw" name="password" type="password" required minlength="8" autocomplete="new-password">` : ''}
  <p><button class="btn y" type="submit">Daftar</button></p></form>${C.online ? '<p class="muted">Sudah punya akun? <a href="#/masuk">Masuk</a></p>' : ''}`);
}
function vMasuk() {
  return authWrap(`<h1 class="pt">Masuk</h1><form data-form="masuk" novalidate><label for="m-email">Email</label><input id="m-email" name="email" type="email" required autocomplete="email">
  <label for="m-pw">Kata sandi</label><input id="m-pw" name="password" type="password" required autocomplete="current-password"><p><button class="btn y" type="submit">Masuk</button></p></form>
  <p class="muted">Belum punya akun? <a href="#/daftar">Daftar</a></p>`);
}
const authWrap = b => `<header class="top"><div class="bar"><img src="${D.logo}" alt="Logo KABUZEN"><div class="t">${NM}<small>LMS Trouble Shooting Sistem Pendingin Kapal</small></div><a class="chip" style="color:#fff;text-decoration:none" href="#/">Halaman muka</a></div></header><main class="wrap" style="max-width:520px">${fl()}<div class="card">${b}</div></main>`;

function vAkun() {
  return shell(`<h1 class="pt">Akun</h1><div class="card"><div class="kv"><b>Nama</b><span>${esc(U.nama)}</span><b>Pangkat</b><span>${esc(U.pangkat || '-')}</span><b>Bagian</b><span>${esc(U.bagian || '-')}</span>${U.email ? `<b>Email</b><span>${esc(U.email)}</span>` : ''}<b>Peran</b><span>${U.role === 'pembina' ? 'Pembina' : 'Peserta'}</span><b>Mode</b><span>${C.online ? 'Online' : 'Offline (data di perangkat ini)'}</span></div></div>
  <div class="card">${C.online ? '<h3>Keluar</h3><p class="muted">Kemajuan dan nilai Anda tetap tersimpan di server.</p><button class="btn" data-act="logout">Keluar</button>'
    : '<h3>Hapus data di perangkat ini</h3><p class="muted">Menghapus nama, kemajuan dan semua nilai dari perangkat ini. Tidak dapat dikembalikan.</p><button class="btn d" data-act="reset1">Hapus semua data</button>'}</div>`, 'akun');
}

/* ---------------- beranda & modul ---------------- */
function vBeranda() {
  const o = overall();
  return shell(`<h1 class="pt">Selamat belajar, ${esc(U.nama)}</h1><p class="muted">Kemajuan keseluruhan: <b>${o}%</b></p><div class="pb" role="progressbar" aria-valuenow="${o}" aria-valuemin="0" aria-valuemax="100"><i style="width:${o}%"></i></div>
  <div class="grid" style="margin-top:14px">${D.modul.map(M => { const r = nread(M.n), t = M.bagian.length, b = best(M.n), ok = tuntas(M.n);
    return `<div class="card"><div class="row"><span class="mnum">MODUL ${M.n}</span><span class="sp"></span><span class="badge ${ok ? 'ok' : (r || b !== null ? 'w' : 'no')}">${ok ? 'TUNTAS' : (r || b !== null ? 'BERJALAN' : 'BELUM')}</span></div>
    <h3>${esc(M.judul)}</h3><p class="lead">${esc(M.lead)}</p><div class="muted">Materi ${r}/${t} · Kuis terbaik ${b === null ? '-' : b + '%'}</div><div class="pb"><i style="width:${pct(r, t)}%"></i></div>
    <div class="row" style="margin-top:8px"><a class="btn s" href="#/modul/${M.n}">Buka materi</a><a class="btn s g" href="#/kuis/${M.n}">Kuis</a></div></div>`; }).join('')}</div>
  <div class="card"><h3>Cara belajar</h3><ol style="margin:6px 0 0;padding-left:20px"><li>Buka materi modul, baca tiap bagian, lalu tandai selesai.</li><li>Kerjakan kuis modul. Modul tuntas bila semua bagian selesai dan nilai kuis minimal ${PASS}%.</li><li>Gunakan Pandu Gangguan untuk berlatih menelusuri bagan alir.</li><li>Buka buku manual kapal berdampingan; angka dan prosedur resmi ada di sana.</li></ol></div>`, 'beranda');
}
function vModul(m, i) {
  const M = D.modul[m - 1]; if (!M) return vBeranda();
  i = Math.min(Math.max(i || 0, 0), M.bagian.length - 1); const B = M.bagian[i], done = !!READ[m + ':' + B.id], last = i === M.bagian.length - 1;

  <div class="secs" role="tablist">${M.bagian.map((b, j) => `<a href="#/modul/${m}/${j}" class="${j === i ? 'on' : ''} ${READ[m + ':' + b.id] ? 'dn' : ''}">${esc(b.judul)}</a>`).join('')}<a href="#/kuis/${m}">Kuis</a></div>
  <article class="mat"><h2>${esc(B.judul)}</h2>${B.html}</article>
  <div class="row" style="margin:14px 0">${i > 0 ? `<a class="btn g" href="#/modul/${m}/${i - 1}">Sebelumnya</a>` : ''}<span class="sp"></span>

  <button class="btn y" data-act="read" data-m="${m}" data-b="${B.id}" data-next="${last ? '#/kuis/' + m : '#/modul/' + m + '/' + (i + 1)}">${done ? 'Lanjut' : 'Tandai selesai & lanjut'}</button></div>`, 'beranda');
}

/* ---------------- kuis ---------------- */
function vKuis(m) {
  const M = D.modul[m - 1], Q = D.quiz[m]; if (!M) return vBeranda();
  if (quizRes && quizRes.modul === m) return vHasil(m);
  let n = 0;
  const pg = Q.pg.map((q, i) => `<fieldset class="q"><legend class="n">SOAL ${++n}</legend><p>${esc(q.q)}</p>${q.o.map((o, j) => `<label class="opt"><input type="radio" name="pg${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('');
  const isi = Q.isi.map((q, i) => `<div class="q"><div class="n">SOAL ${++n}</div><p><label for="isi${i}" style="margin:0;font-size:16px">${esc(q.q)}</label></p><input type="text" id="isi${i}" name="isi${i}" maxlength="60" placeholder="Jawaban singkat" autocomplete="off"></div>`).join('');
  const sk = Q.sk.map((s, i) => `<section class="sk"><h3>Skenario ${i + 1}: ${esc(s.judul)}</h3><p>${esc(s.cerita)}</p><div class="dt"><b>Data pengamatan</b><ul>${s.data.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>
    ${s.langkah.map((l, j) => `<fieldset class="q"><legend class="n">SOAL ${++n} · LANGKAH ${j + 1}</legend><p>${esc(l.q)}</p>${l.o.map((o, k) => `<label class="opt"><input type="radio" name="sk${i}_${j}" value="${k}"><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}
    <div class="q"><div class="n">URAIAN (tidak dinilai otomatis)</div><p><label for="es${i}" style="margin:0;font-size:16px">${esc(s.esai)}</label></p><textarea id="es${i}" name="es${i}" maxlength="1500"></textarea></div></section>`).join('');
  return shell(`<div class="mnum">KUIS MODUL ${m}</div><h1 class="pt">${esc(M.judul)}</h1><p class="muted">Tiga bagian: pilihan ganda, isian singkat dan analisis skenario. Nilai lulus ${PASS}%. Kuis dapat diulang; nilai terbaik yang dipakai.</p>
  <form data-form="kuis" data-m="${m}"><div class="part">BAGIAN A · PILIHAN GANDA</div>${pg}<div class="part">BAGIAN B · ISIAN SINGKAT</div>${isi}<div class="part">BAGIAN C · ANALISIS SKENARIO</div>${sk}
  <div class="row" style="margin:16px 0"><a class="btn g" href="#/modul/${m}">Kembali ke materi</a><span class="sp"></span><button class="btn y" type="submit">Kumpulkan jawaban</button></div></form>`, 'beranda');
}
function grade(m, fd) {
  const Q = D.quiz[m], det = {pg: [], isi: [], sk: [], bagian: {}}; let s = 0, mx = 0, a = 0, b = 0, c = 0;
  Q.pg.forEach((q, i) => { const v = fd.get('pg' + i); const x = v === null ? -1 : +v; det.pg.push(x); mx++; if (x === q.a) { s++; a++; } });
  Q.isi.forEach((q, i) => { const v = String(fd.get('isi' + i) || '').slice(0, 60); det.isi.push(v); mx++; if (cekIsi(v, q.a)) { s++; b++; } });
  Q.sk.forEach((sc, i) => { const l = sc.langkah.map((q, j) => { const v = fd.get('sk' + i + '_' + j); const x = v === null ? -1 : +v; mx++; if (x === q.a) { s++; c++; } return x; });
    det.sk.push({l, esai: String(fd.get('es' + i) || '').slice(0, 1500)}); });
  det.bagian = {pg: a, isi: b, sk: c};
  return {modul: m, skor: s, maks: mx, detail: det};
}
function review(m, det) {
  const Q = D.quiz[m]; let n = 0;
  const mc = (q, x) => `<p>${esc(q.q)}</p>${q.o.map((o, j) => `<div class="opt ${j === q.a ? 'r' : (j === x ? 'x' : '')}"><span>${j === q.a ? '✓' : (j === x ? '✗' : '○')}</span><span>${esc(o)}${j === x ? ' <b>(jawaban Anda)</b>' : ''}</span></div>`).join('')}<div class="fb ${x === q.a ? 'ok' : 'no'}">${x === q.a ? 'Benar. ' : (x < 0 ? 'Tidak dijawab. ' : 'Belum tepat. ')}${esc(q.e)}</div>`;
  return `<div class="part">BAGIAN A · PILIHAN GANDA</div>${Q.pg.map((q, i) => `<div class="q"><div class="n">SOAL ${++n}</div>${mc(q, det.pg[i])}</div>`).join('')}
  <div class="part">BAGIAN B · ISIAN SINGKAT</div>${Q.isi.map((q, i) => { const ok = cekIsi(det.isi[i], q.a); return `<div class="q"><div class="n">SOAL ${++n}</div><p>${esc(q.q)}</p><div class="fb ${ok ? 'ok' : 'no'}">Jawaban Anda: <b>${esc(det.isi[i] || '(kosong)')}</b> · ${ok ? 'Benar' : 'Belum tepat'}. Kunci: <b>${esc(q.a[0])}</b>. ${esc(q.e)}</div></div>`; }).join('')}
  <div class="part">BAGIAN C · ANALISIS SKENARIO</div>${Q.sk.map((s, i) => `<section class="sk"><h3>Skenario ${i + 1}: ${esc(s.judul)}</h3><p>${esc(s.cerita)}</p>${s.langkah.map((l, j) => `<div class="q"><div class="n">SOAL ${++n} · LANGKAH ${j + 1}</div>${mc(l, (det.sk[i] || {l: []}).l[j] ?? -1)}</div>`).join('')}
    <div class="q"><div class="n">URAIAN</div><p>${esc(s.esai)}</p><div class="fb">Uraian Anda: ${esc((det.sk[i] || {}).esai || '(kosong)')}</div><div class="fb ok"><b>Jawaban acuan:</b> ${esc(s.model)}</div></div></section>`).join('')}`;
}
function vHasil(m) {
  const R = quizRes, p = pct(R.skor, R.maks), ok = p >= PASS, bg = R.detail.bagian, Q = D.quiz[m];

/* ---------------- nilai ---------------- */

  return [`RAPOR ${NM}`, `${U.pangkat ? U.pangkat + ' ' : ''}${U.nama}${U.bagian ? ' - ' + U.bagian : ''}`, `Kemajuan keseluruhan: ${overall()}%`]
    .concat(D.modul.map(M => `Modul ${M.n}: materi ${nread(M.n)}/${M.bagian.length}, kuis terbaik ${best(M.n) === null ? '-' : best(M.n) + '%'}${tuntas(M.n) ? ' (TUNTAS)' : ''}`)).join('\n');
}
function vNilai(open) {
  const rows = D.modul.map(M => { const b = best(M.n), n = ATT.filter(x => x.modul === M.n).length;
    return `<tr><td>Modul ${M.n}</td><td>${esc(M.judul)}</td><td>${nread(M.n)}/${M.bagian.length}</td><td>${n}</td><td>${b === null ? '-' : b + '%'}</td><td><span class="badge ${tuntas(M.n) ? 'ok' : 'no'}">${tuntas(M.n) ? 'TUNTAS' : 'BELUM'}</span></td></tr>`; }).join('');

  return shell(`<h1 class="pt">Nilai Saya</h1><p class="muted">Kemajuan keseluruhan ${overall()}%. Modul tuntas bila semua bagian materi selesai dan nilai kuis terbaik minimal ${PASS}%.</p>
  <div class="tw"><table><tr><th>Modul</th><th>Judul</th><th>Materi</th><th>Percobaan</th><th>Terbaik</th><th>Status</th></tr>${rows}</table></div>
  <div class="row"><button class="btn g s" data-act="salin">Salin rapor</button><span class="muted">Menyalin ringkasan nilai untuk dikirim ke pembina.</span></div>
  <h2>Riwayat percobaan kuis</h2>${hist ? `<div class="tw"><table><tr><th>Waktu</th><th>Modul</th><th>Benar</th><th>Nilai</th><th></th></tr>${hist}</table></div>` : '<p class="muted">Belum ada percobaan kuis.</p>'}${det}`, 'nilai');
}

/* ---------------- pandu gangguan ---------------- */
function vPandu(key) {
  if (!key || !D.flows[key]) return shell(`<h1 class="pt">Pandu Gangguan</h1><p class="muted">Pilih gejala. Anda akan dituntun pertanyaan demi pertanyaan, dari pemeriksaan yang paling mudah.</p>
  ${Object.entries(D.flows).map(([k, f]) => `<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/pandu/${k}"><div class="mnum">${f.grp}</div><h3>${esc(f.judul)}</h3></a>`).join('')}
  <div class="alert i">Bagan ini menuntun cara berpikir. Angka dan prosedur resmi ikuti buku manual kapal; pekerjaan pada peralatan hanya atas perintah dan pengawasan.</div>`, 'pandu');
  const f = D.flows[key]; if (!flowSt || flowSt.k !== key) flowSt = {k: key, i: 0, ya: false};

  else if (st.ya) body = `<div class="steps">Pertanyaan ${st.i + 1} dari ${n}</div><p class="flowq">${esc(f.langkah[st.i][0])}</p><div class="alert o"><b>Ya. Tindakan:</b><br>${esc(f.langkah[st.i][1])}</div>
    <div class="row"><button class="btn g" data-act="fl-next">Gejala belum hilang, lanjut</button><button class="btn" data-act="fl-reset">Selesai, mulai lagi</button></div>`;
  else body = `<div class="steps">Pertanyaan ${st.i + 1} dari ${n}</div><p class="flowq">${esc(f.langkah[st.i][0])}</p><div class="row"><button class="btn y" data-act="fl-ya">Ya</button><button class="btn g" data-act="fl-next">Tidak</button>${st.i > 0 ? '<button class="btn g s" data-act="fl-back">Kembali</button>' : ''}</div>`;
  return shell(`<p><a href="#/pandu">‹ Semua gejala</a></p><div class="mnum">${f.grp}</div><h1 class="pt">${esc(f.judul)}</h1><div class="alert i">${esc(f.mulai)}</div><div class="card">${body}</div>
  <details class="card"><summary><b>Lihat bagan alir lengkap</b></summary><figure>${f.svg}</figure></details>`, 'pandu');
}

  <video controls preload="metadata" playsinline src="${esc(C.video)}" data-vid></video><div class="alert i" id="vnote" hidden>Video tidak ditemukan. Pada mode offline, letakkan berkas <b>${esc(C.video)}</b> di folder yang sama dengan berkas LMS ini.</div>
  <div class="card"><h3>Adegan</h3><ol style="margin:6px 0 0;padding-left:20px">${D.adegan.map(a => `<li>${esc(a)}</li>`).join('')}</ol></div>`, 'animasi');
