<style>:root{--ind:#1d0b78;--ind2:#12065a;--yel:#ffd60a;--ink:#1a1a2e;--mut:#5d6180;--line:#d9dcec;--bg:#f4f5fb;--grn:#1f8a4c;--red:#c93a27;--blu:#1479c9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blu)}
button,input,select,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{background:var(--ind);color:#fff;position:sticky;top:0;z-index:5}
.top .bar{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.top img{width:36px;height:36px;border-radius:50%;border:2px solid var(--yel);flex:none}
.top .t{font-weight:800;letter-spacing:.3px;font-size:14px;line-height:1.15;flex:1;min-width:0}
.top .t small{display:block;font-weight:500;color:#cfd3ff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;background:#ffffff22;border-radius:99px;padding:4px 10px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.nav{max-width:860px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#e6e8ff;text-decoration:none;font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;white-space:nowrap}
.nav a.on{background:var(--yel);color:var(--ind)}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--ind);color:#fff;text-align:center}
.btn.y{background:var(--yel);color:var(--ind)}
.btn.g{background:#fff;color:var(--ind);border:1.5px solid var(--ind)}
.btn.s{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.d{background:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.hero{background:linear-gradient(180deg,#2a12a0,#1d0b78 45%,#0a0338);color:#fff;min-height:100vh;position:relative;overflow:hidden}
.hero .in{max-width:720px;margin:0 auto;padding:28px 22px 40px;position:relative}
.hero .lg{position:absolute;right:22px;top:22px;width:72px;height:72px;border-radius:50%;border:3px solid var(--yel)}
.hero .k{color:var(--yel);font-weight:700;letter-spacing:4px;font-size:12px;margin-top:8px}
.hero h1{font-size:clamp(34px,9vw,58px);line-height:1.02;margin:64px 0 6px;font-weight:800;letter-spacing:-1px}
.hero h2{font-size:clamp(18px,5vw,28px);margin:0 0 14px;font-weight:700;color:#fff;border:0;padding:0}
.hero .bars i{display:inline-block;width:46px;height:6px;border-radius:3px;margin-right:8px}
.hero p.sub{font:italic 18px/1.45 Georgia,Caladea,serif;color:#e6e8ff;max-width:560px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}
.hero .cta .btn{font-size:17px;padding:14px 26px}
.hero ul{padding-left:20px;color:#e6e8ff}
.hero .note{font-size:13px;color:#cfd3ff;margin-top:22px;border-top:1px solid #ffffff33;padding-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card h3{margin:0 0 4px;color:var(--ind);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid .card{margin:0;display:flex;flex-direction:column}
.mnum{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--mut)}
.lead{color:var(--mut);font-size:14px;margin:4px 0 10px;flex:1}
.pb{height:8px;background:#e6e8f5;border-radius:9px;overflow:hidden;margin:6px 0}
.pb i{display:block;height:100%;background:var(--grn);border-radius:9px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.badge{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;letter-spacing:.5px}
.badge.ok{background:#e5f5ea;color:var(--grn)}.badge.no{background:#eef0f8;color:var(--mut)}.badge.w{background:#fff3c4;color:#7a5c00}
h1.pt{font-size:24px;color:var(--ind);margin:8px 0 2px;line-height:1.2}
h2{font-size:19px;color:var(--ind);border-left:5px solid var(--yel);padding-left:10px;margin:22px 0 8px}
h3{font-size:16px;margin:18px 0 6px}
.muted{color:var(--mut);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=search],textarea{width:100%;padding:11px 12px;border:1.5px solid #b9bdd6;border-radius:10px;background:#fff}
textarea{min-height:96px;resize:vertical}
.alert{border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
.alert.e{background:#fde9e5;color:#7d1f12;border-left:5px solid var(--red)}
.alert.o{background:#e5f5ea;color:#12502c;border-left:5px solid var(--grn)}
.alert.i{background:#e3f3fb;color:#0c4470;border-left:5px solid var(--blu)}
.secs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px}
.secs a{flex:none;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink);background:#fff}
.secs a.on{background:var(--ind);color:#fff;border-color:var(--ind)}
.secs a.dn::before{content:"✓ ";color:var(--grn)}.secs a.on.dn::before{color:var(--yel)}
.mat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 18px 18px}
.mat h2:first-child{margin-top:14px}
.lv{font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:4px;color:#fff;vertical-align:2px;margin-right:6px}
.lv.d{background:#1f8a4c}.lv.m{background:#1479c9}.lv.l{background:#b0331f}
.box{border-radius:8px;padding:10px 14px;margin:12px 0;font-size:15px}
.box ul,.box ol{margin:6px 0 0}
.box.term{background:#f1f2f8;border-left:5px solid #6b6f8a}.box.note{background:#e3f3fb;border-left:5px solid #1479c9}
.box.warn{background:#fde9e5;border-left:5px solid #d9432f}.box.key{background:var(--ind);color:#fff}
.box.goal{background:#eef1fb;border:1px solid var(--ind)}.box.act{background:#e5f5ea;border-left:5px solid #1f8a4c}
.box.case{background:#fff9e0;border-left:5px solid #b58900}.box.manual{background:#fffbe0;border:1.5px dashed #b58900;line-height:2}
.fill{display:inline-block;width:140px;border-bottom:1px solid #555;height:14px}.fill.s{width:70px}
figure{margin:16px 0;text-align:center}
figure svg{border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%;height:auto}
figcaption{font-size:13px;color:#333;margin-top:6px}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:440px}
caption{caption-side:top;text-align:left;font-weight:700;color:var(--ind);padding-bottom:6px;font-size:14px}
th{background:var(--ind);color:#fff;text-align:left;padding:7px 9px;font-weight:600}
td{border:1px solid #c9cce0;padding:6px 9px;vertical-align:top}
tr:nth-child(even) td{background:#f7f8fc}
td.blank{background:#fffbe0!important}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.q .n{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:1px}
.q p{margin:4px 0 8px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;font-weight:400}
.opt input{margin-top:4px;accent-color:var(--ind);width:18px;height:18px;flex:none}
.opt.r{border-color:var(--grn);background:#e5f5ea}.opt.x{border-color:var(--red);background:#fde9e5}
.fb{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#f1f2f8}
.fb.ok{background:#e5f5ea}.fb.no{background:#fde9e5}
.sk{background:#fff9e0;border:1px solid #e4cf7a;border-radius:12px;padding:14px 16px;margin:14px 0}
.sk h3{margin-top:0;color:#5c4500}
.sk .dt{background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.sk .dt li{margin:2px 0}
.score{font-size:44px;font-weight:800;color:var(--ind);line-height:1}
.part{font-size:12px;font-weight:800;letter-spacing:2px;color:#fff;background:var(--ind);display:inline-block;border-radius:6px;padding:4px 10px;margin-top:18px}
.flowq{font-size:19px;font-weight:700;margin:10px 0 14px}
.steps{font-size:13px;color:var(--mut)}
video{width:100%;border-radius:12px;background:#000}
.foot{color:var(--mut);font-size:12px;text-align:center;padding:26px 16px 40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.kv b{color:var(--mut);font-weight:600}
@media(max-width:520px){.wrap{padding:12px}.mat{padding:4px 12px 14px}.hero .lg{width:58px;height:58px}}

ng panas ke yang dingin. Seluruh sistem pendingin hanya mengatur jalannya.","bagian":[{"id":"s3-1","judul":"Uraian materi","html":"<div class=\"box goal\"><b>Tujuan modul<\/b><br>Setelah modul ini Anda dapat (1) menjelaskan tiga cara panas berpindah, (2) membedakan suhu, tekanan dan panas, (3) menjelaskan hubungan tekanan dengan titik didih, dan (4) menggambar peta aliran panas di kapal.<\/div>\n\n\n<h3><span class=\"lv d\">DASAR<\/span> Panas, suhu dan tekanan<\/h3>\n<p><b>Suhu<\/b> menyatakan seberapa panas atau dingin suatu benda, diukur dengan termometer dalam derajat Celsius (°C). <b>Panas<\/b> adalah energi yang berpindah karena ada beda suhu. Panas tidak pernah berpindah sendiri dari benda dingin ke benda panas; untuk itulah mesin pendingin memerlukan kompresor.<\/p>\n<p><b>Tekanan<\/b> adalah gaya yang menekan tiap satuan luas, dibaca pada manometer. Satuan yang umum di kapal adalah bar; pada alat lama dapat dijumpai kg/cm² atau psi. Pakailah satuan yang tertera di alat ukur dan di manual kapal, jangan mencampurnya.<\/p>\n<p>Panas berpindah dengan tiga cara:<\/p>\n<ul>\n<li><b>Hantaran<\/b> (konduksi): panas merambat melalui benda padat, misalnya dari gas pembakaran menembus dinding silinder ke air pendingin.<\/li>\n<li><b>Aliran<\/b> (konveksi): panas dibawa oleh cairan atau gas yang mengalir, misalnya air tawar yang membawa panas dari mesin ke penukar kalor.<\/li>\n<li><b>Pancaran<\/b> (radiasi): panas memancar tanpa perantara, misalnya panas dari pipa gas buang yang terasa di kulit.<\/li>\n<\/ul>\n<div class=\"box term\"><b>Istilah<\/b><br><i>Penukar kalor<\/i> (<i>heat exchanger<\/i>, di lapangan disebut <i>cooler<\/i>) = alat tempat dua cairan bertukar panas melalui dinding logam tipis tanpa bercampur.<\/div>\n\n<h3><span class=\"lv m\">MENENGAH<\/span> Panas yang mengubah wujud<\/h3>\n<p>Ketika air dipanaskan, suhunya naik. Panas seperti ini disebut <b>panas sensibel<\/b> (panas yang terasa pada termometer). Tetapi ketika air sudah mendidih, suhunya berhenti naik walau terus dipanaskan; panas yang masuk dipakai untuk mengubah air menjadi uap. Panas ini disebut <b>panas laten<\/b> (panas tersembunyi).<\/p>\n<p>Panas laten sangat besar. Itulah sebabnya mesin pendingin bekerja dengan menguapkan dan mengembunkan refrigeran: sedikit refrigeran dapat memindahkan banyak panas.<\/p>\n<p>Ada satu hukum alam yang menjadi kunci seluruh Modul 2 dan 3:<\/p>\n<div class=\"box key\"><b>Titik didih mengikuti tekanan.<\/b> Bila tekanan diturunkan, cairan mendidih pada suhu lebih rendah. Bila tekanan dinaikkan, uap mengembun pada suhu lebih tinggi. Untuk tiap refrigeran, pasangan tekanan dan suhu didih ini tetap dan tercantum dalam <i>tabel jenuh<\/i> refrigeran (sering tercetak sebagai skala suhu pada manometer mesin pendingin).<\/div>\n\n<h3><span class=\"lv l\">LANJUT<\/span> Tiga hal yang menentukan kemampuan sebuah cooler<\/h3>\n<p>Jumlah panas yang dapat dipindahkan sebuah penukar kalor ditentukan oleh tiga hal: (1) <b>luas<\/b> permukaan yang bersih, (2) <b>beda suhu<\/b> antara cairan panas dan cairan dingin, dan (3) <b>aliran<\/b> kedua cairan. Hampir semua gangguan \"suhu naik\" dapat dikembalikan ke salah satu dari tiga hal ini:<\/p>\n<ul>\n<li>permukaan kotor atau berkerak, sehingga luas efektif berkurang;<\/li>\n<li>cairan pendingin sudah hangat ketika masuk (misalnya air laut di perairan tropis yang dangkal), sehingga beda suhu mengecil;<\/li>\n<li>aliran berkurang karena saringan kotor, pompa lemah, katup setengah tertutup, atau ada udara terperangkap.<\/li>\n<\/ul>\n<p>Ingat tiga kata ini: <b>luas, beda suhu, aliran<\/b>. Ketiganya akan muncul lagi di setiap bagan alir.<\/p>"},{"id":"s3-2","judul":"Peta sistem pendingin di kapal","html":"<p>Gambar 3.1 menunjukkan ke mana panas di kapal mengalir. Perhatikan bahwa ujung semua jalur adalah air laut. Karena itu gangguan pada pasokan air laut dapat menjalar ke semua sistem sekaligus.<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 276\" width=\ -family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.56\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"102.0\" y=\"132.1\">Ruangan awak &amp; peralatan<\/tspan><tspan x=\"102.0\" y=\"145.3\">elektronik<\/tspan><\/text><rect x=\"232\" y=\"108\" width=\"176\" height=\"54\" rx=\"6\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.56\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"132.1\">Air dingin (chilled water) +<\/tspan><tspan x=\"320.0\" y=\"145.3\">refrigeran<\/tspan><\/text><polyline points=\"190.0,135.0 232.0,135.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"232.0,135.0 225.7,138.0 225.7,132.0\" fill=\"#d9432f\"/><polyline points=\"408.0,135.0 450.0,135.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"450.0,135.0 443.7,138.0 443.7,132.0\" fill=\"#d9432f\"/><rect x=\"14\" y=\"182\" width=\"176\" height=\"54\" rx=\"6\" fill=\"#e3f3fb\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"102.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.56\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"102.0\" y=\"212.7\">Bahan makanan di kamar dingin<\/tspan><\/text><rect x=\"232\" y=\"182\" width=\"176\" height=\"54\" rx=\"6\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.56\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"212.7\">Refrigeran<\/tspan><\/text><polyline points=\"190.0,209.0 232.0,209.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"232.0,209.0 225.7,212.0 225.7,206.0\" fill=\"#d9432f\"/><polyline points=\"408.0,209.0 450.0,135.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"450.0,135.0 449.5,142.0 444.2,139.0\" fill=\"#d9432f\"/><rect x=\"450\" y=\"95\" width=\"176\" height=\"80\" rx=\"6\" fill=\"#dff0fb\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"538.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"538.0\" y=\"125.1\">Air laut pendingin<\/tspan><tspan x=\"538.0\" y=\"138.8\">→ dibuang kembali ke laut<\/tspan><tspan x=\"538.0\" y=\"152.6\">(overboard)<\/tspan><\/text><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#444\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"320.0\" y=\"265.5\">Arah panah = arah perpindahan panas. Semua panas di kapal pada akhirnya dibuang ke laut.<\/tspan><\/text><\/svg><figcaption><b>Gambar 3.1<\/b> Peta aliran panas di kapal: dari sumber panas, melalui media perantara, ke air laut<\/figcaption><\/figure>\n\n<div class=\"tw\"><table id=\"t3-1\"><caption>Tabel 3.1 Sistem pendingin yang umum ada di kapal<\/caption>\n<tr><th style=\"width:24%\">Sistem<\/th><th style=\"width:26%\">Yang didinginkan<\/th><th style=\"width:24%\">Media pembawa panas<\/th><th>Panas dibuang ke<\/th><\/tr>\n<tr><td>Pendingin mesin (air tawar)<\/td><td>Silinder, kepala silinder mesin diesel<\/td><td>Air tawar yang diberi bahan pelindung karat<\/td><td>Air laut, lewat cooler<\/td><\/tr>\n<tr><td>Pendingin air laut<\/td><td>Cooler air tawar, oli pelumas, udara bilas, kondensor<\/td><td>Air laut<\/td><td>Laut (<i>overboard<\/i> = buang ke luar lambung)<\/td><\/tr>\n<tr><td>Pengatur udara (AC)<\/td><td>Udara ruangan dan peralatan elektronik<\/td><td>Refrigeran dan air dingin (<i>chilled water<\/i>)<\/td><td>Air laut, lewat kondensor<\/td><\/tr>\n<tr><td>Kamar dingin<\/td><td>Bahan makanan<\/td><td>Refrigeran<\/td><td>Air laut, lewat kondensor<\/td><\/tr>\n<\/table><\/div>\n<p>Susunan di atas adalah susunan umum kapal [4][7]. Susunan pasti di KRI Bung Tomo, termasuk jumlah unit dan letaknya, harus Anda pastikan dari manual dan penelusuran di kapal.<\/p>"},{"id":"s3-3","judul":"Kegiatan","html":"<div class=\"box act\"><b>Kegiatan 1.1 — Peta panas kapal saya<\/b>\n<ol>\n<li>Tanpa melihat buku, gambar ulang Gambar 3.1 di buku catatan.<\/li>\n<li>Dengan izin pengawas jaga, cari di kapal: satu cooler air tawar, satu kondensor mesin pendingin, satu saringan air laut. Catat letak ruangannya.<\/li>\n<li>Catat satuan tekanan yang dipakai pada tiga manometer berbeda di kamar mesin.<\/li>\n<\/ol><\/div>"}]},{"n":2,"judul":"Cara Kerja Mesin Pendingin","lead":"Empat komponen utama, satu zat kerja, dan dua tingkat tekanan: itulah seluruh rahasia AC dan kamar dingin.","bagian":[{"id":"s4-1","judul":"Uraian materi","html":"<div class=\"box goal\"><b>Tujuan modul<\/b><br>Setelah modul ini Anda dapat (1) menjelaskan siklus kompresi uap, (2) menyebut fungsi tiap komponen dan perlengkapan pengaman, (3) menjelaskan arti <i>superheat<\/i> dan <i>subcooling<\/i>, serta (4) menyebut parameter yang diamati saat jaga.<\/div>\n\n\n<h3><span class=\"lv d\">DASAR<\/span> Siklus kompresi uap<\/h3>\n<p>Mesin pendingin di kapal umumnya bekerja dengan <b>siklus kompresi uap<\/b> [4]. Refrigeran beredar terus-menerus melalui empat komponen utama (Gambar 4.1):<\/p>\n<ol>\n<li><b>Kompresor<\/b> mengisap uap refrigeran dingin bertekanan rendah, lalu memampatkannya menjadi gas panas bertekanan tinggi.<\/li>\n<li><b>Kondensor<\/b> (pengembun) mendinginkan gas panas itu dengan air laut sampai mengembun menjadi cairan. Di sinilah panas dibuang ke laut.<\/li>\n<li><b>Katup ekspansi<\/b> menurunkan tekanan cairan secara mendadak. Karena tekanan turun, titik didihnya turun dan refrigeran menjadi sangat dingin.<\/li>\n<li><b>Evaporator<\/b> (penguap) adalah tempat refrigeran dingin itu menguap sambil menyerap panas dari udara ruangan, dari air dingin, atau dari kamar bahan makanan.<\/li>\n<\/ol>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 380\" width=\"100%\"><rect x=\"1\" y=\"1\" width=\"638\" height=\"182\" fill=\"#fdeeee\" stroke=\"none\"/><rect x=\"1\" y=\"183\" width=\"638\" height=\"196\" fill=\"#e9f4fc\" stroke=\"none\"/><text x=\"12.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"start\" fill=\"#d9432f\" font-weight=\"700\"><tspan x=\"12.0\" y=\"19.7\">SISI TEKANAN TINGGI<\/tspan><\/text><text x=\"12.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"700\"><tspan x=\"12.0\" y=\"371.7\">SISI TEKANAN RENDAH<\/tspan><\/text><line x1=\"1\" y1=\"183\" x2=\"639\" y2=\"183\" stroke=\"#888\" stroke-dasharray=\"5 4\"/><polyline points=\"520.0,160.0 520.0,70.0 430.0,70.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"430.0,70.0 439.0,65.7 439.0,74.3\" fill=\"#d9432f\"/><polyline points=\"210.0,70.0 120.0,70.0 120.0,160.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"120.0,160.0 115.7,151.0 124.3,151.0\" fill=\"#f08a24\"/><polyline points=\"120.0,206.0 120.0,300.0 210.0,300.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-dasharray=\"8 4\"/><polygon points=\"210.0,300.0 201.0,304.3 201.0,295.7\" fill=\"#39b6d8\"/><polyline points=\"430.0,300.0 520.0,300.0 520.0,206.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"520.0,206.0 524.3,215.0 515.7,215.0\" fill=\"#1479c9\"/><rect x=\"210\" y=\"44\" width=\"220\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.55\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"320.0\" y=\"66.8\">KONDENSOR<\/tspan><tspan x=\"320.0\" y=\"81.3\">gas panas → cairan<\/tspan><\/text><rect x=\"210\" y=\"274\" width=\"220\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.55\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"320.0\" y=\"296.8\">EVAPORATOR<\/tspan><tspan x=\"320.0\" y=\"311.3\">cairan → uap (menyerap panas)<\/tspan><\/text><circle cx=\"520\" cy=\"183\" r=\"30\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"520.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"520.0\" y=\"180.6\">KOMPRE-<\/tspan><tspan x=\"520.0\" y=\"191.6\">SOR<\/tspan><\/text><polygon points=\"98,160 142,160 120,183\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><polygon points=\"98,206 142,206 120,183\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"92.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.46\" text-anchor=\"end\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"92.0\" y=\"180.4\">KATUP<\/tspan><tspan x=\"92.0\" y=\"192.2\">EKSPANSI<\/tspan><\/text><text x=\"566.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#d9432f\" font-weight=\"600\"><tspan x=\"566.0\" y=\"97.3\">① Gas panas<\/tspan><tspan x=\"566.0\" y=\"109.7\">tekanan tinggi<\/tspan><\/text><text x=\"200.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#b55d00\" font-weight=\"600\"><tspan x=\"200.0\" y=\"37.5\">② Cairan hangat tekanan tinggi<\/tspan><\/text><text x=\"170.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#147a96\" font-weight=\"600\"><tspan x=\"170.0\" y=\"343.5\">③ Campuran cair-uap dingin<\/tspan><\/text><text x=\"566.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"566.0\" y=\"259.3\">④ Uap dingin<\/tspan><tspan x=\"566.0\" y=\"271.7\">tekanan rendah<\/tspan><\/text><polyline points=\"320.0,44.0 320.0,12.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"320.0,12.0 323.0,18.3 317.0,18.3\" fill=\"#d9432f\"/><text x=\"330.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#d9432f\" font-weight=\"400\"><tspan x=\"330.0\" y=\"27.5\">panas dibuang ke air laut<\/tspan><\/text><polyline points=\"320.0,358.0 320.0,328.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"320.0,328.0 323.0,334.3 317.0,334.3\" fill=\"#1479c9\"/><text x=\"330.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"400\"><tspan x=\"330.0\" y=\"353.5\">panas diserap dari ruangan / air dingin<\/tspan><\/text><\/svg><figcaption><b>Gambar 4.1<\/b> Siklus kompresi uap dengan empat komponen utama dan dua tingkat tekanan<\/figcaption><\/figure>\n<p>Garis putus-putus pada Gambar 4.1 membagi instalasi menjadi <b>sisi tekanan tinggi<\/b> (dari keluaran kompresor sampai katup ekspansi) dan <b>sisi tekanan rendah<\/b> (dari katup ekspansi sampai isapan kompresor). Dua manometer utama mesin pendingin membaca kedua sisi ini: <b>tekanan tekan<\/b> (<i>discharge<\/i>) dan <b>tekanan isap<\/b> (<i>suction<\/i>).<\/p>\n<div class=\"box term\"><b>Istilah<\/b><br><i>Discharge<\/i> = sisi keluar/tekan kompresor. <i>Suction<\/i> = sisi masuk/isap kompresor. <i>Kondensor<\/i> = pengembun. <i>Evaporator<\/i> = penguap.<\/div>\n\n<h3><span class=\"lv d\">DASAR<\/span> Komponen dan perlengkapan<\/h3>\n<p>Selain empat komponen utama, instalasi dilengkapi beberapa alat bantu (Gambar 4.2 dan Tabel 4.1).<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 264\" width=\"100%\"><rect x=\"10\" y=\"30\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"64.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"64.0\" y=\"61.5\">Kompresor<\/tspan><\/text><polyline points=\"118.0,58.0 138.0,58.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"138.0,58.0 131.7,61.0 131.7,55.0\" fill=\"#d9432f\"/><rect x=\"138\" y=\"30\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"192.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"192.0\" y=\"55.2\">Pemisah oli (oil<\/tspan><tspan x=\"192.0\" y=\"67.9\">separator)<\/tspan><\/text><polyline points=\"246.0,58.0 266.0,58.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"266.0,58.0 259.7,61.0 259.7,55.0\" fill=\"#d9432f\"/><rect x=\"266\" y=\"30\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"320.0\" y=\"61.5\">Kondensor<\/tspan><\/text><polyline points=\"374.0,58.0 394.0,58.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"394.0,58.0 387.7,61.0 387.7,55.0\" fill=\"#f08a24\"/><rect x=\"394\" y=\"30\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#f08a24\" stroke-width=\"1.4\"/><text x=\"448.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"448.0\" y=\"55.2\">Tabung penampung<\/tspan><tspan x=\"448.0\" y=\"67.9\">(receiver)<\/tspan><\/text><polyline points=\"502.0,58.0 522.0,58.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"522.0,58.0 515.7,61.0 515.7,55.0\" fill=\"#f08a24\"/><rect x=\"522\" y=\"30\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#f08a24\" stroke-width=\"1.4\"/><text x=\"576.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"576.0\" y=\"55.2\">Saringan pengering<\/tspan><tspan x=\"576.0\" y=\"67.9\">(filter-drier)<\/tspan><\/text><rect x=\"522\" y=\"150\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#f08a24\" stroke-width=\"1.4\"/><text x=\"576.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"576.0\" y=\"175.2\">Kaca duga (sight<\/tspan><tspan x=\"576.0\" y=\"187.9\">glass)<\/tspan><\/text><polyline points=\"522.0,178.0 480.0,178.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"480.0,178.0 486.3,175.0 486.3,181.0\" fill=\"#f08a24\"/><rect x=\"372\" y=\"150\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#f08a24\" stroke-width=\"1.4\"/><text x=\"426.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"426.0\" y=\"181.5\">Katup solenoid<\/tspan><\/text><polyline points=\"372.0,178.0 330.0,178.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"330.0,178.0 336.3,175.0 336.3,181.0\" fill=\"#f08a24\"/><rect x=\"222\" y=\"150\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#f08a24\" stroke-width=\"1.4\"/><text x=\"276.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"276.0\" y=\"175.2\">Katup ekspansi<\/tspan><tspan x=\"276.0\" y=\"187.9\">termostatik (TEV)<\/tspan><\/text><polyline points=\"222.0,178.0 180.0,178.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"180.0,178.0 186.3,175.0 186.3,181.0\" fill=\"#39b6d8\"/><rect x=\"72\" y=\"150\" width=\"108\" height=\"56\" rx=\"6\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"126.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"126.0\" y=\"181.5\">Evaporator<\/tspan><\/text><polyline points=\"576.0,86.0 576.0,150.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"576.0,150.0 573.0,143.7 579.0,143.7\" fill=\"#f08a24\"/><polyline points=\"72.0,178.0 30.0,178.0 30.0,118.0 64.0,118.0 64.0,86.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"64.0,86.0 67.0,92.3 61.0,92.3\" fill=\"#1479c9\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#d9432f\" font-weight=\"600\"><tspan x=\"320.0\" y=\"17.5\">gas panas  →  cairan tekanan tinggi<\/tspan><\/text><text x=\"126.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"126.0\" y=\"127.5\">uap dingin kembali ke kompresor (saluran isap)<\/tspan><\/text><rect x=\"70\" y=\"224\" width=\"500\" height=\"32\" rx=\"6\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"320.0\" y=\"243.4\">Pengaman: saklar tekanan tinggi (HP), tekanan rendah (LP), tekanan oli, termostat<\/tspan><\/text><\/svg><figcaption><b>Gambar 4.2<\/b> Urutan komponen sebuah instalasi mesin pendingin<\/figcaption><\/figure>\n\n<div class=\"tw\"><table id=\"t4-1\"><caption>Tabel 4.1 Komponen mesin pendingin dan fungsinya<\/caption>\n<tr><th style=\"width:32%\">Komponen<\/th><th>Fungsi<\/th><\/tr>\n<tr><td>Kompresor<\/td><td>Mengisap uap dari evaporator dan memampatkannya; \"jantung\" instalasi<\/td><\/tr>\n<tr><td>Pemisah oli (<i>oil separator<\/i>)<\/td><td>Menangkap oli pelumas yang terbawa gas dan mengembalikannya ke kompresor<\/td><\/tr>\n<tr><td>Kondensor<\/td><td>Membuang panas ke air laut sehingga gas mengembun menjadi cairan<\/td><\/tr>\n<tr><td>Tabung penampung (<i>receiver<\/i>)<\/td><td>Menampung cadangan refrigeran cair; tempat melihat level isi<\/td><\/tr>\n<tr><td>Saringan pengering (<i>filter-drier<\/i>)<\/td><td>Menyaring kotoran dan menyerap uap air dari refrigeran<\/td><\/tr>\n<tr><td>Kaca duga (<i>sight glass<\/i>)<\/td><td>Jendela untuk melihat aliran cairan; gelembung terus-menerus menandakan ada yang tidak beres; sebagian dilengkapi penunjuk kelembapan yang berubah warna<\/td><\/tr>\n<tr><td>Katup solenoid<\/td><td>Katup buka-tutup yang digerakkan listrik, diperintah oleh termostat ruangan<\/td><\/tr>\n<tr><td>Katup ekspansi termostatik (TEV)<\/td><td>Menurunkan tekanan dan mengatur jumlah refrigeran yang masuk evaporator<\/td><\/tr>\n<tr><td>Evaporator<\/td><td>Tempat refrigeran menguap dan menyerap panas<\/td><\/tr>\n<tr><td>Saklar tekanan tinggi (HP <i>cut-out<\/i>)<\/td><td>Menghentikan kompresor bila tekanan tekan melewati batas aman<\/td><\/tr>\n<tr><td>Saklar tekanan rendah (LP <i>cut-out<\/i>)<\/td><td>Menghentikan kompresor bila tekanan isap terlalu rendah<\/td><\/tr>\n<tr><td>Saklar tekanan oli<\/td><td>Menghentikan kompresor bila tekanan oli pelumas tidak cukup<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box term\"><b>Istilah<\/b><br><i>Cut-out<\/i> = alat pemutus otomatis. <i>TEV<\/i> (<i>thermostatic expansion valve<\/i>) = katup ekspansi termostatik. <i>HP<\/i> = <i>high pressure<\/i> (tekanan tinggi). <i>LP<\/i> = <i>low pressure<\/i> (tekanan rendah).<\/div>\n\n<p>Kondensor kapal umumnya berjenis selongsong dan pipa (<i>shell and tube<\/i>): air laut mengalir di dalam pipa-pipa, gas refrigeran mengembun di luar pipa di dalam selongsong (Gambar 4.3).<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 244\" width=\"100%\"><rect x=\"110\" y=\"70\" width=\"420\" height=\"120\" rx=\"18\" fill=\"#fde9e5\" stroke=\"#1d0b78\" stroke-width=\"2\"/><rect x=\"70\" y=\"62\" width=\"44\" height=\"136\" rx=\"10\" fill=\"#dff0fb\" stroke=\"#1d0b78\" stroke-width=\"2\"/><rect x=\"526\" y=\"62\" width=\"44\" height=\"136\" rx=\"10\" fill=\"#dff0fb\" stroke=\"#1d0b78\" stroke-width=\"2\"/><line x1=\"70\" y1=\"130\" x2=\"114\" y2=\"130\" stroke=\"#1d0b78\" stroke-width=\"2\"/><line x1=\"114\" y1=\"86\" x2=\"526\" y2=\"86\" stroke=\"#1479c9\" stroke-width=\"4\"/><line x1=\"114\" y1=\"102\" x2=\"526\" y2=\"102\" stroke=\"#1479c9\" stroke-width=\"4\"/><line x1=\"114\" y1=\"118\" x2=\"526\" y2=\"118\" stroke=\"#1479c9\" stroke-width=\"4\"/><line x1=\"114\" y1=\"142\" x2=\"526\" y2=\"142\" stroke=\"#1479c9\" stroke-width=\"4\"/><line x1=\"114\" y1=\"158\" x2=\"526\" y2=\"158\" stroke=\"#1479c9\" stroke-width=\"4\"/><line x1=\"114\" y1=\"174\" x2=\"526\" y2=\"174\" stroke=\"#1479c9\" stroke-width=\"4\"/><path d=\"M112,160 Q320,150 528,160 L528,172 Q528,190 510,190 L130,190 Q112,190 112,172 Z\" fill=\"#f08a24\" opacity=\"0.45\"/><polyline points=\"30.0,164.0 70.0,164.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"70.0,164.0 63.7,167.0 63.7,161.0\" fill=\"#1479c9\"/><text x=\"8.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"8.0\" y=\"145.3\">air laut<\/tspan><tspan x=\"8.0\" y=\"157.7\">masuk<\/tspan><\/text><polyline points=\"70.0,96.0 30.0,96.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"30.0,96.0 36.3,93.0 36.3,99.0\" fill=\"#1479c9\"/><text x=\"8.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"8.0\" y=\"73.3\">air laut<\/tspan><tspan x=\"8.0\" y=\"85.7\">keluar<\/tspan><\/text><polyline points=\"240.0,26.0 240.0,70.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"240.0,70.0 237.0,63.7 243.0,63.7\" fill=\"#d9432f\"/><text x=\"250.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#d9432f\" font-weight=\"600\"><tspan x=\"250.0\" y=\"37.5\">gas refrigeran panas masuk (dari kompresor)<\/tspan><\/text><polyline points=\"400.0,190.0 400.0,232.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"400.0,232.0 397.0,225.7 403.0,225.7\" fill=\"#f08a24\"/><text x=\"410.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#b55d00\" font-weight=\"600\"><tspan x=\"410.0\" y=\"229.5\">refrigeran cair keluar (ke receiver)<\/tspan><\/text><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"600\"><tspan x=\"320.0\" y=\"133.5\">pipa-pipa berisi air laut (melintas dua kali)<\/tspan><\/text><text x=\"600.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#444\" font-weight=\"400\"><tspan x=\"600.0\" y=\"127.4\">tutup<\/tspan><tspan x=\"600.0\" y=\"139.1\">ujung<\/tspan><\/text><text x=\"176.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#444\" font-weight=\"400\"><tspan x=\"176.0\" y=\"211.3\">selongsong (shell)<\/tspan><\/text><rect x=\"76\" y=\"100\" width=\"10\" height=\"16\" fill=\"#9aa\" stroke=\"#555\"/><text x=\"60.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#444\" font-weight=\"400\"><tspan x=\"60.0\" y=\"221.6\">anoda seng<\/tspan><tspan x=\"60.0\" y=\"232.6\">(pelindung karat)<\/tspan><\/text><polyline points=\"60.0,212.0 80.0,118.0\" fill=\"none\" stroke=\"#777\" stroke-width=\"1\" stroke-linejoin=\"round\"/><polygon points=\"80.0,118.0 81.2,122.9 76.9,122.0\" fill=\"#777\"/><\/svg><figcaption><b>Gambar 4.3<\/b> Skema potongan kondensor jenis selongsong dan pipa<\/figcaption><\/figure>\n\n<h3><span class=\"lv m\">MENENGAH<\/span> Katup ekspansi termostatik<\/h3>\n<p>TEV menjaga agar evaporator mendapat refrigeran secukupnya: tidak kekurangan (pendinginan lemah) dan tidak kelebihan (cairan terbawa ke kompresor). Cara kerjanya dapat dibaca pada Gambar 4.4. Sebuah tabung peraba (<i>bulb<\/i>) dijepit pada pipa keluar evaporator. Bila pipa itu menghangat, tekanan di dalam bulb naik, menekan membran, dan katup membuka lebih lebar. Bila pipa mendingin, katup menutup [8].<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 296\" width=\"100%\"><rect x=\"250\" y=\"110\" width=\"140\" height=\"120\" rx=\"8\" fill=\"#f1f2f8\" stroke=\"#1d0b78\" stroke-width=\"2\"/><path d=\"M250,110 Q320,60 390,110 Z\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><line x1=\"250\" y1=\"110\" x2=\"390\" y2=\"110\" stroke=\"#d9432f\" stroke-width=\"3\"/><text x=\"402.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#d9432f\" font-weight=\"600\"><tspan x=\"402.0\" y=\"115.5\">membran (diafragma)<\/tspan><\/text><line x1=\"320\" y1=\"110\" x2=\"320\" y2=\"165\" stroke=\"#333\" stroke-width=\"3\"/><polygon points=\"310,165 330,165 320,185\" fill=\"#333\"/><text x=\"402.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1a1a2e\" font-weight=\"400\"><tspan x=\"402.0\" y=\"163.5\">batang dorong &amp; jarum katup<\/tspan><\/text><path d=\"M300,192 l10,8 l-10,8 l10,8 l-10,8\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"2\"/><path d=\"M340,192 l-10,8 l10,8 l-10,8 l10,8\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"2\"/><text x=\"402.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#1f8a4c\" font-weight=\"600\"><tspan x=\"402.0\" y=\"211.5\">pegas (penyetel superheat)<\/tspan><\/text><polyline points=\"160.0,178.0 250.0,178.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"4\" stroke-linejoin=\"round\"/><polygon points=\"250.0,178.0 241.9,181.9 241.9,174.1\" fill=\"#f08a24\"/><text x=\"150.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"end\" fill=\"#b55d00\" font-weight=\"600\"><tspan x=\"150.0\" y=\"161.3\">cairan tekanan<\/tspan><tspan x=\"150.0\" y=\"173.7\">tinggi masuk<\/tspan><\/text><polyline points=\"320.0,230.0 320.0,280.0 470.0,280.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-dasharray=\"7 4\"/><polygon points=\"470.0,280.0 461.9,283.9 461.9,276.1\" fill=\"#39b6d8\"/><text x=\"480.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"start\" fill=\"#147a96\" font-weight=\"600\"><tspan x=\"480.0\" y=\"283.5\">ke evaporator<\/tspan><\/text><path d=\"M320,84 C320,24 470,14 520,44\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.6\"/><rect x=\"520\" y=\"34\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#ffd60a\" stroke=\"#555\" stroke-width=\"1.5\"/><text x=\"540.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"540.0\" y=\"71.3\">tabung peraba (bulb)<\/tspan><tspan x=\"540.0\" y=\"83.4\">dijepit di pipa keluar evaporator<\/tspan><\/text><text x=\"400.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\"><tspan x=\"400.0\" y=\"15.4\">pipa kapiler<\/tspan><\/text><polyline points=\"205.0,70.0 205.0,104.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"205.0,104.0 202.0,97.7 208.0,97.7\" fill=\"#d9432f\"/><text x=\"200.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#d9432f\" font-weight=\"700\"><tspan x=\"200.0\" y=\"51.3\">tekanan bulb<\/tspan><tspan x=\"200.0\" y=\"63.4\">→ MEMBUKA<\/tspan><\/text><polyline points=\"205.0,250.0 205.0,216.0\" fill=\"none\" stroke=\"#1f8a4c\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"205.0,216.0 208.0,222.3 202.0,222.3\" fill=\"#1f8a4c\"/><text x=\"200.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#1f8a4c\" font-weight=\"700\"><tspan x=\"200.0\" y=\"263.3\">tekanan evaporator + pegas<\/tspan><tspan x=\"200.0\" y=\"275.4\">→ MENUTUP<\/tspan><\/text><\/svg><figcaption><b>Gambar 4.4<\/b> Skema cara kerja katup ekspansi termostatik (TEV)<\/figcaption><\/figure>\n<div class=\"box warn\"><b>PERINGATAN<\/b><br>Sekrup penyetel TEV bukan alat untuk \"menambah dingin\". Menyetel TEV tanpa mengukur superheat hampir selalu memperburuk keadaan. Penyetelan hanya dilakukan personel berwenang dengan prosedur manual.<\/div>\n\n<h3><span class=\"lv m\">MENENGAH<\/span> Superheat dan subcooling<\/h3>\n<p>Dua istilah ini sering terdengar rumit, padahal artinya sederhana (Gambar 4.5).<\/p>\n<ul>\n<li><b><i>Superheat<\/i><\/b> (panas lanjut) adalah selisih antara suhu uap yang keluar dari evaporator dan suhu didih refrigeran pada tekanan isap saat itu. Superheat yang cukup menjamin semua cairan sudah menguap sebelum sampai ke kompresor. Kompresor dibuat untuk memampatkan gas; cairan yang ikut terisap dapat merusaknya.<\/li>\n<li><b><i>Subcooling<\/i><\/b> (dingin lanjut) adalah selisih antara suhu embun refrigeran pada tekanan kondensor dan suhu cairan yang keluar dari kondensor. Subcooling yang cukup menjamin katup ekspansi menerima cairan penuh tanpa gelembung.<\/li>\n<\/ul>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 334\" width=\"100%\"><polyline points=\"70.0,300.0 70.0,20.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"70.0,20.0 73.0,26.3 67.0,26.3\" fill=\"#333\"/><polyline points=\"70.0,300.0 610.0,300.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"610.0,300.0 603.7,303.0 603.7,297.0\" fill=\"#333\"/><text x=\"26.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"26.0\" y=\"153.8\">Tekanan<\/tspan><\/text><text x=\"340.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"340.0\" y=\"325.9\">Entalpi (kandungan energi panas refrigeran)<\/tspan><\/text><path d=\"M130,300 C170,150 250,50 320,50 C400,50 470,150 500,300\" fill=\"#f3f4fb\" stroke=\"#777\" stroke-width=\"1.5\"/><text x=\"315.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\"><tspan x=\"315.0\" y=\"197.1\">daerah campuran<\/tspan><tspan x=\"315.0\" y=\"210.2\">cair + uap<\/tspan><\/text><text x=\"110.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\"><tspan x=\"110.0\" y=\"113.7\">cair<\/tspan><\/text><text x=\"590.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\"><tspan x=\"590.0\" y=\"147.1\">uap<\/tspan><tspan x=\"590.0\" y=\"160.2\">(gas)<\/tspan><\/text><polyline points=\"505.0,240.0 575.0,95.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><polygon points=\"575.0,95.0 575.0,102.0 569.5,99.4\" fill=\"#d9432f\"/><polyline points=\"575.0,95.0 185.0,95.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><polygon points=\"185.0,95.0 191.3,92.0 191.3,98.0\" fill=\"#f08a24\"/><polyline points=\"185.0,95.0 185.0,240.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><polygon points=\"185.0,240.0 182.0,233.7 188.0,233.7\" fill=\"#39b6d8\"/><polyline points=\"185.0,240.0 505.0,240.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><polygon points=\"505.0,240.0 498.7,243.0 498.7,237.0\" fill=\"#1479c9\"/><circle cx=\"505\" cy=\"240\" r=\"4\" fill=\"#1d0b78\"/><text x=\"513.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"12.1\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"700\"><tspan x=\"513.0\" y=\"256.2\">1<\/tspan><\/text><circle cx=\"575\" cy=\"95\" r=\"4\" fill=\"#1d0b78\"/><text x=\"585.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"12.1\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"700\"><tspan x=\"585.0\" y=\"91.2\">2<\/tspan><\/text><circle cx=\"185\" cy=\"95\" r=\"4\" fill=\"#1d0b78\"/><text x=\"175.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"12.1\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"700\"><tspan x=\"175.0\" y=\"91.2\">3<\/tspan><\/text><circle cx=\"185\" cy=\"240\" r=\"4\" fill=\"#1d0b78\"/><text x=\"175.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"12.1\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"700\"><tspan x=\"175.0\" y=\"256.2\">4<\/tspan><\/text><text x=\"560.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#d9432f\" font-weight=\"600\"><tspan x=\"560.0\" y=\"173.5\">kompresi<\/tspan><\/text><text x=\"380.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#b55d00\" font-weight=\"600\"><tspan x=\"380.0\" y=\"111.5\">pengembunan di kondensor<\/tspan><\/text><text x=\"150.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#147a96\" font-weight=\"600\"><tspan x=\"150.0\" y=\"173.5\">ekspansi<\/tspan><\/text><text x=\"345.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"345.0\" y=\"261.5\">penguapan di evaporator<\/tspan><\/text><line x1=\"478\" y1=\"232\" x2=\"505\" y2=\"232\" stroke=\"#1479c9\" stroke-width=\"5\"/><text x=\"455.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"700\"><tspan x=\"455.0\" y=\"231.3\">superheat<\/tspan><\/text><line x1=\"185\" y1=\"89\" x2=\"205\" y2=\"89\" stroke=\"#f08a24\" stroke-width=\"5\"/><text x=\"240.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#b55d00\" font-weight=\"700\"><tspan x=\"240.0\" y=\"85.3\">subcooling<\/tspan><\/text><\/svg><figcaption><b>Gambar 4.5<\/b> Diagram tekanan–entalpi sederhana: letak superheat dan subcooling pada siklus<\/figcaption><\/figure>\n<div class=\"box manual\"><b>ISI DARI BUKU MANUAL KAPAL<\/b><br>Nilai superheat yang dianjurkan pabrik untuk mesin pendingin kapal: <span class=\"fill\"><\/span><br>Cara dan titik pengukurannya (halaman manual): <span class=\"fill\"><\/span><\/div>\n\n<h3><span class=\"lv m\">MENENGAH<\/span> Dua pemakaian: AC dan kamar dingin<\/h3>\n<p><b>Pengatur udara (AC).<\/b> Pada kapal perang, mesin pendingin AC lazimnya tidak mendinginkan udara secara langsung. Refrigeran mendinginkan air di dalam sebuah pendingin air (<i>chiller<\/i>); air dingin (<i>chilled water<\/i>) itu lalu dipompa berkeliling kapal ke unit pengolah udara di tiap ruangan dan ke peralatan elektronik yang memerlukannya (Gambar 4.6) [4]. Dengan cara ini refrigeran tetap berada di ruang mesin, sedangkan yang beredar di ruangan hanya air.<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 272\" width=\"100%\"><rect x=\"40\" y=\"40\" width=\"150\" height=\"70\" rx=\"6\" fill=\"#fff\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"115.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"115.0\" y=\"78.8\">KONDENSOR<\/tspan><\/text><rect x=\"40\" y=\"170\" width=\"150\" height=\"70\" rx=\"6\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"115.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"115.0\" y=\"202.1\">EVAPORATOR (pendingin air<\/tspan><tspan x=\"115.0\" y=\"215.2\">/ chiller)<\/tspan><\/text><circle cx=\"230\" cy=\"140\" r=\"24\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"230.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"230.0\" y=\"143.1\">Kompresor<\/tspan><\/text><polyline points=\"190.0,190.0 230.0,190.0 230.0,164.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"230.0,164.0 233.0,170.3 227.0,170.3\" fill=\"#1479c9\"/><polyline points=\"230.0,116.0 230.0,62.0 190.0,62.0\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"190.0,62.0 196.3,59.0 196.3,65.0\" fill=\"#d9432f\"/><polyline points=\"40.0,90.0 16.0,90.0 16.0,128.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polyline points=\"16.0,152.0 16.0,205.0 40.0,205.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"40.0,205.0 33.7,208.0 33.7,202.0\" fill=\"#39b6d8\"/><polygon points=\"6,128 26,128 16,140\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.5\"/><polygon points=\"6,152 26,152 16,140\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.5\"/><polyline points=\"115.0,6.0 115.0,40.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"115.0,40.0 112.0,33.7 118.0,33.7\" fill=\"#1479c9\"/><text x=\"124.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"400\"><tspan x=\"124.0\" y=\"17.4\">air laut pendingin<\/tspan><\/text><text x=\"115.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"700\"><tspan x=\"115.0\" y=\"265.5\">UNIT MESIN PENDINGIN (refrigeran)<\/tspan><\/text><polyline points=\"190.0,225.0 330.0,225.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polygon points=\"330.0,225.0 323.7,228.0 323.7,222.0\" fill=\"#39b6d8\"/><circle cx=\"350\" cy=\"225\" r=\"20\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"2\"/><text x=\"350.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"350.0\" y=\"228.1\">Pompa<\/tspan><\/text><polyline points=\"370.0,225.0 560.0,225.0 560.0,150.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polygon points=\"560.0,150.0 563.0,156.3 557.0,156.3\" fill=\"#39b6d8\"/><rect x=\"480\" y=\"80\" width=\"150\" height=\"70\" rx=\"6\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"555.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"555.0\" y=\"112.2\">Unit pengolah udara (AHU /<\/tspan><tspan x=\"555.0\" y=\"124.9\">fan coil) di ruangan<\/tspan><\/text><polyline points=\"520.0,80.0 520.0,34.0 300.0,34.0 300.0,185.0 190.0,185.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polygon points=\"190.0,185.0 196.3,182.0 196.3,188.0\" fill=\"#f08a24\"/><text x=\"470.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#147a96\" font-weight=\"600\"><tspan x=\"470.0\" y=\"247.4\">air dingin (chilled water) pergi<\/tspan><\/text><text x=\"410.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#b55d00\" font-weight=\"600\"><tspan x=\"410.0\" y=\"27.4\">air kembali (lebih hangat)<\/tspan><\/text><rect x=\"380\" y=\"100\" width=\"70\" height=\"44\" rx=\"6\" fill=\"#eef1fb\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"415.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"500\"><tspan x=\"415.0\" y=\"119.4\">Tangki<\/tspan><tspan x=\"415.0\" y=\"131.1\">ekspansi<\/tspan><\/text><polyline points=\"415.0,144.0 415.0,225.0\" fill=\"none\" stroke=\"#777\" stroke-width=\"1.2\" stroke-linejoin=\"round\" stroke-dasharray=\"3 3\"/><polyline points=\"600.0,60.0 600.0,80.0\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"600.0,80.0 597.0,73.7 603.0,73.7\" fill=\"#999\"/><text x=\"600.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\"><tspan x=\"600.0\" y=\"53.3\">udara ruangan<\/tspan><\/text><\/svg><figcaption><b>Gambar 4.6<\/b> Skema umum sistem AC dengan air dingin (chilled water)<\/figcaption><\/figure>\n<div class=\"box manual\"><b>ISI DARI BUKU MANUAL KAPAL<\/b><br>Jumlah unit mesin pendingin AC: <span class=\"fill s\"><\/span> &nbsp; Letak: <span class=\"fill\"><\/span><br>Apakah memakai air dingin (<i>chilled water<\/i>)? <span class=\"fill s\"><\/span> &nbsp; Jenis refrigeran: <span class=\"fill s\"><\/span><\/div>\n<p><b>Kamar dingin.<\/b> Bahan makanan disimpan di kamar berisolasi. Kamar daging dan ikan dijaga pada suhu beku, kamar sayur dan buah pada suhu sejuk di atas titik beku. Satu unit mesin pendingin dapat melayani beberapa kamar; tiap kamar punya katup solenoid dan termostat sendiri (Gambar 4.7). Bila suhu kamar tercapai, termostat menutup katup solenoid; tekanan isap turun dan saklar LP menghentikan kompresor. Ketika kamar menghangat, urutan sebaliknya terjadi [4][5].<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 232\" width=\"100%\"><rect x=\"330\" y=\"30\" width=\"290\" height=\"190\" rx=\"4\" fill=\"#eaf6fc\" stroke=\"#1d0b78\" stroke-width=\"5\"/><text x=\"475.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"700\"><tspan x=\"475.0\" y=\"209.5\">KAMAR DINGIN (dinding berisolasi)<\/tspan><\/text><rect x=\"360\" y=\"50\" width=\"150\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"435.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"435.0\" y=\"76.5\">Evaporator + kipas<\/tspan><\/text><polyline points=\"380.0,100.0 380.0,130.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"380.0,130.0 377.8,125.5 382.2,125.5\" fill=\"#39b6d8\"/><polyline points=\"416.0,100.0 416.0,130.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"416.0,130.0 413.8,125.5 418.2,125.5\" fill=\"#39b6d8\"/><polyline points=\"452.0,100.0 452.0,130.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"452.0,130.0 449.8,125.5 454.2,125.5\" fill=\"#39b6d8\"/><polyline points=\"488.0,100.0 488.0,130.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"488.0,130.0 485.8,125.5 490.2,125.5\" fill=\"#39b6d8\"/><text x=\"435.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#147a96\" font-weight=\"400\"><tspan x=\"435.0\" y=\"147.3\">udara dingin<\/tspan><\/text><circle cx=\"575\" cy=\"120\" r=\"12\" fill=\"#ffd60a\" stroke=\"#555\"/><text x=\"575.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"575.0\" y=\"143.6\">peraba<\/tspan><tspan x=\"575.0\" y=\"154.6\">termostat<\/tspan><\/text><rect x=\"616\" y=\"130\" width=\"8\" height=\"70\" fill=\"#8a5a2b\"/><text x=\"600.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#333\" font-weight=\"400\"><tspan x=\"600.0\" y=\"179.1\">pintu<\/tspan><\/text><polyline points=\"40.0,60.0 150.0,60.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"150.0,60.0 143.7,63.0 143.7,57.0\" fill=\"#f08a24\"/><text x=\"40.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#b55d00\" font-weight=\"600\"><tspan x=\"40.0\" y=\"49.4\">cairan dari receiver<\/tspan><\/text><rect x=\"150\" y=\"42\" width=\"70\" height=\"36\" rx=\"6\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"185.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"600\"><tspan x=\"185.0\" y=\"57.4\">Katup<\/tspan><tspan x=\"185.0\" y=\"69.1\">solenoid<\/tspan><\/text><polyline points=\"220.0,60.0 250.0,60.0\" fill=\"none\" stroke=\"#f08a24\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"250.0,60.0 243.7,63.0 243.7,57.0\" fill=\"#f08a24\"/><rect x=\"250\" y=\"42\" width=\"50\" height=\"36\" rx=\"6\" fill=\"#fff\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"275.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"275.0\" y=\"63.5\">TEV<\/tspan><\/text><polyline points=\"300.0,60.0 360.0,60.0\" fill=\"none\" stroke=\"#39b6d8\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-dasharray=\"6 3\"/><polygon points=\"360.0,60.0 353.7,63.0 353.7,57.0\" fill=\"#39b6d8\"/><polyline points=\"360.0,86.0 310.0,86.0 310.0,120.0 40.0,120.0\" fill=\"none\" stroke=\"#1479c9\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"40.0,120.0 46.3,117.0 46.3,123.0\" fill=\"#1479c9\"/><text x=\"40.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"start\" fill=\"#1479c9\" font-weight=\"600\"><tspan x=\"40.0\" y=\"137.4\">uap kembali ke kompresor<\/tspan><\/text><polyline points=\"563.0,120.0 540.0,170.0 185.0,170.0 185.0,78.0\" fill=\"none\" stroke=\"#777\" stroke-width=\"1.3\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><polygon points=\"185.0,78.0 188.0,84.3 182.0,84.3\" fill=\"#777\"/><text x=\"170.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"170.0\" y=\"189.3\">termostat membuka/menutup katup solenoid<\/tspan><\/text><path d=\"M370,100 q8,10 0,18 M400,100 q8,10 0,18\" fill=\"none\" stroke=\"#d9432f\" stroke-width=\"1.5\"/><text x=\"150.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\"><tspan x=\"150.0\" y=\"215.4\">Pemanas pencair es (defrost) bekerja berkala agar<\/tspan><tspan x=\"150.0\" y=\"227.1\">evaporator tidak tertutup es.<\/tspan><\/text><\/svg><figcaption><b>Gambar 4.7<\/b> Skema satu kamar dingin dengan katup solenoid, TEV dan termostat<\/figcaption><\/figure>\n<p>Uap air dari udara yang masuk saat pintu dibuka akan membeku pada evaporator. Lapisan es menghambat perpindahan panas, sehingga evaporator kamar beku dilengkapi pencair es (<i>defrost<\/i>) yang bekerja berkala.<\/p>\n\n<h3><span class=\"lv l\">LANJUT<\/span> Oli, uap air dan udara: tiga tamu tak diundang<\/h3>\n<ul>\n<li><b>Oli.<\/b> Kompresor dilumasi oli, dan sedikit oli selalu ikut beredar. Yang penting adalah oli itu kembali. Level oli di kaca duga karter harus diamati setiap jaga. Oli berbusa saat start menandakan refrigeran cair bercampur di karter.<\/li>\n<li><b>Uap air.<\/b> Sedikit saja uap air di dalam sistem dapat membeku di lubang katup ekspansi dan menyumbatnya. Karena itu ada filter-drier, dan karena itu pula sistem tidak boleh dibiarkan terbuka ke udara.<\/li>\n<li><b>Udara.<\/b> Udara tidak dapat mengembun di kondensor. Ia berkumpul di sana, mengambil tempat, dan menaikkan tekanan tekan. Udara masuk saat perbaikan yang kurang cermat, atau terisap lewat kebocoran bila sisi isap bekerja di bawah tekanan udara luar [13].<\/li>\n<\/ul>"},{"id":"s4-2","judul":"Parameter yang diamati saat jaga","html":"<div class=\"tw\"><table id=\"t4-2\"><caption>Tabel 4.2 Parameter jaga mesin pendingin<\/caption>\n<tr><th style=\"width:30%\">Parameter<\/th><th style=\"width:38%\">Mengapa diamati<\/th><th>Angka normal kapal (isi dari manual/jurnal)<\/th><\/tr>\n<tr><td>Tekanan isap<\/td><td>Menunjukkan suhu penguapan di evaporator<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Tekanan tekan<\/td><td>Menunjukkan suhu pengembunan di kondensor<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Tekanan oli (selisih terhadap tekanan isap)<\/td><td>Menjamin pelumasan kompresor<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Level oli di karter<\/td><td>Oli hilang berarti tertinggal di sistem atau bocor<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Kaca duga saluran cair<\/td><td>Harus penuh cairan, tanpa gelembung terus-menerus<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Level cairan receiver<\/td><td>Menunjukkan cukup tidaknya isi refrigeran<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Suhu air laut masuk dan keluar kondensor<\/td><td>Menunjukkan aliran air dan kebersihan kondensor<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Suhu air dingin pergi dan kembali<\/td><td>Menunjukkan beban dan hasil kerja AC<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Suhu tiap kamar dingin<\/td><td>Hasil akhir yang dituju<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Arus motor kompresor<\/td><td>Beban kompresor; naik bila tekanan tekan tinggi<\/td><td class=\"blank\"><\/td><\/tr>\n<tr><td>Jam kerja dan jumlah start-stop<\/td><td>Start-stop terlalu sering merusak kompresor<\/td><td class=\"blank\"><\/td><\/tr>\n<\/table><\/div>"},{"id":"s4-3","judul":"Kegiatan","html":"<div class=\"box act\"><b>Kegiatan 2.1 — Menelusuri instalasi<\/b>\n<ol>\n<li>Dengan Gambar 4.2 di tangan, telusuri satu unit mesin pendingin di kapal dari kompresor sampai kembali ke kompresor. Tunjuk tiap komponen kepada pendamping.<\/li>\n<li>Raba dengan hati-hati (punggung tangan, sekilas) pipa isap dan pipa cair pada jarak aman dari bagian berputar. Mana yang dingin, mana yang hangat? Cocokkan dengan Gambar 4.1. <b>Jangan menyentuh pipa tekan kompresor: panas.<\/b><\/li>\n<li>Isi kolom \"angka normal\" pada Tabel 4.2 dari manual dan dari jurnal jaga tujuh hari terakhir.<\/li>\n<\/ol><\/div>"}]},{"n":3,"judul":"Trouble Shooting Mesin Pendingin","lead":"Mulai dari gejala, bukan dari dugaan. Dua manometer dan satu kaca duga sudah menceritakan sebagian besar keadaan.","bagian":[{"id":"s5-1","judul":"Cara berpikir: lima langkah","html":"<div class=\"box goal\"><b>Tujuan modul<\/b><br>Setelah modul ini Anda dapat (1) menerapkan lima langkah pencarian gangguan, (2) menafsirkan pasangan tekanan isap dan tekan, (3) memakai tabel gejala–penyebab–tindakan, dan (4) menelusuri empat bagan alir gangguan utama.<\/div>\n\n\n<h3><span class=\"lv d\">DASAR<\/span> Urutan yang selalu sama<\/h3>\n<p>Pencarian gangguan yang baik bukan soal bakat. Ia mengikuti urutan yang sama setiap kali (Gambar 5.1).<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 192\" width=\"100%\"><circle cx=\"64\" cy=\"46\" r=\"30\" fill=\"#1d0b78\"/><text x=\"64.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"26.4\" text-anchor=\"middle\" fill=\"#ffd60a\" font-weight=\"800\"><tspan x=\"64.0\" y=\"55.2\">1<\/tspan><\/text><text x=\"64.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"800\"><tspan x=\"64.0\" y=\"95.8\">KENALI<\/tspan><\/text><text x=\"64.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"64.0\" y=\"119.3\">Catat gejala: angka,<\/tspan><tspan x=\"64.0\" y=\"131.4\">bunyi, bau, alarm<\/tspan><\/text><polyline points=\"98.0,46.0 158.0,46.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"158.0,46.0 151.7,49.0 151.7,43.0\" fill=\"#888\"/><circle cx=\"192\" cy=\"46\" r=\"30\" fill=\"#1d0b78\"/><text x=\"192.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"26.4\" text-anchor=\"middle\" fill=\"#ffd60a\" font-weight=\"800\"><tspan x=\"192.0\" y=\"55.2\">2<\/tspan><\/text><text x=\"192.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"800\"><tspan x=\"192.0\" y=\"95.8\">BANDINGKAN<\/tspan><\/text><text x=\"192.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"192.0\" y=\"119.3\">Dengan angka normal<\/tspan><tspan x=\"192.0\" y=\"131.4\">di manual &amp; jurnal<\/tspan><\/text><polyline points=\"226.0,46.0 286.0,46.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"286.0,46.0 279.7,49.0 279.7,43.0\" fill=\"#888\"/><circle cx=\"320\" cy=\"46\" r=\"30\" fill=\"#1d0b78\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"26.4\" text-anchor=\"middle\" fill=\"#ffd60a\" font-weight=\"800\"><tspan x=\"320.0\" y=\"55.2\">3<\/tspan><\/text><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"800\"><tspan x=\"320.0\" y=\"95.8\">PERSEMPIT<\/tspan><\/text><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"320.0\" y=\"119.3\">Dari yang mudah &amp;<\/tspan><tspan x=\"320.0\" y=\"131.4\">paling mungkin dulu<\/tspan><\/text><polyline points=\"354.0,46.0 414.0,46.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"414.0,46.0 407.7,49.0 407.7,43.0\" fill=\"#888\"/><circle cx=\"448\" cy=\"46\" r=\"30\" fill=\"#1d0b78\"/><text x=\"448.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"26.4\" text-anchor=\"middle\" fill=\"#ffd60a\" font-weight=\"800\"><tspan x=\"448.0\" y=\"55.2\">4<\/tspan><\/text><text x=\"448.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"800\"><tspan x=\"448.0\" y=\"95.8\">BUKTIKAN<\/tspan><\/text><text x=\"448.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"448.0\" y=\"119.3\">Uji satu dugaan,<\/tspan><tspan x=\"448.0\" y=\"131.4\">satu perubahan<\/tspan><\/text><polyline points=\"482.0,46.0 542.0,46.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"542.0,46.0 535.7,49.0 535.7,43.0\" fill=\"#888\"/><circle cx=\"576\" cy=\"46\" r=\"30\" fill=\"#1d0b78\"/><text x=\"576.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"26.4\" text-anchor=\"middle\" fill=\"#ffd60a\" font-weight=\"800\"><tspan x=\"576.0\" y=\"55.2\">5<\/tspan><\/text><text x=\"576.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"800\"><tspan x=\"576.0\" y=\"95.8\">PULIHKAN &amp; CATAT<\/tspan><\/text><text x=\"576.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"400\"><tspan x=\"576.0\" y=\"119.3\">Perbaiki, uji jalan,<\/tspan><tspan x=\"576.0\" y=\"131.4\">tulis di jurnal<\/tspan><\/text><polyline points=\"576.0,150.0 576.0,166.0 64.0,166.0 64.0,150.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.5\" stroke-linejoin=\"round\" stroke-dasharray=\"5 4\"/><polygon points=\"64.0,150.0 67.0,156.3 61.0,156.3\" fill=\"#888\"/><text x=\"320.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.68\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"400\" font-style=\"italic\"><tspan x=\"320.0\" y=\"183.4\">bila gejala belum hilang: kembali ke langkah 1 dengan data baru<\/tspan><\/text><\/svg><figcaption><b>Gambar 5.1<\/b> Lima langkah pencarian gangguan<\/figcaption><\/figure>\n<ol>\n<li><b>Kenali.<\/b> Catat apa yang sebenarnya terjadi: angka tekanan dan suhu, bunyi, bau, embun es, alarm yang menyala, dan sejak kapan. Tanyakan apa yang berubah sebelum gangguan muncul: baru selesai perawatan, baru memuat bahan makanan, kapal pindah ke perairan lebih hangat?<\/li>\n<li><b>Bandingkan.<\/b> Bandingkan dengan angka normal di manual dan jurnal jaga. Gangguan adalah selisih dari normal.<\/li>\n<li><b>Persempit.<\/b> Susun dugaan dari yang paling mudah diperiksa dan paling sering terjadi. Katup yang salah posisi dan saringan kotor jauh lebih sering daripada kompresor rusak.<\/li>\n<li><b>Buktikan.<\/b> Uji satu dugaan pada satu waktu. Bila dua hal diubah sekaligus, Anda tidak tahu mana yang menyembuhkan.<\/li>\n<li><b>Pulihkan dan catat.<\/b> Setelah diperbaiki, jalankan dan amati sampai angka kembali normal. Tulis gejala, sebab, tindakan dan suku cadang di jurnal. Catatan hari ini adalah petunjuk untuk gangguan berikutnya.<\/li>\n<\/ol>\n<div class=\"box key\"><b>Atasi sebab, bukan gejala.<\/b> Menambah refrigeran tanpa mencari kebocoran, atau mereset pengaman berulang-ulang, hanya menunda dan memperbesar kerusakan.<\/div>\n\n<h3><span class=\"lv d\">DASAR<\/span> Alat bantu<\/h3>\n<div class=\"tw\"><table id=\"t5-1\"><caption>Tabel 5.1 Alat bantu pencarian gangguan mesin pendingin<\/caption>\n<tr><th style=\"width:32%\">Alat<\/th><th>Kegunaan<\/th><\/tr>\n<tr><td>Indera sendiri<\/td><td>Melihat embun es, noda oli dan gelembung; mendengar ketukan; meraba beda suhu pipa (dengan hati-hati)<\/td><\/tr>\n<tr><td>Manometer isap dan tekan<\/td><td>Dua bacaan terpenting; banyak yang berskala ganda, tekanan dan suhu jenuh<\/td><\/tr>\n<tr><td>Termometer (tempel atau inframerah)<\/td><td>Mengukur suhu pipa untuk menghitung superheat dan beda suhu air kondensor<\/td><\/tr>\n<tr><td>Tabel jenuh refrigeran<\/td><td>Mencocokkan tekanan dengan suhu didih/embun<\/td><\/tr>\n<tr><td>Larutan sabun / alat pendeteksi bocor elektronik<\/td><td>Mencari kebocoran refrigeran pada sambungan<\/td><\/tr>\n<tr><td>Tang ampere dan multimeter<\/td><td>Mengukur arus motor dan memeriksa rangkaian kontrol (oleh personel listrik)<\/td><\/tr>\n<tr><td>Manual dan jurnal jaga<\/td><td>Sumber angka normal dan riwayat gangguan<\/td><\/tr>\n<\/table><\/div>"},{"id":"s5-2","judul":"Membaca pasangan tekanan","html":"<h3><span class=\"lv m\">MENENGAH<\/span> Empat kemungkinan<\/h3>\n<p>Bandingkan tekanan isap dan tekanan tekan dengan angka normalnya. Empat gabungan yang mungkin memberi arah awal pencarian (Gambar 5.2) [8][14]. Gambar ini petunjuk arah, bukan putusan; buktikan dengan pemeriksaan lain.<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 322\" width=\"100%\"><polyline points=\"90.0,290.0 90.0,20.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"90.0,20.0 93.0,26.3 87.0,26.3\" fill=\"#333\"/><polyline points=\"90.0,290.0 620.0,290.0\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"620.0,290.0 613.7,293.0 613.7,287.0\" fill=\"#333\"/><text x=\"40.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"40.0\" y=\"145.6\">Tekanan<\/tspan><tspan x=\"40.0\" y=\"158.7\">tekan<\/tspan><tspan x=\"40.0\" y=\"171.7\">(discharge)<\/tspan><\/text><text x=\"355.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.45\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"700\"><tspan x=\"355.0\" y=\"315.7\">Tekanan isap (suction)<\/tspan><\/text><text x=\"78.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"end\" fill=\"#d9432f\" font-weight=\"700\"><tspan x=\"78.0\" y=\"83.3\">TINGGI<\/tspan><\/text><text x=\"78.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"end\" fill=\"#1479c9\" font-weight=\"700\"><tspan x=\"78.0\" y=\"228.3\">RENDAH<\/tspan><\/text><text x=\"220.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"700\"><tspan x=\"220.0\" y=\"305.3\">RENDAH<\/tspan><\/text><text x=\"490.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"9.35\" text-anchor=\"middle\" fill=\"#d9432f\" font-weight=\"700\"><tspan x=\"490.0\" y=\"305.3\">TINGGI<\/tspan><\/text><rect x=\"96\" y=\"26\" width=\"256\" height=\"126\" rx=\"6\" fill=\"#fff7cc\" stroke=\"#b58900\" stroke-width=\"1.4\"/><text x=\"224.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#7a5c00\" font-weight=\"800\"><tspan x=\"224.0\" y=\"51.9\">Isap rendah + tekan tinggi<\/tspan><\/text><text x=\"224.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"400\"><tspan x=\"224.0\" y=\"92.9\">Jarang. Curigai sumbatan saluran cair pada<\/tspan><tspan x=\"224.0\" y=\"105.5\">instalasi tanpa receiver, atau dua<\/tspan><tspan x=\"224.0\" y=\"118.2\">gangguan sekaligus.<\/tspan><\/text><rect x=\"360\" y=\"26\" width=\"256\" height=\"126\" rx=\"6\" fill=\"#fde9e5\" stroke=\"#d9432f\" stroke-width=\"1.4\"/><text x=\"488.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#d9432f\" font-weight=\"800\"><tspan x=\"488.0\" y=\"51.9\">Keduanya tinggi<\/tspan><\/text><text x=\"488.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"400\"><tspan x=\"488.0\" y=\"92.9\">Kondensor kurang pendinginan atau kotor,<\/tspan><tspan x=\"488.0\" y=\"105.5\">ada udara di sistem, isi refrigeran<\/tspan><tspan x=\"488.0\" y=\"118.2\">berlebih.<\/tspan><\/text><rect x=\"96\" y=\"160\" width=\"256\" height=\"126\" rx=\"6\" fill=\"#e3f3fb\" stroke=\"#1479c9\" stroke-width=\"1.4\"/><text x=\"224.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1479c9\" font-weight=\"800\"><tspan x=\"224.0\" y=\"185.8\">Keduanya rendah<\/tspan><\/text><text x=\"224.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"400\"><tspan x=\"224.0\" y=\"226.9\">Kurang refrigeran (bocor), atau aliran ke<\/tspan><tspan x=\"224.0\" y=\"239.5\">evaporator terhambat: drier buntu,<\/tspan><tspan x=\"224.0\" y=\"252.2\">TEV/solenoid macet.<\/tspan><\/text><rect x=\"360\" y=\"160\" width=\"256\" height=\"126\" rx=\"6\" fill=\"#eef1fb\" stroke=\"#1d0b78\" stroke-width=\"1.4\"/><text x=\"488.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1d0b78\" font-weight=\"800\"><tspan x=\"488.0\" y=\"185.8\">Isap tinggi + tekan rendah<\/tspan><\/text><text x=\"488.0\" font-family=\"Inter, 'DejaVu Sans', sans-serif\" font-size=\"10.12\" text-anchor=\"middle\" fill=\"#1a1a2e\" font-weight=\"400\"><tspan x=\"488.0\" y=\"226.9\">Kompresor tidak memompa penuh: katup/ring<\/tspan><tspan x=\"488.0\" y=\"239.5\">bocor, pengatur kapasitas macet, bypass<\/tspan><tspan x=\"488.0\" y=\"252.2\">terbuka.<\/tspan><\/text><\/svg><figcaption><b>Gambar 5.2<\/b> Arah awal pencarian gangguan dari gabungan tekanan isap dan tekanan tekan<\/figcaption><\/figure>"},{"id":"s5-3","judul":"Tabel gejala, penyebab dan tindakan","html":"<p>Tabel 5.2 merangkum gangguan yang paling sering dijumpai pada mesin pendingin kapal menurut rujukan [4][5][8][14]. Kolom tindakan menyebut arah pekerjaan; langkah rincinya ikuti manual kapal.<\/p>\n<div class=\"tw\"><table id=\"t5-2\" class=\"ts\"><caption>Tabel 5.2 Gejala, kemungkinan penyebab dan tindakan pada mesin pendingin<\/caption>\n<tr><th style=\"width:22%\">Gejala<\/th><th style=\"width:39%\">Kemungkinan penyebab<\/th><th>Tindakan<\/th><\/tr>\n<tr><td rowspan=\"4\">Tekanan tekan terlalu tinggi<\/td><td>Air laut ke kondensor kurang atau terlalu hangat<\/td><td>Periksa pompa, katup, saringan; pulihkan aliran<\/td><\/tr>\n<tr><td>Pipa kondensor kotor atau berkerak<\/td><td>Bersihkan pipa kondensor<\/td><\/tr>\n<tr><td>Udara atau gas tak terembunkan di dalam sistem<\/td><td>Buang udara (<i>purging<\/i>) sesuai manual<\/td><\/tr>\n<tr><td>Isi refrigeran berlebih<\/td><td>Kurangi isi dengan menampungnya ke tabung<\/td><\/tr>\n<tr><td rowspan=\"4\">Tekanan isap terlalu rendah<\/td><td>Isi refrigeran kurang karena bocor<\/td><td>Cari dan perbaiki bocor, lalu isi ulang<\/td><\/tr>\n<tr><td>Filter-drier atau saringan tersumbat<\/td><td>Ganti elemen drier, bersihkan saringan<\/td><\/tr>\n<tr><td>TEV macet, tersumbat es, atau bulb kehilangan isi<\/td><td>Bersihkan/ganti; ganti drier bila ada uap air<\/td><\/tr>\n<tr><td>Evaporator tertutup es; aliran udara atau air dingin kurang<\/td><td>Defrost; bersihkan filter udara; periksa kipas/pompa<\/td><\/tr>\n<tr><td rowspan=\"2\">Tekanan isap tinggi, tekan rendah<\/td><td>Katup isap/tekan kompresor bocor, ring torak aus<\/td><td>Laporkan; pemeriksaan kompresor<\/td><\/tr>\n<tr><td>Pengatur kapasitas macet pada beban rendah<\/td><td>Periksa pengatur kapasitas<\/td><\/tr>\n<tr><td rowspan=\"3\">Kompresor jalan lalu segera berhenti<\/td><td>Pengaman LP memutus (isi kurang, katup isap tertutup)<\/td><td>Periksa katup dan isi refrigeran<\/td><\/tr>\n<tr><td>Pengaman tekanan oli memutus (oli kurang atau berbusa)<\/td><td>Periksa level dan mutu oli<\/td><\/tr>\n<tr><td>Pengaman beban lebih motor jatuh<\/td><td>Cari sebab beban lebih sebelum reset<\/td><\/tr>\n<tr><td rowspan=\"
