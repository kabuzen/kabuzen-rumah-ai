<style>
:root{--ind:#1d0b78;--yel:#ffd60a;--lav:#cfc7ff;--bg:#f6f4fd;--ink:#1a1630;--ok:#1e9e5a;--warn:#e67e22;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ind);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;border:3px solid var(--yel);object-fit:cover}header b{color:var(--yel)}
header nav{margin-left:auto;display:flex;gap:6px}header nav button{background:transparent;border:1px solid #4b3bb0;color:#fff;border-radius:20px;padding:7px 13px;font-weight:700;cursor:pointer}
header nav button.on{background:var(--yel);color:var(--ind)}
main{max-width:1100px;margin:0 auto;padding:20px 14px 60px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(29,11,120,.08);margin-bottom:14px}
h1,h2{color:var(--ind);margin:.2em 0 .5em}
.btn{background:var(--yel);color:var(--ind);border:0;border-radius:22px;padding:10px 20px;font-weight:800;cursor:pointer}.btn.sec{background:#ece8fb}
.cover{background:radial-gradient(ellipse at 50% 30%,#3b26c9,#1d0b78 55%,#0b0624);color:#fff;border-radius:22px;padding:34px 22px;text-align:center}
.cover .logo{width:92px;height:92px;border-width:5px}.cover h1{color:#fff}.cover h1 span{color:var(--yel)}
input,select,textarea{padding:8px;border-radius:8px;border:1px solid #d6d0f2;font-family:inherit;font-size:14px;width:100%}
label{font-weight:700;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.kpi div{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(29,11,120,.07)}
.kpi b{display:block;font-size:28px;color:var(--ind)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{background:var(--ind);color:#fff;text-align:left;padding:8px}td{padding:6px;border-bottom:1px solid #eee;vertical-align:top}
.pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:800;color:#fff}
.bar{height:10px;background:#ece8fb;border-radius:5px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--ind)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters select{width:auto}
.gantt td.q{width:5.5%;padding:0;height:22px}.gantt td.q.on{background:#cfc7ff}.gantt td.q.now{box-shadow:inset 2px 0 0 var(--bad)}
.note{font-size:12.5px;color:#666}.err{color:var(--bad);font-weight:700}
@media(max-width:700px){.hide-m{display:none}}

>Menyusun Kurikulum STEM di Sekolah Kedinasan</b></p></div>
<div class="card"><h2>Daftar</h2><label>Nama</label><input id="n"><label>Email</label><input id="e" type="email"><label>Lembaga</label><input id="l"><label>Bulan mulai peta jalan</label><input id="s" type="month">
<p id="er" class="err"></p><button class="btn" id="go">Daftar & mulai</button><p class="note">Data tersimpan di perangkat ini. Email konfirmasi belum tersedia pada versi ini.</p></div>`;
$('#go').onclick=()=>{const n=$('#n').value.trim(),e=$('#e').value.trim(),s=$('#s').value;if(n.length<3)return $('#er').textContent='Isi nama.';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return $('#er').textContent='Isi email yang benar.';if(!s)return $('#er').textContent='Pilih bulan mulai.';
db.user={n,e,l:$('#l').value.trim()};db.start=s;save();show('dash')}}
function stats(rows){const d=rows.filter(r=>it(r[0]).st==='Selesai').length,b=rows.filter(r=>it(r[0]).st==='Terhambat').length,lt=rows.filter(late).length,avg=Math.round(rows.reduce((a,r)=>a+(+it(r[0]).p||0),0)/rows.length);return{d,b,lt,avg}}
function dash(){const all=stats(SEED),pj=stats(SEED.filter(r=>r[1]==='Peta jalan')),rk=stats(SEED.filter(r=>r[1]==='Rekomendasi'));const q=qNow();
app.innerHTML=`<div class="card"><h1>Dasbor pimpinan</h1><p>${esc(db.user.l||db.user.n)} · mulai ${esc(db.start)} · sekarang <b>${q<1?'belum mulai':q>12?'setelah tahun 3':'Tahun '+Math.ceil(q/4)+', triwulan '+((q-1)%4+1)}</b></p></div>
<div class="kpi"><div>Kemajuan rata-rata<b id="k-avg">${all.avg}%</b></div><div>Kegiatan selesai<b>${all.d}/${SEED.length}</b></div><div>Terhambat<b style="color:var(--bad)">${all.b}</b></div><div>Lewat jadwal<b style="color:var(--warn)">${all.lt}</b></div></div>
<div class="card" style="margin-top:14px"><h2>Ringkasan</h2><table><tr><th>Kelompok</th><th>Selesai</th><th>Kemajuan</th></tr>
<tr><td>Peta jalan (12 kegiatan)</td><td>${pj.d}/12</td><td><div class="bar"><i style="width:${pj.avg}%"></i></div>${pj.avg}%</td></tr><tr><td>Sepuluh rekomendasi</td><td>${rk.d}/10</td><td><div class="bar"><i style="width:${rk.avg}%"></i></div>${rk.avg}%</td></tr></table></div>
<div class="card"><h2>Perlu perhatian</h2>${SEED.filter(r=>it(r[0]).st==='Terhambat'||late(r)).map(r=>`<p><b>${r[0]}</b> ${r[2]} — ${it(r[0]).st==='Terhambat'?'<span class=err>terhambat</span>':'lewat jadwal (target T'+r[4]+')'}${it(r[0]).note?'<br><span class=note>'+esc(it(r[0]).note)+'</span>':''}</p>`).join('')||'<p class="note">Tidak ada kegiatan terhambat atau lewat jadwal.</p>'}</div>
<p><button class="btn sec" id="csv">Unduh CSV</button></p>`;$('#csv').onclick=csv}
function items(){app.innerHTML=`<div class="card"><h2>Daftar kegiatan</h2><div class="filters"><select id="fk"><option value="">Semua kelompok</option><option>Peta jalan</option><option>Rekomendasi</option></select><select id="fs"><option value="">Semua status</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select></div>
<div style="overflow-x:auto"><table id="tb"></table></div><p class="note">T = triwulan sejak bulan mulai (T1–T12 = tiga tahun). Perubahan tersimpan otomatis.</p></div>`;
const draw=()=>{const fk=$('#fk').value,fs=$('#fs').value;$('#tb').innerHTML=`<tr><th>Kode</th><th>Kegiatan</th><th class="hide-m">Jadwal</th><th>Penanggung jawab</th><th>Status</th><th>%</th><th class="hide-m">Catatan</th></tr>`+
SEED.filter(r=>(!fk||r[1]===fk)&&(!fs||it(r[0]).st===fs)).map(r=>{const x=it(r[0]);return `<tr${late(r)?' style="background:#fff4e5"':''}><td><b>${r[0]}</b></td><td>${r[2]}</td><td class="hide-m">T${r[3]}–T${r[4]}</td><td><input data-id="${r[0]}" data-f="pic" value="${esc(x.pic)}" placeholder="Nama/jabatan"></td>
<td><select data-id="${r[0]}" data-f="st">${ST.map(s=>`<option ${x.st===s?'selected':''}>${s}</option>`).join('')}</select> <span class="pill" style="background:${SC[x.st]}">&nbsp;</span></td><td><input type="number" min="0" max="100" step="10" data-id="${r[0]}" data-f="p" value="${x.p||0}" style="width:70px"></td><td class="hide-m"><input data-id="${r[0]}" data-f="note" value="${esc(x.note)}"></td></tr>`}).join('');
document.querySelectorAll('#tb [data-id]').forEach(el=>el.onchange=()=>{const x=it(el.dataset.id);let v=el.value;if(el.dataset.f==='p'){v=Math.max(0,Math.min(100,+v||0));el.value=v;if(v===100)x.st='Selesai'}if(el.dataset.f==='st'&&v==='Selesai')x.p=100;x[el.dataset.f]=v;save();draw()})};
$('#fk').onchange=draw;$('#fs').onchange=draw;draw()}
function gantt(){const q=qNow();app.innerHTML=`<div class="card"><h2>Linimasa tiga tahun</h2><div style="overflow-x:auto"><table class="gantt"><tr><th>Kegiatan</th>${[...Array(12)].map((_,i)=>`<th style="font-size:11px;text-align:center">${i%4===0?'Th'+(i/4+1)+' ':''}T${i%4+1}</th>`).join('')}</tr>
${SEED.filter(r=>r[1]==='Peta jalan').map(r=>`<tr><td style="min-width:220px">${r[2]} <span class="pill" style="background:${SC[it(r[0]).st]}">${it(r[0]).p||0}%</span></td>${[...Array(12)].map((_,i)=>`<td class="q ${i+1>=r[3]&&i+1<=r[4]?'on':''} ${i+1===q?'now':''}"></td>`).join('')}</tr>`).join('')}</table></div><p class="note">Garis merah tipis = triwulan berjalan.</p></div>`}
function csv(){const rows=[['Kode','Kelompok','Kegiatan','Mulai','Selesai','Penanggung jawab','Status','Kemajuan','Catatan']].concat(SEED.map(r=>{const x=it(r[0]);return[r[0],r[1],r[2],'T'+r[3],'T'+r[4],x.pic,x.st,(x.p||0)+'%',x.note||'']}));
const t=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download='pemantau-peta-jalan-stem.csv';a.click()}
show('dash');
</script></body></html>
