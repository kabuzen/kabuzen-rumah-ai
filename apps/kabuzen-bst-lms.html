<style>
:root{--ind:#1d0b78;--yel:#ffd60a;--bg:#f4f4fa;--tx:#1b1b25;--mut:#666a80;--ok:#2e9e5b;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{background:var(--ind);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header .t{flex:1;font-weight:800;letter-spacing:.3px}header .t small{display:block;color:var(--yel);font-weight:700;font-size:11px;letter-spacing:1.5px}
header img{width:44px;height:44px;border-radius:50%;border:3px solid var(--yel)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid #e3e3ee}
nav button{border:0;background:#eeeef8;color:var(--ind);padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
nav button.on{background:var(--ind);color:#fff}
main{max-width:860px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(29,11,120,.06)}
h1,h2,h3{color:var(--ind);line-height:1.25}h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:14px 0 6px}
.btn{display:inline-block;border:0;border-radius:24px;padding:11px 20px;font-weight:800;cursor:pointer;background:var(--yel);color:var(--ind);font-size:15px}
.btn.s{background:var(--ind);color:#fff}.btn.g{background:#eeeef8;color:var(--ind)}.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}input,select{width:100%;padding:11px;border:1px solid #cfd0e0;border-radius:10px;font-size:15px}
.hero{background:linear-gradient(160deg,#1d0b78,#0b0624);color:#fff;border-radius:20px;padding:26px 22px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:26px}.hero .k{color:var(--yel);font-weight:800;letter-spacing:2px;font-size:12px}
.hero img{position:absolute;right:18px;top:18px;width:58px;height:58px;border-radius:50%;border:3px solid var(--yel)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mod{border-left:6px solid var(--c);cursor:pointer}.mod.lock{opacity:.55;cursor:not-allowed}
.bar{height:9px;background:#e6e6f2;border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--c,var(--ind))}
.tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:4px;margin-right:6px}
.L1{background:#2e9e5b}.L2{background:#2a6fdb}.L3{background:#8e44ad}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;border:0;padding:9px;border-radius:10px;font-weight:800;cursor:pointer;background:#eeeef8;color:var(--ind)}
.tabs button.on{color:#fff}.tabs button.L1{background:#2e9e5b}.tabs button.L2{background:#2a6fdb}.tabs button.L3{background:#8e44ad}
ul{padding-left:20px}li{margin-bottom:5px}
.q{border:1px solid #e3e3ee;border-radius:12px;padding:12px;margin-bottom:10px}.q p{margin:0 0 8px;font-weight:700}
.opt{display:block;width:100%;text-align:left;border:1px solid #d7d8e8;background:#fff;border-radius:10px;padding:9px 12px;margin:5px 0;cursor:pointer;font-size:14px}
.opt.sel{border-color:var(--ind);background:#eeeef8}.opt.ok{border-color:var(--ok);background:#e6f6ec}.opt.no{border-color:var(--bad);background:#fdecea}
.ex{font-size:13px;color:#333;background:#fff8d6;border-radius:8px;padding:8px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--ind);color:#fff;text-align:left;padding:7px}td{border-bottom:1px solid #e3e3ee;padding:7px}
.note{font-size:13px;color:var(--mut)}.hide{display:none}
.score{font-size:40px;font-weight:900;color:var(--ind)}
video{width:100%;max-width:360px;border-radius:14px;display:block;margin:8px auto;background:#000}
.cert{border:6px double var(--ind);padding:30px;text-align:center;background:#fff}
.cert h1{font-size:28px}.cert .nm{font-size:30px;font-weight:900;color:var(--ind);margin:12px 0;border-bottom:3px solid var(--yel);display:inline-block;padding:0 20px}
@media print{header,nav,.np{display:none!important}main{max-width:none}.card{box-shadow:none}}
</style></head><body>

const MODS=[
{id:'pst',n:'Modul 1',t:'Teknik Penyelamatan Diri',ref:'STCW Code Tabel A-VI/1-1',c:'#2e9e5b',
 tujuan:['Menyebutkan jenis keadaan darurat dan alat penolong di kapal','Memakai baju pelampung dan pakaian cebur dengan benar','Terjun dengan aman, bertahan di air, dan naik ke rakit','Melakukan tindakan awal di sekoci/rakit dan memakai alat penentu lokasi'],
 L:{1:['Alarm darurat umum: 7 tiup pendek atau lebih diikuti 1 tiup panjang. Tugas tiap awak ada di sijil darurat.','Saat alarm: kenakan pakaian hangat dan sepatu, ambil baju pelampung, menuju tempat berkumpul, jangan kembali ke kamar.','Baju pelampung SOLAS harus dapat dipakai dalam 1 menit dan aman untuk terjun dari sekurang-kurangnya 4,5 m.','Terjun: titik terendah, lengan silang menahan kerah baju pelampung, tutup hidung, kaki rapat, melangkah keluar.','Di air: sikap HELP bila sendirian, berangkulan melingkar bila berkelompok. Jangan berenang tanpa tujuan.'],
    2:['Tindakan awal di rakit: potong tali tambat, menjauh dari kapal, pasang jangkar apung, rawat (tutup pintu, keringkan lantai, P3K, obat mabuk laut).','Bahaya utama: kejutan air dingin, hipotermia (suhu inti < 35 °C), kekurangan air minum, mabuk laut, sengatan matahari, putus asa.','Prinsip 1–10–1: 1 menit mengendalikan napas, 10 menit gerakan bermakna, sekitar 1 jam sebelum hilang kesadaran (perkiraan).','Piroteknik hanya dinyalakan bila kapal atau pesawat pencari terlihat atau terdengar.'],
    3:['SOLAS III/19: tiap awak ikut latihan meninggalkan kapal dan kebakaran sekurang-kurangnya sebulan sekali; dalam 24 jam setelah berangkat bila lebih dari 25% awak belum ikut bulan sebelumnya.','Sekoci diturunkan dan diolah gerak oleh awaknya sekurang-kurangnya sekali tiga bulan.','Latihan yang baik: skenario realistis, tugas nyata, evaluasi segera (debriefing), dicatat di buku harian kapal. Periksa pengait pelepas dan tali pengaman.']},
 anim:{judul:'Animasi: Saat Kapal Harus Ditinggalkan',url:'/video/animasi-bst-meninggalkan-kapal.mp4'},
 q:[['Sinyal alarm keadaan darurat umum di kapal adalah …',['tiga tiup panjang','tujuh tiup pendek atau lebih diikuti satu tiup panjang','satu tiup panjang terus-menerus','dua tiup pendek diikuti dua tiup panjang'],1,'SOLAS III/6.4.2: tujuh tiup pendek atau lebih diikuti satu tiup panjang.'],
 ['Tugas setiap awak dalam keadaan darurat tercantum dalam …',['daftar awak kapal','buku harian kapal','sijil darurat (muster list)','sertifikat keselamatan kapal'],2,'Sijil darurat memuat sinyal, tugas, dan tempat berkumpul setiap awak.'],
 ['Saat terjun memakai baju pelampung, salah satu tangan sebaiknya …',['direntangkan ke samping','menahan kerah baju pelampung sambil menyilang di dada','memegang pagar kapal','diangkat ke atas kepala'],1,'Menahan kerah mencegah baju pelampung menghantam dagu atau terlepas.'],
 ['Sikap HELP bertujuan untuk …',['berenang lebih cepat','mengurangi hilangnya panas tubuh','memudahkan terlihat dari udara','menegakkan rakit terbalik'],1,'HELP = Heat Escape Lessening Posture.'],
 ['Tindakan pertama setelah semua orang yang dapat dijangkau naik ke rakit adalah …',['menyalakan roket parasut','membagikan air minum','memotong tali tambat dan menjauh dari kapal','menurunkan jangkar apung'],2,'Menjauh menghindari isapan kapal tenggelam, puing, dan api.'],
 ['Fungsi jangkar apung (sea anchor) adalah …',['menambatkan rakit ke dasar laut','mengurangi hanyut dan menjaga rakit dekat lokasi kejadian','menambah kecepatan rakit','sebagai pemberat'],1,'Pencarian dimulai dari posisi kejadian; jangkar apung juga mengurangi risiko terbalik.'],
 ['Piroteknik sebaiknya dinyalakan …',['segera setelah rakit mengembang','setiap jam sekali','saat kapal atau pesawat pencari terlihat atau terdengar','hanya siang hari'],2,'Jumlah piroteknik terbatas; gunakan saat dapat dilihat penolong.'],
 ['Korban di rakit tidak boleh minum air laut karena …',['rasanya asin','mempercepat dehidrasi dan merusak ginjal','mengandung minyak','menyebabkan mabuk laut'],1,'Kadar garam air laut menarik cairan dari tubuh.'],
 ['Hipotermia terjadi bila suhu inti tubuh turun di bawah …',['37 °C','36,5 °C','35 °C','30 °C'],2,'Batas hipotermia adalah suhu inti di bawah 35 °C.'],
 ['Menurut SOLAS, awak kapal barang wajib ikut latihan meninggalkan kapal sekurang-kurangnya …',['sekali seminggu','sekali sebulan','sekali tiga bulan','sekali setahun'],1,'SOLAS III/19.3.2: sekali setiap bulan.']]},
{id:'fpff',n:'Modul 2',t:'Pencegahan dan Pemadaman Kebakaran',ref:'STCW Code Tabel A-VI/1-2',c:'#c0392b',
 tujuan:['Menjelaskan unsur api, rambat panas, dan kelas kebakaran','Mengenali sumber nyala di kapal dan mencegahnya','Memilih dan memakai alat pemadam api ringan','Memakai SCBA dan fireman\'s outfit, serta bertindak saat menemukan kebakaran'],
 L:{1:['Segitiga api: bahan bakar, oksigen, panas; ditambah reaksi berantai menjadi tetrahedron api.','Kelas: A padat, B cair, C gas, D logam, F/K minyak masak; listrik diputus dulu.','Jangan menyemprot air ke minyak masak yang terbakar atau peralatan listrik bertegangan.','Saat menemukan kebakaran: beri tanda bahaya dan lapor (lokasi, apa yang terbakar, besarnya, korban), selamatkan, batasi, padamkan bila kecil.','Alat pemadam: TARIK pin, ARAHKAN ke dasar api, TEKAN tuas, SAPU dari sisi ke sisi.'],
    2:['Rambat panas: konduksi lewat sekat baja, konveksi lewat tangga/ventilasi, radiasi. Lakukan pendinginan batas.','Sebelum CO₂ banjir total dilepas: ruangan dikosongkan dan semua awak dihitung.','SCBA: periksa tekanan, uji kebocoran, uji peluit, rapatkan masker, lapor ke pengawas masuk. EEBD hanya untuk meloloskan diri.','Selang: pancaran lurus untuk jangkauan, kabut untuk mendinginkan dan melindungi regu.'],
    3:['Pencarian di ruang berasap: berpasangan, pola satu sisi dinding, tali penyelamat, keluar dengan cadangan udara cukup.','Setelah padam: penjagaan api ulang, periksa ruang sebelah, ventilasi terkendali, ukur oksigen dan gas.','Air pemadam memengaruhi stabilitas kapal (free surface effect); diperhitungkan perwira.']},
 q:[['Tiga unsur segitiga api adalah …',['air, udara, panas','bahan bakar, oksigen, panas','asap, api, panas','bahan bakar, CO₂, oksigen'],1,'Hilangkan salah satu unsur untuk memadamkan api.'],
 ['Kebakaran minyak masak di dapur termasuk kelas …',['A','B','D','F/K'],3,'Kelas F/K: minyak dan lemak masak.'],
 ['Media pemadam yang TIDAK boleh dipakai pada peralatan listrik bertegangan adalah …',['CO₂','serbuk kimia','air','semua boleh'],2,'Air menghantarkan listrik.'],
 ['Rambat panas melalui sekat baja ke ruang sebelah disebut …',['konveksi','konduksi','radiasi','difusi'],1,'Konduksi: panas merambat melalui benda padat.'],
 ['Langkah pertama saat menemukan kebakaran adalah …',['mengambil barang pribadi','memberi tanda bahaya dan melapor','membuka semua pintu','menunggu perintah'],1,'Tanda bahaya menggerakkan seluruh organisasi pemadaman.'],
 ['Pada alat pemadam api ringan, ujung selang diarahkan ke …',['puncak nyala api','asap','dasar api','dinding belakang api'],2,'Bahan yang terbakar ada di dasar api.'],
 ['EEBD digunakan untuk …',['memadamkan api di kamar mesin','meloloskan diri dari ruang berasap','mencari korban','mengisi tabung SCBA'],1,'EEBD bekerja singkat dan hanya untuk meloloskan diri.'],
 ['Sebelum CO₂ banjir total dilepas ke kamar mesin, yang wajib dilakukan adalah …',['membuka ventilasi','memastikan semua orang keluar dan dihitung','menyalakan pompa darurat','mendinginkan tabung CO₂'],1,'CO₂ dalam kadar pemadaman mematikan bagi manusia.'],
 ['Tujuan pendinginan batas (boundary cooling) adalah …',['memadamkan api langsung','mencegah api merambat ke ruang sebelah','menghemat air','menurunkan suhu SCBA'],1,'Mendinginkan sekat dan geladak di sekitar ruang terbakar.'],
 ['Penjagaan api ulang (re-flash watch) dilakukan …',['sebelum pemadaman','selama api besar','setelah api padam','hanya di dapur'],2,'Bara tersembunyi dapat menyala kembali.']]},
{id:'efa',n:'Modul 3',t:'Pertolongan Pertama Dasar',ref:'STCW Code Tabel A-VI/1-3',c:'#2a6fdb',
 tujuan:['Memastikan keamanan lokasi dan menilai korban (D-R-S-A-B-C-D)','Melakukan RJP dan memakai AED','Menangani perdarahan, syok, luka bakar, patah tulang','Meminta nasihat medis dan melaporkan keadaan korban'],
 L:{1:['D-R-S-A-B-C-D: Bahaya, Respons, Minta bantuan, Jalan napas, Pernapasan, RJP, Defibrilasi (AED).','RJP dewasa: tekan tengah dada 5–6 cm, 100–120 kali/menit, 30 tekanan : 2 napas bila terlatih.','Posisi pemulihan untuk korban tidak sadar yang bernapas normal tanpa cedera tulang belakang.','Perdarahan: tekan langsung luka. Torniket untuk perdarahan anggota gerak yang mengancam nyawa.','Luka bakar: dinginkan dengan air mengalir sejuk 20 menit; jangan pecahkan lepuh; tutup dengan plastik pembungkus makanan.'],
    2:['Syok: pucat, dingin, berkeringat, nadi cepat lemah. Baringkan, hangatkan, jangan beri makan/minum.','Patah tulang: jangan diluruskan; bidai melewati sendi atas dan bawah.','Curigai cedera tulang belakang pada korban jatuh atau terhantam; tahan kepala-leher sejajar.','Korban tenggelam: berikan 5 napas bantuan dulu sebelum tekanan dada.'],
    3:['Siapkan data sebelum meminta nasihat medis (TMAS): identitas kapal, posisi, korban, kejadian, tanda vital, tindakan, obat tersedia.','Rujukan standar: International Medical Guide for Ships (WHO/ILO/IMO).','Lindungi penolong (sarung tangan, masker RJP) dan beri dukungan psikologis sederhana.']},
 q:[['Langkah pertama sebelum menolong korban adalah …',['memeriksa nadi','memastikan lokasi aman','memberi napas bantuan','memindahkan korban'],1,'Jangan menjadi korban kedua.'],
 ['Kecepatan tekanan dada pada RJP dewasa adalah …',['60–80 kali/menit','80–100 kali/menit','100–120 kali/menit','140–160 kali/menit'],2,'Kecepatan anjuran 100–120 kali per menit.'],
 ['Perbandingan tekanan dada dan napas bantuan pada RJP dewasa oleh penolong terlatih adalah …',['15 : 2','30 : 2','5 : 1','30 : 5'],1,'30 tekanan diikuti 2 napas bantuan.'],

const CHECK={'PST':['Menyebut sinyal alarm darurat umum dan tempat berkumpul ★','Memakai baju pelampung dengan benar dalam 1 menit ★','Memakai pakaian cebur dengan benar','Memeriksa area bawah, sikap terjun benar ★','Berenang telentang, sikap HELP, huddle','Menegakkan rakit terbalik','Naik ke rakit dan membantu rekan','Menjelaskan tindakan awal di rakit dan piroteknik'],
'FPFF':['Memberi tanda bahaya dan melapor dengan lengkap ★','Memilih alat pemadam sesuai kelas kebakaran ★','Memadamkan api: Tarik-Arahkan-Tekan-Sapu','Memeriksa tekanan dan kebocoran SCBA ★','Memakai SCBA dan fireman\'s outfit lengkap','Bergerak berpasangan di ruang berasap dengan tali penyelamat ★','Memakai selang dengan pancaran lurus dan kabut'],
'EFA & PSSR':['Memastikan keamanan lokasi sebelum menolong ★','RJP: 5–6 cm, 100–120/menit, 30:2 ★','Memakai AED sesuai perintah alat','Balut tekan dan bidai dengan benar','Posisi pemulihan','Izin masuk ruang tertutup; penjaga tidak masuk sendirian ★','Memerankan cara campur tangan 5D dengan aman','Menemukan pelanggaran jam istirahat']};
const KEY='kz-bst-lms-v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.users=S.users||{};S.praktik=S.praktik||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function me(){return S.cur&&S.users[S.cur]}
function lvl(){const r=(me()||{}).peran;return r==='Instruktur'?3:r==='Pelaut aktif'?2:1}
function unlocked(i){if(i===0)return true;const u=me();return (u.skor[MODS[i-1].id]||0)>=70}
function go(v,a){window.scrollTo(0,0);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({home,modul,ujian,praktik,rekap,sert,keluar,daftar}[v]||home)(a)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#lg').src=LOGO;$('#lg').onerror=function(){this.style.display='none'};

function daftar(){
 $('#nav').classList.add('hide');
 app.innerHTML=`<div class="hero"><img src="${LOGO}" onerror="this.remove()"><div class="k">SELAMAT DATANG</div><h1>KABUZEN BASIC SAFETY TRAINING</h1>
 <p>Ruang belajar pendamping buku Seri Buku KABUZEN Bidang Kepelautan, Jilid 1 (STCW Bab VI): empat modul, animasi, kuis berpembahasan, ujian akhir, daftar periksa praktik, dan rekap nilai.</p></div>
 <div class="card"><h2>Daftar</h2>
 <label>Nama lengkap</label><input id="fn" autocomplete="name">
 <label>Email</label><input id="fe" type="email" autocomplete="email">
 <label>Lembaga / kapal</label><input id="fl">
 <label>Peran</label><select id="fr"><option>Taruna</option><option>Pelaut aktif</option><option>Instruktur</option></select>
 <p class="note">Data tersimpan di perangkat ini. Email konfirmasi belum tersedia pada versi ini.</p>
 <button class="btn" id="bd">Daftar</button> <span id="err" style="color:var(--bad);font-weight:700"></span>
 ${Object.keys(S.users).length?`<h3>Sudah terdaftar di perangkat ini?</h3>${Object.values(S.users).map(u=>`<button class="btn g" data-e="${esc(u.email)}" style="margin:4px">${esc(u.nama)}</button>`).join('')}`:''}</div>
 <p class="note np">Sertifikat dari aplikasi ini adalah bukti belajar mandiri, bukan sertifikat BST/STCW. Sertifikat resmi hanya diterbitkan lembaga diklat yang disetujui Administrasi.</p>`;
 $('#bd').onclick=()=>{const n=$('#fn').value.trim(),e=$('#fe').value.trim().toLowerCase();
  if(n.length<3)return $('#err').textContent='Isi nama lengkap.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return $('#err').textContent='Email tidak valid.';
  S.users[e]=S.users[e]||{nama:n,email:e,lembaga:$('#fl').value.trim(),peran:$('#fr').value,skor:{},ujian:null,tgl:new Date().toISOString().slice(0,10)};
  S.cur=e;save();$('#nav').classList.remove('hide');go('home')};
 app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.e;save();$('#nav').classList.remove('hide');go('home')});
}
function home(){const u=me();
 const done=MODS.filter(m=>(u.skor[m.id]||0)>=70).length;
 app.innerHTML=`<div class="card"><h1>Halo, ${esc(u.nama)}</h1><p class="note">${esc(u.peran)}${u.lembaga?' · '+esc(u.lembaga):''} · ${done} dari 4 modul lulus</p>
 <div class="bar" style="--c:var(--yel)"><i style="width:${done*25}%"></i></div></div>
 <div class="mods">${MODS.map((m,i)=>{const sk=u.skor[m.id],lk=!unlocked(i);return `<div class="card mod ${lk?'lock':''}" style="--c:${m.c}" data-i="${i}">
 <b style="color:${m.c}">${m.n}${lk?' · terkunci':''}</b><h2 style="margin:4px 0">${m.t}</h2><div class="note">${m.ref}</div>
 <div class="bar"><i style="width:${sk||0}%"></i></div><div class="note">Kuis: ${sk==null?'belum':sk+' / 100'}${sk>=70?' ✓ lulus':''}</div></div>`}).join('')}</div>
 <div class="card"><h2>Ujian Akhir</h2><p>20 soal acak dari 40 soal, nilai lulus 70. Terbuka setelah empat modul lulus.</p><button class="btn s" ${done<4?'disabled':''} onclick="go('ujian')">Mulai Ujian Akhir</button></div>`;
 app.querySelectorAll('.mod').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;if(unlocked(i))go('modul',i)});
}
function modul(i){const m=MODS[i];let L=lvl();
 const draw=()=>{app.innerHTML=`<div class="card" style="border-top:6px solid ${m.c}"><b style="color:${m.c}">${m.n} · ${m.ref}</b><h1>${m.t}</h1>
 <h3>Tujuan pembelajaran</h3><ul>${m.tujuan.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3>Materi berlapis</h3><div class="tabs">${[1,2,3].map(k=>`<button data-l="${k}" class="${k===L?'on L'+k:''}">${['','DASAR','MENENGAH','LANJUT'][k]}</button>`).join('')}</div>
 ${[1,2,3].filter(k=>k<=L).map(k=>`<div><span class="tag L${k}">${['','DASAR','MENENGAH','LANJUT'][k]}</span><ul>${m.L[k].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}
 ${m.anim?`<h3>${m.anim.judul}</h3><video controls preload="none" src="${m.anim.url}"></video>`:''}
 <p class="note">Uraian lengkap ada di buku KABUZEN BASIC SAFETY TRAINING, Bab ${['III','IV','V','VI'][i]}.</p></div>
 <div class="card"><h2>Kuis Modul</h2><p>10 soal, nilai lulus 70. Pembahasan tampil setelah dikumpulkan.</p><div id="qz"></div></div>`;
 app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{L=+b.dataset.l;draw()});
 quiz($('#qz'),m.q,sc=>{const u=me();u.skor[m.id]=Math.max(u.skor[m.id]||0,sc);save();
   return sc>=70?(i<3?`<button class="btn" onclick="go('modul',${i+1})">Lanjut ke ${MODS[i+1].n}</button>`:`<button class="btn" onclick="go('ujian')">Ke Ujian Akhir</button>`):`<button class="btn g" onclick="go('modul',${i})">Ulangi kuis</button>`})};
 draw();
}
function quiz(el,qs,after){const ans={};
 el.innerHTML=qs.map((q,k)=>`<div class="q" id="q${k}"><p>${k+1}. ${q[0]}</p>${q[1].map((o,j)=>`<button class="opt" data-k="${k}" data-j="${j}">${'ABCD'[j]}. ${o}</button>`).join('')}<div class="ex hide"></div></div>`).join('')+`<button class="btn s" id="kumpul">Kumpulkan</button> <span id="qerr" class="note"></span><div id="hasil"></div>`;
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(el.dataset.done)return;const k=+b.dataset.k;ans[k]=+b.dataset.j;el.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.classList.toggle('sel',x===b))});
 el.querySelector('#kumpul').onclick=()=>{if(Object.keys(ans).length<qs.length)return el.querySelector('#qerr').textContent=`Baru ${Object.keys(ans).length} dari ${qs.length} soal dijawab.`;
  el.dataset.done=1;let b=0;qs.forEach((q,k)=>{const ok=ans[k]===q[2];if(ok)b++;
   el.querySelectorAll(`[data-k="${k}"]`).forEach(x=>{const j=+x.dataset.j;if(j===q[2])x.classList.add('ok');else if(j===ans[k])x.classList.add('no')});
   const ex=el.querySelector(`#q${k} .ex`);ex.classList.remove('hide');ex.innerHTML=(ok?'<b>Benar.</b> ':'<b>Kurang tepat.</b> Jawaban: '+'ABCD'[q[2]]+'. ')+q[3]});
  const sc=Math.round(b/qs.length*100);el.querySelector('#kumpul').remove();
  el.querySelector('#hasil').innerHTML=`<div class="card" style="text-align:center"><div class="score">${sc}</div><p>${b} dari ${qs.length} benar · ${sc>=70?'<b style="color:var(--ok)">LULUS</b>':'<b style="color:var(--bad)">belum lulus</b>'}</p>${after(sc)}</div>`;
  el.querySelector('#hasil').scrollIntoView({behavior:'smooth'})};
}
function ujian(){const u=me();
 if(MODS.some(m=>(u.skor[m.id]||0)<70)){app.innerHTML=`<div class="card"><h2>Ujian Akhir</h2><p>Selesaikan dulu keempat kuis modul dengan nilai minimal 70.</p><button class="btn" onclick="go('home')">Ke Beranda</button></div>`;return}
 const bank=MODS.flatMap(m=>m.q);const pick=bank.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).slice(0,20).map(x=>x[1]);
 app.innerHTML=`<div class="card"><h1>Ujian Akhir</h1><p>20 soal acak dari bank 40 soal. Nilai lulus 70.</p><div id="qz"></div></div>`;
 quiz($('#qz'),pick,sc=>{if(!u.ujian||sc>u.ujian.nilai)u.ujian={nilai:sc,tgl:new Date().toISOString().slice(0,10)};save();
  return sc>=70?`<button class="btn" onclick="go('sert')">Lihat Sertifikat</button>`:`<button class="btn g" onclick="go('ujian')">Ulangi ujian</button>`});
}
function sert(){const u=me();if(!u.ujian||u.ujian.nilai<70){go('ujian');return}
 app.innerHTML=`<div class="cert"><img src="${LOGO}" onerror="this.remove()" style="width:70px;border-radius:50%;border:4px solid var(--yel)">
 <p style="letter-spacing:3px;font-weight:800;color:#8a6500">SERTIFIKAT PENYELESAIAN BELAJAR MANDIRI</p><h1>KABUZEN BASIC SAFETY TRAINING</h1>
 <p>diberikan kepada</p><div class="nm">${esc(u.nama)}</div>
 <p>yang telah menyelesaikan empat modul dan Ujian Akhir dengan nilai <b>${u.ujian.nilai}</b><br>pada ${u.ujian.tgl}</p>
 <p class="note">Seri Buku KABUZEN Bidang Kepelautan, Jilid 1 · Penulis: Laksma TNI Dr. Arif Badrudin, M.Mgt.Stud.<br>Bukan sertifikat BST/STCW. Sertifikat resmi diterbitkan lembaga diklat yang disetujui Administrasi.</p></div>
 <p class="np" style="text-align:center"><button class="btn" onclick="print()">Cetak</button></p>`;
}
function praktik(){const groups=Object.keys(CHECK);let g=groups[0];
 const draw=()=>{const recs=S.praktik[g]||[];
 app.innerHTML=`<div class="card"><h1>Daftar Periksa Praktik</h1><p class="note">Untuk instruktur saat ujian praktik. Tanda ★ = butir kritis; peserta kompeten bila semua butir kritis "Ya".</p>
 <div class="tabs">${groups.map(x=>`<button data-g="${x}" class="${x===g?'on L1':''}">${x}</button>`).join('')}</div>
 <label>Nama peserta</label><input id="pn">
 <table><tr><th>Butir</th><th style="width:70px">Ya</th></tr>${CHECK[g].map((b,k)=>`<tr><td>${b}</td><td><input type="checkbox" id="c${k}" style="width:22px;height:22px"></td></tr>`).join('')}</table>
 <p><button class="btn s" id="ps">Simpan</button> <span id="pe" class="note"></span></p></div>
 <div class="card"><h2>Hasil ${g}</h2>${recs.length?`<table><tr><th>Peserta</th><th>Tanggal</th><th>Butir Ya</th><th>Hasil</th></tr>${recs.map(r=>`<tr><td>${esc(r.nama)}</td><td>${r.tgl}</td><td>${r.ya}/${r.n}</td><td><b style="color:${r.kompeten?'var(--ok)':'var(--bad)'}">${r.kompeten?'Kompeten':'Ulang praktik'}</b></td></tr>`).join('')}</table>`:'<p class="note">Belum ada data.</p>'}</div>`;
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=b.dataset.g;draw()});
 $('#ps').onclick=()=>{const n=$('#pn').value.trim();if(!n)return $('#pe').textContent='Isi nama peserta.';
  const v=CHECK[g].map((b,k)=>$('#c'+k).checked);const kompeten=CHECK[g].every((b,k)=>!b.includes('★')||v[k]);
  (S.praktik[g]=S.praktik[g]||[]).push({nama:n,tgl:new Date().toISOString().slice(0,10),ya:v.filter(Boolean).length,n:v.length,kompeten});save();draw()}};
 draw();
}
function rekap(){const us=Object.values(S.users);
 app.innerHTML=`<div class="card"><h1>Rekap Nilai</h1><p class="note">Semua akun yang terdaftar di perangkat ini.</p>
 <table><tr><th>Nama</th><th>Peran</th>${MODS.map(m=>`<th>${m.n.replace('Modul ','M')}</th>`).join('')}<th>Ujian</th></tr>
 ${us.map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.peran)}</td>${MODS.map(m=>`<td>${u.skor[m.id]??'–'}</td>`).join('')}<td>${u.ujian?u.ujian.nilai:'–'}</td></tr>`).join('')}</table>
 <p><button class="btn" id="csv">Unduh CSV</button></p></div>`;
 $('#csv').onclick=()=>{const rows=[['Nama','Email','Lembaga','Peran',...MODS.map(m=>m.t),'Ujian Akhir','Tanggal Ujian']].concat(us.map(u=>[u.nama,u.email,u.lembaga,u.peran,...MODS.map(m=>u.skor[m.id]??''),u.ujian?u.ujian.nilai:'',u.ujian?u.ujian.tgl:'']));
  const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='rekap-kabuzen-bst.csv';a.click()};
}
function keluar(){S.cur=null;save();daftar()}
if(me()){$('#nav').classList.remove('hide');go('home')}else daftar();
</script></body></html>
