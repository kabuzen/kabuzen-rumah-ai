<style>
:root{--ind:#1d0b78;--yel:#ffd60a;--lav:#cfc7ff;--bg:#f6f4fd;--ink:#1a1630;--ok:#1e9e5a;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ind);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;position:sticky;top:0;z-index:5}
header .brand{font-weight:900;letter-spacing:.5px}header .brand b{color:var(--yel)}
header nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}header nav button{background:transparent;border:1px solid #4b3bb0;color:#fff;border-radius:20px;padding:7px 13px;font-weight:700;cursor:pointer;font-size:13px}
header nav button.on{background:var(--yel);color:var(--ind);border-color:var(--yel)}
.logo{width:40px;height:40px;border-radius:50%;border:3px solid var(--yel);object-fit:cover}
main{max-width:920px;margin:0 auto;padding:22px 16px 60px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 6px 20px rgba(29,11,120,.08);margin-bottom:16px}
h1{color:var(--ind);margin:.2em 0}h2{color:var(--ind);margin:.2em 0 .5em}
.btn{background:var(--yel);color:var(--ind);border:0;border-radius:24px;padding:11px 22px;font-weight:800;cursor:pointer;font-size:15px}
.btn.sec{background:#ece8fb}.btn:disabled{opacity:.45;cursor:not-allowed}
.cover{background:radial-gradient(ellipse at 50% 30%,#3b26c9,#1d0b78 55%,#0b0624);color:#fff;border-radius:22px;padding:34px 24px;text-align:center}
.cover .logo{width:92px;height:92px;border-width:5px}
.cover h1{color:#fff;font-size:34px}.cover h1 span{color:var(--yel)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #d6d0f2;font-size:15px;margin:4px 0 12px;font-family:inherit}
label{font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{background:#fff;border-radius:16px;padding:16px;border:2px solid #ece8fb;cursor:pointer}
.mod.lock{opacity:.5;cursor:not-allowed}.mod.done{border-color:var(--ok)}
.rn{display:inline-flex;min-width:46px;height:34px;border-radius:10px;background:var(--yel);color:var(--ind);font-weight:900;align-items:center;justify-content:center;margin-right:8px}
.bar{height:12px;background:#ece8fb;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ind)}
.opt{display:block;border:1px solid #d6d0f2;border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt input{width:auto;margin:0 8px 0 0}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.exp{font-size:14px;color:#555;margin:4px 0 10px}
ul.pts li{margin-bottom:6px}
.tag{display:inline-block;background:#ece8fb;color:var(--ind);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}
.heat{display:grid;grid-template-columns:repeat(5,52px);gap:3px}.heat div{height:46px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ind);flex-wrap:wrap}
.cert{border:10px double var(--ind);border-radius:14px;padding:34px;text-align:center;background:#fff}
.cert h1{font-size:30px}.cert .nm{font-size:30px;font-weight:900;color:var(--ind);margin:14px 0}
.note{font-size:12.5px;color:#666}
@media print{header,.noprint{display:none}main{padding:0}}

{n:'I',t:'Pendahuluan',goal:'Menjelaskan alasan strategis penguatan STEM di sekolah kedinasan dan lima tantangan utamanya.',
pts:['Lulusan sekolah kedinasan langsung bekerja untuk negara; celah kurikulum menjadi celah kemampuan aparatur.','STEM dimaknai sebagai cara menyusun kurikulum, bukan tambahan empat mata kuliah.','Lima tantangan: bekal awal peserta didik, struktur yang padat, teknologi yang cepat berubah, dua kiblat mutu, dan kesiapan pendidik.','PISA 2022: sekitar 34% siswa Indonesia mencapai Level 2 sains (OECD 76%); hasil PISA 2025 kurang lebih sama.','WEF 2025: AI dan big data, jaringan dan keamanan siber, serta literasi teknologi adalah tiga keterampilan yang tumbuh paling cepat.'],

['Tiga keterampilan yang tumbuh paling cepat menurut WEF Future of Jobs 2025 adalah…',['Menulis, membaca, berhitung','AI dan big data, jaringan dan keamanan siber, literasi teknologi','Akuntansi, hukum, manajemen','Desain grafis, fotografi, musik'],1,'Ketiganya adalah keterampilan teknologi.'],

{n:'II',t:'Landasan Regulasi dan Konsep',goal:'Mengenali regulasi utama dan kerangka konsep yang mendasari kurikulum STEM kedinasan.',

{n:'III',t:'Memetakan Kebutuhan Kompetensi',goal:'Melakukan analisis kebutuhan kompetensi STEM bersama pengguna lulusan.',

{n:'IV',t:'Model Kurikulum STEM',goal:'Memilih model integrasi dan merumuskan CPL serta asesmen yang selaras.',

['Bentuk asesmen yang dianjurkan untuk kurikulum STEM adalah…',['Ujian hafalan saja','Bukti unjuk kerja seperti portofolio, laporan teknis, dan uji praktik','Tanpa asesmen','Absensi'],1,'Dengan rubrik bersama.']]},
{n:'V',t:'Langkah Penyusunan Kurikulum',goal:'Memimpin sepuluh langkah penyusunan kurikulum dalam lima tahap ADDIE.',
pts:['Analysis: bentuk tim lintas unsur; analisis kebutuhan bersama pengguna.','Design: rumuskan profil lulusan dan CPL; pilih model dan struktur.','Development: kembangkan RPS, modul, proyek, rubrik; siapkan sarana dan LMS.','Implementation: latih pendidik, uji coba terbatas, terapkan bertahap.','Evaluation: evaluasi empat tingkat; tinjau dan perbaiki.','Setiap CPL STEM dicapai minimal lewat dua pengalaman belajar dan satu asesmen unjuk kerja.'],

function pct(){return Math.round(MODS.filter((m,i)=>passed(i)).length/MODS.length*100)}
function dash(){app.innerHTML=`<div class="card"><h1>Halo, ${esc(st.user.n)}</h1><p>${esc(st.user.p)}${st.user.l?' · '+esc(st.user.l):''}</p>
<div class="bar"><i style="width:${pct()}%"></i></div><p><b>${pct()}%</b> modul lulus · Ujian akhir: ${st.exam?(st.exam.score>=75?'<span class=ok>lulus ('+st.exam.score+')</span>':'belum lulus ('+st.exam.score+')'):(allDone()?'siap dikerjakan':'terbuka setelah 9 modul lulus')}</p></div>
<h2>Modul</h2><div class="grid">${MODS.map((m,i)=>`<div class="mod ${unlocked(i)?'':'lock'} ${passed(i)?'done':''}" data-i="${i}"><div><span class="rn">${m.n}</span><b>${m.t}</b></div><p class="note">${unlocked(i)?(passed(i)?'✔ Lulus, nilai '+st.mods[i]:(st.mods[i]!=null?'Nilai terakhir '+st.mods[i]+' (lulus ≥80)':'Belum dikerjakan')):'Terkunci: luluskan modul sebelumnya'}</p></div>`).join('')}</div>`;
document.querySelectorAll('.mod').forEach(d=>d.onclick=()=>{const i=+d.dataset.i;if(unlocked(i))mod(i)})}
function mod(i){const m=MODS[i];nav('dash');app.innerHTML=`<div class="card"><span class="tag">MODUL ${m.n} · BAB ${m.n}</span><h1>${m.t}</h1><p><b>Tujuan:</b> ${m.goal}</p>
<h2>Poin kunci</h2><ul class="pts">${m.pts.map(p=>`<li>${p}</li>`).join('')}</ul>
<h2>Kegiatan</h2><label class="opt"><input type="checkbox" id="act" ${st.act[i]?'checked':''}>${m.act}</label></div>
<div class="card"><h2>Kuis modul</h2><p class="note">5 soal · lulus minimal 80% · urutan pilihan diacak</p><div id="qz"></div><button class="btn" id="qsub">Periksa jawaban</button> <span id="qres"></span></div>
<div class="noprint"><button class="btn sec" onclick="show('dash')">← Beranda</button> ${i<8?`<button class="btn sec" id="nx" ${passed(i)?'':'disabled'}>Modul berikutnya →</button>`:''}</div>`;
$('#act').onchange=e=>{st.act[i]=e.target.checked;save()};
const order=m.q.map(q=>q[1].map((o,k)=>k).sort(()=>Math.random()-.5));
$('#qz').innerHTML=m.q.map((q,j)=>`<div style="margin:12px 0"><b>${j+1}. ${q[0]}</b>${order[j].map(k=>`<label class="opt"><input type="radio" name="q${j}" value="${k}">${q[1][k]}</label>`).join('')}<div class="exp" id="e${j}"></div></div>`).join('');
$('#qsub').onclick=()=>{let ok=0,miss=0;m.q.forEach((q,j)=>{const s=document.querySelector(`input[name=q${j}]:checked`);if(!s){miss++;return}const r=+s.value===q[2];if(r)ok++;$('#e'+j).innerHTML=(r?'<span class=ok>Benar.</span> ':'<span class=bad>Kurang tepat.</span> ')+q[3]});
if(miss){$('#qres').innerHTML=`<span class=bad>Jawab semua soal dulu (${miss} belum dijawab).</span>`;return}
const sc=ok*20;st.mods[i]=Math.max(st.mods[i]||0,sc);save();$('#qres').innerHTML=sc>=80?`<span class=ok>Nilai ${sc}. Lulus!</span>`:`<span class=bad>Nilai ${sc}. Pelajari pembahasan lalu coba lagi.</span>`;if($('#nx'))$('#nx').disabled=!passed(i)};
if($('#nx'))$('#nx').onclick=()=>mod(i+1)}
function tools(){app.innerHTML=`<div class="card"><h2>1. Pemilih Model Integrasi</h2><p class="note">Jawab empat pertanyaan untuk mendapatkan saran model (Bab IV).</p>
${[['Seberapa padat struktur kurikulum saat ini?',['Sangat padat','Sedang','Masih longgar']],['Berapa persen pendidik terbiasa dengan pembelajaran berbasis proyek?',['< 30%','30–60%','> 60%']],['Apakah sudah ada kerja sama aktif dengan satuan pengguna?',['Belum','Sebagian','Ya, rutin']],['Bagaimana ketersediaan ruang proyek, simulator, atau laboratorium?',['Terbatas','Cukup','Memadai']]].map((q,j)=>`<p><b>${q[0]}</b><br>${q[1].map((o,k)=>`<label class="opt" style="display:inline-block;margin-right:6px"><input type="radio" name="m${j}" value="${k}">${o}</label>`).join('')}</p>`).join('')}
<button class="btn" id="mb">Lihat saran</button><div id="mr" style="margin-top:10px">${st.model?'<b>Saran terakhir:</b> '+st.model:''}</div></div>
<div class="card"><h2>2. Kalkulator Risiko</h2><p class="note">Nilai kemungkinan (K) dan dampak (D) 1–5. Nilai ≥15 dipantau langsung pimpinan (Bab VIII).</p>
<table><tr><th>Risiko</th><th>K</th><th>D</th><th>Nilai</th></tr>${RISKS.map((r,j)=>`<tr><td><b>${r[0]}</b> ${r[1]}</td><td><input type="number" min="1" max="5" value="${r[2]}" data-j="${j}" data-f="k" style="width:58px"></td><td><input type="number" min="1" max="5" value="${r[3]}" data-j="${j}" data-f="d" style="width:58px"></td><td id="rv${j}"></td></tr>`).join('')}</table>
<div style="margin-top:12px" class="heat" id="heat"></div><p class="note">Baris atas = kemungkinan 5, kolom kanan = dampak 5.</p></div>
<div class="card"><h2>3. Daftar Periksa Pimpinan</h2><p class="note">Lampiran A buku. Centang yang sudah terpenuhi; tersimpan otomatis.</p><div id="ck"></div><p id="ckp"></p></div>
<div class="card"><h2>4. Pemantau Sepuluh Rekomendasi</h2><p class="note">Tandai status setiap rekomendasi (Bab IX).</p><div id="rk"></div></div>`;
$('#mb').onclick=()=>{let s=0,miss=0;for(let j=0;j<4;j++){const x=document.querySelector(`input[name=m${j}]:checked`);if(!x)miss++;else s+=+x.value}
if(miss){$('#mr').innerHTML='<span class=bad>Jawab keempat pertanyaan.</span>';return}
const r=s<=3?'Model A — benang tematik. Mulai dengan tema STEM bersama per semester dan siapkan pendidik.':s<=6?'Model B — blok proyek terpadu, diawali uji coba pada satu angkatan.':'Model C dapat dipertimbangkan untuk program studi yang paling siap; program lain tetap Model B.';
st.model=r;save();$('#mr').innerHTML='<b>Saran:</b> '+r};
const RS=RISKS.map(r=>[r[2],r[3]]);
function heat(){let h='';for(let k=5;k>=1;k--)for(let d=1;d<=5;d++){const v=k*d,c=v<6?'#c7f0d2':v<12?'#fff1a8':v<15?'#ffc98a':'#ff9b9b';h+=`<div style="background:${c}">${RISKS.filter((r,j)=>RS[j][0]==k&&RS[j][1]==d).map(r=>r[0]).join(' ')}</div>`}$('#heat').innerHTML=h;
RS.forEach((x,j)=>{const v=x[0]*x[1];$('#rv'+j).innerHTML=v>=15?`<span class=bad>${v} · awasi</span>`:v})}
document.querySelectorAll('input[data-j]').forEach(inp=>inp.oninput=()=>{const v=Math.min(5,Math.max(1,+inp.value||1));RS[+inp.dataset.j][inp.dataset.f==='k'?0:1]=v;heat()});heat();
const ck=()=>{$('#ck').innerHTML=CHECK.map((c,j)=>`<label class="opt"><input type="checkbox" data-c="${j}" ${st.check[j]?'checked':''}>${c}</label>`).join('');const n=CHECK.filter((c,j)=>st.check[j]).length;$('#ckp').innerHTML=`<b>${n}/${CHECK.length}</b> butir terpenuhi`;
document.querySelectorAll('[data-c]').forEach(b=>b.onchange=()=>{st.check[b.dataset.c]=b.checked;save();ck()})};ck();
$('#rk').innerHTML=`<table>${REKS.map((r,j)=>`<tr><td>${j+1}. ${r}</td><td><select data-r="${j}" style="margin:0">${['Belum dimulai','Sedang berjalan','Selesai'].map(o=>`<option ${st.rek[j]===o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`).join('')}</table>`;
document.querySelectorAll('[data-r]').forEach(s=>s.onchange=()=>{st.rek[s.dataset.r]=s.value;save()})}
function exam(){if(!allDone()){app.innerHTML=`<div class="card"><h2>Ujian Akhir</h2><p>Ujian terbuka setelah kesembilan modul lulus. Kemajuan Anda: <b>${pct()}%</b>.</p><button class="btn sec" onclick="show('dash')">← Beranda</button></div>`;return}

app.innerHTML=`<div class="card"><h2>Ujian Akhir</h2><p class="note">15 soal acak dari bank 45 soal · lulus minimal 75</p><div id="ex"></div><button class="btn" id="exb">Kumpulkan</button> <span id="exr"></span></div>`;
$('#ex').innerHTML=pick.map((qi,j)=>{const q=bank[qi];return `<div style="margin:12px 0"><b>${j+1}. ${q[0]}</b>${q[1].map((o,k)=>`<label class="opt"><input type="radio" name="x${j}" value="${k}">${o}</label>`).join('')}</div>`}).join('');
$('#exb').onclick=()=>{let ok=0,miss=0;pick.forEach((qi,j)=>{const s=document.querySelector(`input[name=x${j}]:checked`);if(!s)miss++;else if(+s.value===bank[qi][2])ok++});
if(miss){$('#exr').innerHTML=`<span class=bad>${miss} soal belum dijawab.</span>`;return}
const sc=Math.round(ok/15*100);if(!st.exam||sc>st.exam.score)st.exam={score:sc,d:new Date().toISOString()};save();
$('#exr').innerHTML=sc>=75?`<span class=ok>Nilai ${sc}. Selamat, Anda lulus!</span> <button class="btn" onclick="show('cert')">Buka sertifikat</button>`:`<span class=bad>Nilai ${sc}. Pelajari kembali modul, lalu coba lagi.</span>`}}
