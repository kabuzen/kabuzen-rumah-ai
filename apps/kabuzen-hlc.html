<style>
:root{--indigo:#1d0b78;--indigo2:#2a1599;--yellow:#ffd60a;--ink:#161331;--mut:#5b5a72;--line:#e3e2ef;--bg:#f5f5fb;--ok:#12805c;--bad:#c62828;--sea:#0b3a5c}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
button{font:inherit;cursor:pointer}
a{color:var(--indigo2)}
.top{background:var(--indigo);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 22px;position:sticky;top:0;z-index:5}
.top .brand{font-weight:800;letter-spacing:.04em;font-size:15px}
.top .brand small{display:block;font-weight:500;letter-spacing:0;opacity:.75;font-size:12px}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:7px 11px;border-radius:8px;opacity:.82}
.top nav a.on,.top nav a:hover{background:rgba(255,255,255,.14);opacity:1}
.logo{width:42px;height:42px;border-radius:50%;border:3px solid var(--yellow);object-fit:cover;flex:none}
main{max-width:1080px;margin:0 auto;padding:26px 22px 70px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;margin:26px 0 8px}
h3{font-size:16px;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 18px;max-width:70ch}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.btn{background:var(--yellow);color:#1a1300;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--indigo);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#ecebfa;color:var(--indigo)}
.tag.ok{background:#dff3ea;color:var(--ok)}
.tag.wait{background:#fff4c2;color:#6b5200}
.mod{display:flex;flex-direction:column;gap:8px}
.mod .no{font-size:13px;font-weight:800;color:var(--indigo);letter-spacing:.08em}
.mod p{margin:0;color:var(--mut);font-size:14.5px}
.mod .row{display:flex;gap:8px;margin-top:auto;padding-top:8px;align-items:center}
.bar{height:10px;background:#e6e5f3;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:99px}
/* cover */
.cover{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#3a22b8 0,transparent 60%),linear-gradient(160deg,var(--indigo) 0,#0d0540 70%);color:#fff;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;padding:44px 6vw;align-items:center;position:relative}
.cover .logo{position:absolute;right:6vw;top:34px;width:64px;height:64px;border-width:4px}
.cover .kicker{font-weight:700;letter-spacing:.16em;font-size:13px;color:var(--yellow)}
.cover h1{font-size:clamp(38px,5.4vw,68px);margin:12px 0 14px;line-height:1.02}
.cover p{font-size:18px;opacity:.9;max-width:52ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.chips span{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.reg{background:#fff;color:var(--ink);border-radius:18px;padding:24px}
.reg label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.reg input,.sim input{width:100%;padding:11px 12px;border:1px solid #cfcde3;border-radius:10px;font:inherit}
.reg .note{font-size:12.5px;color:var(--mut);margin-top:12px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
.stripes{display:flex;gap:6px;margin:20px 0 0}
.stripes i{height:6px;width:54px;border-radius:9px}
@media(max-width:820px){.cover{grid-template-columns:1fr}}
/* module */
.pts{display:grid;gap:12px}
.pt{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.pt b.n{width:34px;height:34px;border-radius:10px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:14px}
.pt p{margin:2px 0 0;color:#33314d}
.key{background:#fffbe0;border:1px solid #f0de7a;border-radius:12px;padding:14px 16px}
.key ul{margin:6px 0 0;padding-left:20px}
.warn{background:#eef4ff;border:1px solid #c5d6f7;border-radius:12px;padding:12px 14px;font-size:14px;color:#1e3566}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
/* quiz */
.q{margin-bottom:14px}
.q .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cfcde3;border-radius:10px;padding:10px 13px;margin-top:7px}
.q .opt.sel{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo);background:#f1effc}
.q .opt.good{border-color:var(--ok);background:#e3f5ec}
.q .opt.bad{border-color:var(--bad);background:#fdeaea}
.q .exp{font-size:14px;color:var(--mut);margin-top:7px}
.score{font-size:44px;font-weight:800;line-height:1}
/* sim */
.sim{display:grid;grid-template-columns:340px 1fr;gap:18px}
.sim label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:12px 0 4px}
.sim input[type=range]{padding:0}
.deck{border-radius:14px;padding:16px;text-align:center;font-weight:800;font-size:24px;letter-spacing:.06em;color:#fff}
.deck.g{background:var(--ok)}.deck.r{background:var(--bad)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kv div{background:#f3f2fb;border-radius:10px;padding:10px 12px}
.kv small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.kv b{font-size:19px}
@media(max-width:860px){.sim{grid-template-columns:1fr}}
/* signals */
.sig svg{width:100%;height:170px;background:#f3f2fb;border-radius:10px}
/* cert */
.cert{background:#fff;border:10px solid var(--indigo);outline:3px solid var(--yellow);outline-offset:-16px;border-radius:6px;padding:54px 50px;text-align:center;position:relative}
.cert .logo{position:absolute;right:34px;top:34px;width:60px;height:60px}
.cert .nm{font-size:36px;font-weight:800;margin:10px 0;color:var(--indigo)}
.foot{font-size:12.5px;color:var(--mut);margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>

const MODS=[
{t:"Peran HLC dan Organisasi Geladak Heli",jp:4,
 s:"Siapa melakukan apa saat heli beroperasi dari kapal perang, dan di mana posisi HLC dalam rantai komando.",
 p:[
 ["Tugas pokok HLC","Helicopter Landing Controller (HLC) mengendalikan fase pendekatan akhir, pendaratan, dan lepas landas heli di geladak. HLC menjadi penghubung tunggal antara pilot, anjungan, dan tim geladak."],
 ["Rantai wewenang","Komandan kapal memberi izin operasi penerbangan. Pilot pemegang komando pesawat berwenang akhir atas keselamatan pesawatnya. HLC berwenang membatalkan pendekatan (wave-off) kapan pun geladak tidak aman."],
 ["Anjungan dan PIT","Perwira jaga anjungan memegang haluan dan kecepatan kapal untuk memberi angin relatif yang sesuai. PIT memegang gambar taktis dan mengendalikan heli pada jarak jauh sebelum diserahkan ke HLC."],
 ["Tim geladak","Pemandu (marshaller) memberi isyarat tangan, regu pengikat memasang ganjal dan lashing, regu pemadam dan penyelamat siaga dengan pakaian tahan api, tim kesehatan dan awak sekoci penolong siap di posnya."],
 ["Satu suara","Hanya satu stasiun yang berbicara kepada pilot pada satu waktu. Setiap izin dan informasi penting dibaca ulang (read-back) agar tidak ada salah dengar."]],
 k:["HLC adalah penghubung pilot, anjungan, dan geladak","Izin operasi dari komandan; keselamatan pesawat pada pilot","HLC boleh dan wajib wave-off bila geladak tidak aman"],
 q:[
 ["Siapa yang memberi izin dilaksanakannya operasi penerbangan dari kapal?",["Komandan kapal","Pemandu geladak","Regu pengikat","Juru mudi"],0,"Izin operasi penerbangan berada pada komandan kapal; HLC melaksanakan dan mengendalikannya."],
 ["Dalam situasi geladak mendadak tidak aman saat heli pendekatan akhir, tindakan HLC adalah…",["Menunggu perintah anjungan","Memerintahkan wave-off","Meminta pilot mempercepat pendaratan","Mematikan lampu geladak"],1,"HLC berwenang dan wajib membatalkan pendekatan bila geladak tidak aman."],
 ["Mengapa hanya satu stasiun yang berbicara kepada pilot pada satu waktu?",["Menghemat baterai radio","Agar pilot tidak menerima perintah yang bertentangan","Karena radio hanya satu kanal","Supaya PIT tidak perlu jaga"],1,"Prinsip satu suara mencegah perintah ganda yang membingungkan pada fase kritis."],
 ["Unsur yang mengatur haluan dan kecepatan kapal agar angin relatif sesuai adalah…",["Regu pemadam","Tim kesehatan","Perwira jaga anjungan","Awak sekoci penolong"],2,"Anjungan mengolah gerak kapal; HLC meminta dan memantau hasilnya."]]},
{t:"Angin Relatif dan Olah Gerak Kapal",jp:6,
 s:"Kapal yang sedang berlayar menciptakan anginnya sendiri. HLC harus bisa menghitung dan meminta haluan yang tepat.",
 p:[
 ["Angin sejati dan angin relatif","Angin sejati adalah angin terhadap bumi. Angin relatif adalah angin yang dirasakan di geladak: gabungan vektor angin sejati dan gerak maju kapal. Heli mendarat terhadap angin relatif, bukan angin sejati."],
 ["SHOL","Ship Helicopter Operating Limits adalah diagram batas arah dan kecepatan angin relatif, ditambah batas angguk (pitch) dan oleng (roll), untuk satu kombinasi kapal dan tipe heli. Batas siang dan malam biasanya berbeda."],
 ["Merah dan Hijau","Arah angin relatif disebut dari haluan kapal: Merah untuk sisi kiri, Hijau untuk sisi kanan. Contoh: Merah 20 berarti angin datang dari 20° kiri haluan."],
 ["Mencari haluan penerbangan","Bila angin relatif di luar batas, HLC meminta anjungan mengubah haluan atau kecepatan. Mengubah haluan menggeser arah angin relatif; mengubah kecepatan mengubah kekuatannya sekaligus gerak geladak."],
 ["Turbulensi dan gas buang","Bangunan atas dan cerobong menimbulkan pusaran udara dan gas panas di atas geladak. Itu sebabnya angin tepat dari haluan belum tentu yang terbaik; ikuti diagram SHOL kapal."],
 ["Haluan tetap","Selama pendekatan akhir sampai heli terikat, kapal mempertahankan haluan dan kecepatan. Perubahan apa pun diberitahukan ke pilot lebih dulu."]],
 k:["Heli mendarat terhadap angin relatif","SHOL berlaku khusus per kapal dan tipe heli","Kapal mempertahankan haluan dan kecepatan selama pendekatan akhir"],
 q:[
 ["Kapal berlayar haluan 000° kecepatan 15 knot, angin sejati dari 000° 10 knot. Angin relatif di geladak adalah…",["Dari haluan 5 knot","Dari haluan 25 knot","Dari buritan 5 knot","Dari lambung kanan 15 knot"],1,"Angin dari depan dan gerak maju kapal saling menambah: 10 + 15 = 25 knot dari haluan."],
 ["Laporan angin relatif \"Merah 30\" berarti angin datang dari…",["30° kanan haluan","30° kiri haluan","30° kiri buritan","Baringan sejati 030°"],1,"Merah menunjuk sisi kiri, dihitung dari haluan kapal."],
 ["Diagram SHOL berlaku untuk…",["Semua kapal dan semua heli","Satu kombinasi kapal dan tipe heli tertentu","Hanya operasi malam","Hanya kapal yang sedang lego jangkar"],1,"Tiap kombinasi kapal dan heli diuji tersendiri sehingga batasnya berbeda."],
 ["Selama heli pendekatan akhir, kapal seharusnya…",["Berzigzag untuk mencari angin","Menambah kecepatan terus-menerus","Mempertahankan haluan dan kecepatan","Mematikan mesin"],2,"Geladak yang stabil dan angin relatif yang tetap adalah syarat pendaratan aman."]]},
{t:"Persiapan Geladak",jp:4,
 s:"Sebelum izin mendarat diberikan, geladak harus bersih, terang, lengkap, dan dilaporkan siap.",
 p:[
 ["Peran penerbangan","Pengumuman peran penerbangan memanggil seluruh personel ke pos. Personel yang tidak berkepentingan menjauhi geladak heli dan geladak terbuka di sekitarnya."],
 ["Bersih dari benda lepas (FOD)","Tim menyisir geladak berbanjar untuk memungut benda lepas sekecil apa pun. Benda lepas dapat terisap mesin atau terlempar oleh hembusan rotor."],
 ["Rintangan direbahkan","Jaring pengaman dan railing tepi geladak direbahkan, antena dan derek yang mengganggu jalur pendekatan diturunkan, pintu hanggar diposisikan sesuai prosedur kapal."],
 ["Pemadam dan penyelamat","Busa dan alat pemadam siap pakai, selang tergelar dan bertekanan, regu penyelamat memakai pakaian tahan api, sekoci penolong siap diturunkan."],
 ["Perlengkapan perorangan","Semua personel geladak memakai helm, pelindung mata dan telinga, rompi berwarna sesuai tugas, dan jaket apung. Tidak ada topi atau benda lepas di saku."],
 ["Laporan siap","Lampu geladak dan komunikasi dicek, lalu HLC melaporkan \"geladak siap\" ke anjungan. Tanpa laporan itu tidak ada izin mendarat."]],
 k:["Sisir FOD sebelum setiap operasi","Pemadam, penyelamat, dan sekoci penolong siaga dulu","Izin mendarat hanya setelah laporan geladak siap"],
 q:[
 ["Tujuan menyisir geladak (FOD walkdown) adalah…",["Mengeringkan geladak","Memungut benda lepas yang bisa terisap mesin atau terlempar rotor","Mengecat ulang tanda pendaratan","Menghitung personel"],1,"Benda lepas adalah bahaya utama bagi mesin, rotor, dan personel."],
 ["Jaring pengaman tepi geladak pada saat operasi heli…",["Dilepas dan disimpan di gudang","Direbahkan","Ditegakkan setinggi mungkin","Dicat kuning"],1,"Jaring direbahkan agar tidak menjadi rintangan namun tetap menahan personel yang terjatuh."],
 ["Yang BUKAN perlengkapan wajib personel geladak adalah…",["Pelindung telinga","Jaket apung","Topi pet lepas","Pelindung mata"],2,"Topi lepas justru menjadi benda lepas; yang dipakai adalah helm."],
 ["Izin mendarat dapat diberikan setelah…",["Heli terlihat secara visual","HLC melaporkan geladak siap ke anjungan","Regu pengikat berdiri di titik darat","Lampu navigasi dipadamkan"],1,"Laporan geladak siap menutup seluruh daftar periksa persiapan."]]},
{t:"Pendekatan, Pendaratan, dan Lepas Landas",jp:8,
 s:"Urutan baku dari kontak pertama sampai heli terikat, lalu kebalikannya saat lepas landas.",
 p:[
 ["Kontak awal","Heli melapor posisi, jumlah orang di pesawat, sisa bahan bakar atau daya tahan terbang, dan maksudnya. HLC mencatat dan meneruskan ke anjungan."],
 ["Informasi dari kapal","HLC memberikan haluan dan kecepatan kapal, arah dan kecepatan angin relatif, angguk dan oleng, tekanan udara, serta status geladak."],
 ["Geladak hijau dan merah","Geladak hijau berarti izin mendarat atau lepas landas diberikan. Geladak merah berarti tidak ada izin; heli menunggu di luar atau membatalkan pendekatan."],
 ["Pendekatan dan hover","Heli mendekat dari arah buritan atau lambung sesuai prosedur kapal, berhenti melayang di samping geladak, lalu bergeser ke atas titik darat mengikuti isyarat pemandu."],
 ["Saat menyentuh geladak","Pilot menurunkan heli pada saat geladak paling tenang. Setelah roda menapak, regu pengikat masuk hanya atas isyarat, memasang ganjal dan lashing dari sektor aman, jauh dari rotor ekor."],
 ["Lepas landas","Semua lashing dan ganjal dilepas dan diperlihatkan ke pilot, geladak dikosongkan, angin relatif dicek ulang, lalu geladak hijau diberikan."]],
 k:["Lima informasi kapal: haluan dan kecepatan, angin relatif, angguk dan oleng, tekanan udara, status geladak","Hijau berarti ada izin, merah berarti tidak","Regu pengikat bergerak hanya atas isyarat"],
 q:[
 ["Informasi yang wajib dilaporkan heli pada kontak awal antara lain…",["Warna cat pesawat","Jumlah orang di pesawat dan sisa bahan bakar","Nama pemandu geladak","Nomor lambung kapal lain"],1,"Jumlah orang dan sisa bahan bakar menentukan prioritas dan rencana darurat."],
 ["Status \"geladak merah\" berarti…",["Geladak sedang dicat","Tidak ada izin mendarat atau lepas landas","Lampu merah rusak","Heli boleh mendarat darurat saja"],1,"Merah berarti izin tidak diberikan; heli menunggu atau membatalkan pendekatan."],
 ["Kapan regu pengikat boleh mendekati heli yang baru mendarat?",["Segera setelah roda menapak","Setelah ada isyarat dari pilot atau HLC","Saat rotor masih dipercepat","Kapan saja dari arah ekor"],1,"Mendekat tanpa isyarat, terlebih dari arah rotor ekor, sangat berbahaya."],
 ["Sebelum geladak hijau untuk lepas landas, lashing yang sudah dilepas…",["Dibiarkan di geladak","Diperlihatkan kepada pilot","Dibuang ke laut","Diikat ke railing"],1,"Pilot harus yakin tidak ada pengikat yang tertinggal; lashing diperlihatkan lalu dibawa keluar geladak."]]},
{t:"Komunikasi dan Isyarat",jp:4,
 s:"Radio bisa gagal dan rotor sangat bising. HLC menguasai radio, isyarat tangan, dan lampu sekaligus.",

/* ---------- wind math ---------- */
const rad=d=>d*Math.PI/180, n360=d=>((d%360)+360)%360;
function relWind(course,spd,twFrom,tw){
  const wx=-tw*Math.sin(rad(twFrom)), wy=-tw*Math.cos(rad(twFrom));
  const sx=spd*Math.sin(rad(course)), sy=spd*Math.cos(rad(course));
  const rx=wx-sx, ry=wy-sy;
  const sp=Math.hypot(rx,ry);
  const from=n360(Math.atan2(-rx,-ry)*180/Math.PI);
  let rel=n360(from-course); if(rel>180)rel-=360;
  return {sp,rel};
}
const ENV={maxRel:30,minSp:5,maxSp:35,pitch:2,roll:4};
function inEnv(w,pitch,roll){return Math.abs(w.rel)<=ENV.maxRel&&w.sp>=ENV.minSp&&w.sp<=ENV.maxSp&&pitch<=ENV.pitch&&roll<=ENV.roll}
function relText(r){const a=Math.round(Math.abs(r));return a===0?"Tepat dari haluan":a===180?"Tepat dari buritan":(r<0?"Merah ":"Hijau ")+a+"°"}
function bestCourse(spd,twFrom,tw){
  let best=null;
  for(let c=0;c<360;c++){const w=relWind(c,spd,twFrom,tw);const d=Math.abs(w.rel+15);
    if(w.sp>=ENV.minSp&&w.sp<=ENV.maxSp&&(best===null||d<best.d))best={c,d,w}}
  return best;
}

let SIM={c:90,s:12,wd:60,ws:18,p:1,r:2};
function shipSvg(w,ok){
  const a=rad(w.rel), L=150, x1=200+Math.sin(a)*L, y1=200-Math.cos(a)*L, x2=200+Math.sin(a)*62, y2=200-Math.cos(a)*62;

  return `<svg viewBox="0 0 400 400" style="width:100%;max-width:440px;display:block;margin:auto" role="img" aria-label="Diagram angin relatif">
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${ok?"#12805c":"#c62828"}"/></marker></defs>
  <circle cx="200" cy="200" r="180" fill="#eaf3fb" stroke="#bcd2e6"/>
  <path d="M200,200 L${200-ex},${200-ey} A170,170 0 0 1 ${200+ex},${200-ey} z" fill="rgba(18,128,92,.18)" stroke="#12805c" stroke-dasharray="5 4"/>
  <text x="200" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#12805c">Batas contoh ±${ENV.maxRel}°</text>
  <path d="M200,110 C222,140 226,190 224,290 L176,290 C174,190 178,140 200,110 z" fill="#5d6b7a" stroke="#2c3742" stroke-width="2"/>
  <rect x="181" y="232" width="38" height="52" fill="#3a4652" stroke="#ffd60a" stroke-width="2"/>
  <circle cx="200" cy="258" r="12" fill="none" stroke="#fff" stroke-width="2"/><text x="200" y="263" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">H</text>
  <text x="200" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#2c3742">HALUAN</text>
  <text x="34" y="205" font-size="12" font-weight="800" fill="#c62828">MERAH</text><text x="322" y="205" font-size="12" font-weight="800" fill="#12805c">HIJAU</text>
  <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ok?"#12805c":"#c62828"}" stroke-width="6" marker-end="url(#ah)"/></svg>`;
}
function simOut(){
  const w=relWind(SIM.c,SIM.s,SIM.wd,SIM.ws), ok=inEnv(w,SIM.p,SIM.r), b=bestCourse(SIM.s,SIM.wd,SIM.ws);
  const why=[];if(Math.abs(w.rel)>ENV.maxRel)why.push("arah angin relatif di luar ±"+ENV.maxRel+"°");
  if(w.sp<ENV.minSp)why.push("angin relatif terlalu lemah");if(w.sp>ENV.maxSp)why.push("angin relatif terlalu kuat");
  if(SIM.p>ENV.pitch)why.push("angguk melewati "+ENV.pitch+"°");if(SIM.r>ENV.roll)why.push("oleng melewati "+ENV.roll+"°");
  return `<div class="deck ${ok?"g":"r"}" id="deck">${ok?"GELADAK HIJAU":"GELADAK MERAH"}</div>
  <div class="kv"><div><small>Arah angin relatif</small><b id="o-rel">${relText(w.rel)}</b></div><div><small>Kecepatan angin relatif</small><b id="o-sp">${w.sp.toFixed(1)} kn</b></div></div>
  ${shipSvg(w,ok)}
  <p style="margin:10px 0 0;font-size:14.5px">${ok?"Angin relatif dan gerak geladak berada di dalam batas contoh.":"<b>Alasan:</b> "+why.join("; ")+"."}
  ${b?` <b>Saran haluan penerbangan:</b> ${String(b.c).padStart(3,"0")}° pada ${SIM.s} kn memberi angin relatif ${relText(b.w.rel)} ${b.w.sp.toFixed(0)} kn.`:" Pada kecepatan kapal ini tidak ada haluan yang memberi kekuatan angin di dalam batas; ubah kecepatan kapal."}</p>
  ${b?'<button class="btn sec" id="apply" style="margin-top:10px">Pakai haluan yang disarankan</button>':""}`;
}

function vExamGate(){
  const d=doneCount();
  return shell("ujian",`<h1>Ujian akhir</h1><p class="lead">15 soal acak dari seluruh modul. Batas lulus ${PASS}%.</p>
  <div class="card"><b>${allDone()?"Semua kuis modul sudah lulus. Ujian akhir terbuka.":`Ujian akhir terbuka setelah semua kuis modul lulus. Saat ini ${d} dari ${MODS.length}.`}</b>
  ${S.exam!=null?`<p style="margin:8px 0 0">Nilai ujian terakhir: <b>${S.exam}%</b></p>`:""}
  <table style="margin-top:12px"><tr><th>Modul</th><th>Nilai kuis</th><th>Status</th></tr>${MODS.map((m,i)=>`<tr><td>${i+1}. ${m.t}</td><td>${S.quiz[i]==null?"—":S.quiz[i]+"%"}</td><td>${(S.quiz[i]||0)>=PASS?'<span class="tag ok">Lulus</span>':'<span class="tag wait">Belum</span>'}</td></tr>`).join("")}</table>
  <button class="btn" id="mulai" style="margin-top:16px" ${allDone()?"":"disabled"}>Mulai ujian akhir</button></div>`);
}
function vCert(){
  if(!(S.exam>=PASS))return shell("sertifikat",`<h1>Sertifikat</h1><div class="card">Sertifikat terbit setelah ujian akhir lulus dengan nilai minimal ${PASS}%. ${S.exam!=null?"Nilai terakhir Anda "+S.exam+"%.":""} <a href="#ujian">Ke ujian akhir</a></div>`);
  return shell("sertifikat",`<div class="cert"><img class="logo" src="${LOGO}" alt="Logo KABUZEN">
  <div style="letter-spacing:.2em;font-weight:700;color:var(--mut);font-size:13px">SERTIFIKAT KELULUSAN</div>
  <div style="margin-top:18px">Diberikan kepada</div><div class="nm">${esc(S.user.nama)}</div><div>${esc(S.user.kapal)}</div>
  <p style="max-width:56ch;margin:18px auto">telah menyelesaikan enam modul dan lulus ujian akhir <b>KABUZEN HLC — Helicopter Landing Controller</b> dengan nilai <b>${S.exam}%</b>.</p>
  <div style="color:var(--mut);font-size:14px">${esc(S.examDate||"")}</div></div>
  <p style="color:var(--mut);font-size:14px;margin-top:12px">Sertifikat ini bukti penyelesaian pembelajaran, bukan kualifikasi jabatan. Untuk menyimpannya, ambil tangkapan layar halaman ini.</p>`);
}

/* ---------- router ---------- */
function render(){
  const h=(location.hash||"").replace(/^#/,"");
  const app=$("#app");
  if(!S.user){app.innerHTML=vCover();
    $("#reg").addEventListener("submit",e=>{e.preventDefault();const nm=$("#nm").value.trim(),kp=$("#kp").value.trim();
      if(nm.length<3){$("#err").textContent="Isi nama lengkap, minimal 3 huruf.";return}
      S.user={nama:nm,kapal:kp||"Peserta umum"};save();location.hash="beranda";render()});
    return}
  let m;
  if((m=h.match(/^modul-(\d)$/))&&MODS[m[1]-1]){app.innerHTML=vMod(m[1]-1)}
  else if((m=h.match(/^kuis-(\d)$/))&&MODS[m[1]-1]){const i=m[1]-1;if(!QZ||QZ.kind!=="modul"||QZ.i!==i)startQuiz("modul",i);app.innerHTML=vQuiz();bindQuiz()}
  else if(h==="simulator"){app.innerHTML=vSim();bindSim()}
  else if(h==="isyarat"){app.innerHTML=vSig()}
  else if(h==="ujian"){if(QZ&&QZ.kind==="ujian"){app.innerHTML=vQuiz();bindQuiz()}else{app.innerHTML=vExamGate();const b=$("#mulai");if(b)b.onclick=()=>{startQuiz("ujian");render();scrollTo(0,0)}}}
  else if(h==="sertifikat"){app.innerHTML=vCert()}
  else{app.innerHTML=vHome()}
}
function bindQuiz(){
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const y=scrollY;QZ.ans[+b.dataset.k]=+b.dataset.j;render();scrollTo(0,y)});
  const s=$("#submit");if(s)s.onclick=()=>{QZ.done=true;const benar=QZ.qs.filter((x,k)=>QZ.ans[k]===x.q[2]).length;const sc=Math.round(benar/QZ.qs.length*100);
    if(QZ.kind==="modul"){S.quiz[QZ.i]=Math.max(S.quiz[QZ.i]||0,sc)}else{S.exam=Math.max(S.exam||0,sc);if(sc>=PASS)S.examDate=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}
    save();render();scrollTo(0,0)};
  const a=$("#again");if(a)a.onclick=()=>{startQuiz(QZ.kind,QZ.i);render();scrollTo(0,0)};
}
function bindApply(){const a=$("#apply");if(a)a.onclick=()=>{const b=bestCourse(SIM.s,SIM.wd,SIM.ws);if(b){SIM.c=b.c;$("#s-c").value=b.c;$("#l-c").textContent=simLab("c");$("#simout").innerHTML=simOut();bindApply()}}}
function bindSim(){
  document.querySelectorAll(".sim input[type=range]").forEach(r=>r.oninput=()=>{const k=r.dataset.k;SIM[k]=+r.value;$("#l-"+k).textContent=simLab(k);$("#simout").innerHTML=simOut();bindApply()});
  bindApply();
}
addEventListener("hashchange",()=>{const h=location.hash.replace(/^#/,"");if(!/^kuis-/.test(h)&&h!=="ujian"&&QZ&&QZ.done)QZ=null;render();scrollTo(0,0)});
render();
</script>
</body>
</html>
