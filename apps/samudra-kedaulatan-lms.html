<style>
:root{--ind:#1d0b78;--ind2:#2c1696;--dark:#0b0624;--yel:#ffd60a;--bg:#f4f2fb;--ink:#1b1a2a;--mut:#6b6890;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{position:sticky;top:0;z-index:10;background:var(--ind);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--yel)}
header .brand{font-weight:900;letter-spacing:.5px;font-size:15px;flex:1;cursor:pointer}header .brand small{display:block;font-weight:600;color:#c9c3ff;font-size:11px;letter-spacing:0}
header img{width:44px;height:44px}
header button{background:transparent;color:#fff;border:1px solid #6a5bd6;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
main{max-width:920px;margin:0 auto;padding:18px 16px 80px}
.hero{background:radial-gradient(ellipse at 30% 20%,#3b1a8c,var(--ind) 45%,var(--dark));color:#fff;border-radius:20px;padding:26px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero img.cov{width:190px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.1}.hero h1 span{color:var(--yel)}.hero p{color:#e5e1ff;margin:6px 0}
.hero .txt{flex:1;min-width:240px}
.btn{display:inline-block;background:var(--yel);color:var(--ind);font-weight:800;border:0;border-radius:12px;padding:12px 18px;font-size:15px;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;color:var(--ind);border:2px solid var(--ind)}.btn.sm{padding:7px 12px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 2px 10px rgba(29,11,120,.08)}
h2{color:var(--ind);font-size:20px;margin:0 0 10px}h3{color:var(--ind2);font-size:16px;margin:16px 0 6px}
.pill{display:inline-block;background:var(--yel);color:var(--ind);font-weight:800;font-size:11px;border-radius:20px;padding:3px 10px;margin-right:6px}
.pill.g{background:#dcfce7;color:var(--ok)}.pill.m{background:#ece9ff;color:var(--ind2)}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid #cfcaf0;border-radius:10px;font:inherit}
textarea{min-height:220px}
.note{font-size:12.5px;color:var(--mut)}
.err{color:var(--bad);font-size:13px;font-weight:700}
.bar{height:12px;background:#e6e2fa;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ind),#5b3ff0);border-radius:8px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{border:2px solid #e6e2fa;border-radius:14px;padding:14px;background:#fff;cursor:pointer;position:relative}
.mod.lock{opacity:.55;cursor:not-allowed}.mod.done{border-color:var(--ok)}
.mod .n{font-weight:900;color:var(--yel);background:var(--ind);border-radius:8px;padding:2px 8px;font-size:12px}
.mod h4{margin:8px 0 4px;font-size:15px}.mod .st{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--ind);color:#fff;text-align:left;padding:8px}td{border-bottom:1px solid #eee;padding:8px;vertical-align:top}
.layer{border-left:4px solid var(--yel);background:#fffbe6;padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
.layer b{color:var(--ind)}
.map{border:1px solid #d9d4f5;border-radius:12px;overflow:hidden;margin:10px 0;background:#fff}.map svg{display:block;width:100%;height:auto}
.map .cap{font-size:12.5px;padding:8px 10px;background:#f2f0ff}.map .ttl{font-weight:800;font-size:13px;padding:8px 10px;color:var(--ind)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;margin:4px 0;background:#f7f6ff}.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.q{margin:14px 0;padding:12px;border:1.5px solid #e6e2fa;border-radius:12px}.q p{margin:0 0 8px;font-weight:700}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;margin:4px 0;cursor:pointer;border:1px solid transparent}
.opt input{width:18px;height:18px;flex:none;margin-top:2px}
.opt.right{background:#dcfce7;border-color:#86efac}.opt.wrong{background:#fee2e2;border-color:#fca5a5}
.expl{font-size:13px;background:#f2f0ff;border-radius:8px;padding:8px 10px;margin-top:6px;display:none}
.res{font-size:18px;font-weight:900;padding:12px;border-radius:12px;margin:12px 0}.res.ok{background:#dcfce7;color:var(--ok)}.res.no{background:#fee2e2;color:var(--bad)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cert{background:#fff;border:10px solid var(--ind);outline:4px solid var(--yel);outline-offset:-18px;padding:40px 30px;text-align:center;border-radius:6px;position:relative}
.cert img{width:80px}.cert h1{color:var(--ind);font-size:28px;margin:10px 0 4px;letter-spacing:2px}.cert .nm{font-size:30px;font-weight:900;color:var(--ink);border-bottom:2px solid var(--yel);display:inline-block;padding:4px 20px;margin:14px 0}
.cert .sig{margin-top:30px;font-weight:700}
.hidden{display:none}

<script>
const D = {"title": "KABUZEN SAMUDRA KEDAULATAN", "subtitle": "Kursus Sejarah Kekuatan Laut dan Pelajaran Strategis bagi Indonesia", "author": "Laksma TNI Dr. Arif Badrudin, M.Mgt.Stud.", "peserta": "Masyarakat umum yang ingin memahami pentingnya laut, mahasiswa dan dosen (sejarah, hubungan internasional, kemaritiman, pertahanan), aparatur sipil negara, perwira TNI/Polri, dan pejabat pengambil kebijakan.", "syarat": "Menuntaskan semua kegiatan modul, lulus setiap kuis modul (≥ 80%), lulus ujian akhir (≥ 80%), dan mengunggah/menyusun proyek akhir.", "capaian": [["CP1", "Menjelaskan konsep dasar kekuatan laut: sea power, sea control, sea denial, choke point, dan enam unsur kekuatan laut menurut Mahan."], ["CP2", "Menguraikan penyebab, pelaku, jalannya, dan akibat pertempuran laut yang menentukan dari 480 SM hingga 2026."], ["CP3", "Membaca dan menafsirkan peta taktis bertahap untuk menjelaskan mengapa sebuah armada menang atau kalah."], ["CP4", "Menganalisis hubungan kekuatan laut dengan logistik, ekonomi, teknologi, intelijen, dan politik dalam negeri."], ["CP5", "Menilai relevansi pelajaran sejarah bagi kedaulatan Indonesia sebagai negara kepulauan."], ["CP6", "Merancang kajian kebijakan singkat (policy brief) tentang penguatan kekuatan laut Indonesia."]], "strategi": ["Belajar mandiri: baca uraian modul (tiga lapis: Dasar, Menengah, Lanjut) dan bab buku yang dirujuk.", "Membaca peta: setiap modul memuat peta taktis bertahap; peserta menjelaskan peta dengan kata-katanya sendiri.", "Kegiatan praktik: tugas singkat yang menghubungkan sejarah dengan keadaan Indonesia.", "Diskusi: pertanyaan diskusi dapat dibahas dalam kelompok belajar, kelas, atau forum kantor.", "Evaluasi: kuis modul (5 soal, lulus ≥ 80%), ujian akhir acak 20 soal (lulus ≥ 80%), dan proyek akhir yang dinilai dengan rubrik."], "penilaian": [["Kuis modul (rata-rata 11 kuis)", "30%"], ["Ujian akhir", "30%"], ["Proyek akhir (policy brief)", "40%"]], "modul": [{"no": 1, "judul": "Memahami Kekuatan Laut", "bab": "Pendahuluan, Epilog, Lampiran B", "jam": 2, "cp": ["CP1", "CP3"], "tujuan": ["Menjelaskan arti kekuatan laut (sea power) beserta unsur-unsurnya.", "Membedakan sea control, sea denial, dan proyeksi kekuatan.", "Membaca lambang-lambang pada peta taktis bertahap."], "dasar": "Kekuatan laut adalah kemampuan sebuah bangsa memanfaatkan laut untuk kepentingannya dan mencegah pihak lain berbuat sama. Kekuatan laut tidak hanya terdiri dari kapal perang, tetapi juga armada niaga, pelabuhan, galangan kapal, pelaut, ilmu pengetahuan, keuangan negara, dan kehendak politik. Sejarah dua puluh lima abad menunjukkan pola yang berulang: bangsa yang besar karena laut akan jatuh bila melupakan laut, dan bangsa yang berpaling dari laut akan didikte oleh bangsa yang menguasainya.", "menengah": "Alfred Thayer Mahan (1890) menekankan penguasaan laut melalui armada dan pertempuran yang menentukan, serta enam unsur kekuatan laut: letak geografis, bentuk fisik wilayah, luas wilayah, jumlah penduduk, watak bangsa, dan watak pemerintahan. Julian Corbett (1911) mengingatkan bahwa manusia hidup di darat sehingga penguasaan laut biasanya terbatas waktu dan tempat, dan bahwa armada yang lebih lemah tetapi tetap utuh (fleet in being) dapat membatasi lawan. Ahli strategi modern membedakan sea control (memakai laut untuk tujuan sendiri), sea denial (mencegah lawan memakai laut), dan power projection (membawa kekuatan dari laut ke darat).", "lanjut": "Bagi Indonesia, konsep ini terkait dengan Wawasan Nusantara dan status negara kepulauan yang diakui UNCLOS 1982 serta diratifikasi melalui UU No. 17 Tahun 1985. Hak itu disertai kewajiban: menyediakan Alur Laut Kepulauan Indonesia (ALKI) bagi pelayaran internasional dan menjaga keamanannya. Selat Malaka, Sunda, Lombok, dan Makassar adalah choke point dunia; gangguan di sana berdampak global, sebagaimana krisis Selat Hormuz 2026 menunjukkan betapa rentannya ekonomi dunia terhadap satu selat sempit.", "kerangka": {"judul": "Daftar periksa membaca peta taktis", "isi": ["Baca judul, tanggal, dan keterangan warna pihak yang bertempur.", "Ikuti panel dari Tahap 1 ke tahap terakhir.", "Panah utuh = gerak maju/serangan; panah putus-putus = mundur, tipuan, atau rute.", "Tanda silang = kapal/satuan tenggelam atau hancur; bintang = ledakan/titik serangan.", "Tanyakan: di mana geografi (selat, pulau, arus) memberi keuntungan?", "Simpulkan: keputusan apa yang paling menentukan hasil?"]}, "kegiatan": {"judul": "Peta laut di sekitar saya", "langkah": ["Buka peta Indonesia dan tandai empat selat strategis: Malaka, Sunda, Lombok, Makassar.", "Tandai tiga ALKI dan kota/pangkalan terdekat dari tempat tinggal Anda.", "Tulis 5 kalimat: apa yang terjadi pada harga barang di daerah Anda bila salah satu selat tersebut terganggu?"]}, "peta": [{"title": "Pertempuran Salamis, September 480 SM", "t": "Tahap 3 — Serangan taji (ramming) dan pengepungan sayap", "cap": "Trireme Yunani yang berat dan rendah menghantam lambung Persia dengan taji perunggu. Sayap kanan Persia terjepit oleh kontingen Aigina. Menjelang senja Persia mundur ke Phaleron; Herodotus mencatat sekitar 200 kapal Persia dan 40 kapal Yunani hilang.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"salamis2ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"salamis2ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"salamis2ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#15803d\"/><\/marker><marker id=\"salamis2ahD\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient 70.0\" fill=\"none\" stroke=\"#15803d\" stroke-width=\"3.2\" stroke-linecap=\"round\" marker-end=\"url(#salamis2ahC)\" opacity=\"0.92\"/><text x=\"264.0\" y=\"324.0\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" font-family=\"Inter\" fill=\"#ffffff\" stroke=\"#ffffff\" stroke-width=\"3.2\" stroke-linejoin=\"round\">Aristides merebut Psyttaleia<\/text><text x=\"264.0\" y=\"324.0\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" font-family=\"Inter\" fill=\"#15803d\">Aristides merebut Psyttaleia<\/text><rect x=\"0\" y=\"0\" width=\"600\" height=\"24\" fill=\"#1d0b78\" opacity=\"0.92\"/><rect x=\"0\" y=\"24\" width=\"600\" height=\"2\" fill=\"#ffd60a\"/><text x=\"10\" y=\"16.5\" font-size=\"11.5\" font-weight=\"700\" fill=\"#ffffff\" font-family=\"Inter\">Tahap 3 — Serangan taji (ramming) dan pengepungan sayap<\/text><g><circle cx=\"576\" cy=\"50\" r=\"13\" fill=\"#ffffff\" opacity=\"0.85\" stroke=\"#1d0b78\"/><path d=\"M576,39 L580,50 L576,61 L572,50 Z\" fill=\"#1d0b78\"/><path d=\"M576,39 L580,50 L572,50 Z\" fill=\"#ffd60a\"/><text x=\"576\" y=\"35\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1d0b78\">U<\/text><\/g><text x=\"594\" y=\"354\" text-anchor=\"end\" font-size=\"8\" fill=\"#334155\" font-style=\"italic\">Skematik — tidak berskala<\/text><\/svg>", "src": "Herodotus, Historiai VIII; Aeschylus, Persai; Strauss (2004)."}], "kuis": [{"q": "Kekuatan laut (sea power) dalam buku ini paling tepat diartikan sebagai…", "a": "Kemampuan memanfaatkan laut bagi kepentingan sendiri dan mencegah lawan berbuat sama, didukung armada, niaga, pelabuhan, industri, dan kehendak politik", "w": ["Jumlah kapal perang yang dimiliki suatu negara", "Luas wilayah laut menurut peta resmi", "Kemampuan menangkap ikan di laut lepas"], "e": "Kekuatan laut adalah sistem: kapal perang hanya satu unsurnya."}, {"q": "Mencegah lawan memakai laut, misalnya dengan kapal selam, ranjau, atau rudal pantai, disebut…", "a": "Sea denial", "w": ["Sea control", "Power projection", "Fleet in being"], "e": "Sea denial menolak penggunaan laut oleh lawan, seperti Ukraina di Laut Hitam."}, {"q": "Siapa yang merumuskan enam unsur kekuatan laut, termasuk \"watak bangsa\" dan \"watak pemerintahan\"?", "a": "Alfred Thayer Mahan", "w": ["Julian Corbett", "Sergei Gorshkov", "Themistocles"], "e": "Mahan, The Influence of Sea Power upon History (1890)."}, {"q": "Konsep negara kepulauan Indonesia diakui secara internasional melalui…", "a": "UNCLOS 1982", "w": ["Konvensi Montreux 1936", "Perjanjian Bongaya 1667", "Persetujuan New York 1962"], "e": "Perjuangan sejak Deklarasi Djuanda 1957 diakui dalam UNCLOS 1982."}, {"q": "Pada peta taktis buku ini, panah putus-putus umumnya berarti…", "a": "Gerak mundur, tipuan, atau rute", "w": ["Serangan utama", "Kapal yang tenggelam", "Garis pantai"], "e": "Panah utuh menandai serangan atau gerak maju."}]}, {"no": 2, "judul": "Yunani: Salamis dan Aleksander Agung", "bab": "Bab I–II", "jam": 2, "cp": ["CP2", "CP3", "CP4"], "tujuan": ["Menjelaskan keputusan Athena membangun armada dan memilih bertempur di laut.", "Menafsirkan tahapan Pertempuran Salamis dari peta taktis.", "Menjelaskan strategi Aleksander \"mengalahkan armada dari darat\" beserta risikonya."], "dasar": "Sekitar 483 SM, Themistocles meyakinkan Athena memakai hasil tambang perak Laurion untuk membangun armada, bukan dibagikan kepada warga; menurut Herodotus jumlahnya 200 kapal. Ia menafsirkan ramalan \"tembok kayu\" sebagai kapal. Pada September 480 SM, di selat sempit Salamis, sekitar 370 trireme Yunani mengalahkan armada Persia yang jauh lebih besar. Tanpa armada, tentara raksasa Xerxes tidak dapat dipasok dan harus mundur.", "menengah": "Kemenangan Salamis lahir dari tiga hal: pemilihan medan (selat sempit meniadakan keunggulan jumlah), tipu muslihat (pesan palsu Sicinnus memancing Persia masuk dan menguras tenaga pendayungnya semalaman), dan taktik menaji dengan trireme yang berat. Setelah itu Themistocles justru terkena ostrakisme (±471 SM), dituduh bersekongkol dengan Persia, dan wafat di Magnesia sebagai gubernur Persia (±459 SM). Satu setengah abad kemudian, Aleksander Agung menolak bertempur di laut di Miletos (334 SM), membubarkan armadanya, dan merebut pangkalan-pangkalan Persia dari darat; armada Fenisia dan Siprus kemudian beralih kepadanya dan Tirus jatuh pada 332 SM.", "lanjut": "Strategi Aleksander berisiko: Memnon dari Rhodos hampir mengobarkan perang di Laut Aigaia dan Yunani sebelum wafat pada 333 SM, dan Aleksander tetap harus membangun armada untuk merebut Tirus. Bagi Indonesia, pelajarannya ganda: armada membutuhkan pangkalan yang aman dan tersebar, dan lawan yang tidak sanggup menandingi armada dapat berusaha melumpuhkannya dengan menyerang pangkalan dan galangan. Kisah Themistocles juga mengingatkan perlunya melindungi pemimpin visioner dari intrik politik.", "kerangka": {"judul": "Lima pertanyaan analisis pertempuran", "isi": ["Penyebab: mengapa pertempuran terjadi?", "Pelaku: siapa pemimpin dan kekuatan masing-masing?", "Jalannya: keputusan apa yang menentukan di tiap tahap?", "Akibat: apa yang berubah setelahnya?", "Pelajaran: apa artinya bagi Indonesia hari ini?"]}, "kegiatan": {"judul": "Analisis Salamis dengan lima pertanyaan", "langkah": ["Gunakan kerangka lima pertanyaan untuk Pertempuran Salamis.", "Tulis jawaban maksimal 300 kata.", "Sebutkan satu keputusan anggaran masa kini yang serupa dengan perak Laurion."]}, "peta": [{"title": "Pertempuran Salamis, September 480 SM", "t": "Tahap 2 — Fajar: Persia masuk ke selat sempit", "cap": "Persia memasuki selat yang hanya selebar sekitar 1,5 km. Kapal Yunani mula-mula mundur (backing water), memancing lawan makin dalam. Barisan Persia yang panjang kehilangan susunan dan saling menghalangi.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"salamis1ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" n Tirus diblokade<\/text><rect x=\"0\" y=\"0\" width=\"600\" height=\"24\" fill=\"#1d0b78\" opacity=\"0.92\"/><rect x=\"0\" y=\"24\" width=\"600\" height=\"2\" fill=\"#ffd60a\"/><text x=\"10\" y=\"16.5\" font-size=\"11.5\" font-weight=\"700\" fill=\"#ffffff\" font-family=\"Inter\">Tahap 2 — Armada Fenisia dan Siprus beralih ke Aleksander<\/text><g><circle cx=\"576\" cy=\"50\" r=\"13\" fill=\"#ffffff\" opacity=\"0.85\" stroke=\"#1d0b78\"/><path d=\"M576,39 L580,50 L576,61 L572,50 Z\" fill=\"#1d0b78\"/><path d=\"M576,39 L580,50 L572,50 Z\" fill=\"#ffd60a\"/><text x=\"576\" y=\"35\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1d0b78\">U<\/text><\/g><text x=\"594\" y=\"354\" text-anchor=\"end\" font-size=\"8\" fill=\"#334155\" font-style=\"italic\">Skematik — tidak berskala<\/text><\/svg>", "src": "Arrianos, Anabasis II.16–24; Diodoros XVII.40–46."}], "kuis": [{"q": "Dana apa yang dipakai Athena untuk membangun armadanya atas usul Themistocles?", "a": "Hasil tambang perak Laurion", "w": ["Upeti dari Persia", "Pinjaman dari Sparta", "Rampasan dari Troya"], "e": "Herodotus mencatat dana itu dipakai membangun 200 kapal."}, {"q": "Mengapa Selat Salamis menguntungkan armada Yunani?", "a": "Selat yang sempit meniadakan keunggulan jumlah kapal Persia", "w": ["Arusnya selalu searah dengan kapal Yunani", "Persia tidak punya kapal trireme", "Yunani dibantu armada Kartago"], "e": "Kapal-kapal Persia saling menghalangi di perairan sempit."}, {"q": "Bagaimana karier Themistocles berakhir?", "a": "Terkena ostrakisme, dituduh pro-Persia, dan wafat sebagai gubernur Magnesia", "w": ["Gugur dalam Pertempuran Salamis", "Menjadi raja Athena seumur hidup", "Ditawan Aleksander Agung"], "e": "Ia diasingkan sekitar 471 SM dan wafat sekitar 459 SM."}, {"q": "Strategi Aleksander Agung terhadap armada Persia yang lebih besar adalah…", "a": "Merebut pangkalan-pangkalannya dari darat", "w": ["Menyerang langsung di laut terbuka", "Membayar upeti agar armada pergi", "Bersekutu dengan Athena untuk berperang di laut"], "e": "Kapal tanpa pelabuhan, air, dan awak setia akan lumpuh."}, {"q": "Mengapa Tirus akhirnya dapat direbut pada 332 SM?", "a": "Armada Fenisia dan Siprus beralih ke Aleksander sehingga pulau itu dapat diblokade dan diserbu dari laut", "w": ["Penduduk Tirus membuka gerbang sukarela", "Gempa bumi meruntuhkan temboknya", "Persia menyerahkan Tirus melalui perjanjian"], "e": "Tanggul saja tidak cukup; armada menentukan."}]}, {"no": 3, "judul": "Roma dan Kartago: Dari Petani Menjadi Pelaut", "bab": "Bab III–V", "jam": 3, "cp": ["CP2", "CP3", "CP4"], "tujuan": ["Membandingkan watak Kartago yang maritim dan Roma yang kontinental.", "Menjelaskan corvus dan kemenangan-kemenangan laut Roma.", "Menjelaskan mengapa Hannibal menang taktis tetapi kalah strategis."], "dasar": "Kartago membangun kekayaan dari perdagangan laut Mediterania, sedangkan Roma adalah bangsa petani-prajurit. Dalam Perang Punik I (264–241 SM) Roma membangun armada dengan meniru kapal Kartago yang terdampar dan menambahkan corvus, jembatan berpaku besi untuk mengunci kapal lawan sehingga legiun dapat bertempur seperti di darat. Roma menang di Mylae (260 SM), Eknomos (256 SM), dan Kepulauan Aegates (241 SM).", "menengah": "Setelah kalah di laut, Kartago di bawah keluarga Barca membangun kekaisaran darat di Iberia. Hannibal menyeberangi Pegunungan Alpen (218 SM) dan menang di Trebia, Trasimene, dan Cannae (216 SM) dengan pengepungan ganda. Namun selama 15 tahun di Italia ia hampir tidak menerima bala bantuan dari laut, karena armada Roma menguasai jalur antara Afrika dan Italia. Roma memakai laut untuk merebut Kartago Baru (209 SM) dan mendarat di Afrika; Hannibal kalah di Zama (202 SM).", "lanjut": "Setelah menguasai Mediterania, Roma membiarkan armadanya menyusut dan perompak Kilikia mengancam pasokan gandum. Pompeius (67 SM) membersihkan laut dalam kurang dari tiga bulan dengan membagi Mediterania menjadi 13 wilayah dan memukimkan kembali perompak yang menyerah. Augustus kemudian mendirikan armada permanen (Misenum dan Ravenna) yang menopang Pax Romana. Pelajaran: kehendak politik dapat mengubah watak bangsa; laut yang tidak dijaga akan dimanfaatkan aktor bukan negara; penegakan hukum di laut paling efektif bila disertai solusi ekonomi di darat.", "kerangka": {"judul": "Matriks watak bangsa", "isi": ["Sumber kekayaan: darat atau laut?", "Siapa yang mengawaki armada: warga atau bayaran?", "Bagaimana armada dibiayai di masa krisis?", "Apa yang terjadi bila armada dikurangi di masa damai?"]}, "kegiatan": {"judul": "Membaca peta Cannae dan Aegates", "langkah": ["Jelaskan dengan kata-kata sendiri tiga tahap Cannae.", "Jelaskan mengapa Kartago kalah di Aegates meski angin menguntungkan.", "Tulis satu paragraf: mengapa kemenangan Cannae tidak memenangkan perang?"]}, "peta": [{"title": "Cannae, 2 Agustus 216 SM: Pengepungan Ganda (Double Envelopment)", "t": "Tahap 3 — Rahang tertutup: dikepung dari empat sisi", "cap": "Infanteri Afrika berputar menghadap ke dalam, kavaleri menutup bagian belakang. Tentara Roma terjepit begitu rapat sehingga tidak bisa mengayunkan pedang.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"cannae2ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"cannae2ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"cannae2ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#15803d\"/><\/marker><marker id=\"cannae2ahD\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 nyerahkan Sisilia."}, {"q": "Mengapa Hannibal menempuh jalan darat melintasi Alpen?", "a": "Karena laut dikuasai armada Roma", "w": ["Karena kapal Kartago tidak dapat berlayar di musim panas", "Karena Alpen adalah jalan terpendek", "Karena Roma telah menutup Selat Gibraltar dengan rantai"], "e": "Hilangnya penguasaan laut memaksa jalan yang mahal."}, {"q": "Taktik Hannibal di Cannae dikenal sebagai…", "a": "Pengepungan ganda (double envelopment)", "w": ["Memotong huruf T", "Formasi sayap bangau", "Raking"], "e": "Pusat melentur, sayap menjepit, kavaleri menutup belakang."}, {"q": "Kunci keberhasilan Pompeius melawan perompak pada 67 SM adalah…", "a": "Komando tunggal, pembagian 13 wilayah yang serentak, dan pemukiman kembali perompak yang menyerah", "w": ["Menyewa armada Kartago", "Membayar upeti kepada perompak", "Menutup semua pelabuhan Italia"], "e": "Laut dibersihkan dalam kurang dari tiga bulan."}]}, {"no": 4, "judul": "Abad Pertengahan: Bizantium, Viking, dan Perang Salib", "bab": "Bab VI–VIII", "jam": 2, "cp": ["CP2", "CP4"], "tujuan": ["Menjelaskan peran Api Yunani dan armada dalam pertahanan Konstantinopel.", "Menjelaskan keunggulan kapal panjang Viking.", "Menjelaskan peran armada Italia dalam Perang Salib dan peristiwa 1204."], "dasar": "Konstantinopel bertahan dari pengepungan Arab 717–718 karena armadanya menjaga jalur pasokan dan menggunakan Api Yunani, cairan api yang disemburkan dari pipa dan tetap menyala di atas air. Viking memiliki kapal panjang yang lentur, dangkal, dan cukup kuat menyeberangi samudra, sehingga dapat muncul tiba-tiba di pantai maupun jauh di pedalaman melalui sungai.", "menengah": "Kerajaan-kerajaan darat Eropa hampir tidak memiliki armada; Alfred dari Wessex menjawab Viking dengan kota berbenteng (burh), pasukan siaga bergiliran, dan kapal panjang yang lebih besar (896). Dalam Perang Salib, kota pantai jatuh atau bertahan tergantung siapa menguasai laut di depannya: Venesia menghancurkan armada Fatimiyah di Askalon (1123) sehingga Tirus jatuh (1124), dan Akko menyerah (1191) setelah perang logistik di laut.", "lanjut": "Bizantium kemudian membiarkan armadanya membusuk dan bergantung pada Venesia (khrysoboullon 1082). Pada 1204, Perang Salib Keempat yang dibiayai kontrak dengan Venesia dibelokkan ke Konstantinopel; armada Venesia menerobos Tanduk Emas dan kota itu dijarah. Pelajaran: menyerahkan keamanan laut kepada pihak asing menukar kemandirian dengan bantuan sesaat; kekuatan laut sewaan membawa kepentingannya sendiri.", "kerangka": {"judul": "Daftar periksa kemandirian maritim", "isi": ["Apakah kapal dibangun dan dirawat di dalam negeri?", "Apakah awak dan perwira adalah warga sendiri yang terlatih?", "Apakah jalur pasokan penting dijaga armada sendiri?", "Adakah ketergantungan pada pihak asing yang dapat dipakai menekan?"]}, "kegiatan": {"judul": "Belajar dari 1204", "langkah": ["Bacalah subbab Perang Salib Keempat.", "Isi daftar periksa kemandirian maritim untuk Bizantium tahun 1204.", "Isi daftar periksa yang sama untuk Indonesia menurut pengetahuan Anda, dan diskusikan."]}, "peta": [{"title": "Pengepungan Arab atas Konstantinopel, 717–718 M", "t": "Tahap 1 — Darat dikepung; armada Arab mencoba menutup Bosporus (Sept 717)", "cap": "Dromon-dromon dengan Api Yunani keluar dari Tanduk Emas dan membakar kapal-kapal Arab yang lambat melawan arus Bosporus.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"konstantinopel7170ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"konstantinopel7170ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"konstantinopel7170ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" mar d\">Olaf melompat ke laut<\/text><text x=\"372.0\" y=\"260.0\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" font-family=\"Inter\" fill=\"#7f1d1d\">Olaf melompat ke laut<\/text><rect x=\"0\" y=\"0\" width=\"600\" height=\"24\" fill=\"#1d0b78\" opacity=\"0.92\"/><rect x=\"0\" y=\"24\" width=\"600\" height=\"2\" fill=\"#ffd60a\"/><text x=\"10\" y=\"16.5\" font-size=\"11.5\" font-weight=\"700\" fill=\"#ffffff\" font-family=\"Inter\">Tahap 3 — Járnbarði milik Eirik memotong satu per satu<\/text><g><circle cx=\"576\" cy=\"50\" r=\"13\" fill=\"#ffffff\" opacity=\"0.85\" stroke=\"#1d0b78\"/><path d=\"M576,39 L580,50 L576,61 L572,50 Z\" fill=\"#1d0b78\"/><path d=\"M576,39 L580,50 L572,50 Z\" fill=\"#ffd60a\"/><text x=\"576\" y=\"35\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1d0b78\">U<\/text><\/g><text x=\"594\" y=\"354\" text-anchor=\"end\" font-size=\"8\" fill=\"#334155\" font-style=\"italic\">Skematik — tidak berskala<\/text><\/svg>", "src": "Snorri Sturluson, Heimskringla: Óláfs saga Tryggvasonar."}], "kuis": [{"q": "Api Yunani adalah…", "a": "Senjata api cair Bizantium yang disemburkan dari pipa dan tetap menyala di atas air", "w": ["Meriam raksasa buatan Orban", "Kapal api Inggris di Calais", "Bom keramik Mongol"], "e": "Rahasianya dijaga ketat; komposisinya tidak diketahui pasti."}, {"q": "Keunggulan utama kapal panjang Viking adalah…", "a": "Kuat di samudra sekaligus dangkal sehingga dapat mendarat di pantai dan menyusuri sungai", "w": ["Bermesin uap", "Berlapis baja tebal", "Membawa meriam di kedua sisinya"], "e": "Mobilitas strategis menjadi pengganda kekuatan."}, {"q": "Alfred dari Wessex menghadapi Viking antara lain dengan…", "a": "Kota berbenteng (burh), pasukan siaga bergiliran, dan kapal panjang yang lebih besar", "w": ["Membayar Danegeld setiap tahun", "Menyewa armada Bizantium", "Membangun tembok di sepanjang pantai"], "e": "Kronik Anglo-Saxon 896 mencatat kapal-kapal Alfred."}, {"q": "Akko menyerah pada 1191 terutama karena…", "a": "Blokade laut memutus pasokan dari armada Mesir", "w": ["Gempa bumi", "Pengkhianatan Saladin", "Kelaparan di Eropa"], "e": "Pengepungan Akko adalah perlombaan pasokan melalui laut."}, {"q": "Pelajaran utama dari jatuhnya Konstantinopel pada 1204 adalah…", "a": "Mengabaikan armada sendiri dan bergantung pada armada asing dapat berakibat fatal", "w": ["Tembok darat selalu cukup", "Api Yunani tidak pernah berguna", "Kota pulau mustahil direbut"], "e": "Armada Bizantium tinggal sekitar 20 kapal lapuk."}]}, {"no": 5, "judul": "Asia dan Nusantara: Mongol, Majapahit, dan Yi Sun-sin", "bab": "Bab IX dan XI", "jam": 3, "cp": ["CP2", "CP3", "CP5"], "tujuan": ["Menjelaskan kegagalan invasi laut Mongol dan lahirnya Majapahit.", "Menjelaskan taktik Yi Sun-sin di Hansando dan Myeongnyang.", "Membandingkan nasib Themistocles dan Yi Sun-sin."], "dasar": "Kekaisaran Mongol, kekuatan darat terbesar dalam sejarah, gagal dalam invasi laut ke Jepang (1274, 1281), Dai Viet (1288), dan Jawa (1293). Di Jawa, Raden Wijaya bersekutu dengan pasukan Yuan untuk mengalahkan Jayakatwang, lalu berbalik mengusir mereka; Majapahit pun lahir. Di Korea, Laksamana Yi Sun-sin memutus jalur laut Jepang dalam Perang Imjin (1592–1598).", "menengah": "Tran Hung Dao di Bach Dang (1288) menancapkan tiang runcing di dasar sungai yang tersembunyi saat pasang dan muncul saat surut. Yi Sun-sin di Hansando (14 Agustus 1592) memancing armada Wakisaka ke perairan terbuka lalu menjepitnya dengan formasi sayap bangau; laporannya mencatat 47 kapal hancur dan 12 direbut. Di Myeongnyang (26 Oktober 1597), dengan 13 kapal, ia memanfaatkan arus yang berbalik di selat sempit melawan sekitar 133 kapal perang Jepang.", "lanjut": "Yi Sun-sin dipenjara dan disiksa pada 1597 akibat fitnah dan jebakan agen ganda; penggantinya, Won Gyun, kehilangan hampir seluruh armada di Chilcheollyang. Yi diangkat kembali dan menulis bahwa ia masih memiliki dua belas kapal. Ia gugur di Noryang (1598). Kisahnya sejajar dengan Themistocles. Bagi Nusantara, visi maritim Kertanegara (Ekspedisi Pamalayu 1275) dan kecerdikan Raden Wijaya menunjukkan bahwa kedaulatan ditentukan oleh siapa yang memahami laut di sekitarnya.", "kerangka": {"judul": "Memanfaatkan medan sendiri", "isi": ["Kenali selat, sungai, dan pulau yang menyempitkan ruang gerak lawan.", "Pelajari pasang surut dan arus.", "Pahami musim dan angin muson.", "Siapkan pertahanan pantai sebelum lawan datang."]}, "kegiatan": {"judul": "Selat di daerah saya", "langkah": ["Pilih satu selat atau muara di Indonesia yang Anda kenal.", "Cari informasi tentang arus, pasang surut, dan lebar selat itu.", "Tulis bagaimana medan itu dapat dimanfaatkan untuk pertahanan, seperti Myeongnyang atau Bach Dang."]}, "peta": [{"title": "Ekspedisi Yuan ke Jawa, 1292–1293: Lahirnya Majapahit", "t": "Tahap 3 — Wijaya berbalik; pasukan Yuan mundur ke laut", "cap": "Majapahit menyerang pasukan Yuan yang tersebar. Menjelang pergantian angin muson, armada Yuan meninggalkan Jawa.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"jawa12932ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"jawa12932ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"jawa12932ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#15803d\"/><\/marker><marker id=\"jawa12932ahD\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#a16207\"/><\/marker><marker id=\"jawa12932ahN\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" mar in, Nanjung Ilgi (16/9/1597); Hawley (2005)."}], "kuis": [{"q": "Bagaimana Raden Wijaya menghadapi ekspedisi Yuan pada 1293?", "a": "Bersekutu dengan pasukan Yuan mengalahkan Jayakatwang, lalu berbalik menyerang pasukan Yuan", "w": ["Menyerah dan membayar upeti tahunan", "Mengalahkan armada Yuan di laut terbuka", "Melarikan diri ke Sumatra"], "e": "Majapahit lahir dari kecerdikan ini."}, {"q": "Taktik Tran Hung Dao di Sungai Bach Dang memanfaatkan…", "a": "Tiang runcing yang tersembunyi saat pasang dan muncul saat surut", "w": ["Api Yunani", "Kapal selam", "Topan musim gugur"], "e": "Pasang surut dijadikan senjata."}, {"q": "Formasi yang dipakai Yi Sun-sin di Hansando disebut…", "a": "Sayap bangau (hagikjin)", "w": ["Bulan sabit", "Baji", "Memotong huruf T"], "e": "Lengkungan U menjepit lawan dari tiga sisi."}, {"q": "Di Myeongnyang, Yi Sun-sin memiliki…", "a": "13 kapal", "w": ["133 kapal", "55 kapal", "300 kapal"], "e": "Arus selat yang berbalik membantu 13 kapal menghadapi ratusan."}, {"q": "Apa yang terjadi di Chilcheollyang (1597) ketika Yi Sun-sin dipenjara?", "a": "Armada Korea di bawah Won Gyun hancur hampir seluruhnya", "w": ["Jepang menyerah", "Ming mengirim armada untuk Korea", "Yi Sun-sin memenangkan pertempuran"], "e": "Armada yang dibangun bertahun-tahun hilang dalam satu malam."}]}, {"no": 6, "judul": "Usmani dan Thalassokrasi Belanda–Inggris", "bab": "Bab X dan XII", "jam": 2, "cp": ["CP2", "CP4", "CP5"], "tujuan": ["Menjelaskan operasi kapal melintasi bukit (1453) dan Lepanto (1571).", "Menjelaskan VOC sebagai thalassokrasi dan dampaknya bagi Nusantara.", "Menjelaskan unsur sistem negara yang membuat Inggris unggul di laut."], "dasar": "Pada 1453 Mehmed II memutus Konstantinopel dari Laut Hitam dengan benteng Rumeli Hisarı dan menarik sekitar 70 kapal melintasi bukit ke Tanduk Emas. Di Lepanto (1571) Liga Suci mengalahkan armada Usmani, tetapi Usmani membangun ulang armadanya dalam satu musim dingin. Aceh meminta bantuan Usmani menghadapi Portugis (±1566).", "menengah": "Belanda membangun kemakmuran dari laut dan mendirikan VOC (1602) yang berwenang membuat perjanjian, membangun benteng, dan berperang. Bagi Nusantara thalassokrasi ini berwajah kekerasan: penaklukan Banda (1621) dan perang melawan Gowa yang berujung Perjanjian Bongaya (1667). Di Eropa, Belanda menghancurkan armada Spanyol di The Downs (1639) dan membakar armada Inggris yang ditambatkan di Medway (1667).", "lanjut": "Inggris belajar dari Medway: membangun Bank of England (1694), galangan kerajaan, ujian perwira, dan perlindungan perdagangan yang saling menguatkan. Kemenangan Hawke di Teluk Quiberon (1759) menggagalkan invasi Prancis. Pelajaran: kekuatan laut adalah sistem negara; bangsa yang lemah di laut dapat menjadi korban thalassokrasi bangsa lain, seperti Banda dan Makassar.", "kerangka": {"judul": "Lingkaran kekuatan laut", "isi": ["Perdagangan laut menghasilkan pajak dan bea.", "Keuangan negara membiayai armada dan galangan.", "Armada melindungi perdagangan dan jalur pasokan.", "Pendidikan perwira dan industri menjaga mutu."]}, "kegiatan": {"judul": "Perlawanan maritim Nusantara", "langkah": ["Pilih satu: Sultan Hasanuddin (Gowa), Aceh, atau Banda.", "Tulis penyebab, pelaku, akibat, dan pelajaran (maksimal 300 kata).", "Usulkan satu pelajaran untuk kebijakan maritim saat ini."]}, "peta": [{"title": "Konstantinopel 1453: Kapal-Kapal Melintasi Bukit", "t": "Tahap 2 — 22 April: ±70 kapal ditarik di atas papan berminyak melewati bukit", "cap": "Kapal-kapal muncul di Tanduk Emas di belakang rantai. Pembela harus menyebar pasukan ke tembok laut.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"konstantinopel14531ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"konstantinopel14531ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY l", "Pembukaan Jepang oleh Perry"], "e": "Sultan Hasanuddin kini Pahlawan Nasional."}, {"q": "Serangan Medway (1667) terjadi karena…", "a": "Armada Inggris ditambatkan untuk menghemat biaya", "w": ["Inggris tidak punya kapal", "Belanda bersekutu dengan Spanyol", "Badai menghancurkan armada Inggris"], "e": "Armada yang tidak siaga tidak menjaga apa pun."}, {"q": "Yang BUKAN bagian sistem kekuatan laut Inggris abad ke-18 menurut buku ini adalah…", "a": "Ketergantungan pada armada sewaan Venesia", "w": ["Bank of England dan utang negara", "Galangan kerajaan", "Ujian bagi calon letnan"], "e": "Inggris membangun sistemnya sendiri."}]}, {"no": 7, "judul": "Nelson, Amerika, dan Lahirnya Teori Mahan", "bab": "Bab XIII–XIV", "jam": 2, "cp": ["CP2", "CP3", "CP4"], "tujuan": ["Menjelaskan \"sentuhan Nelson\" di Trafalgar.", "Menjelaskan akibat pembubaran armada Amerika setelah merdeka.", "Menjelaskan dampak ekspedisi Perry dan pemikiran Mahan."], "dasar": "Nelson menghancurkan armada Prancis di Teluk Abukir (1798) dan di Trafalgar (21 Oktober 1805) dengan menembus barisan lawan dalam dua kolom. Napoleon menguasai Eropa daratan tetapi tidak pernah dapat menyeberangi Selat Inggris. Amerika Serikat menjual kapal perang terakhirnya pada 1785, lalu kapal dagangnya diperas corsair Barbaria.", "menengah": "Undang-Undang Angkatan Laut 1794 melahirkan enam fregat rancangan Joshua Humphreys, lebih kuat dari fregat Eropa sekelasnya. Dalam Perang Barbaria Pertama, Decatur membakar USS Philadelphia di Tripoli (1804). Pada 1853–1854 Komodor Perry memaksa Keshogunan Tokugawa (bukan Kekaisaran Meiji) membuka pelabuhan; kejutan ini memicu Restorasi Meiji (1868), dan Jepang kemudian membangun angkatan laut modern yang menang di Tsushima (1905).", "lanjut": "Mahan (1890) memberi bahasa ilmiah bagi kekuatan laut dan memicu perlombaan armada. Nelson mewariskan komando misi: menjelaskan tujuan dan mempercayai bawahan. Pelajaran: kemerdekaan tanpa kekuatan laut rapuh; membayar upeti tidak menjamin keamanan; rancangan yang cerdik dapat menutupi keterbatasan anggaran.", "kerangka": {"judul": "Komando misi", "isi": ["Jelaskan maksud dan tujuan akhir, bukan hanya perintah.", "Bagikan rencana sebelum operasi.", "Beri keleluasaan bawahan saat keadaan berubah.", "Latih bersama sampai saling percaya."]}, "kegiatan": {"judul": "Dari kapal hitam ke Tsushima", "langkah": ["Susun linimasa 1853–1905 (Perry, Kanagawa, Meiji, Tsushima).", "Tulis tiga langkah yang diambil Jepang setelah dipaksa membuka diri.", "Bandingkan dengan satu langkah yang dapat diambil Indonesia."]}, "peta": [{"title": "Trafalgar, 21 Oktober 1805: Sentuhan Nelson", "t": "Tahap 2 — Barisan ditembus di dua titik (±12.00)", "cap": "Tembakan ke buritan (raking) menyapu geladak lawan dari ujung ke ujung.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"trafalgar1ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"trafalgar1ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"trafalgar1ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#15803d\"/><\/marker><marker id=\"trafalgar1ahD\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#a16207\"/><\/marker><marker id=\"trafalgar1ahN\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#334155\"/><\/marker><linearGradient id=\"trafalgar1sea\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" ukum laut internasional", "Melarang perompakan"], "e": "Dibaca luas di AS, Inggris, Jerman, dan Jepang."}]}, {"no": 8, "judul": "Perang Dunia I dan II: Blokade, Kapal Selam, dan Kapal Induk", "bab": "Bab XV–XVII", "jam": 3, "cp": ["CP2", "CP3", "CP4", "CP5"], "tujuan": ["Menjelaskan peran blokade dan perang kapal selam.", "Menjelaskan pergeseran dari kapal tempur ke kapal induk.", "Menjelaskan Pertempuran Laut Jawa dan maknanya bagi Indonesia."], "dasar": "Dalam Perang Dunia I, armada Inggris jarang bertempur, tetapi blokadenya melemahkan Jerman; Jerman menjawab dengan U-boat yang hampir melumpuhkan Inggris sampai sistem konvoi diterapkan (1917). Kapal Jerman Emden menyerang Penang (1914) dan dihentikan di Kepulauan Cocos. Dalam Perang Dunia II, Inggris hanya bertahan selama Atlantik terbuka.", "menengah": "Taranto (1940) dan tenggelamnya Prince of Wales serta Repulse (1941) menunjukkan bahwa kapal tempur tanpa perlindungan udara tidak dapat bertahan. Jepang berperang untuk merebut minyak Hindia Belanda. Di Laut Jawa (27 Februari 1942), armada ABDA di bawah Karel Doorman yang tidak pernah berlatih bersama dikalahkan; Jawa jatuh. Di Midway (Juni 1942), pemecahan sandi membuat AS menenggelamkan empat kapal induk Jepang.", "lanjut": "Pertempuran Atlantik dimenangkan oleh gabungan pesawat jarak jauh, kapal induk pengawal, radar, dan intelijen Ultra; Jepang kalah ketika kapal selam AS memutus kapal dagangnya. Pelajaran bagi Indonesia: negara kepulauan hidup dan mati oleh jalur lautnya; perlindungan udara dan latihan bersama dalam koalisi mutlak; perang panjang dimenangkan oleh industri dan logistik.", "kerangka": {"judul": "Lima lapis perlindungan jalur laut", "isi": ["Pengawasan (pesawat patroli, radar, satelit).", "Pengawalan konvoi dan kapal pengawal.", "Perlindungan udara armada.", "Intelijen dan perang sandi.", "Industri dan galangan untuk mengganti kerugian."]}, "kegiatan": {"judul": "Membaca peta Laut Jawa", "langkah": ["Jelaskan tiga tahap Pertempuran Laut Jawa dari peta.", "Identifikasi tiga kelemahan ABDA.", "Usulkan tiga langkah kerja sama angkatan laut regional yang mencegah kelemahan serupa."]}, "peta": [{"title": "Pertempuran Laut Jawa, 27 Februari 1942", "t": "Tahap 3 — Malam: De Ruyter dan Java tenggelam (±23.30)", "cap": "Invasi Jawa tertunda satu hari. Houston dan Perth tenggelam di Selat Sunda malam berikutnya.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"lautjawa2ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"lautjawa2ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"lautjawa2ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#15803d\"/><\/marker><marker id=\"lautjawa2ahD\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#a16207\"/><\/marker><marker id=\"lautjawa2ahN\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#334155\"/><\/marker><linearGradient id=\"lautjawa2sea\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#bfe3f5\"/><stop offset=\"1\" stop-color=\"#8cc8e8\"/><\/linearGradient><linearGradient id=\"lautjawa2landg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#efe2c0\"/><stop offset=\"1\" stop-color=\"#d9c79a\"/><\/linearGradient><pattern id=\"lautjawa2hatch\" width=\"8\" height=\"8\" patternUnits=\"userSpaceOnUse\"><path d=\"M0,8 L8,0\" stroke=\"#c9b383\" stroke-width=\"1\"/>< th=\"2.6\"/><\/g><text x=\"336.0\" y=\"68.0\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" font-family=\"Inter\" fill=\"#ffffff\" stroke=\"#ffffff\" stroke-width=\"3.2\" stroke-linejoin=\"round\">Invincible<\/text><text x=\"336.0\" y=\"68.0\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" font-family=\"Inter\" fill=\"#7f1d1d\">Invincible<\/text><path d=\"M312.0,84.0 Q384.0,132.0 372.0,186.0 L360.0,240.0\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-dasharray=\"7,5\" marker-end=\"url(#jutland1ahB)\" opacity=\"0.92\"/><text x=\"432.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" font-family=\"Inter\" fill=\"#ffffff\" stroke=\"#ffffff\" stroke-width=\"3.2\" stroke-linejoin=\"round\">putar balik serentak<\/text><text x=\"432.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" font-family=\"Inter\" fill=\"#c0392b\">putar balik serentak<\/text><rect x=\"0\" y=\"0\" width=\"600\" height=\"24\" fill=\"#1d0b78\" opacity=\"0.92\"/><rect x=\"0\" y=\"24\" width=\"600\" height=\"2\" fill=\"#ffd60a\"/><text x=\"10\" y=\"16.5\" font-size=\"11.5\" font-weight=\"700\" fill=\"#ffffff\" font-family=\"Inter\">Tahap 2 — Lari ke utara; Jellicoe memotong huruf T<\/text><g><circle cx=\"576\" cy=\"50\" r=\"13\" fill=\"#ffffff\" opacity=\"0.85\" stroke=\"#1d0b78\"/><path d=\"M576,39 L580,50 L576,61 L572,50 Z\" fill=\"#1d0b78\"/><path d=\"M576,39 L580,50 L572,50 Z\" fill=\"#ffd60a\"/><text x=\"576\" y=\"35\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1d0b78\">U<\/text><\/g><text x=\"594\" y=\"354\" text-anchor=\"end\" font-size=\"8\" fill=\"#334155\" font-style=\"italic\">Skematik — tidak berskala<\/text><\/svg>", "src": "Gordon, The Rules of the Game (1996); Massie (2003)."}], "kuis": [{"q": "Jawaban paling efektif terhadap ancaman U-boat dalam Perang Dunia I adalah…", "a": "Sistem konvoi", "w": ["Menambah kapal tempur", "Menutup semua pelabuhan", "Berdamai dengan Jerman"], "e": "Kerugian turun drastis sejak pertengahan 1917."}, {"q": "Pelajaran dari tenggelamnya Prince of Wales dan Repulse (1941) adalah…", "a": "Kapal tempur tanpa perlindungan udara sangat rentan", "w": ["Kapal tempur tidak dapat ditenggelamkan", "Kapal selam lebih lemah dari pesawat", "Torpedo tidak efektif"], "e": "Zaman kapal tempur sebagai ratu lautan berakhir."}, {"q": "Komandan armada ABDA dalam Pertempuran Laut Jawa adalah…", "a": "Laksamana Muda Karel Doorman", "w": ["Laksamana Yamamoto", "Laksamana Nimitz", "Laksamana Nelson"], "e": "Doorman gugur bersama De Ruyter."}, {"q": "Faktor kunci kemenangan AS di Midway adalah…", "a": "Pemecahan sandi yang mengungkap rencana Jepang", "w": ["Jumlah kapal tempur yang lebih banyak", "Topan yang menghantam armada Jepang", "Bantuan armada Inggris"], "e": "Pesan palsu tentang air di Midway membuktikan \"AF\"."}, {"q": "Mengapa Jepang berperang di Asia Tenggara pada 1941–1942?", "a": "Untuk merebut sumber minyak, terutama di Hindia Belanda", "w": ["Untuk merebut pelabuhan Inggris di Eropa", "Untuk membantu Belanda", "Untuk menguasai Atlantik"], "e": "Embargo minyak 1941 mendorong keputusan itu."}]}, {"no": 9, "judul": "Perang Dingin, Deklarasi Djuanda, dan Laut Aru", "bab": "Bab XVIII", "jam": 2, "cp": ["CP1", "CP2", "CP5"], "tujuan": ["Menjelaskan peran kapal selam nuklir dalam keseimbangan teror.", "Menjelaskan Deklarasi Djuanda dan konsep negara kepulauan.", "Menjelaskan Pertempuran Laut Aru dan maknanya."], "dasar": "Kapal selam nuklir pembawa rudal balistik (SSBN) bersembunyi di samudra dan menjamin kemampuan serangan kedua, sehingga tidak ada negara adidaya yang berani menyerang lebih dulu. USS Nautilus berlayar dengan tenaga nuklir pada 1955, dan rudal Polaris pertama diluncurkan dari bawah laut pada 1960.", "menengah": "Dalam Krisis Rudal Kuba (1962), AS memakai karantina laut untuk menekan tanpa langsung berperang; di bawah laut, Vasili Arkhipov menolak peluncuran torpedo nuklir dari kapal selam B-59. Di Indonesia, Deklarasi Djuanda (13 Desember 1957) menyatakan perairan di antara pulau-pulau sebagai wilayah Indonesia, menggantikan aturan kolonial tiga mil laut; perjuangan diplomasi ini diakui dalam UNCLOS 1982.", "lanjut": "Pada 15 Januari 1962, tiga MTB ALRI yang membawa pasukan infiltrasi ke Irian Barat dihadang kapal perang Belanda di Laut Aru. RI Matjan Tutul bermanuver menarik tembakan lawan dan tenggelam; Komodor Yos Sudarso gugur dengan pesan \"Kobarkan semangat pertempuran\". Peristiwa ini mempercepat persiapan Komando Mandala dan Persetujuan New York. Pelajaran: keberanian tidak sepenuhnya menggantikan teknologi, perlindungan udara, dan intelijen, tetapi kekuatan laut dapat mengubah perhitungan politik lawan.", "kerangka": {"judul": "Diplomasi dan kekuatan", "isi": ["Tetapkan posisi hukum yang jelas (seperti Deklarasi Djuanda).", "Perjuangkan di forum internasional secara konsisten.", "Dukung dengan kemampuan nyata untuk hadir dan menegakkan.", "Gunakan kekuatan secara terukur untuk memberi ruang diplomasi."]}, "kegiatan": {"judul": "Hari Nusantara dan Hari Dharma Samudera", "langkah": ["Tulis makna 13 Desember (Hari Nusantara) dan 15 Januari (Hari Dharma Samudera).", "Jelaskan hubungan keduanya dengan konsep negara kepulauan.", "Rancang satu kegiatan peringatan untuk sekolah atau kantor Anda."]}, "peta": [{"title": "Pertempuran Laut Aru, 15 Januari 1962", "t": "Tahap 2 — Matjan Tutul menarik tembakan; Yos Sudarso gugur", "cap": "\"Kobarkan semangat pertempuran.\" Peristiwa ini diperingati sebagai Hari Dharma Samudera.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"lautaru1ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"lautaru1ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\" s pantai setiap pulau", "w": ["12 mil laut dari garis pangkal kepulauan", "200 mil laut", "Seluruh perairan di antara pulau"], "e": "Aturan itu memecah wilayah Indonesia oleh laut bebas."}]}, {"no": 10, "judul": "Konflik Modern: Falkland dan Laut Hitam", "bab": "Bab XIX–XX", "jam": 2, "cp": ["CP1", "CP2", "CP4", "CP5"], "tujuan": ["Menjelaskan proyeksi kekuatan dan sea denial dalam Perang Falkland.", "Menjelaskan revolusi drone laut di Laut Hitam.", "Menilai pelajaran keduanya bagi negara kepulauan."], "dasar": "Pada 1982 Argentina merebut Falkland/Malvinas, memperkirakan Inggris yang sedang memangkas angkatan lautnya tidak akan bertindak. Inggris mengirim satuan tugas sejauh hampir 13.000 km dengan kapal induk, kapal selam nuklir, dan kapal dagang yang diambil alih (STUFT).", "menengah": "Kapal selam HMS Conqueror menenggelamkan ARA General Belgrano (2 Mei 1982, 323 tewas); setelah itu armada permukaan Argentina tetap di pelabuhan. Argentina membalas dengan rudal Exocet yang menenggelamkan HMS Sheffield. Di Laut Hitam sejak 2022, Ukraina yang hampir tanpa armada menenggelamkan kapal penjelajah Moskva (klaim Ukraina: dua rudal Neptune) dan memakai drone laut buatan sendiri sehingga Armada Laut Hitam Rusia terdesak ke Novorossiysk.", "lanjut": "Klaim Kementerian Pertahanan Ukraina menyebut sekitar 30% kekuatan tempur Armada Laut Hitam hancur atau rusak berat pada awal 2026; angka ini belum dapat diverifikasi independen. Pelajaran: sinyal pemangkasan armada dapat mengundang agresi; rudal antikapal dan drone yang murah dapat melawan kapal mahal; industri pertahanan dalam negeri mempercepat adaptasi. Untuk perairan Indonesia yang berselat dan dangkal, kapal berawak dapat dipadukan dengan rudal pantai, ranjau, dan sistem tanpa awak.", "kerangka": {"judul": "Perpaduan kekuatan negara kepulauan", "isi": ["Kapal permukaan berawak untuk kehadiran dan pertahanan udara.", "Kapal selam untuk penangkalan dan sea denial.", "Rudal pantai dan ranjau di selat-selat strategis.", "Drone laut dan udara buatan dalam negeri.", "Armada niaga yang dapat dimobilisasi."]}, "kegiatan": {"judul": "Matriks Falkland–Laut Hitam", "langkah": ["Buat tabel: kekuatan, kelemahan, senjata kunci, dan hasil untuk kedua konflik.", "Pilih satu selat di Indonesia.", "Usulkan perpaduan kekuatan untuk mempertahankan selat itu dengan kerangka modul ini."]}, "peta": [{"title": "Perang Falkland/Malvinas 1982: Zona Eksklusi dan Tenggelamnya Belgrano", "t": "April–2 Mei 1982", "cap": "Satu serangan kapal selam nuklir membuat armada permukaan Argentina tetap di pelabuhan sampai perang usai.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"falkland19820ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"falkland19820ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"falkland19820ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#15803d\"/><\/marker><marker id=\"falkland19820ahD\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#a16207\"/><\/marker><marker id=\"falkland19820ahN\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#334155\"/><\/marker><linearGradient id=\"falkland19820sea\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#bfe3f5\"/><stop offset=\"1\" stop-color=\"#8cc8e8\"/><\/linearGradient><linearGradient id=\"falkland19820landg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop ty=\"0.9\">koridor ekspor Ukraina<\/text><text x=\"132.0\" y=\"264.0\" text-anchor=\"middle\" font-size=\"10\" font-family=\"Inter\" font-weight=\"600\" fill=\"#0f172a\">koridor ekspor Ukraina<\/text><rect x=\"0\" y=\"0\" width=\"600\" height=\"24\" fill=\"#1d0b78\" opacity=\"0.92\"/><rect x=\"0\" y=\"24\" width=\"600\" height=\"2\" fill=\"#ffd60a\"/><text x=\"10\" y=\"16.5\" font-size=\"11.5\" font-weight=\"700\" fill=\"#ffffff\" font-family=\"Inter\">Tahap 2 — 2023–2024: drone laut dan rudal; armada pindah ke Novorossiysk<\/text><g><circle cx=\"576\" cy=\"50\" r=\"13\" fill=\"#ffffff\" opacity=\"0.85\" stroke=\"#1d0b78\"/><path d=\"M576,39 L580,50 L576,61 L572,50 Z\" fill=\"#1d0b78\"/><path d=\"M576,39 L580,50 L572,50 Z\" fill=\"#ffd60a\"/><text x=\"576\" y=\"35\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1d0b78\">U<\/text><\/g><text x=\"594\" y=\"354\" text-anchor=\"end\" font-size=\"8\" fill=\"#334155\" font-style=\"italic\">Skematik — tidak berskala<\/text><\/svg>", "src": "Kemhan Ukraina; Naval News (2026); ASPI Strategist (2026); laporan media."}], "kuis": [{"q": "Setelah ARA General Belgrano tenggelam, armada permukaan Argentina…", "a": "Tetap di pelabuhan sampai perang usai", "w": ["Menyerang kapal induk Inggris", "Bergabung dengan armada Chili", "Memblokade Pulau Ascension"], "e": "Contoh nyata sea denial oleh kapal selam."}, {"q": "Kapal Inggris yang tenggelam akibat rudal Exocet pada 4 Mei 1982 adalah…", "a": "HMS Sheffield", "w": ["HMS Conqueror", "HMS Hermes", "HMS Invincible"], "e": "Kapal perang Inggris pertama yang tenggelam akibat serangan musuh sejak PD II."}, {"q": "STUFT dalam Perang Falkland berarti…", "a": "Kapal dagang yang diambil alih untuk operasi militer", "w": ["Rudal antikapal", "Zona eksklusi maritim", "Pesawat pengebom Vulcan"], "e": "Armada niaga adalah bagian kekuatan laut nasional."}, {"q": "Senjata yang paling menandai perlawanan Ukraina di Laut Hitam adalah…", "a": "Drone laut (kapal permukaan tanpa awak)", "w": ["Kapal induk", "Kapal tempur kelas dreadnought", "Kapal selam nuklir"], "e": "Magura dan Sea Baby dikembangkan di dalam negeri."}, {"q": "Mengapa Rusia tidak dapat mengganti kapal yang hilang di Laut Hitam dari armada lain?", "a": "Turki menutup selat bagi kapal perang negara yang berperang berdasarkan Konvensi Montreux", "w": ["Kanal Suez ditutup", "Selat Kerch membeku", "NATO memblokade Laut Baltik"], "e": "Hukum internasional dan geografi membentuk perang laut."}]}, {"no": 11, "judul": "Selat Hormuz 2026 dan Strategi Maritim Indonesia", "bab": "Bab XXI dan Epilog", "jam": 2, "cp": ["CP1", "CP4", "CP5"], "tujuan": ["Menjelaskan krisis Selat Hormuz 2026 dan dampaknya.", "Menjelaskan hak lintas transit dan perbedaan tafsirnya.", "Merumuskan pelajaran strategis bagi Indonesia dengan kacamata Mahan."], "dasar": "Sekitar 20% pasokan minyak dunia melewati Selat Hormuz sebelum krisis. Setelah serangan AS–Israel ke Iran pada 28 Februari 2026, Iran menutup dan membatasi pelayaran di selat itu; kapal diserang, ranjau dilaporkan, dan asuransi ditarik. Brent melampaui 100 dolar per barel pada 8 Maret dan sempat mencapai sekitar 126 dolar.", "menengah": "AS memblokade pelabuhan Iran sejak 13 April 2026 (\"blokade ganda\"); gencatan senjata dan Nota Kesepahaman Islamabad tidak menghasilkan pembukaan yang tuntas, dan blokade diberlakukan kembali pada 14 Juli. Arab Saudi dan Uni Emirat Arab memakai jalur pipa menuju Laut Merah dan Fujairah. Per November 2026 krisis masih berlangsung (status diperiksa 19 November 2026). UNCLOS menjamin hak lintas transit di selat internasional, tetapi Iran menandatangani tanpa meratifikasi UNCLOS dan menafsirkan hak itu hanya bagi negara pihak.", "lanjut": "Indonesia menguasai choke point penting: Malaka, Sunda, Lombok, dan Makassar. Dengan kacamata Mahan: letak geografis adalah peluang sekaligus sorotan kekuatan besar; wilayah luas menuntut pangkalan tersebar; penduduk besar perlu diarahkan ke profesi maritim; watak bangsa bahari perlu dibangkitkan; dan watak pemerintahan menentukan konsistensi program. Renungan strategis buku: program jangka panjang yang konsisten, kekuatan yang seimbang, industri dalam negeri, pengenalan laut sendiri (maritime domain awareness), penjagaan laut bersama lembaga keamanan laut, ketahanan energi, dan kesadaran maritim masyarakat.", "kerangka": {"judul": "Enam unsur Mahan untuk Indonesia", "isi": ["Letak geografis", "Bentuk fisik wilayah", "Luas wilayah", "Jumlah penduduk", "Watak bangsa", "Watak pemerintahan"]}, "kegiatan": {"judul": "Uji tekanan selat", "langkah": ["Bayangkan Selat Malaka terganggu selama satu bulan.", "Tulis dampaknya bagi harga energi, pangan, dan logistik daerah Anda.", "Usulkan lima kemampuan yang dibutuhkan untuk membuka kembali selat itu (gunakan pelajaran Hormuz)."]}, "peta": [{"title": "Krisis Selat Hormuz, Februari–November 2026", "t": "Tahap 3 — Juli–November: pengawalan, penyapuan ranjau, jalur pipa", "cap": "Arus minyak sebagian pulih, tetapi serangan berlanjut; krisis belum berakhir per November 2026.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 360\" width=\"100%\" font-family=\"Inter\"><defs><marker id=\"hormuz20262ahA\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1d4ed8\"/><\/marker><marker id=\"hormuz20262ahB\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/><\/marker><marker id=\"hormuz20262ahC\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#15803d\"/><\/marker><marker id=\"hormuz20262ahD\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#a16207\"/><\/marker><marker id=\"hormuz const KEY = 'kz-samudra-lms-v1';
let mem = null;
function load(){ try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return mem || {user:null, act:{}, quiz:{}, exam:null, proj:{text:'', done:false, self:{}}}; }
function save(){ mem = S; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function quizPassed(n){ return (S.quiz[n]||{}).pass === true; }
function actDone(m){ return m.kegiatan.langkah.every((_,i)=> (S.act[m.no]||{})[i]); }
function modDone(m){ return quizPassed(m.no) && actDone(m); }
function unlocked(n){ return n===1 || quizPassed(n-1); }
function allQuizzes(){ return D.modul.every(m=>quizPassed(m.no)); }
function progress(){ let t=0,d=0; D.modul.forEach(m=>{ t+=2; if(actDone(m)) d++; if(quizPassed(m.no)) d++; }); t+=2; if(S.exam&&S.exam.pass) d++; if(S.proj.done) d++; return Math.round(100*d/t); }
function certReady(){ return D.modul.every(modDone) && S.exam && S.exam.pass && S.proj.done; }

function go(page, arg){
  window.scrollTo(0,0);
  if(!S.user && page!=='daftar'){ page='home'; }
  ({home:home, daftar:daftar, dash:dash, mod:modul, quiz:quiz, exam:exam, proj:proj, cert:cert, silabus:silabus})[page](arg);
}

function daftar(){
  $('#app').innerHTML = `<div class="card"><h2>Daftar peserta</h2>
   <label for="nm">Nama lengkap (untuk sertifikat)</label><input id="nm" autocomplete="name">
   <label for="em">Email</label><input id="em" type="email" autocomplete="email">
   <label for="ins">Instansi / kampus (opsional)</label><input id="ins">
   <label for="rl">Peran</label><select id="rl"><option>Masyarakat umum</option><option>Mahasiswa</option><option>Dosen / guru</option><option>ASN</option><option>TNI / Polri</option><option>Pejabat pemerintah</option></select>
   <p class="err" id="er"></p>
   <p><button class="btn" id="btnSimpan" onclick="doDaftar()">Daftar dan mulai belajar</button> <button class="btn sec" onclick="go('home')">Batal</button></p>
   <p class="note">Versi ini menyimpan data pendaftaran dan kemajuan belajar di perangkat Anda sendiri. Email konfirmasi otomatis belum aktif karena memerlukan server; akan ditambahkan pada versi daring.</p></div>`;
}
function doDaftar(){
  const nm=$('#nm').value.trim(), em=$('#em').value.trim();
  if(nm.length<3){ $('#er').textContent='Nama minimal 3 huruf.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ $('#er').textContent='Format email belum benar.'; return; }
  S.user={nama:nm,email:em,instansi:$('#ins').value.trim(),peran:$('#rl').value,tgl:new Date().toISOString()}; save(); go('dash');
}
function dash(){
  const p=progress();
  $('#app').innerHTML = `<div class="card"><h2>Halo, ${esc(S.user.nama)}</h2><p class="note">${esc(S.user.peran)}${S.user.instansi?' · '+esc(S.user.instansi):''}</p>
   <div class="bar"><i style="width:${p}%"></i></div><p class="note" id="prog">Kemajuan: ${p}%</p>
   <div class="nav"><button class="btn sm sec" onclick="go('silabus')">Silabus & penilaian</button>
   <button class="btn sm ${allQuizzes()?'':'sec'}" id="btnExam" onclick="go('exam')" ${allQuizzes()?'':'disabled'}>Ujian akhir</button>
   <button class="btn sm sec" onclick="go('proj')">Proyek akhir</button>
   <button class="btn sm" id="btnCert" onclick="go('cert')" ${certReady()?'':'disabled'}>Sertifikat</button></div></div>
   <div class="mods">${D.modul.map(m=>{ const u=unlocked(m.no), d=modDone(m);
     return `<div class="mod ${u?'':'lock'} ${d?'done':''}" data-mod="${m.no}" onclick="${u?`go('mod',${m.no})`:''}"><span class="n">MODUL ${m.no}</span>
     <h4>${esc(m.judul)}</h4><div class="st">${esc(m.bab)} · ${m.jam} jam</div>
     <div class="st">${d?'✅ Selesai':(quizPassed(m.no)?'Kuis lulus · kegiatan belum lengkap':(u?'Terbuka':'🔒 Selesaikan kuis modul sebelumnya'))}</div></div>`;}).join('')}
   <div class="mod" onclick="go('proj')"><span class="n">PROYEK</span><h4>${esc(D.proyek.judul)}</h4><div class="st">${D.proyek.jam} jam · ${S.proj.done?'✅ Ditandai selesai':'Belum selesai'}</div></div></div>
   <p class="noprint" style="margin-top:24px"><button class="btn sm sec" onclick="if(confirmReset())resetAll()">Hapus data & mulai ulang</button></p>`;
}
let resetArm=false;
function confirmReset(){ if(resetArm) return true; resetArm=true; alertBox('Tekan tombol sekali lagi untuk menghapus semua data di perangkat ini.'); setTimeout(()=>resetArm=false,5000); return false; }
function alertBox(t){ let b=document.createElement('div'); b.className='card'; b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:20;background:#1d0b78;color:#fff'; b.textContent=t; document.body.appendChild(b); setTimeout(()=>b.remove(),3500); }
function resetAll(){ try{localStorage.removeItem(KEY);}catch(e){} mem=null; S=load(); go('home'); }
function silabus(){
  $('#app').innerHTML = `<div class="nav"><button class="btn sm sec" onclick="go('dash')">← Dasbor</button></div>
  <div class="card"><h2>Silabus</h2><p class="note">Bentuk: program mandiri ±6 minggu, ±${D.jam} jam.</p>
  <table><tr><th>No</th><th>Modul</th><th>Bab buku</th><th>Capaian</th><th>Jam</th></tr>
  ${D.modul.map(m=>`<tr><td>${m.no}</td><td>${esc(m.judul)}</td><td>${esc(m.bab)}</td><td>${m.cp.join(', ')}</td><td>${m.jam}</td></tr>`).join('')}
  <tr><td>12</td><td>${esc(D.proyek.judul)}</td><td>Seluruh buku</td><td>CP5, CP6</td><td>${D.proyek.jam}</td></tr></table></div>
  <div class="card"><h2>Strategi pembelajaran</h2><ul>${D.strategi.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
  <h3>Bobot penilaian</h3><table>${D.penilaian.map(p=>`<tr><td>${esc(p[0])}</td><td>${p[1]}</td></tr>`).join('')}</table>
  <h3>Syarat sertifikat</h3><p>${esc(D.syarat)}</p></div>`;
}
function modul(n){
  const m=D.modul[n-1]; if(!unlocked(n)) return dash();
  const a=S.act[n]||{};
  $('#app').innerHTML = `<div class="nav"><button class="btn sm sec" onclick="go('dash')">← Dasbor</button></div>
  <div class="card"><span class="pill">MODUL ${m.no}</span><span class="pill m">${esc(m.bab)}</span><span class="pill m">${m.jam} jam</span><h2 style="margin-top:8px">${esc(m.judul)}</h2>
  <h3>Tujuan</h3><ol>${m.tujuan.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>
  <h3>Uraian materi</h3>
  <div class="layer"><b>Dasar.</b> ${esc(m.dasar)}</div><div class="layer"><b>Menengah.</b> ${esc(m.menengah)}</div><div class="layer"><b>Lanjut.</b> ${esc(m.lanjut)}</div>
  <h3>Peta taktis</h3>${m.peta.map(p=>`<div class="map"><div class="ttl">${esc(p.title)}</div>${p.svg}<div class="cap">${esc(p.cap)}<br><i>Sumber: ${esc(p.src)}</i></div></div>`).join('')}
  <h3>${esc(m.kerangka.judul)}</h3><ul>${m.kerangka.isi.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <h3>Kegiatan: ${esc(m.kegiatan.judul)}</h3>${m.kegiatan.langkah.map((t,i)=>`<label class="chk"><input type="checkbox" data-act="${i}" ${a[i]?'checked':''} onchange="tick(${n},${i},this.checked)"><span>${esc(t)}</span></label>`).join('')}
  <div class="nav"><button class="btn" id="btnKuis" onclick="go('quiz',${n})">Kerjakan kuis modul ${n}</button>
  ${n<D.modul.length?`<button class="btn sec" id="btnNext" onclick="go('mod',${n+1})" ${unlocked(n+1)?'':'disabled'}>Modul berikutnya →</button>`:''}</div>
  ${quizPassed(n)?`<p class="pill g">Kuis lulus (${S.quiz[n].best}%)</p>`:''}</div>`;
}
function tick(n,i,v){ S.act[n]=S.act[n]||{}; S.act[n][i]=v; save(); }
let CUR=null;
function renderQuiz(items, title, back, onDone){
  CUR={items:items.map(q=>({...q,opts:shuffle([q.a,...q.w])})), onDone};
  $('#app').innerHTML = `<div class="nav"><button class="btn sm sec" onclick="${back}">← Kembali</button></div>
  <div class="card"><h2>${esc(title)}</h2><p class="note">${items.length} soal · lulus minimal 80% · urutan pilihan diacak setiap kali.</p>
  ${CUR.items.map((q,i)=>`<div class="q" data-q="${i}"><p>${i+1}. ${esc(q.q)}</p>${q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}<div class="expl">${esc(q.e)}</div></div>`).join('')}
  <p class="err" id="qer"></p><button class="btn" id="btnSubmit" onclick="submitQuiz()">Kirim jawaban</button><div id="qres"></div></div>`;
}
function submitQuiz(){
  const it=CUR.items; let ok=0;
  for(let i=0;i<it.length;i++){ if(!document.querySelector(`input[name=q${i}]:checked`)){ $('#qer').textContent='Masih ada soal yang belum dijawab (nomor '+(i+1)+').'; return; } }
  it.forEach((q,i)=>{ const v=+document.querySelector(`input[name=q${i}]:checked`).value; const box=document.querySelector(`[data-q="${i}"]`);
    box.querySelectorAll('.opt').forEach((o,j)=>{ if(q.opts[j]===q.a) o.classList.add('right'); else if(j===v) o.classList.add('wrong'); o.querySelector('input').disabled=true; });
    box.querySelector('.expl').style.display='block'; if(q.opts[v]===q.a) ok++; });
  const sc=Math.round(100*ok/it.length), pass=sc>=80; $('#qer').textContent=''; $('#btnSubmit').disabled=true;
  CUR.onDone(sc,pass);
  $('#qres').innerHTML=`<div class="res ${pass?'ok':'no'}" id="score">Nilai: ${sc}% — ${pass?'LULUS':'belum lulus (minimal 80%)'}</div><div class="nav">${pass?'':`<button class="btn" onclick="${CUR.retry}">Ulangi</button>`}<button class="btn sec" onclick="go('dash')">Ke dasbor</button></div>`;
}
function quiz(n){
  if(!unlocked(n)) return dash(); const m=D.modul[n-1];
  renderQuiz(shuffle(m.kuis), 'Kuis Modul '+n+': '+m.judul, `go('mod',${n})`, (sc,pass)=>{ const o=S.quiz[n]||{best:0,pass:false}; o.best=Math.max(o.best,sc); o.pass=o.pass||pass; S.quiz[n]=o; save(); });
  CUR.retry=`go('quiz',${n})`;
}
function exam(){
  if(!allQuizzes()){ alertBox('Ujian akhir terbuka setelah semua kuis modul lulus.'); return dash(); }
  const bank=[]; D.modul.forEach(m=>m.kuis.forEach(q=>bank.push(q)));
  renderQuiz(shuffle(bank).slice(0,20), 'Ujian Akhir (20 soal acak dari bank '+bank.length+' soal)', "go('dash')", (sc,pass)=>{ const o=S.exam||{best:0,pass:false}; o.best=Math.max(o.best,sc); o.pass=o.pass||pass; o.tgl=new Date().toISOString(); S.exam=o; save(); });
  CUR.retry="go('exam')";
}
function proj(){
  const P=D.proyek;
  $('#app').innerHTML = `<div class="nav"><button class="btn sm sec" onclick="go('dash')">← Dasbor</button></div>
  <div class="card"><span class="pill">PROYEK AKHIR</span><span class="pill m">${P.jam} jam</span><h2 style="margin-top:8px">${esc(P.judul)}</h2><p>${esc(P.tugas)}</p>
  <h3>Templat</h3><ol>${P.templat.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>
  <h3>Rubrik penilaian</h3><table><tr><th>Kriteria</th><th>Bobot</th><th>Indikator</th><th>Nilai diri (0–4)</th></tr>
  ${P.rubrik.map((r,i)=>`<tr><td>${esc(r[0])}</td><td>${r[1]}%</td><td>${esc(r[2])}</td><td><select data-rb="${i}" onchange="selfScore(${i},this.value)">${[0,1,2,3,4].map(v=>`<option ${(+S.proj.self[i]||0)===v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table>
  <p class="note" id="selfsum">${selfSum()}</p>
  <h3>Naskah policy brief</h3><textarea id="pt" placeholder="Tulis atau tempel naskah Anda di sini…" oninput="S.proj.text=this.value;save();wc()">${esc(S.proj.text)}</textarea>
  <p class="note" id="wc"></p><p class="err" id="per"></p>
  <div class="nav"><button class="btn" id="btnProj" onclick="projDone()">${S.proj.done?'Sudah ditandai selesai ✅':'Tandai proyek selesai'}</button><button class="btn sec" onclick="dlProj()">Unduh naskah (.txt)</button><button class="btn sec" id="btnCopy" onclick="cpProj()">Salin naskah</button></div><p class="note">Bila tombol unduh tidak bekerja (misalnya halaman dibuka di dalam aplikasi lain), gunakan Salin naskah lalu tempel ke pengolah kata.</p></div>`;
  wc();
}
function wc(){ const n=(S.proj.text.trim().match(/\S+/g)||[]).length; const e=$('#wc'); if(e) e.textContent=n+' kata (target 1.200–1.800).'; return n; }
function selfScore(i,v){ S.proj.self[i]=+v; save(); $('#selfsum').textContent=selfSum(); }
function selfSum(){ let t=0; D.proyek.rubrik.forEach((r,i)=>t+=r[1]*(+S.proj.self[i]||0)/4); return 'Perkiraan nilai diri: '+Math.round(t)+' / 100'; }
function projDone(){ const n=wc(); if(n<1200){ $('#per').textContent='Naskah baru '+n+' kata; minimal 1.200 kata sebelum ditandai selesai.'; return; } S.proj.done=true; save(); proj(); }
function dlProj(){ const b=new Blob([S.proj.text],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='policy-brief-samudra-kedaulatan.txt'; a.click(); }
async function cpProj(){ try{ await navigator.clipboard.writeText(S.proj.text); alertBox('Naskah disalin.'); }catch(e){ alertBox('Penyalinan ditolak peramban. Pilih teks di kotak naskah lalu salin manual.'); } }
