    onLogs:(tid, cb) => sub("logs", tid, cb), onDebates:(tid, cb) => sub("debates", tid, cb),
    async setTeam(tid, o){ data.teams[tid] = clone(o); save(); emit("teams"); },
    async setLog(tid, id, o){ (data.logs[tid] = data.logs[tid] || {})[id] = clone(o); save(); emit("logs", tid); },
    async setDebate(tid, id, o){ (data.debates[tid] = data.debates[tid] || {})[id] = clone(o); save(); emit("debates", tid); },
    async delDebate(tid, id){ if (data.debates[tid]) delete data.debates[tid][id]; save(); emit("debates", tid); }
  };
}
function dbStore(db){
  const coll = (path, cb) => db.collection(path).onSnapshot(s => { const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); cb(o, s.metadata); }, err => { toast("Data tidak bisa dimuat: " + (err && err.message || "coba muat ulang halaman")); });
  return {
    onTeams: cb => coll("teams", cb),
    onLogs: (tid, cb) => coll(`teams/${tid}/logs`, cb),
    onDebates: (tid, cb) => coll(`teams/${tid}/debates`, cb),
    setTeam: (tid, o) => db.doc(`teams/${tid}`).set(o),
    setLog: (tid, id, o) => db.doc(`teams/${tid}/logs/${id}`).set(o),
    setDebate: (tid, id, o) => db.doc(`teams/${tid}/debates/${id}`).set(o),
    delDebate: (tid, id) => db.doc(`teams/${tid}/debates/${id}`).delete()
  };
}
const writeErr = e => toast(e && e.code === "invalid_argument" ? "Anda belum punya izin menyimpan. Minta pemilik aplikasi mengundang Anda sebagai Editor." : e && e.code === "quota_exceeded" ? "Penyimpanan penuh. Hubungi pemilik aplikasi." : "Gagal menyimpan. Periksa koneksi lalu coba lagi.");

/* ---------- Identitas ---------- */
const team = () => S.teams[S.tid];
function mySlot(){
  const t = team(); if (!t) return null;
  if (S.guest) return null;
  if (S.uid){
    if (t.coord && t.coord.uid === S.uid) return "koor";
    const m = (t.members||[]).find(m => m.uid === S.uid); if (m) return m.k;
  }
  return null;
}
const isKoor = () => mySlot() === "koor" || (S.owner && S.mode === "db");
const nameOf = (k, t=team()) => { if (!t) return ""; if (k === "koor") return t.coord.name; const m = (t.members||[]).find(m => m.k === k); return m ? m.name : k; };
const people = (t=team()) => t ? [{k:"koor", name:t.coord.name, role:"Koordinator"}].concat((t.members||[]).map(m => ({k:m.k, name:m.name, role:"Anggota"}))) : [];
const pos = () => { const t = team(); return t ? E.position(t.start, t.holidays||{}) : null; };

/* ---------- Log ---------- */
const logId = (k, s, d) => `${k}_s${s}_d${d}`;
const getLog = (k, s, d) => S.logs[logId(k, s, d)] || null;
function saveLog(k, s, d, patch){
  if (!k) { toast("Pilih nama Anda dulu agar hasil tersimpan."); return; }
  const id = logId(k, s, d); const cur = clone(S.logs[id] || {k, s, d});
  Object.assign(cur, patch, {upd: Date.now()});
  S.logs[id] = cur; render();
  store.setLog(S.tid, id, cur).catch(writeErr);
}
const statusOf = l => !l ? "none" : l.status === "diterima" ? "ok" : l.status === "ulang" ? "no" : (l.quiz || l.text || l.used || l.notes || l.prep) ? "sub" : "none";
const STATUS_TXT = {ok:"Diterima koordinator", sub:"Menunggu verifikasi", no:"Perlu diulang", none:"Belum dikerjakan"};
const statusPill = l => { const s = statusOf(l); return `<span class="status st-${s}">${STATUS_TXT[s]}</span>`; };

/* ---------- Render utama ---------- */
let toastT;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3600); }
const VIEWS = [["belajar","Belajar"],["tim","Tim & Verifikasi"],["debat","Debat"],["jadwal","Jadwal"],["panduan","Panduan"]];

function render(){

  tickTimer();
}

}

function createTeam(){
  const v = id => (document.getElementById(id).value || "").trim();

function viewClaim(){
  const t = team();

    ${S.confirm && S.confirm.type === "claim" ? `<div class="card row"><span>Anda adalah <b>${esc(nameOf(S.confirm.k))}</b>?</span><button class="btn pri" data-act="claim-yes">Ya, ini saya</button><button class="btn" data-act="claim-no">Batal</button></div>` : ""}
    <div class="row"><button class="link" data-act="guest">Lihat sebagai tamu (tanpa menyimpan)</button></div>

function claim(k){
  const t = clone(team()); const me = S.uid || localId();
  if (k === "koor") { if (t.coord.uid) return; t.coord.uid = me; }
  else { const m = t.members.find(m => m.k === k); if (!m || m.uid) return; m.uid = me; }
  if (!S.uid) S.uid = me;
  S.teams[S.tid] = t; S.confirm = null; render();

function localId(){ let id = LS.get("et_tim_uid"); if (!id) { id = "local_" + Math.random().toString(36).slice(2,10); LS.set("et_tim_uid", id); } return id; }

/* ---------- Belajar ---------- */
function ladder(selSt, p, who){
  return `<div class="ladder">${E.STAGES.map(s => {
    let done = 0; for (let d=1; d<=30; d++) if (statusOf(getLog(who, s.n, d)) === "ok") done++;
    const now = p && !p.before && !p.done && p.stage === s.n;
    const r = p ? `${E.fmtShort(p.list[(s.n-1)*30])}–${E.fmtShort(p.list[(s.n-1)*30+29])}` : "";
    return `<button class="rung ${now?"now":""}" style="--sc:${SC(s.n)};padding-top:${8 + s.n*4}px" aria-pressed="${selSt===s.n}" data-act="pick-stage" data-s="${s.n}">
      <span class="n">${s.n}</span><span class="k">${s.k}</span><span class="d">${r}</span><span class="fill" style="width:${done/30*100}%"></span></button>`;
  }).join("")}</div>`;
}
function viewBelajar(){
  const p = pos(); const who = mySlot();
  const curSt = p.before ? 1 : p.stage, curDy = p.before ? 1 : p.day;
  const st = S.st || curSt, dy = S.dy || (st === curSt ? curDy : 1);
  const unlockedIdx = p.before ? -1 : p.idx;
  const dayBtns = Array.from({length:30}, (_,i) => {
    const d = i+1, idx = (st-1)*30 + i, l = getLog(who, st, d), s = statusOf(l);
    return `<button class="day ${s==="ok"?"ok":s==="sub"?"sub":""} ${idx===p.idx && !p.before?"today":""}" aria-pressed="${d===dy}" data-act="pick-day" data-d="${d}" title="${E.fmt(p.list[idx], true)}">${d}</button>`;
  }).join("");
  const idx = (st-1)*30 + dy - 1;
  const future = idx > unlockedIdx && !isKoor();
  const S_ = E.STAGES[st-1];
  return `
  <section class="stack">
    ${ladder(st, p, who)}
    <div class="card stack" style="--sc:${SC(st)}">
      <div class="row" style="justify-content:space-between">
        <div class="stagehead"><span class="eyebrow">Tahap ${st} · ${S_.k} (${S_.id})</span><h2>Hari ${dy} · ${E.fmt(p.list[idx], true)}</h2></div>
        <div class="row">${statusPill(getLog(who, st, dy))}${(st!==curSt||dy!==curDy) ? `<button class="btn sm" data-act="go-today">Ke hari ini</button>` : ""}</div>
      </div>

      ${future ? `<div class="notice">Ini hari yang belum tiba (pratinjau). Anda bisa mempelajari materinya, tetapi setoran baru dibuka pada ${E.fmt(p.list[idx], true)}.</div>` : ""}
      ${!who ? `<div class="notice">${isKoor() ? "Anda melihat sebagai pemilik/admin. Hasil latihan di sini tidak dicatat sebagai setoran anggota." : "Anda melihat sebagai tamu. Hasil latihan tidak disimpan."}</div>` : ""}
    </div>
    ${stagePanel(st, dy, who, future)}
  </section>`;

function stagePanel(st, dy, who, future){

const verbCard = (v, big, ex) => `<div class="verb ${big?"big":""}">
  <div class="forms">${esc(v.b)} <span>·</span> ${esc(v.p)} <span>·</span> ${esc(v.pp)}</div>
  <div class="m">${esc(v.m)}</div>${ex ? `<div class="ex">${esc(E.conj(v,"spast"))}<br>${esc(E.conj(v,"pperf"))}</div>` : ""}

const reviewNote = l => l && l.review && (l.review.note || (l.review.errors||[]).length) ? `<div class="notice"><b>Catatan koordinator:</b> ${esc(l.review.note||"")} ${(l.review.errors||[]).length ? `<br>Kata yang perlu diulang: <span class="mono">${l.review.errors.map(i => esc(E.VERBS[i][0])).join(", ")}</span>` : ""}</div>` : "";

/* Tahap 1: Remembering */
function p1(c){
  const prev = []; for (let n=1; n<c.dy; n++) prev.push(n);
  const today = E.setVerbs(c.dy);
  const q = S.q1 && S.q1.dy === c.dy ? S.q1 : null;
  return `

      ${prev.map(n => E.setVerbs(n).map((v,j) => `<tr>${j===0?`<td rowspan="5" class="tnum"><b>${n}</b></td>`:""}<td class="mono">${esc(v.b)}</td><td class="mono"><span class="hv" data-act="reveal">${esc(v.p)}</span></td><td class="mono"><span class="hv" data-act="reveal">${esc(v.pp)}</span></td><td class="small">${esc(v.m)}</td></tr>`).join("")).join("")}

  </div>

    <p class="small muted">Kuis selalu dimulai dari Set 1, lalu Set 2, dan seterusnya sampai set hari ini. Tulis V2 dan V3 untuk setiap kata. Nilai minimal 90% sebelum setoran lisan kepada koordinator.</p>

function quiz1(q){
  if (q.i >= q.items.length) {
    const sc = q.res.filter(Boolean).length, tot = q.items.length, pct = Math.round(sc/tot*100);
    const wrong = q.items.filter((_,i) => !q.res[i]);
    return `<div class="quizbox"><h3>Selesai: ${sc}/${tot} (${pct}%)</h3>
      <p class="${pct>=90?"fb-ok":"fb-no"}">${pct>=90 ? "Bagus! Siap disetor kepada koordinator." : "Belum mencapai 90%. Ulangi kata yang salah lalu coba lagi."}</p>
      ${wrong.length ? `<div class="verbs">${wrong.map(i => verbCard(E.verb(i))).join("")}</div>` : ""}
      <div class="row">${q.mode==="full" ? `<span class="small muted">${q.saved ? "Hasil tersimpan." : ""}</span>` : `<span class="small muted">Latihan tidak disimpan.</span>`}<button class="btn" data-act="q1-close">Tutup</button></div></div>`;
  }
  const v = E.verb(q.items[q.i]), fb = q.fb;
  return `<div class="quizbox">
    <div class="prog"><i style="width:${q.i/q.items.length*100}%"></i></div>
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Set ${v.set} · kata ${q.i+1} dari ${q.items.length}</span><span class="small tnum">Benar: ${q.res.filter(Boolean).length}</span></div>
    <div><div class="qv">${esc(v.b)}</div><div class="muted">${esc(v.m)}</div></div>
    <div class="grid2"><label class="f">V2 (past)<input type="text" id="q1-p" autocomplete="off" autocapitalize="off" spellcheck="false" ${fb?"disabled":""} value="${esc(fb?fb.p:"")}"></label>
    <label class="f">V3 (past participle)<input type="text" id="q1-pp" autocomplete="off" autocapitalize="off" spellcheck="false" ${fb?"disabled":""} value="${esc(fb?fb.pp:"")}"></label></div>
    ${fb ? `<p class="${fb.ok?"fb-ok":"fb-no"}">${fb.ok ? "Benar!" : "Belum tepat."} <span class="mono">${esc(v.b)} – ${esc(v.p)} – ${esc(v.pp)}</span></p>
      <div class="row"><button class="btn pri" id="q1-next" data-act="q1-next">Lanjut ↵</button></div>`
    : `<div class="row"><button class="btn pri" data-act="q1-check">Periksa ↵</button></div>`}
  </div>`;
}
function q1Start(mode, dy){
  const items = mode === "today" ? [0,1,2,3,4].map(j => (dy-1)*5+j) : Array.from({length: dy*5}, (_,i) => i);
  S.q1 = {dy, mode, items, i:0, res:[], fb:null}; render(); setTimeout(() => { const el = $("#q1-p"); if (el) el.focus(); }, 0);
}
function q1Check(){
  const q = S.q1; const v = E.verb(q.items[q.i]);
  const p = $("#q1-p").value, pp = $("#q1-pp").value;
  const ok = E.ok(p, v.p) && E.ok(pp, v.pp);
  q.res[q.i] = ok; q.fb = {p, pp, ok}; render(); setTimeout(() => { const b = $("#q1-next"); if (b) b.focus(); }, 0);
}
function q1Next(){
  const q = S.q1; q.i++; q.fb = null;
  if (q.i >= q.items.length && q.mode === "full") {
    const sc = q.res.filter(Boolean).length;
    saveLog(mySlot(), 1, q.dy, {quiz:{score:sc, total:q.items.length, wrong:q.items.filter((_,i)=>!q.res[i]), at:Date.now()}, status: (getLog(mySlot(),1,q.dy)||{}).status === "diterima" ? "diterima" : "menunggu"});
    q.saved = !!mySlot();
  }
  render(); setTimeout(() => { const el = $("#q1-p"); if (el) el.focus(); }, 0);
}

/* Tahap 2: Understanding */
function tenseTable(v){
  return `<div class="scroll"><table class="t"><thead><tr><th>Tense</th><th>Kalimat (+)</th></tr></thead><tbody>${E.TENSES.map(t => { const s = E.conj(v, t.k); return `<tr><td class="small"><b>${t.n}</b><br><span class="muted">${t.id}</span></td><td>${s ? esc(s) : `<span class="muted small">Kata kerja statif: tidak lazim dalam bentuk continuous</span>`}</td></tr>`; }).join("")}</tbody></table></div>`;
}
const verbSelect = (id, val) => `<select id="${id}" data-act="verbpick">${E.VERBS.map((v,i) => `<option value="${i}" ${i==val?"selected":""}>Set ${Math.floor(i/5)+1} · ${esc(v[0])}</option>`).join("")}</select>`;
function mcQuiz(key, qs, onDone){
  const st = S.q2[key] || (S.q2[key] = {ans:{}});
  const done = Object.keys(st.ans).length === qs.length;
  const sc = qs.filter((q,i) => st.ans[i] === q.a).length;
  return `<div class="stack">${qs.map((q,i) => `<div class="stack" style="gap:6px"><b>${i+1}. ${esc(q.q)}</b><div class="opts">${q.o.map((o,j) => {
    const a = st.ans[i]; const cls = a == null ? "" : j === q.a ? "right" : j === a ? "wrong" : "";
    return `<button class="opt ${cls}" data-act="mc" data-key="${key}" data-i="${i}" data-j="${j}" ${a!=null?"disabled":""}>${esc(o)}</button>`; }).join("")}</div></div>`).join("")}
    ${done ? `<p class="${sc===qs.length?"fb-ok":"fb-no"}">Nilai: ${sc}/${qs.length}</p><div class="row">${onDone ? `<button class="btn pri" data-act="${onDone}">Simpan hasil</button>` : ""}<button class="btn" data-act="mc-reset" data-key="${key}">Ulangi</button></div>` : ""}</div>`;
}
function p2(c){
  const L = E.LESSONS[c.dy-1]; const setV = E.setVerbs(c.dy);
  const pick = S.verbPick["s2"] != null ? S.verbPick["s2"] : (c.dy-1)*5;
  const v = E.verb(+pick);
  return `
  <div class="card stack">
    <h3>${esc(L.t)}</h3><p>${esc(L.s)}</p>
    <div class="stack" style="gap:6px">${L.f.map(f => `<div class="formula">${esc(f)}</div>`).join("")}</div>
    <h4>Contoh</h4><div class="ex-list">${L.ex.map(e => `<div><div>${esc(e[0])}</div><div class="id">${esc(e[1])}</div></div>`).join("")}</div>
    <p class="small"><b>Tips:</b> ${esc(L.tip)}</p>
  </div>
  <div class="card stack">
    <h3>Kata hafalan dalam pelajaran ini</h3>
    <p class="small muted">Set ${c.dy} muncul lagi di sini supaya hafalan tahap 1 terpakai dalam struktur kalimat.</p>
    ${L.tk ? `<div class="scroll"><table class="t"><thead><tr><th>Kata</th><th>(+)</th><th>(−)</th><th>(?)</th></tr></thead><tbody>${setV.map(v => { const a = E.conj(v,L.tk,"+"); return `<tr><td class="mono"><b>${esc(v.b)}</b></td>${a ? `<td>${esc(a)}</td><td>${esc(E.conj(v,L.tk,"-"))}</td><td>${esc(E.conj(v,L.tk,"?"))}</td>` : `<td colspan="3" class="muted small">Kata kerja statif: tidak lazim dalam bentuk continuous.</td>`}</tr>`; }).join("")}</tbody></table></div>`
      : `<div class="verbs">${setV.map(v => verbCard(v)).join("")}</div>`}
    ${L.showFam ? `<h4>Tabel keluarga kata</h4><div class="scroll"><table class="t"><thead><tr><th>Noun</th><th>Verb</th><th>Adjective</th><th>Adverb</th></tr></thead><tbody>${E.WORDFAM.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : ""}
    ${(L.tk || L.showAll) ? `<details ${L.showAll?"open":""}><summary>Lihat satu kata dalam 16 tenses</summary><div class="stack" style="margin-top:10px"><label class="f">Pilih kata kerja${verbSelect("vp-s2", pick)}</label>${tenseTable(v)}</div></details>` : ""}
  </div>
  <div class="card stack"><div class="row" style="justify-content:space-between"><h3>Latihan pemahaman</h3>${c.log && c.log.quiz ? `<span class="chip tnum">Tersimpan: ${c.log.quiz.score}/${c.log.quiz.total}</span>` : ""}</div>
    ${mcQuiz("s2d"+c.dy, L.q, c.canSave ? "save-s2" : null)}
    <p class="small muted">Setelah latihan, jelaskan kembali pola pelajaran ini secara lisan kepada koordinator dengan kata-kata Anda sendiri.</p>
    <div class="row">${statusPill(c.log)}</div>${reviewNote(c.log)}</div>`;
}

/* Tahap 3: Implementing */
function targetVerbs(dy){ return E.targetSets(dy).flatMap(n => E.setVerbs(n)); }
function p3(c){
  const T = E.IMPL[c.dy-1]; const tv = targetVerbs(c.dy); const used = new Set((c.log && c.log.used) || []);
  const nd = "s3n-"+c.dy;
  return `
  <div class="card stack"><h3>${esc(T.t)}</h3>
    <p class="small muted">Diskusi terpimpin 45 menit, dipandu koordinator. Semua anggota wajib memakai kata target.</p>
    <div class="scroll"><table class="t"><tbody>
      <tr><td class="tnum"><b>5′</b></td><td><b>Pemanasan:</b> koordinator menyebut 10 kata target; anggota menjawab V2–V3 secara bergiliran.</td></tr>
      <tr><td class="tnum"><b>30′</b></td><td><b>Diskusi terpimpin:</b> setiap anggota menjawab minimal satu pertanyaan, lalu bertanya balik kepada anggota lain.</td></tr>
      <tr><td class="tnum"><b>10′</b></td><td><b>Penutup:</b> tiap anggota membacakan kalimat terbaiknya hari ini; koordinator memberi koreksi.</td></tr></tbody></table></div>
  </div>
  <div class="grid2">
    <div class="card stack"><h4>Pertanyaan pemandu</h4><ol style="margin:0;padding-left:20px">${T.q.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      <h4>Ungkapan berguna</h4><div class="stack" style="gap:6px">${T.e.map(x => `<div class="formula">${esc(x)}</div>`).join("")}</div></div>
    <div class="card stack"><h4>10 kata target (Set ${E.targetSets(c.dy).join(" & ")})</h4><p class="small muted">Centang kata yang sudah Anda pakai dalam diskusi.</p>
      <div>${tv.map(v => `<label class="chk"><input type="checkbox" data-act="use" data-i="${v.i}" ${used.has(v.i)?"checked":""} ${c.canSave?"":"disabled"}><span><span class="mono"><b>${esc(v.b)}</b> · ${esc(v.p)} · ${esc(v.pp)}</span> <span class="small muted">${esc(v.m)}</span></span></label>`).join("")}</div>
      <span class="small tnum">${used.size}/10 kata terpakai</span></div>
  </div>
  <div class="card stack"><label class="f">Kalimat terbaik saya hari ini<textarea id="${nd}" style="min-height:90px">${esc(S.drafts[nd] ?? ((c.log && c.log.notes) || ""))}</textarea></label>
    <div class="row"><button class="btn pri" data-act="save-s3" ${c.canSave?"":"disabled"}>Simpan</button>${statusPill(c.log)}</div>${reviewNote(c.log)}</div>`;
}

/* Tahap 4: Analysing */
function aiBox(key){
  const a = S.ai[key]; if (!a) return "";
  return `<div class="ai">${a.err ? `<span class="fb-no">${esc(a.err)}</span>` : esc(a.text || "Sedang membaca tulisan Anda…")}</div>`;
}
function p4(c){
  const T = E.ANAL[c.dy-1], F = E.FRAMES[T.f], tv = targetVerbs(c.dy);
  const id = "s4t-"+c.dy, txt = S.drafts[id] ?? ((c.log && c.log.text) || ""), sc = E.scan(txt), wc = E.words(txt);
  return `
  <div class="card stack"><span class="eyebrow">Kerangka: ${F.n}</span><h3>${esc(T.t)}</h3>
    <ol style="margin:0;padding-left:20px">${T.q.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
  <div class="grid2">
    <div class="card stack"><h4>Langkah analisis</h4><ol style="margin:0;padding-left:20px">${F.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      <h4>Ungkapan analisis</h4><div class="stack" style="gap:6px">${F.p.map(x => `<div class="formula">${esc(x)}</div>`).join("")}</div></div>
    <div class="card stack"><h4>Pembagian peran diskusi (60 menit)</h4>
      <div class="small stack" style="gap:6px"><div><b>Koordinator:</b> moderator, menjaga waktu, memberi pertanyaan lanjutan.</div><div><b>Anggota 1–2:</b> memaparkan analisis langkah 1–2.</div><div><b>Anggota 3–4:</b> memaparkan langkah 3–4 dan menanggapi.</div><div><b>Anggota 5:</b> notulis; merangkum kesimpulan di akhir.</div><div class="muted">Peran bergilir setiap hari.</div></div>
      <h4>Kata target</h4><p class="mono small">${tv.map(v => esc(v.b)).join(", ")}</p></div>
  </div>
  <div class="card stack"><label class="f">Ringkasan analisis saya (minimal 80 kata)<textarea id="${id}">${esc(txt)}</textarea></label>
    <div class="row small"><span class="chip tnum">${wc} kata</span><span class="chip tnum">${sc.used.length} kata hafalan terpakai</span></div>
    ${txt ? `<div class="preview">${sc.html}</div>` : ""}
    <div class="row"><button class="btn pri" data-act="save-s4" ${c.canSave?"":"disabled"}>Kirim analisis</button>${S.sample !== null ? `<button class="btn" data-act="ai" data-key="${id}" data-kind="analysis">Minta umpan balik AI</button>` : ""}${statusPill(c.log)}</div>
    ${aiBox(id)}${reviewNote(c.log)}</div>`;
}

/* Tahap 5: Evaluating */
function p5(c){
  const M = E.MOTIONS[c.dy-1];
  const deb = Object.entries(S.debates).filter(([,d]) => d.day === c.dy);
  const id = "s5p-"+c.dy;
  return `
  <div class="card stack"><span class="eyebrow">Mosi hari ${c.dy} (dipilih sistem)</span><h3 style="font-size:1.35rem">${esc(M[0])}</h3><p class="muted">${esc(M[1])}</p>
    <div class="phases">${E.DEBATE_PHASES.map(ph => `<span class="ph">${ph.n}${ph.sec ? " · " + (ph.sec/60).toString().replace(".",",") + "′" : ""}</span>`).join("")}</div>
    <div class="row">${deb.length ? deb.map(([did,d]) => `<button class="btn" data-act="open-debate" data-id="${did}">Buka debat: ${esc(d.title||"Debat hari "+c.dy)}</button>`).join("") : `<span class="small muted">Belum ada sesi debat untuk hari ini.</span>`}
      ${isKoor() ? `<button class="btn pri" data-act="new-debate" data-d="${c.dy}">Siapkan debat hari ini</button>` : ""}</div></div>
  <div class="card stack"><label class="f">Catatan persiapan saya (argumen, sanggahan, contoh)<textarea id="${id}">${esc(S.drafts[id] ?? ((c.log && c.log.prep) || ""))}</textarea></label>
    <div class="row"><button class="btn pri" data-act="save-s5" ${c.canSave?"":"disabled"}>Simpan catatan</button>${statusPill(c.log)}</div>${reviewNote(c.log)}</div>`;
}

/* Tahap 6: Creating */
function p6(c){
  const W = E.WEEKS.find(w => c.dy >= w.d[0] && c.dy <= w.d[1]);
  const id = "s6t-"+c.dy, tid = "s6title-"+c.dy, pid = "s6topic-"+c.dy;
  const txt = S.drafts[id] ?? ((c.log && c.log.text) || ""), sc = E.scan(txt), wc = E.words(txt);
  const topic = S.drafts[pid] ?? ((c.log && c.log.topic) || E.ART_TOPICS[(c.dy-1) % (E.ART_TOPICS.length-1)]);
  const rub = c.log && c.log.review && c.log.review.rubric;
  return `
  <div class="card stack"><span class="eyebrow">Minggu: ${esc(W.n)} · target ${W.w} kata</span><h3>${esc(W.g)}</h3>
    <div class="grid2"><label class="f">Topik<select id="${pid}" data-act="draft">${E.ART_TOPICS.map(t => `<option ${t===topic?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
    <label class="f">Judul artikel<input type="text" id="${tid}" value="${esc(S.drafts[tid] ?? ((c.log && c.log.title) || ""))}"></label></div>
    <label class="f">Artikel<textarea id="${id}" style="min-height:260px">${esc(txt)}</textarea></label>
    <div class="row small"><span class="chip tnum" style="${wc>=W.w?"border-color:var(--good)":""}">${wc}/${W.w} kata</span><span class="chip tnum">${sc.used.length} kata hafalan terpakai</span></div>
    ${txt ? `<details><summary>Lihat kata hafalan yang terpakai</summary><div class="preview" style="margin-top:8px">${sc.html}</div></details>` : ""}
    <div class="row"><button class="btn pri" data-act="save-s6" ${c.canSave?"":"disabled"}>Kirim artikel</button>${S.sample !== null ? `<button class="btn" data-act="ai" data-key="${id}" data-kind="article">Minta umpan balik AI</button>` : ""}${statusPill(c.log)}</div>
    ${aiBox(id)}
    ${rub ? `<div class="notice"><b>Nilai rubrik:</b> ${E.RUBRIC.map(([k,n]) => `${n} ${rub[k]||"–"}/5`).join(" · ")} · <b>Total ${rubTotal(rub)}/100</b></div>` : ""}
    ${reviewNote(c.log)}</div>`;
}
const rubTotal = r => Math.round(E.RUBRIC.reduce((a,[k]) => a + (+r[k]||0), 0) / 25 * 100);

/* ---------- Tim & Verifikasi ---------- */
function viewTim(){
  const t = team(), p = pos(), koor = isKoor();
  const st = S.revStage || (p.before ? 1 : p.stage);
  const mem = t.members || [];
  const rev = S.rev && S.rev.s === st ? S.rev : null;
  return `<section class="stack">
    <div class="stagehead" style="--sc:${SC(st)}"><span class="eyebrow">${koor ? "Panel koordinator" : "Kemajuan tim (hanya baca)"}</span><h2>${esc(t.name)}</h2>
      <p class="muted small">Klik kotak untuk meninjau setoran. Hijau = diterima, kuning = menunggu, merah = perlu diulang.</p></div>
    <div class="row">${E.STAGES.map(s => `<button class="btn sm" style="${s.n===st?`background:${SC(s.n)};color:#fff;border-color:${SC(s.n)}`:""}" data-act="rev-stage" data-s="${s.n}">${s.n}. ${s.k}</button>`).join("")}</div>
    <div class="card scroll"><table class="matrix"><thead><tr><th>Anggota</th>${Array.from({length:30},(_,i)=>`<th class="small tnum">${i+1}</th>`).join("")}<th class="small">✓</th></tr></thead><tbody>
      ${mem.map(m => { let ok = 0; const cells = Array.from({length:30}, (_,i) => { const l = getLog(m.k, st, i+1), s = statusOf(l); if (s==="ok") ok++; const sel = rev && rev.k===m.k && rev.d===i+1; return `<td><button class="cell ${s==="none"?"":s} ${sel?"sel":""}" data-act="rev-cell" data-k="${m.k}" data-d="${i+1}" aria-label="${esc(m.name)} hari ${i+1}: ${STATUS_TXT[s]}">${s==="ok"?"✓":s==="no"?"!":s==="sub"?"•":""}</button></td>`; }).join("");
        return `<tr><td><b>${esc(m.name)}</b>${m.uid?"":` <span class="small muted">(belum masuk)</span>`}</td>${cells}<td class="tnum"><b>${ok}</b></td></tr>`; }).join("")}
    </tbody></table></div>
    ${rev ? reviewPanel(rev) : `<div class="card"><div class="row"><span class="muted">Tinjau semua anggota untuk satu hari:</span>${[p.before?1:(p.stage===st?p.day:1)].map(d => `<button class="btn sm" data-act="rev-cell" data-k="${mem[0]?mem[0].k:""}" data-d="${d}">Mulai dari hari ${d}</button>`).join("")}</div></div>`}
    ${koor ? teamSettings() : ""}
  </section>`;
}
function reviewPanel(r){
  const t = team(), l = getLog(r.k, r.s, r.d), koor = isKoor(), st = r.s;
  const mem = t.members; const i = mem.findIndex(m => m.k === r.k);
  const nav = `<div class="row"><button class="btn sm" data-act="rev-move" data-dk="-1" ${i<=0?"disabled":""}>← Anggota sebelumnya</button><button class="btn sm" data-act="rev-move" data-dk="1" ${i>=mem.length-1?"disabled":""}>Anggota berikutnya →</button><button class="btn sm" data-act="rev-day" data-dd="-1" ${r.d<=1?"disabled":""}>Hari −1</button><button class="btn sm" data-act="rev-day" data-dd="1" ${r.d>=30?"disabled":""}>Hari +1</button><button class="link small" data-act="rev-close">Tutup</button></div>`;
  const noteId = `rv-note-${r.k}-${st}-${r.d}`;
  const rv = (l && l.review) || {};
  let body = "";
  if (st === 1) {
    const sim = S.simak && S.simak.key === logId(r.k, 1, r.d) ? S.simak : null;
    body = `${l && l.quiz ? `<p>Kuis sistem: <b class="tnum">${l.quiz.score}/${l.quiz.total}</b> (${Math.round(l.quiz.score/l.quiz.total*100)}%) ${l.quiz.wrong && l.quiz.wrong.length ? `· salah: <span class="mono small">${l.quiz.wrong.map(i => esc(E.VERBS[i][0])).join(", ")}</span>` : ""}</p>` : `<p class="muted">Belum mengerjakan kuis sistem.</p>`}
      ${koor ? (sim ? `<div class="stack"><p class="small"><b>Mode simak:</b> minta anggota mengucapkan V1–V2–V3 berurutan dari Set 1. Klik kata yang salah.</p>
        <div class="simak">${Array.from({length:r.d}, (_,n) => `<span class="setlabel">Set ${n+1}</span>` + E.setVerbs(n+1).map(v => `<button class="${sim.err.has(v.i)?"err":""}" data-act="simak-tog" data-i="${v.i}">${esc(v.b)}</button>`).join("")).join("")}</div>
        <span class="small tnum">${sim.err.size} kata salah dari ${r.d*5}</span></div>`
        : `<div class="row"><button class="btn" data-act="simak-start" data-k="${r.k}" data-d="${r.d}">Mulai simak setoran lisan (Set 1–${r.d})</button></div>`) : ""}`;
  } else if (st === 2) {
    body = l && l.quiz ? `<p>Latihan pemahaman: <b class="tnum">${l.quiz.score}/${l.quiz.total}</b>. Minta anggota menjelaskan kembali pola "${esc(E.LESSONS[r.d-1].t)}" secara lisan.</p>` : `<p class="muted">Belum menyimpan latihan pelajaran "${esc(E.LESSONS[r.d-1].t)}".</p>`;
  } else if (st === 3) {
    body = `<p>Kata target terpakai: <b class="tnum">${(l && l.used || []).length}/10</b></p>${l && l.notes ? `<div class="preview">${E.scan(l.notes).html}</div>` : ""}
      ${koor ? `<div class="row"><label class="row"><input type="checkbox" id="rv-hadir" ${rv.hadir!==false?"checked":""}> Hadir</label><label class="row">Keaktifan <select id="rv-aktif">${[1,2,3,4,5].map(n => `<option ${+(rv.aktif||3)===n?"selected":""}>${n}</option>`).join("")}</select></label></div>` : ""}`;
  } else if (st === 4 || st === 6) {
    const txt = (l && l.text) || "";
    body = txt ? `${st===6 ? `<h4>${esc(l.title||"(tanpa judul)")}</h4><p class="small muted">Topik: ${esc(l.topic||"")}</p>` : ""}<div class="row small"><span class="chip tnum">${E.words(txt)} kata</span><span class="chip tnum">${E.scan(txt).used.length} kata hafalan</span></div><div class="preview" style="max-height:340px">${E.scan(txt).html}</div>${l.ai ? `<details><summary>Umpan balik AI yang diminta anggota</summary><div class="ai" style="margin-top:8px">${esc(l.ai)}</div></details>` : ""}` : `<p class="muted">Belum mengirim tulisan.</p>`;
    if (st === 6 && koor) { const rb = rv.rubric || {}; body += `<div class="grid2">${E.RUBRIC.map(([k,n]) => `<label class="f">${n}<select id="rb-${k}">${[1,2,3,4,5].map(x => `<option ${+(rb[k]||3)===x?"selected":""}>${x}</option>`).join("")}</select></label>`).join("")}</div>`; }
  } else if (st === 5) {
    body = `${l && l.prep ? `<div class="preview">${esc(l.prep)}</div>` : `<p class="muted">Belum ada catatan persiapan.</p>`}<p class="small muted">Nilai debat dicatat di halaman Debat.</p>`;
  }
  return `<div class="card stack" style="--sc:${SC(st)}">
    <div class="row" style="justify-content:space-between"><div class="stagehead"><span class="eyebrow">Tahap ${st} · Hari ${r.d}</span><h3>${esc(nameOf(r.k))}</h3></div>${statusPill(l)}</div>
    ${nav}${body}
    ${koor ? `<label class="f">Catatan untuk anggota<input type="text" id="${noteId}" value="${esc(S.drafts[noteId] ?? (rv.note||""))}"></label>
      <div class="row"><button class="btn good" data-act="verify" data-v="diterima">Terima setoran</button><button class="btn bad" data-act="verify" data-v="ulang">Minta ulang</button></div>` : (rv.note ? `<p class="small"><b>Catatan:</b> ${esc(rv.note)}</p>` : "")}
  </div>`;
}
function verify(v){
  const r = S.rev; const noteId = `rv-note-${r.k}-${r.s}-${r.d}`;
  const cur = getLog(r.k, r.s, r.d) || {};
  const review = clone(cur.review || {});
  review.note = ($("#"+CSS.escape(noteId)) || {}).value || "";
  review.by = mySlot() || "admin"; review.at = Date.now();
  if (r.s === 1 && S.simak && S.simak.key === logId(r.k, 1, r.d)) review.errors = [...S.simak.err];
  if (r.s === 3) { review.hadir = $("#rv-hadir").checked; review.aktif = +$("#rv-aktif").value; }
  if (r.s === 6) { review.rubric = {}; E.RUBRIC.forEach(([k]) => { const el = $("#rb-"+k); if (el) review.rubric[k] = +el.value; }); }
  delete S.drafts[noteId];
  saveLog(r.k, r.s, r.d, {review, status: v});
  toast(v === "diterima" ? "Setoran " + nameOf(r.k) + " diterima." : "Diminta mengulang. Catatan terkirim.");
}
function teamSettings(){
  const t = team(); const hol = Object.entries(t.holidays||{}).sort();
  return `<details class="card"><summary>Pengaturan tim</summary><div class="stack" style="margin-top:12px">

/* ---------- AI umpan balik ---------- */
async function askAI(key, kind){
  if (S.sample === undefined) { try { S.sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch(e){ S.sample = null; } }
  const sample = S.sample; if (!sample) { toast("Umpan balik AI tidak tersedia di tampilan ini."); render(); return; }
  const el = document.getElementById(key); const text = el ? el.value.trim() : "";
  if (E.words(text) < 20) { toast("Tulis minimal 20 kata dulu."); return; }
  S.ai[key] = {text:""}; render();
  const prompt = `You are a supportive English writing coach for Indonesian adult learners. Give feedback in Bahasa Indonesia, with the English corrections quoted in English.\nTask type: ${kind === "article" ? "short article" : "written analysis of a discussion topic"}.\nReturn plain text, no markdown headings, in this order:\n1) Kesan umum (2 kalimat).\n2) Koreksi tata bahasa: up to 6 items, each "kalimat asli → perbaikan (alasan singkat)". Pay special attention to tense use and irregular verb forms (V2/V3).\n3) Saran kosakata: 3 items.\n4) Satu saran untuk struktur.\n5) Perkiraan nilai 1–5 untuk: isi, organisasi, kosakata, tata bahasa, ejaan.\nText:\n"""${text.slice(0, 6000)}"""`;
  try {
    const r = await sample(prompt, { onText: ({text}) => { S.ai[key] = {text}; const box = document.querySelectorAll(".ai"); render(); } });
    S.ai[key] = {text: r.text};
    const c = curCtx(); if (c && mySlot()) saveLog(mySlot(), c.st, c.dy, {ai: r.text.slice(0, 4000)}); else render();
  } catch(e) {
    S.ai[key] = {err: e && e.code === "not_granted" ? "Izin umpan balik AI tidak diberikan." : e && e.code === "rate_limited" ? "Terlalu banyak permintaan. Coba lagi beberapa menit lagi." : "Umpan balik AI gagal. Coba lagi."};
    if (e && e.code === "not_granted") S.sample = null;
    render();
  }
}
function curCtx(){ const p = pos(); if (!p) return null; const st = S.st || (p.before?1:p.stage); const dy = S.dy || (st === (p.before?1:p.stage) ? (p.before?1:p.day) : 1); return {st, dy}; }

/* ---------- Event ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, c = curCtx();
  switch (a) {
    case "switch-team": S.tid = null; S.guest = false; LS.set("et_tim_tid", ""); unsubs.forEach(f => f()); unsubs = []; S.logs = {}; S.debates = {}; render(); break;
    case "pick-team": S.tid = b.dataset.id; LS.set("et_tim_tid", S.tid); S.st = S.dy = null; subscribeTeam(); render(); break;
    case "create-team": createTeam(); break;
    case "claim": S.confirm = {type:"claim", k:b.dataset.k}; render(); break;
    case "claim-yes": claim(S.confirm.k); break;
    case "claim-no": S.confirm = null; render(); break;
    case "guest": S.guest = true; render(); break;
    case "pick-stage": S.st = +b.dataset.s; S.dy = null; S.q1 = null; render(); break;
    case "pick-day": S.dy = +b.dataset.d; if (!S.st) { const p = pos(); S.st = p.before ? 1 : p.stage; } S.q1 = null; render(); break;
    case "go-today": S.st = S.dy = null; S.q1 = null; render(); break;
    case "say": E.say(b.dataset.t); break;
    case "reveal": b.style.color = "inherit"; b.style.background = "transparent"; break;
    case "q1-start": q1Start(b.dataset.mode, c.dy); break;
    case "q1-check": q1Check(); break;
    case "q1-next": q1Next(); break;
    case "q1-close": S.q1 = null; render(); break;
    case "mc": { const st = S.q2[b.dataset.key]; st.ans[+b.dataset.i] = +b.dataset.j; render(); break; }
    case "mc-reset": S.q2[b.dataset.key] = {ans:{}}; render(); break;
    case "save-s2": { const L = E.LESSONS[c.dy-1]; const st = S.q2["s2d"+c.dy]; const sc = L.q.filter((q,i) => st.ans[i] === q.a).length; saveLog(mySlot(), 2, c.dy, {quiz:{score:sc, total:L.q.length, at:Date.now()}, status: keepOk(2,c.dy)}); toast("Hasil latihan tersimpan."); break; }
    case "save-s3": { const id = "s3n-"+c.dy; saveLog(mySlot(), 3, c.dy, {notes: ($("#"+id)||{}).value || "", status: keepOk(3,c.dy)}); delete S.drafts[id]; toast("Tersimpan."); break; }
    case "save-s4": { const id = "s4t-"+c.dy; const v = $("#"+id).value; if (E.words(v) < 80) { toast("Ringkasan minimal 80 kata (sekarang " + E.words(v) + ")."); break; } saveLog(mySlot(), 4, c.dy, {text:v, status: keepOk(4,c.dy, true)}); delete S.drafts[id]; toast("Analisis terkirim ke koordinator."); break; }
    case "save-s5": { const id = "s5p-"+c.dy; saveLog(mySlot(), 5, c.dy, {prep: $("#"+id).value, status: keepOk(5,c.dy)}); delete S.drafts[id]; toast("Catatan tersimpan."); break; }
    case "save-s6": { const id = "s6t-"+c.dy, v = $("#"+id).value; if (E.words(v) < 30) { toast("Artikel masih terlalu pendek."); break; } saveLog(mySlot(), 6, c.dy, {text:v, title: $("#s6title-"+c.dy).value, topic: $("#s6topic-"+c.dy).value, status: keepOk(6,c.dy,true)}); ["s6t-","s6title-","s6topic-"].forEach(k => delete S.drafts[k+c.dy]); toast("Artikel terkirim ke koordinator."); break; }
    case "ai": askAI(b.dataset.key, b.dataset.kind); break;
    case "rev-stage": S.revStage = +b.dataset.s; S.rev = null; S.simak = null; render(); break;
    case "rev-cell": if (!b.dataset.k) break; S.rev = {k:b.dataset.k, d:+b.dataset.d, s: S.revStage || (pos().before?1:pos().stage)}; S.simak = null; render(); break;
    case "rev-close": S.rev = null; S.simak = null; render(); break;
    case "rev-move": { const mem = team().members; const i = mem.findIndex(m => m.k === S.rev.k) + (+b.dataset.dk); if (mem[i]) { S.rev.k = mem[i].k; S.simak = null; render(); } break; }
    case "rev-day": S.rev.d = Math.min(30, Math.max(1, S.rev.d + (+b.dataset.dd))); S.simak = null; render(); break;
    case "simak-start": { const l = getLog(b.dataset.k, 1, +b.dataset.d); S.simak = {key: logId(b.dataset.k, 1, +b.dataset.d), err: new Set((l && l.review && l.review.errors) || [])}; render(); break; }
    case "simak-tog": { const i = +b.dataset.i; S.simak.err.has(i) ? S.simak.err.delete(i) : S.simak.err.add(i); render(); break; }
    case "verify": verify(b.dataset.v); break;
    case "save-team": saveTeam(t => { t.name = $("#ts-name").value.trim() || t.name; t.start = $("#ts-start").value || t.start; t.coord.name = $("#ts-coord").value.trim() || t.coord.name; t.members.forEach((m,i) => { m.name = $("#ts-m"+i).value.trim() || m.name; }); }); break;
    case "unclaim": saveTeam(t => { const m = t.members.find(m => m.k === b.dataset.k); if (m) m.uid = null; }); break;
    case "hol-add": { const d = $("#hol-d").value, n = $("#hol-n").value.trim() || "Libur"; if (!d) { toast("Pilih tanggal libur."); break; } saveTeam(t => { t.holidays = t.holidays || {}; t.holidays[d] = n; }); break; }
    case "hol-del": saveTeam(t => { delete t.holidays[b.dataset.d]; }); break;
    case "new-debate": S.debateId = "new"; S.newDay = b.dataset.d ? +b.dataset.d : null; S.newMotion = null; location.hash = "#debat"; S.view = "debat"; render(); break;
    case "nd-random": { const used = new Set(Object.values(S.debates).map(d => d.motion[0])); const free = E.MOTIONS.map((m,i) => i).filter(i => !used.has(E.MOTIONS[i][0])); const pool = free.length ? free : E.MOTIONS.map((m,i)=>i); S.newMotion = pool[Math.floor(Math.random()*pool.length)]; keepSides(); render(); break; }
    case "nd-create": createDebate(); break;
    case "open-debate": S.debateId = b.dataset.id; location.hash = "#debat"; S.view = "debat"; render(); break;
    case "debate-back": S.debateId = null; S.confirm = null; render(); break;
    case "ph-start": updDebate(d => { d.run = true; d.t0 = Date.now(); }); break;
    case "ph-pause": updDebate(d => { d.left = remaining(d); d.run = false; }); break;
    case "ph-reset": updDebate(d => { d.left = E.DEBATE_PHASES[d.phase].sec; d.run = false; }); break;
    case "ph-next": updDebate(d => { d.phase = Math.min(E.DEBATE_PHASES.length-1, d.phase+1); d.left = E.DEBATE_PHASES[d.phase].sec; d.run = false; }); break;
    case "ph-prev": updDebate(d => { d.phase = Math.max(0, d.phase-1); d.left = E.DEBATE_PHASES[d.phase].sec; d.run = false; }); break;
    case "deb-text": { const el = $("#"+b.dataset.el); updDebate(d => { d[b.dataset.f] = el.value; }); delete S.drafts[b.dataset.el]; toast("Tersimpan."); break; }
    case "deb-win": updDebate(d => { d.winner = b.dataset.w; }); break;
    case "deb-del": S.confirm = {type:"deb-del"}; render(); break;
    case "deb-del-yes": { const id = S.debateId; delete S.debates[id]; S.debateId = null; S.confirm = null; render(); store.delDebate(S.tid, id).catch(writeErr); break; }
  }
});
const keepOk = (s, d, resubmit) => { const l = getLog(mySlot(), s, d); return l && l.status === "diterima" && !resubmit ? "diterima" : "menunggu"; };
function keepSides(){ const g = side => [0,1,2].map(i => { const el = $(`#nd-${side}-${i}`); return el ? el.value : ""; }); if ($("#nd-pos-0")) S.newSides = {pos:g("pos"), neg:g("neg")}; }
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type === "text"))) {
    if (/^(q1-)/.test(el.id)) return;
    S.drafts[el.id] = el.value;
    if (/^s[46]t-/.test(el.id)) { clearTimeout(el._t); el._t = setTimeout(render, 500); }
  }
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset.act;
  if (a === "hideforms") { S.hideForms = el.checked; render(); }
  else if (a === "verbpick") { S.verbPick["s2"] = +el.value; render(); }
  else if (a === "draft") { S.drafts[el.id] = el.value; }
  else if (a === "nd-day") { keepSides(); S.newDay = +el.value; S.newMotion = null; render(); }
  else if (a === "use") { const c = curCtx(); const l = getLog(mySlot(), 3, c.dy); const u = new Set((l && l.used) || []); el.checked ? u.add(+el.dataset.i) : u.delete(+el.dataset.i); saveLog(mySlot(), 3, c.dy, {used:[...u], status: keepOk(3,c.dy)}); }
  else if (a === "score") { const v = el.value === "" ? null : Math.max(0, Math.min(+el.max, +el.value)); updDebate(d => { d.scores = d.scores || {}; d.scores[el.dataset.key] = d.scores[el.dataset.key] || {}; d.scores[el.dataset.key][el.dataset.c] = v; }); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "q1-p") { e.preventDefault(); $("#q1-pp").focus(); }
  else if (e.target.id === "q1-pp") { e.preventDefault(); q1Check(); }
});
function route(){ const h = (location.hash || "").slice(1); S.view = VIEWS.some(v => v[0] === h) ? h : "belajar"; if (S.view !== "debat") S.debateId = null; render(); }
window.addEventListener("hashchange", route);

/* ---------- Langganan data ---------- */
function subscribeTeam(){
  unsubs.forEach(f => f()); unsubs = []; S.logs = {}; S.debates = {};
  if (!S.tid) return;
  unsubs.push(store.onLogs(S.tid, o => { S.logs = o; render(); }));
  unsubs.push(store.onDebates(S.tid, o => { S.debates = o; render(); }));
}
async function init(){
  route();
  let db = null, user = null;
  try { if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e) {}
  if (db) { store = dbStore(db); S.mode = "db"; if (user) { try { S.uid = await user.id(); S.owner = await user.isOwner(); } catch(e){} } }
  else { store = localStore(); S.mode = "local"; S.uid = localId(); }
  const slow = setTimeout(() => { if (!S.teamsLoaded) { S.slow = true; render(); } }, 10000);
  store.onTeams(o => {
    S.teams = o; S.teamsLoaded = true; clearTimeout(slow);
    if (!S.tid) { const saved = LS.get("et_tim_tid"); if (saved && o[saved]) { S.tid = saved; subscribeTeam(); } }
    else if (!o[S.tid]) { /* tim baru belum kembali dari server */ }
    render();
  });
  if (window.claude && window.claude.use) window.claude.use("sample").then(s => { S.sample = s; render(); }).catch(() => { S.sample = null; });
  else S.sample = null;
}
init();
})();
</script>
